<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ultimate Sand Sim</title>
<style>
:root{
  --bg:#0d0f13; --panel:#151820; --panel2:#1b1f29; --line:#2a3040; --line2:#353c50;
  --text:#d9dde6; --dim:#8b93a6; --faint:#5d6578; --accent:#e9b44c; --accent2:#f07a3a;
  --good:#5fd38d; --bad:#ff5d5d; --info:#5aa8ff;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.35 var(--sans);overflow:hidden;user-select:none}
button,select,input{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 9px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--line2);background:#222736}
button.on,button.active{background:#3a2f17;border-color:var(--accent);color:#ffe2a8}
button.primary{background:var(--accent);color:#1a1205;border-color:var(--accent);font-weight:600}
button.primary:hover{background:#f4c66a}
button.danger{border-color:#6b2a2a;color:#ffb3b3}
button:disabled{opacity:.4;cursor:default}
select,input[type=text],input[type=number]{background:#0f1218;border:1px solid var(--line);border-radius:6px;padding:4px 6px}
input[type=range]{accent-color:var(--accent);width:100%}
input[type=color]{width:40px;height:24px;border:1px solid var(--line);background:none;padding:0}
#app{display:grid;grid-template-rows:42px 1fr 24px;height:100%}
#topbar{display:flex;align-items:center;gap:6px;padding:0 8px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden}
#topbar::-webkit-scrollbar{height:4px}
.brand{font-weight:800;letter-spacing:.06em;color:var(--accent);margin-right:6px;font-size:14px;cursor:pointer;white-space:nowrap}
.brand small{color:var(--dim);font-weight:500;letter-spacing:0}
.sep{width:1px;height:22px;background:var(--line);margin:0 3px;flex:none}
.grow{flex:1}
#speedWrap{display:flex;align-items:center;gap:4px;color:var(--dim)}
#speedWrap input{width:80px}
#main{display:grid;grid-template-columns:46px 1fr 286px;min-height:0}
#main.sideHidden{grid-template-columns:46px 1fr 0}
#tools{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:3px 0;gap:1px;overflow-y:auto}
#tools::-webkit-scrollbar{width:0}
.tbtn{width:36px;height:27px;padding:0;font-size:16px;display:flex;align-items:center;justify-content:center;border-radius:6px;flex:none}
.tsep{width:26px;height:1px;background:var(--line);margin:2px 0;flex:none}
@media (max-width:1720px){#topbar .lbl{display:none} #topbar button{padding:4px 8px}}
@media (max-width:1100px){#speedWrap input{width:56px} .brand small{display:none}}
#stage{position:relative;overflow:hidden;background:#07080a;cursor:none}
#view{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
#mini{position:absolute;right:8px;bottom:8px;border:1px solid var(--line2);border-radius:4px;background:#000;cursor:pointer;image-rendering:pixelated;box-shadow:0 4px 14px #0008}
#hover{position:absolute;pointer-events:none;background:#0d0f13e8;border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:11px/1.35 var(--mono);color:var(--text);white-space:pre;display:none;z-index:5}
#pauseBadge{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:#0d0f13d0;border:1px solid var(--accent);color:var(--accent);padding:3px 12px;border-radius:20px;font-weight:700;letter-spacing:.15em;font-size:11px;pointer-events:none;display:none}
#legend{position:absolute;left:8px;bottom:8px;background:#0d0f13d8;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:11px var(--mono);display:none;pointer-events:none}
#legend canvas{display:block;margin-top:4px;border-radius:2px}
#ctlHud{position:absolute;left:50%;transform:translateX(-50%);bottom:54px;z-index:21;background:rgba(14,16,24,.88);border:1px solid #3a4560;border-radius:10px;padding:6px 12px;color:#dde;font:13px system-ui;display:flex;gap:10px;align-items:center;pointer-events:none;white-space:nowrap}#ctlHud small{color:#99a}.cbar{display:inline-block;width:60px;height:7px;background:#222a;border-radius:4px;overflow:hidden}.cbar i{display:block;height:100%}
#toasts{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none;z-index:20}
.toast{background:#141821f0;border:1px solid var(--line2);border-left:3px solid var(--accent);padding:7px 11px;border-radius:6px;max-width:340px;box-shadow:0 6px 18px #0009;animation:tin .25s ease-out;font-size:12px}
.toast.good{border-left-color:var(--good)} .toast.bad{border-left-color:var(--bad)} .toast.info{border-left-color:var(--info)}
@keyframes tin{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
#objective{position:absolute;left:10px;top:10px;background:#11141bf0;border:1px solid var(--accent);border-radius:8px;padding:9px 12px;max-width:340px;display:none;z-index:6;box-shadow:0 6px 18px #0009}
#objective h4{margin:0 0 4px;color:var(--accent);font-size:13px}
#objective .prog{margin-top:6px;font:12px var(--mono);color:var(--dim)}
#objective .row{display:flex;gap:6px;margin-top:8px}
#side{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow:hidden}
#side .sec{border-bottom:1px solid var(--line);padding:8px}
#side h3{margin:0 0 6px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:700;display:flex;align-items:center;gap:6px}
#side h3 .grow{flex:1}
#matSearch{width:100%}
#catTabs{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
#catTabs button{padding:2px 6px;font-size:11px;border-radius:12px}
#palWrap{flex:1;min-height:120px;overflow-y:auto;padding:6px 8px}
#palWrap::-webkit-scrollbar,.scroll::-webkit-scrollbar{width:8px}
#palWrap::-webkit-scrollbar-thumb,.scroll::-webkit-scrollbar-thumb{background:#2a3040;border-radius:4px}
.palgrp{font-size:10px;letter-spacing:.12em;color:var(--faint);text-transform:uppercase;margin:6px 0 3px}
.pal{display:grid;grid-template-columns:repeat(2,1fr);gap:3px}
.mitem{display:flex;align-items:center;gap:6px;padding:3px 5px;border:1px solid transparent;border-radius:5px;cursor:pointer;font-size:12px;min-width:0}
.mitem:hover{background:#1f2430;border-color:var(--line)}
.mitem.sel{background:#2b2414;border-color:var(--accent)}
.mitem img{width:16px;height:16px;border-radius:3px;flex:none;image-rendering:pixelated;box-shadow:inset 0 0 0 1px #0006}
.mitem span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mitem .star{margin-left:auto;color:var(--accent);font-size:10px}
.chips{display:flex;flex-wrap:wrap;gap:3px;min-height:20px}
.chip{display:flex;align-items:center;gap:4px;padding:2px 6px 2px 3px;border:1px solid var(--line);border-radius:12px;cursor:pointer;font-size:11px;background:#121620}
.chip:hover{border-color:var(--line2)} .chip.sel{border-color:var(--accent)}
.chip img{width:13px;height:13px;border-radius:50%}
.chip .k{color:var(--faint);font:10px var(--mono)}
#matInfo{font-size:12px}
#matInfo .nm{font-weight:700;font-size:14px;display:flex;align-items:center;gap:7px}
#matInfo .nm img{width:20px;height:20px;border-radius:4px}
#matInfo .ds{color:var(--dim);margin:4px 0}
.props{display:grid;grid-template-columns:auto 1fr;gap:1px 10px;font:11px var(--mono);color:var(--dim)}
.props b{color:var(--text);font-weight:500}
#toolOpts{max-height:44%;overflow-y:auto}
.opt{display:grid;grid-template-columns:92px 1fr 52px;align-items:center;gap:6px;margin:4px 0;font-size:12px}
.opt .v{font:11px var(--mono);color:var(--dim);text-align:right}
.opt.wide{grid-template-columns:92px 1fr}
.seg{display:flex;flex-wrap:wrap;gap:2px}
.seg button{padding:2px 7px;font-size:11px}
.hint{color:var(--faint);font-size:11px;margin-top:4px}
#status{display:flex;gap:14px;align-items:center;padding:0 10px;background:var(--panel);border-top:1px solid var(--line);font:11px var(--mono);color:var(--dim);white-space:nowrap;overflow:hidden}
#status b{color:var(--text);font-weight:500}
/* windows */
.win{position:absolute;background:var(--panel);border:1px solid var(--line2);border-radius:9px;box-shadow:0 12px 40px #000b;display:flex;flex-direction:column;z-index:30;min-width:260px;max-height:80vh}
.win .wh{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line);cursor:move;font-weight:700;font-size:12px;letter-spacing:.04em}
.win .wh .grow{flex:1}
.win .wh button{padding:0 7px;font-size:13px;line-height:20px}
.win .wb{padding:10px;overflow:auto;min-height:0}
.modalBg{position:fixed;inset:0;background:#05060aa8;display:flex;align-items:center;justify-content:center;z-index:60;backdrop-filter:blur(2px)}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:12px;box-shadow:0 20px 60px #000c;width:min(720px,94vw);max-height:90vh;display:flex;flex-direction:column}
.modal .mh{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:800;font-size:15px}
.modal .mh .grow{flex:1}
.modal .mb{padding:14px 16px;overflow:auto}
.modal .mf{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;cursor:pointer}
.card:hover{border-color:var(--accent)}
.card.sel{border-color:var(--accent);background:#2a2314}
.card h4{margin:0 0 3px;font-size:13px} .card p{margin:0;color:var(--dim);font-size:12px}
table.t{width:100%;border-collapse:collapse;font-size:12px}
table.t td,table.t th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left}
table.t th{color:var(--dim);font-weight:600;font-size:11px}
.kbd{font:11px var(--mono);background:#0f1218;border:1px solid var(--line2);border-radius:4px;padding:0 5px;color:var(--accent)}
/* title */
#title{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,#1a1408cc,#05060aee 70%)}
#title .box{text-align:center;max-width:620px;padding:30px}
#title h1{font-size:54px;margin:0;letter-spacing:.04em;line-height:1;background:linear-gradient(180deg,#ffe0a0,#e9b44c 55%,#b06a24);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 40px #e9b44c33}
#title .sub{color:var(--dim);margin:10px 0 24px;font-size:14px}
#title .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:440px;margin:0 auto}
#title .btns button{padding:10px;font-size:14px}
#title .modes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:18px}
#title .modes button{padding:8px 4px;font-size:12px;white-space:normal}
#title .foot{margin-top:20px;color:var(--faint);font-size:11px}
#tut{position:fixed;z-index:70;background:#141821;border:1px solid var(--accent);border-radius:10px;padding:14px 16px;width:330px;box-shadow:0 12px 40px #000c;left:60px;bottom:40px;display:none}
#tut h4{margin:0 0 6px;color:var(--accent)}
#tut p{margin:0 0 10px;color:var(--text);font-size:13px}
#tut .row{display:flex;justify-content:space-between;align-items:center;color:var(--faint);font-size:11px}
.bar{height:6px;background:#0f1218;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.listrow{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:7px;margin-bottom:5px;background:var(--panel2)}
.listrow .grow{flex:1;min-width:0}
.dim{color:var(--dim)} .faint{color:var(--faint)} .mono{font-family:var(--mono)}
.tag{display:inline-block;font-size:10px;padding:0 5px;border-radius:8px;border:1px solid var(--line2);color:var(--dim);margin-left:4px}
#debugLog{font:11px var(--mono);white-space:pre-wrap;color:#ffb3b3;max-height:240px;overflow:auto;background:#0b0d11;padding:6px;border-radius:6px}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand" id="brand" title="Main menu">ULTIMATE SAND SIM <small>v1.0</small></div>
    <button id="bPlay" title="Pause / Play (Space)">❚❚</button>
    <button id="bStep" title="Single step (.)">⏭</button>
    <div id="speedWrap" title="Simulation speed (− / = keys)">Speed <input type="range" id="speed" min="0" max="7" step="1" value="3"><span id="speedLbl" class="mono">1×</span></div>
    <div class="sep"></div>
    <button id="bUndo" title="Undo (Ctrl+Z)">↶</button>
    <button id="bRedo" title="Redo (Ctrl+Y / Ctrl+Shift+Z)">↷</button>
    <button id="bReset" title="Reset world (clears everything)">⟲<span class="lbl"> Reset</span></button>
    <div class="sep"></div>
    <button id="bWorld" title="New world / generator">🌍<span class="lbl"> World</span></button>
    <button id="bSaves" title="Save & load (Ctrl+S)">💾<span class="lbl"> Saves</span></button>
    <button id="bSun" title="Sun: show / hide and adjust (drag it around outside the world)">☀<span class="lbl"> Sun</span></button>
    <button id="bShot" title="Save a screenshot of the view (Shift+P)">📷</button>
    <button id="bStats" title="Live statistics">📊<span class="lbl"> Stats</span></button>
    <select id="overlaySel" title="Overlay (O cycles)">
      <option value="none">Normal</option><option value="temp">Temperature</option><option value="mag">Magnetic fields</option>
    </select>
    <div class="grow"></div>
    <button id="bMute" title="Mute / unmute sound">🔊</button>
    <button id="bSettings" title="Settings">⚙</button>
    <button id="bDebug" title="Debug panel">🐞</button>
    <button id="bHelp" title="Help & shortcuts (F1)">?</button>
    <button id="bSide" title="Toggle side panel (Tab)">◨</button>
  </header>
  <div id="main">
    <nav id="tools"></nav>
    <div id="stage">
      <canvas id="view"></canvas>
      <canvas id="mini" title="Minimap – click or drag to navigate"></canvas>
      <div id="hover"></div>
      <div id="pauseBadge">PAUSED</div>
      <div id="legend"></div>
      <div id="toasts"></div>
      <div id="objective"></div>
    </div>
    <aside id="side">
      <div class="sec">
        <input id="matSearch" type="text" placeholder="Search materials…  ( / )" autocomplete="off">
        <div id="catTabs"></div>
      </div>
      <div class="sec" style="padding-bottom:6px">
        <h3>Hotbar <span class="faint" style="text-transform:none;letter-spacing:0;font-weight:400">1–0 · shift-click to pin</span></h3>
        <div class="chips" id="hotbar"></div>
        <h3 style="margin-top:6px">Recent</h3>
        <div class="chips" id="recent"></div>
      </div>
      <div id="palWrap"></div>
      <div class="sec" id="matInfo"></div>
      <div class="sec" id="toolOpts"></div>
    </aside>
  </div>
  <footer id="status">
    <span>FPS <b id="sFps">0</b></span><span>TPS <b id="sTps">0</b></span>
    <span>Cursor <b id="sCur">–</b></span><span id="sUnder" style="min-width:220px">–</span>
    <span>Cells <b id="sCells">0</b></span><span>Active chunks <b id="sChunks">0</b></span>
    <span>Creatures <b id="sCre">0</b></span><span id="sClock" title="Time of day (Settings → Day / night)"></span><span id="sTool"></span>
  </footer>
</div>
<div id="tut"><h4 id="tutH"></h4><p id="tutP"></p><div class="row"><span id="tutN"></span><span><button id="tutSkip">Skip</button> <button id="tutNext" class="primary">Next</button></span></div></div>
<input type="file" id="fileIn" accept=".sandsim,.json" style="display:none">
<script>
'use strict';
// =====================================================================
//  ULTIMATE SAND SIM — single-file falling-sand / chemistry / life sandbox
// =====================================================================

// ---------- small utilities ----------
let _rs = (Math.random() * 4294967296) >>> 0;
function rnd() { // fast xorshift for simulation
  _rs ^= _rs << 13; _rs >>>= 0; _rs ^= _rs >>> 17; _rs ^= _rs << 5; _rs >>>= 0;
  return _rs / 4294967296;
}
function rint(n) { return (rnd() * n) | 0; }
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function hexToRgb(h) { h = h.replace('#', ''); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; }
function $(id) { return document.getElementById(id); }
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (k === 'class') e.className = v; else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'html') e.innerHTML = v; else if (v !== undefined && v !== null && v !== false) e.setAttribute(k, v);
  }
  for (const k of kids) if (k !== null && k !== undefined) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
}

// ---------- states & behaviours ----------
const ST = { EMPTY: 0, POWDER: 1, LIQUID: 2, GAS: 3, SOLID: 4, ENERGY: 5, MACHINE: 7, CREATURE: 8 };
const STATE_NAME = ['Empty', 'Powder', 'Liquid', 'Gas', 'Solid', 'Energy', '', 'Machine', 'Creature'];
// movement codes
const MV = { NONE: 0, POWDER: 1, LIQUID: 2, GAS: 3, FIRE: 4, PARTICLE: 5 };
// special per-tick behaviours
const SP = {
  NONE: 0, SPARK: 1, EMBER: 2, PLASMA: 3, ELEC: 4, LIGHTNING: 5, HEATP: 6, COLDP: 7, RAD: 8, MAGIC: 9,
  MICROBE: 10, MACHINE: 11, SOURCE: 12, DRAIN: 13, URANIUM: 14, SPONGE: 15, DYE: 16, MUDDY: 17, NITRO: 18,
  SLIME: 19, LARVA: 20, CLONE: 21, FUSE: 22, ANTI: 23, NEON: 24, MAGNET: 25, ROCKET: 26, CLOUD: 27, ACIDX: 28, LIGHTSRC: 29
};

const MATS = [];
const ID = Object.create(null);
const P = ST.POWDER, L = ST.LIQUID, G = ST.GAS, S = ST.SOLID, EN = ST.ENERGY, MC = ST.MACHINE, CR = ST.CREATURE;

function D(key, name, cat, state, color, o) {
  o = o || {};
  const m = {
    key, name, cat, state, color,
    dens: state === P ? 1500 : state === L ? 1000 : state === G ? 1.2 : state === EN ? 0.6 : state === CR ? 1000 : 2500,
    cond: state === G ? 0.04 : state === L ? 0.35 : state === P ? 0.2 : state === EN ? 0.5 : 0.3,
    hc: 1, slide: 0.75, cohesion: 0, visc: 1, spread: 4, flam: 0, ign: 99999, burn: null, burnTo: null,
    explode: 0, life: null, decayTo: null, heat: null, hard: state === S ? 40 : 10, acid: 0, elec: 0,
    hiT: null, hiTo: null, loT: null, loTo: null, phaseP: 0.08, emit: null, keepOrigin: false,
    glow: 0, alpha: 1, vary: 0.08, hidden: false, desc: '', sp: SP.NONE, mv: null, debris: null, porous: 0, light: null,
    insul: false
  };
  Object.assign(m, o);
  m.id = MATS.length; MATS.push(m); ID[key] = m.id;
  return m;
}

// ======================= MATERIAL LIBRARY =======================
D('empty', 'Air (empty)', 'Special', ST.EMPTY, '#000000', { dens: 1.2, cond: 0.03, hidden: true, desc: 'Empty space filled with ordinary air.' });

// ---------------- POWDERS ----------------
const PW = 'Powders';
D('sand', 'Sand', PW, P, '#dcbf78', { dens: 1600, slide: 0.72, hiT: 1500, hiTo: 'molten_glass', acid: 0.3, hard: 8, desc: 'The heart of the sim. Piles into slopes, gets wet, is carried by wind and water, and melts into glass.' });
D('red_sand', 'Red sand', PW, P, '#c46a3e', { dens: 1650, slide: 0.7, hiT: 1450, hiTo: 'molten_glass', acid: 0.3, desc: 'Iron-oxide rich desert sand. Melts into glass.' });
D('black_sand', 'Black sand', PW, P, '#3b3735', { dens: 2100, slide: 0.75, hiT: 1300, hiTo: 'lava', elec: 1, acid: 0.2, desc: 'Volcanic magnetite sand. Heavy and weakly conductive.' });
D('wet_sand', 'Wet sand', PW, P, '#a88a52', { dens: 1900, slide: 0.12, cohesion: 0.93, hiT: 100, hiTo: 'sand', emit: 'steam', phaseP: 0.05, loT: -5, loTo: 'frozen_soil', acid: 0.3, desc: 'Sand holding water. Clumps, holds steep walls and overhangs, and slowly dries in the air.' });

function allocWorld(w, h) {

// index with boundary handling (-1 = outside)
function idx(x, y) {

  return y * W + x;
}
function wake(x, y) {
  const cx = (x / CS) | 0, cy = (y / CS) | 0;

  if (lx === 0 && cx > 0) chunkNext[c - 1] = 1; else if (lx === CS - 1 && cx < CW - 1) chunkNext[c + 1] = 1;
  if (ly === 0 && cy > 0) chunkNext[c - CW] = 1; else if (ly === CS - 1 && cy < CH - 1) chunkNext[c + CW] = 1;
  if (settings.bound === BOUND.WRAP) { if (x === 0) chunkNext[cy * CW + CW - 1] = 1; else if (x === W - 1) chunkNext[cy * CW] = 1; }
}
function wakeI(i) { wake(i % W, (i / W) | 0); }
function wakeArea(x0, y0, x1, y1) {
  const cx0 = Math.max(0, ((x0 / CS) | 0) - 1), cx1 = Math.min(CW - 1, ((x1 / CS) | 0) + 1);
  const cy0 = Math.max(0, ((y0 / CS) | 0) - 1), cy1 = Math.min(CH - 1, ((y1 / CS) | 0) + 1);
  for (let cy = cy0; cy <= cy1; cy++) for (let cx = cx0; cx <= cx1; cx++) chunkNext[cy * CW + cx] = 1;

// set a cell to a fresh material (used by tools and reactions)
function setCell(i, m, keepTemp) {

}

function transform(i, m) {

  if (KEEPO[m] && !KEEPO[old]) aux[i] = old; // remember origin (molten metals)

  life[i] = BLIFE0[m] ? BLIFE0[m] + rint(BLIFE1[m] - BLIFE0[m] + 1) : lifeFor(m);
  if (HASHEAT[m]) { const h = HEAT0[m]; if ((h > 300 && tmp[i] < h) || (h < -50 && tmp[i] > h)) tmp[i] = h; }

}
function clearCell(i) { mat[i] = 0; life[i] = 0; aux[i] = 0; vx[i] = 0; vy[i] = 0; wakeI(i); }

function swapCells(a, b) {
  let t = mat[a]; mat[a] = mat[b]; mat[b] = t;
  let f = tmp[a]; tmp[a] = tmp[b]; tmp[b] = f;
  t = life[a]; life[a] = life[b]; life[b] = t;
  t = aux[a]; aux[a] = aux[b]; aux[b] = t;
  t = shade[a]; shade[a] = shade[b]; shade[b] = t;
  t = vx[a]; vx[a] = vx[b]; vx[b] = t;
  t = vy[a]; vy[a] = vy[b]; vy[b] = t;

// move cell a into empty cell b (cheaper than swap)
function moveCell(a, b) {
  mat[b] = mat[a]; tmp[b] = tmp[a]; life[b] = life[a]; aux[b] = aux[a]; shade[b] = shade[a]; vx[b] = vx[a]; vy[b] = vy[a];

function resizeWorldTo(nw, nh, keep) {

  allocWorld(nw, nh);

    const yo = nh - oH; // keep ground anchored to the bottom
    for (let y = 0; y < Math.min(oH, nh); y++) for (let x = 0; x < Math.min(oW, nw); x++) {
      const s = y * oW + x, ty = y + Math.max(0, yo), d = ty * nw + x;
      if (ty < 0 || ty >= nh) continue;

    }

function designPreviewRGB(d, k, n, t) {

    case 'pulse': f = 0.5 + 0.5 * Math.sin(t * 7 + k * 0.8); break;

    if (hab === 'air') { ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.beginPath(); ctx.ellipse(Wc * 0.25, Hc * 0.2, 34, 9, 0, 0, 6.283); ctx.ellipse(Wc * 0.75, Hc * 0.32, 26, 7, 0, 0, 6.283); ctx.fill(); }

function designSummary(d) {
  const bits = [];
  bits.push((BLOB_HABS.find(h => h[0] === d.hab) || [, '?'])[1].replace(/^\S+ /, '') + (d.hab === 'water' || d.hab === 'amphib' ? ' (' + BLOB_LIQUIDS.find(l => l[0] === d.liquid)[1].toLowerCase() + ')' : ''));

  if (d.climb) bits.push('climbs walls'); if (d.jump) bits.push('hops');
  bits.push('lives at ' + d.tMin + '…' + d.tMax + '°C');
  if (d.immune.length) bits.push('immune to ' + d.immune.join(', '));
  const food = [];
  if (d.diet.length) food.push(d.diet.length + ' food' + (d.diet.length > 1 ? 's' : ''));
  if (d.prey.length) food.push('hunts ' + d.prey.map(p => p === 'blob_other' ? 'other blobs' : p === 'blob_kin' ? 'its own kind' : (p === 'fish' ? 'fish' : p === 'microbe' ? 'microbes' : (SPECIES_BY_KEY[p] || { name: p }).name.toLowerCase() + 's')).join(', '));
  if (d.photo) food.push('photosynthesises');
  bits.push(food.join(', ') || 'eats nothing');
  bits.push({ split: 'splits in two', eggs: 'lays eggs', seeds: 'drops seeds', none: 'does not breed' }[d.breed]);
  if (d.mutation > 0) bits.push('mutates ' + Math.round(d.mutation * 100) + '%');
  if (d.morphTo && getDesign(d.morphTo)) bits.push('becomes ' + getDesign(d.morphTo).name + ' when mature');
  const cb = [];
  if (d.targets === 'others') cb.push('attacks other creatures'); if (d.targets === 'everything') cb.push('attacks everything');
  if (d.ranged === 'lightning') cb.push('shoots lightning'); else if (d.ranged !== 'none') cb.push('spits ' + MATS[M[d.ranged]].name.toLowerCase());
  if (d.creeper) cb.push('explodes near targets'); if (d.armour) cb.push(Math.round(d.armour * 100) + '% armour'); if (d.regen) cb.push('regenerates');
  if (cb.length) bits.push(cb.join(', '));

  if (d.glow) pw.push('glows'); if (d.aura > 0) pw.push('heats surroundings'); if (d.aura < 0) pw.push('chills surroundings');

function wireTopbar() {

  $('bStep').onclick = () => stepOnce();

  $('bUndo').onclick = undo; $('bRedo').onclick = redo;

  $('bSaves').onclick = openSaves;
  $('bSun').onclick = () => toggleWindow('sun', openSunPanel);
  $('bStats').onclick = () => toggleWindow('stats', openStats);
  $('overlaySel').onchange = () => setOverlay($('overlaySel').value);
  $('bMute').onclick = () => { audioInit(); settings.sound = !(settings.sound && settings.volume > 0); if (settings.sound && settings.volume <= 0) settings.volume = 0.35; setVolume(); syncSettingsUI(); saveSettings(); toast(settings.sound ? '🔊 Sound on' : '🔇 Muted'); };
  $('bSettings').onclick = openSettings;
  $('bDebug').onclick = () => toggleWindow('debug', openDebug);
  $('bHelp').onclick = openHelp;
  $('bSide').onclick = toggleSide;
  $('brand').onclick = showTitle;
  $('matSearch').addEventListener('input', () => { renderCats(); renderPalette(); });
  window.addEventListener('keydown', e => { if (e.key === '/' && document.activeElement !== $('matSearch') && !document.querySelector('.modalBg')) { e.preventDefault(); $('matSearch').focus(); } });
  window.addEventListener('resize', () => { resizeCanvas(); clampCam(); });
  // don't let buttons/dropdowns keep keyboard focus (Space would re-click them and shortcuts would be swallowed)
  document.addEventListener('click', e => { const b = e.target.closest && e.target.closest('button'); if (b) b.blur(); });
  document.addEventListener('change', e => { if (e.target.tagName === 'SELECT' && e.target.closest('#topbar')) e.target.blur(); });
}

let lastT = performance.now(), acc = 0, fpsAcc = 0, fpsN = 0, tickCount = 0, secT = 0, slowFrames = 0, lastPerfWarn = -1e9;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = now - lastT; lastT = now;
  if (dt > 250) dt = 250;
  try {
    continuousTools();
    // fixed-timestep simulation (60 ticks/s at 1×)
    const speed = SPEEDS[settings.simSpeed];
    let steps = 0;
    if (!paused) {
      acc += dt / (1000 / 60) * speed;
      const budget = Math.ceil(speed) + 2;
      const t0 = performance.now();
      while (acc >= 1 && steps < budget) {
        stepSim(); challengeTick(); steps++; acc -= 1;
        if (performance.now() - t0 > 40) { acc = Math.min(acc, 1); break; }
      }
      if (acc > Math.max(4, speed * 1.5)) acc = Math.max(4, speed * 1.5);
    } else {
      while (stepRequested > 0) { stepSim(); challengeTick(); stepRequested--; steps++; }
      acc = 0;
    }
    tickCount += steps;
    updateFx();
    controlCamera();
    mysteryFrame(); littleEyesFrame(); eyeFlowersFrame();
    // smooth zoom is applied in zoomAt; render
    renderWorld();
    drawFrame();
    drawMinimap();
    updateHover();
  } catch (e) {
    simErrorCount++;
    reportError('main loop', e);
    if (simErrorCount > 3) { togglePause(true); toastOnce('err', '⚠ The simulation hit an error and was paused. See the 🐞 debug panel. You can try "Validate world" there.', 'bad'); simErrorCount = 0; }
  }
  // stats
  fpsAcc += dt; fpsN++; secT += dt;
  if (secT >= 500) {
    stats.fps = Math.round(fpsN * 1000 / fpsAcc); stats.tps = Math.round(tickCount * 1000 / secT);
    stats.reactionsPerSec = Math.round(reactionsThisSec * 1000 / secT); reactionsThisSec = 0;
    fpsAcc = 0; fpsN = 0; tickCount = 0; secT = 0;
    $('sFps').textContent = stats.fps; $('sTps').textContent = stats.tps;
    $('sChunks').textContent = activeChunkCount + '/' + (CW * CH); $('sCre').textContent = creatures.length; $('sClock').textContent = settings.dayNight ? clockText() : (settings.weather !== 'clear' ? '' : '');  if (settings.weather !== 'clear') $('sClock').textContent += ' ' + (WEATHERS.find(w => w[0] === settings.weather) || ['', ''])[1];
    lastStats = computeStats(); $('sCells').textContent = lastStats.occ.toLocaleString();
    popHist.push({ c: Object.assign({}, creatureCounts) }); if (popHist.length > 120) popHist.shift();
    if (wins.stats) updateStatsWindow();
    if (wins.inspector) updateInspector(false);
    if (wins.dis) renderDisasterList();
    if (stats.fps < 24 && !paused && settings.quality !== 'low') { slowFrames++; if (slowFrames > 8 && now - lastPerfWarn > 60000) { lastPerfWarn = now; toast('⚠ Running slowly (' + stats.fps + ' fps). Try Low quality in ⚙ Settings or a smaller world.', 'bad'); } }
    else slowFrames = 0;
  }
  autosaveTick(dt);
}

function init() {
  loadSettings();
  const d = LS.get('discovered', []); if (Array.isArray(d)) d.forEach(x => discovered.add(x));
  buildIcons();
  loadDesignLibrary();
  wireTopbar();
  // world size adapted to screen
  const sw = window.innerWidth;
  genParams.w = sw > 1700 ? 560 : sw > 1200 ? 480 : 360; genParams.h = Math.round(genParams.w * 0.62);
  allocWorld(genParams.w, genParams.h);
  setupWorldCanvas();
  generateWorld('starter', { seed: 20260 + ((Math.random() * 1000) | 0) });
  fitCamera();
  buildToolbar(); renderCats(); renderPalette(); renderHotbar(); renderRecent(); selectMaterial(M.sand); setTool('brush'); setSpeed(3); syncSettingsUI(); updateUndoButtons();
  requestAnimationFrame(t => { lastT = t; requestAnimationFrame(frame); });
  showTitle();
}
init();

// ---------- screenshot ----------
function takeScreenshot() {
  try {
    view.toBlob(b => {
      if (!b) { toast('Screenshot failed', 'bad'); return; }
      const d = new Date(), stamp = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') + '_' + String(d.getHours()).padStart(2, '0') + String(d.getMinutes()).padStart(2, '0') + String(d.getSeconds()).padStart(2, '0');
      const a = el('a', { href: URL.createObjectURL(b), download: 'sandsim_' + stamp + '.png' });
      document.body.appendChild(a); a.click(); a.remove();
      flashScreen(); toast('📷 Screenshot saved', 'good');
    }, 'image/png');
  } catch (e) { toast('Screenshot failed: ' + e.message, 'bad'); }
}
function flashScreen() { const f = document.createElement('div'); f.style.cssText = 'position:fixed;inset:0;background:#fff;opacity:.5;pointer-events:none;z-index:99;transition:opacity .35s'; document.body.appendChild(f); requestAnimationFrame(() => { f.style.opacity = '0'; }); setTimeout(() => f.remove(), 400); }
$('bShot').onclick = takeScreenshot;
