<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Table Manners: The Grand Banquet</title>
<style>
:root { --ink: #f4ecd8; --dim: #b9b2c9; --gold: #f2c75c; --bg: #141228; --card: #221d3d; --line: #3a3363; --good: #7fd88f; --bad: #ff8a80; }
* { box-sizing: border-box; }
html, body { margin: 0; background: radial-gradient(ellipse at top, #2a2350, #0e0c1c 70%); color: var(--ink); font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif; min-height: 100%; }
#app { display: flex; gap: 12px; padding: 12px; max-width: 1340px; margin: 0 auto; align-items: flex-start; }
#stage { position: relative; flex: 1 1 auto; min-width: 0; aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden; box-shadow: 0 10px 40px #0008, 0 0 0 2px #3b3466; background: #1b1838; }
#cv { display: block; width: 100%; height: 100%; touch-action: none; cursor: default; }
#panel { flex: 0 0 330px; background: var(--card); border-radius: 14px; box-shadow: 0 0 0 2px var(--line); padding: 12px 12px 10px; display: flex; flex-direction: column; gap: 8px; max-height: calc((100vw - 380px) * 9 / 16); min-height: 420px; overflow: hidden; }
#hdr { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
#hdr .t { font-size: 17px; font-weight: bold; color: var(--gold); line-height: 1.15; }
#hdr .c { font-size: 12px; color: var(--dim); white-space: nowrap; }
#stats { display: flex; justify-content: space-between; font-size: 13px; color: var(--dim); }
#stats b { color: var(--ink); }
.row { display: flex; gap: 6px; }
button { font-family: inherit; font-size: 14px; border: 0; border-radius: 9px; padding: 8px 10px; cursor: pointer; background: #3b3466; color: var(--ink); box-shadow: 0 2px 0 #0006; transition: transform .06s, filter .1s; }
button:hover { filter: brightness(1.15); }
button:active { transform: translateY(1px); }
button:disabled { opacity: .45; cursor: default; filter: none; }
button.big { background: linear-gradient(#f6d27a, #d9a640); color: #2a1d05; font-weight: bold; font-size: 16px; flex: 1.6; }
button.ghost { background: transparent; box-shadow: 0 0 0 1px var(--line); }
.row button { flex: 1; }
#msg { font-size: 13px; min-height: 34px; color: var(--ink); background: #1a1631; border-radius: 8px; padding: 6px 8px; line-height: 1.3; }
#fibhelp { font-size: 12px; color: #ffcf8a; background: #3a2a1a; border-radius: 8px; padding: 6px 8px; display: none; line-height: 1.3; }
#list { flex: 1 1 auto; overflow-y: auto; padding-right: 4px; font-size: 13px; }
#list::-webkit-scrollbar { width: 6px; } #list::-webkit-scrollbar-thumb { background: #4a427a; border-radius: 3px; }
.gb { border-radius: 9px; padding: 5px 7px; margin-bottom: 5px; background: #1a1631; border: 1px solid transparent; }
.gb.hl { border-color: var(--gold); }
.gb .gn { display: flex; align-items: center; gap: 6px; font-weight: bold; }
.gb .gn .f { font-size: 16px; }
.gb .gn .fd { margin-left: auto; font-weight: normal; font-size: 12px; color: var(--dim); }
.gb ul { list-style: none; margin: 3px 0 0; padding: 0; }
.gb li { padding: 2px 4px 2px 20px; position: relative; border-radius: 5px; line-height: 1.25; }
.gb li::before { position: absolute; left: 3px; top: 2px; }
.gb li.ok { color: var(--good); } .gb li.ok::before { content: '✓'; }
.gb li.bad { color: var(--bad); } .gb li.bad::before { content: '✗'; }
.gb li.wait { color: var(--dim); } .gb li.wait::before { content: '·'; }
.gb li.fib { color: #c9a26b; text-decoration: line-through; } .gb li.fib::before { content: '🤥'; text-decoration: none; left: 0; }
.gb li.click { cursor: pointer; } .gb li.click:hover { background: #2c2650; }
.gb li .tag { font-size: 11px; background: #3b3466; border-radius: 4px; padding: 0 4px; margin-right: 4px; color: var(--ink); text-decoration: none; display: inline-block; }
.gb li .tag.nw { background: #6a4a10; }
#foot { border-top: 1px solid var(--line); padding-top: 7px; font-size: 12px; color: var(--dim); display: flex; flex-direction: column; gap: 6px; }
#chprog { display: flex; gap: 4px; flex-wrap: wrap; }
#chprog span { background: #1a1631; border-radius: 6px; padding: 2px 6px; }
#foot .row button { font-size: 12px; padding: 6px 6px; }
#overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: #0b0918cc; backdrop-filter: blur(2px); padding: 14px; }
#overlay.on { display: flex; }
.card { background: linear-gradient(#2b2450, #1e1938); border-radius: 16px; box-shadow: 0 0 0 2px #5a4f94, 0 20px 50px #000a; padding: 18px 22px; max-width: 640px; width: 100%; max-height: 100%; overflow-y: auto; }
.card h1 { margin: 0 0 4px; font-size: 34px; color: var(--gold); text-align: center; letter-spacing: .5px; }
.card h2 { margin: 0 0 10px; font-size: 22px; color: var(--gold); }
.card .sub { text-align: center; color: var(--dim); margin-bottom: 14px; font-style: italic; }
.card p.l { margin: 7px 0; line-height: 1.4; font-size: 15px; }
.card p.l b { color: var(--gold); }
.card .btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; flex-wrap: wrap; }
.card .stars { font-size: 38px; text-align: center; color: var(--gold); letter-spacing: 6px; margin: 4px 0; }
.card .stars .off { color: #4a427a; }
.chap { margin: 10px 0 4px; font-weight: bold; color: var(--gold); }
.tgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(108px, 1fr)); gap: 6px; }
.tgrid button { font-size: 12px; padding: 6px; text-align: left; line-height: 1.2; }
.tgrid button .s { color: var(--gold); display: block; }
.tgrid button.done { background: #3d3a1e; }
.tgrid button.next { background: #5a4a1a; box-shadow: 0 0 0 2px var(--gold); }
.endstats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; font-size: 16px; margin: 10px 0; }
.endstats div:nth-child(odd) { color: var(--dim); }
.rank { text-align: center; font-size: 22px; color: var(--gold); margin: 10px 0 2px; }
label.tog { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
@media (max-width: 900px) {
  #app { flex-direction: column; padding: 6px; }
  #stage { width: 100%; }
  #panel { flex: none; width: 100%; max-height: none; min-height: 0; }
  #list { max-height: none; overflow: visible; }
  .card { padding: 12px 14px; } .card h1 { font-size: 24px; } .card p.l { font-size: 13px; margin: 4px 0; }
}
</style>
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="cv" width="960" height="540"></canvas><div id="overlay"></div></div>
  <aside id="panel">
    <div id="hdr"><div class="t" id="ptitle">Table Manners</div><div class="c" id="pch"></div></div>
    <div id="stats"><span>Moves <b id="smoves">0</b> / par <b id="spar">0</b></span><span>Hints <b id="shints">0</b></span><span id="sstars">☆☆☆</span></div>
    <div class="row"><button class="big" id="bServe">🍽️ Serve</button><button id="bUndo" title="Undo (Ctrl+Z)">↶ Undo</button><button id="bClear">Clear</button><button id="bHint">💡 Hint</button></div>
    <div id="msg">Drag guests from the lobby onto chairs.</div>
    <div id="fibhelp">🤥 Someone at this table is fibbing. Use the dialogue clue, then <b>click their fake wish</b> below to mark it. Click again to unmark.</div>
    <div id="list"></div>
    <div id="foot">
      <div id="chprog"></div>
      <div class="row"><button id="bRelax" class="ghost">Relaxed: off</button><button id="bMute" class="ghost">🔊 Sound</button><button id="bStory" class="ghost">📜 Story</button><button id="bMenu" class="ghost">☰ Tables</button></div>
    </div>
  </aside>
</div>
<script>
// ===== Table Manners engine: geometry, wishes, solver (shared by game + generator) =====
(function (root) {
'use strict';
const E = {};
E.rng = function (a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; };

const SP = 46;
function isMid(i, k) { return k % 2 ? i === (k - 1) / 2 : (i === k / 2 - 1 || i === k / 2); }

E.buildSeats = function (tables) {
  const seats = [], T = [];
  tables.forEach((tb, ti) => {
    const t = { shape: tb.shape, cx: tb.cx, cy: tb.cy, lazy: !!tb.lazy, ring: true, ids: [], name: tb.name || '' };
    T.push(t);
    const add = (x, y, o) => { const s = Object.assign({ id: seats.length, t: ti, x, y, head: false, middle: false, window: false, kitchen: false, ang: 0 }, o || {}); s.ord = t.ids.length; seats.push(s); t.ids.push(s.id); return s; };
    const ac = {}; // ord -> ord
    if (tb.shape === 'round') {
      const n = tb.n, R = Math.max(74, n * SP / (2 * Math.PI)); t.R = R; t.r = R - 23;
      for (let k = 0; k < n; k++) { const a = -Math.PI / 2 + 2 * Math.PI * k / n, dx = Math.cos(a), dy = Math.sin(a);
        add(tb.cx + dx * R, tb.cy + dy * R, { head: k === 0, window: dy > 0.75, kitchen: dx > 0.75, ang: a }); }
      if (n % 2 === 0) for (let k = 0; k < n; k++) ac[k] = (k + n / 2) % n;
    } else if (tb.shape === 'rect') {
      const k = tb.k, w = k * SP, h = 62; t.w = w; t.h = h;
      const x0 = tb.cx - w / 2 + SP / 2;
      for (let i = 0; i < k; i++) add(x0 + i * SP, tb.cy - h / 2 - 22, { middle: isMid(i, k), ang: -Math.PI / 2 });
      add(tb.cx + w / 2 + 23, tb.cy, { head: true, kitchen: true, ang: 0 });
      for (let i = k - 1; i >= 0; i--) add(x0 + i * SP, tb.cy + h / 2 + 22, { middle: isMid(i, k), window: true, ang: Math.PI / 2 });
      add(tb.cx - w / 2 - 23, tb.cy, { head: true, ang: Math.PI });
      for (let i = 0; i < k; i++) { const b = k + 1 + (k - 1 - i); ac[i] = b; ac[b] = i; }
      ac[k] = 2 * k + 1; ac[2 * k + 1] = k;
    } else if (tb.shape === 'u') {
      t.ring = false; const a = tb.a, b = tb.b, th = 34;
      const L = tb.cx - b * SP / 2, Rr = tb.cx + b * SP / 2, H = a * SP + th, yT = tb.cy - H / 2, yB = tb.cy + H / 2;
      Object.assign(t, { L, R: Rr, yT, yB, th });
      for (let i = 0; i < a; i++) add(L - 22, yT + SP / 2 + i * SP, { middle: a % 2 === 1 && i === (a - 1) / 2, ang: Math.PI });
      for (let j = 0; j < b; j++) add(tb.cx + (j - (b - 1) / 2) * SP, yB + 22, { window: true, head: b % 2 === 1 && j === (b - 1) / 2, ang: Math.PI / 2 });
      for (let i = a - 1; i >= 0; i--) add(Rr + 22, yT + SP / 2 + i * SP, { kitchen: true, middle: a % 2 === 1 && i === (a - 1) / 2, ang: 0 });
      for (let i = 0; i < a; i++) { const r = a + b + (a - 1 - i); ac[i] = r; ac[r] = i; }
    }
    t.across = ac;
  });
  const N = seats.length;
  const D = [], A = [], across = new Array(N).fill(-1), nb = [];
  for (let i = 0; i < N; i++) { D.push(new Array(N).fill(99)); A.push(new Array(N).fill(false)); nb.push([]); }
  T.forEach(t => {
    const n = t.ids.length;
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
      let d = Math.abs(i - j); if (t.ring) d = Math.min(d, n - d);
      D[t.ids[i]][t.ids[j]] = d; if (d === 1) { A[t.ids[i]][t.ids[j]] = true; }
    }
    for (const o in t.across) across[t.ids[o]] = t.ids[t.across[o]];
  });
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) if (A[i][j]) nb[i].push(j);
  return { seats, tables: T, D, A, across, nb, N };
};

// ---------- wishes ----------
// ev returns 1 true, 0 false, 2 unknown.  P = {pos, occ, left, fin}
const UNARY = { head: 1, middle: 1, window: 1, kitchen: 1 };
const GLOBAL = { empty: 1, food: 1, between: 1, nofam: 1, aura: 1 };
E.GLOBAL = GLOBAL;
function ev(w, C, P) {
  const S = C.S, pos = P.pos, occ = P.occ, fin = P.fin;
  const sg = pos[w.g];
  switch (w.k) {
    case 'head': case 'middle': case 'window': case 'kitchen':
      if (sg < 0) return fin ? 0 : 2; return S.seats[sg][w.k] ? 1 : 0;
    case 'next': case 'near': case 'across': case 'same': case 'two': {
      const sx = pos[w.x]; if (sg < 0 || sx < 0) return fin ? 0 : 2;
      if (w.k === 'next') return S.A[sg][sx] ? 1 : 0;
      if (w.k === 'near') return S.D[sg][sx] <= 2 ? 1 : 0;
      if (w.k === 'across') return S.across[sg] === sx ? 1 : 0;
      if (w.k === 'same') return S.seats[sg].t === S.seats[sx].t ? 1 : 0;
      return S.D[sg][sx] === 2 ? 1 : 0;
    }
    case 'tbl': if (sg < 0) return fin ? 0 : 2; return S.seats[sg].t === w.t ? 1 : 0;
    case 'notnext': case 'far': case 'diff': {
      const sx = pos[w.x]; if (sg < 0) return fin ? 0 : 2; if (sx < 0) return fin ? 1 : 2;
      if (w.k === 'notnext') return S.A[sg][sx] ? 0 : 1;
      if (w.k === 'far') return S.D[sg][sx] <= 2 ? 0 : 1;
      return S.seats[sg].t !== S.seats[sx].t ? 1 : 0;
    }
    case 'empty': {
      if (sg < 0) return fin ? 0 : 2;
      let anyEmpty = false; for (const n of S.nb[sg]) if (occ[n] < 0) anyEmpty = true;
      if (!anyEmpty) return 0; if (fin || P.left === 0) return 1; return 2;
    }
    case 'between': {
      if (sg < 0) return fin ? 0 : 2;
      const nb = S.nb[sg]; if (nb.length < 2) return 0;
      const sx = pos[w.x], sy = pos[w.y];
      if (fin) return (sx >= 0 && sy >= 0 && S.A[sg][sx] && S.A[sg][sy]) ? 1 : 0;
      if (sx >= 0 && !S.A[sg][sx]) return 0; if (sy >= 0 && !S.A[sg][sy]) return 0;
      for (const n of nb) { const o = occ[n]; if (o >= 0 && o !== w.x && o !== w.y) return 0; }
      return (sx >= 0 && sy >= 0) ? 1 : 2;
    }
    case 'food': {
      if (sg < 0) return fin ? 0 : 2;
      const f = C.G[w.g].food; let full = true;
      for (const n of S.nb[sg]) { const o = occ[n]; if (o < 0) full = false; else if (C.G[o].food === f) return 1; }
      if (fin || full) return 0;
      for (let h = 0; h < pos.length; h++) if (h !== w.g && pos[h] < 0 && C.act[h] && C.G[h].food === f) return 2;
      return 0;
    }
    case 'nofam': {
      const f = w.fam;
      for (let s = 0; s < S.N; s++) { const o = occ[s]; if (o < 0 || C.G[o].fam !== f) continue;
        for (const n of S.nb[s]) { const o2 = occ[n]; if (n > s && o2 >= 0 && C.G[o2].fam === f) return 0; } }
      return (fin || P.left === 0) ? 1 : 2;
    }
    case 'aura': {
      if (sg < 0) return fin ? 1 : 2;
      for (const n of S.nb[sg]) { const o = occ[n]; if (o >= 0 && !(C.G[o].imm || []).includes(w.t)) return 0; }
      return (fin || P.left === 0) ? 1 : 2;
    }
    case 'mirror': return (fin || P.left === 0) ? 1 : 2; // resolved by mood()
    case 'ifthen': {
      const sx = pos[w.x]; if (sx < 0) return fin ? 0 : 2;
      const sub = S.seats[sx][w.c] ? w.a : w.b;
      return ev(sub, C, P);
    }
  }
  return 1;
}
E.ev = ev;
function involved(w) {
  const r = [w.g]; if (w.x != null) r.push(w.x); if (w.y != null) r.push(w.y);
  if (w.k === 'ifthen') { for (const s of [w.a, w.b]) { if (s.x != null) r.push(s.x); } }
  return r;
}
E.involved = involved;
function isGlobal(w) { if (GLOBAL[w.k]) return true; if (w.k === 'ifthen') return GLOBAL[w.a.k] || GLOBAL[w.b.k]; return false; }

// ---------- solver ----------
E.solve = function (C, wishes, limit, opt) {
  opt = opt || {};
  const S = C.S, N = S.N, act = C.act, G = act.length, rnd = opt.rnd;
  const pos = new Array(G).fill(-1), occ = new Array(N).fill(-1);
  const list = []; for (let g = 0; g < G; g++) if (act[g]) list.push(g);
  const P = { pos, occ, left: list.length, fin: false };
  const dep = []; for (let g = 0; g < G; g++) dep.push([]);
  const glob = [];
  for (const w of wishes) { if (w.k === 'mirror') continue; if (isGlobal(w)) glob.push(w); else for (const g of new Set(involved(w))) dep[g].push(w); }
  let seatOrder = []; for (let s = 0; s < N; s++) seatOrder.push(s);
  if (rnd) for (let i = N - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [seatOrder[i], seatOrder[j]] = [seatOrder[j], seatOrder[i]]; }
  let gOrder = list.slice(); if (rnd) for (let i = gOrder.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [gOrder[i], gOrder[j]] = [gOrder[j], gOrder[i]]; }
  const sols = []; let nodes = 0, aborted = false; const maxNodes = opt.maxNodes || 3e6;
  function ok(g) { for (const w of dep[g]) if (ev(w, C, P) === 0) return false; for (const w of glob) if (ev(w, C, P) === 0) return false; return true; }
  function rec() {
    if (P.left === 0) {
      for (const w of wishes) if (ev(w, C, P) === 0) return false;
      sols.push(pos.slice()); return sols.length >= limit;
    }
    if (++nodes > maxNodes) { aborted = true; return true; }
    let best = -1, bl = null;
    for (const g of gOrder) {
      if (pos[g] >= 0) continue;
      const l = [];
      for (const s of seatOrder) { if (occ[s] >= 0) continue; pos[g] = s; occ[s] = g; P.left--; if (ok(g)) l.push(s); pos[g] = -1; occ[s] = -1; P.left++; if (bl && l.length >= bl.length) break; }
      if (!bl || l.length < bl.length) { best = g; bl = l; if (!l.length) return false; }
    }
    for (const s of bl) { pos[best] = s; occ[s] = best; P.left--; const r = rec(); pos[best] = -1; occ[s] = -1; P.left++; if (r) return true; }
    return false;
  }
  rec();
  return { sols, count: sols.length, aborted, nodes };
};

// ---------- mood (game-side, final mode) ----------
// pos: guest->seat (-1 lobby / not arrived). returns per-guest happy and per-wish ok
E.mood = function (C, pos, wishes, fib) {
  const S = C.S, G = pos.length, occ = new Array(S.N).fill(-1);
  for (let g = 0; g < G; g++) if (pos[g] >= 0) occ[pos[g]] = g;
  const P = { pos, occ, left: 0, fin: true };
  const ok = wishes.map(w => ev(w, C, P));
  const happy = [], grump = [];
  for (let g = 0; g < G; g++) { happy.push(C.act[g] && pos[g] >= 0); grump.push([]); }
  wishes.forEach((w, i) => {
    if (w.k === 'aura') { const sa = pos[w.g]; if (sa < 0) return; for (const n of S.nb[sa]) { const o = occ[n]; if (o >= 0 && !(C.G[o].imm || []).includes(w.t)) { grump[o].push(w.g); happy[o] = false; } } return; }
    if (w.k === 'mirror' || i === fib) return;
    if (!ok[i]) happy[w.g] = false;
  });
  wishes.forEach((w, i) => { if (w.k === 'mirror' && i !== fib) { ok[i] = (happy[w.x] && pos[w.x] >= 0) ? 1 : 0; } });
  wishes.forEach((w, i) => { if (w.k === 'mirror' && i !== fib && !ok[i]) happy[w.g] = false; });
  return { happy, ok, grump, occ };
};

// ---------- text ----------
E.TNAMES = ['🌙 Moon', '⭐ Star', '☄️ Comet'];
E.FOOD = { pasta: '🍝 pasta', salad: '🥗 salad', cake: '🍰 cake', fish: '🐟 fish', steak: '🥩 steak', soup: '🍲 soup', tacos: '🌮 tacos' };
E.wishText = function (w, nm, G) {
  const X = w.x != null ? nm(w.x) : '', Y = w.y != null ? nm(w.y) : '';
  switch (w.k) {
    case 'next': return 'Next to ' + X;
    case 'notnext': return 'NOT next to ' + X;
    case 'near': return 'Near ' + X + ' (within 2 seats)';
    case 'far': return 'Far from ' + X + ' (3+ seats or another table)';
    case 'across': return 'Directly across from ' + X;
    case 'head': return 'At the head of a table 👑';
    case 'middle': return 'In a middle seat ◆';
    case 'window': return 'Facing the window 🌙';
    case 'kitchen': return 'Back to the kitchen door 🚪';
    case 'empty': return 'An empty chair beside them';
    case 'same': return 'At the same table as ' + X;
    case 'tbl': return 'At the ' + E.TNAMES[w.t] + ' table';
    case 'diff': return 'At a different table from ' + X;
    case 'two': return 'Exactly 2 seats away from ' + X;
    case 'between': return 'Between ' + X + ' and ' + Y;
    case 'food': return 'Next to a fellow ' + E.FOOD[G[w.g].food] + ' fan';
    case 'nofam': return 'No two ' + w.fam + 's side by side!';
    case 'aura': return w.t === 'smell' ? "Doesn't care where they sit… but neighbours get grumpy 💨 (unless they can't smell)" : "Doesn't care where they sit… but neighbours get grumpy 🎶 (unless they love opera)";
    case 'mirror': return 'Only happy if ' + X + ' is happy';
    case 'ifthen': {
      const c = { head: 'at a head', window: 'facing the window', kitchen: 'back to the kitchen' }[w.c];
      const lo = s => { const t = E.wishText(s, nm, G); return t.charAt(0).toLowerCase() + t.slice(1); };

  if (drag && dragSeat >= 0) { const p2 = G.pos.slice(); const h = p2.indexOf(dragSeat); if (h >= 0) p2[h] = p2[drag.g]; p2[drag.g] = dragSeat; pred = mood(p2); }
  if (hoverS >= 0) { ring = {}; activeList().forEach(g => { const p2 = G.pos.slice(); const h = p2.indexOf(hoverS); if (h >= 0 && h !== g) p2[h] = p2[g]; p2[g] = hoverS; ring[g] = mood(p2).happy[g]; }); }
  const sol = G.p.stages[G.stage].sol;
  S.seats.forEach(s => {
    let hl = null;
    if (s.id === dragSeat) hl = pred && pred.happy[drag.g] ? '#7fd88f' : '#ff8a80';
    else if (s.id === hoverS) hl = '#f2c75c';
    if (G.hintG >= 0 && sol[G.hintG] === s.id) hl = 'rgba(255,215,90,' + (0.5 + 0.5 * Math.sin(now / 160)) + ')';
    drawSeat(s, now, hl);
  });
  // hint line
  if (G.hintG >= 0) { const a = G.disp[G.hintG] || targetXY(G.hintG), b = S.seats[sol[G.hintG]]; ctx.strokeStyle = 'rgba(255,215,90,0.8)'; ctx.setLineDash([5, 5]); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); ctx.setLineDash([]); }
  // guests
  const order = activeList().filter(g => !drag || g !== drag.g);
  order.forEach(g => {
    const tg = targetXY(g); let d = G.disp[g];
    if (!d) d = G.disp[g] = { x: tg.x, y: tg.y };
    d.x += (tg.x - d.x) * 0.28; d.y += (tg.y - d.y) * 0.28;
    if (Math.abs(tg.x - d.x) < 0.3) d.x = tg.x; if (Math.abs(tg.y - d.y) < 0.3) d.y = tg.y;
    const mm = pred || m;
    const st = G.pos[g] < 0 ? 'wait' : (mm.happy[g] ? 'happy' : 'grumpy');
    if (ring) { ctx.strokeStyle = ring[g] ? '#7fd88f' : 'rgba(255,138,128,0.85)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(d.x, d.y, TR + 4, 0, 7); ctx.stroke(); }
    if (g === panelHL || g === hoverG) { ctx.strokeStyle = '#f2c75c'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(d.x, d.y, TR + 6, 0, 7); ctx.stroke(); }
    if (G.guests[g].aura && G.pos[g] >= 0) { ctx.fillStyle = G.guests[g].aura === 'smell' ? 'rgba(140,200,80,0.12)' : 'rgba(230,120,200,0.12)'; ctx.beginPath(); ctx.arc(d.x, d.y, TR + 14 + 3 * Math.sin(now / 300), 0, 7); ctx.fill(); }
    drawGuest(g, d.x, d.y, st, false);
    if (G.guests[g].aura && G.pos[g] >= 0) { ctx.font = '11px serif'; ctx.textAlign = 'center'; ctx.fillText(G.guests[g].aura === 'smell' ? '💨' : '🎶', d.x + 14 + 2 * Math.sin(now / 200), d.y - 14); }
  });
  if (drag) { const x = drag.x + drag.ox, y = drag.y + drag.oy; G.disp[drag.g] = { x, y }; drawGuest(drag.g, x, y, pred ? (pred.happy[drag.g] ? 'happy' : 'grumpy') : 'wait', true); }
  // fx
  fx = fx.filter(f => now - f.b < 1200);
  fx.forEach(f => { const k = (now - f.b) / 1200; ctx.globalAlpha = 1 - k; ctx.fillStyle = f.c; ctx.font = 'bold 18px serif'; ctx.textAlign = 'center'; ctx.fillText(f.t, f.x, f.y - k * 30); ctx.globalAlpha = 1; });
  // tooltips
  if (hoverG >= 0) {
    const gu = G.guests[hoverG], d = G.disp[hoverG] || targetXY(hoverG);
    const rows = [];
    G.wishes.forEach((w, i) => { if (w.g !== hoverG) return; const seated = G.pos[hoverG] >= 0; rows.push([i === G.fib ? '🤥' : !seated ? '·' : m.ok[i] ? '✓' : '✗', (w.note ? '📨 ' : '') + (w.nw ? '✨ ' : '') + wtext(w), i === G.fib ? '#c9a26b' : !seated ? '#b9b2c9' : m.ok[i] ? '#7fd88f' : '#ff8a80']); });
    m.grump[hoverG].forEach(a => rows.push(['😖', 'Next to ' + G.guests[a].sh + '!', '#ff8a80']));
    if (!rows.length) rows.push(['·', 'Easygoing: happy anywhere.', '#b9b2c9']);
    rows.push(['', FOOD_E[gu.food] + ' likes ' + gu.food + (gu.imm ? ' · ' + gu.imm.map(x => x === 'smell' ? "can't smell" : 'loves/ignores opera').join(', ') : ''), '#b9b2c9']);
    tooltip(d.x, d.y, gu.name, rows, gu.bio);
  } else if (hoverS >= 0) {
    const s = S.seats[hoverS], a = [];
    if (s.head) a.push('👑 head'); if (s.window) a.push('🌙 faces window'); if (s.kitchen) a.push('🚪 back to kitchen'); if (s.middle) a.push('◆ middle');
    if (S.tables.length > 1) a.push(E.TNAMES[s.t] + ' table');
    const happyHere = ring ? activeList().filter(g => ring[g]).map(g => G.guests[g].sh) : [];
    tooltip(s.x, s.y, 'Chair ' + (s.ord + 1), [['', a.length ? a.join(' · ') : 'An ordinary chair'], ['😊', happyHere.length ? 'Happy here: ' + happyHere.join(', ') : 'Nobody would be happy here (yet)', happyHere.length ? '#7fd88f' : '#ff8a80']]);
  }
  // twist banner / stage indicator
  if (G.p.stages.length > 1) { ctx.fillStyle = 'rgba(20,16,40,0.7)'; rr(8, 30, 120, 20, 6); ctx.fill(); ctx.fillStyle = '#f2c75c'; ctx.font = 'bold 11px Georgia'; ctx.textAlign = 'left'; ctx.fillText(G.stage === 0 ? '🍲 First course' : '⚡ After the twist', 16, 44); }
  cv.style.cursor = drag ? 'grabbing' : hoverG >= 0 ? 'grab' : 'default';
}
function loop(now) { try { draw(now); } catch (e) { console.error(e); } requestAnimationFrame(loop); }

// ---------------- test API (used by the automated playtest bot)
window.__TM = {
  rando(seed) { startRando(seed); },
  state() { return G ? { id: G.p.id, stage: G.stage, stages: G.p.stages.length, pos: G.pos.slice(), act: G.act.slice(), sol: G.p.stages[G.stage].sol.slice(), fake: G.fake, fib: G.fib, done: G.done, busy: !!G.busy, moves: G.moves, par: G.p.par, mode, lazy: G.S.tables.some(t => t.lazy) } : { mode }; },
  client(x, y) { const r = cv.getBoundingClientRect(); return { x: r.left + x * r.width / W, y: r.top + y * r.height / H }; },
  seatXY(s) { const q = G.S.seats[s]; return this.client(q.x, q.y); },
  guestXY(g) { const t = targetXY(g); return this.client(t.x, t.y); },
  save() { return JSON.parse(JSON.stringify(save)); },
  happy() { const m = mood(); return activeList().every(g => m.happy[g]); }
};

resize();
requestAnimationFrame(loop);
showTitle();
})();
