<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blorp</title>
<style id="blorp-style">
  /* Single dark look: one-screen chat column, slide-in drawer for saved chats */
  :root{
    --bg:#0f1117; --fg:#e8e8f0; --muted:#8a8fa3; --line:#262a38;
    --field:#171a24; --panel:#141722; --bot:#1c2340; --bot-fg:#cfdcff; --me:#262a38;
    --avatar:#2b3a67; --avatar-fg:#9fb8ff; --accent:#5b7cff; --on-accent:#ffffff;
    --danger:#ff7a8a; --scrim:rgba(5,6,10,.6); --canvas:#ffffff;
    color-scheme:dark;
  }
  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  img{max-width:100%;}
  html,body{height:100%;}
  body{margin:0;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;}
  button{font:inherit;}
  button:focus-visible,input:focus-visible{outline:2px solid var(--avatar-fg);outline-offset:2px;}
  .pad{padding-left:max(18px, env(safe-area-inset-left, 0px));padding-right:max(18px, env(safe-area-inset-right, 0px));}
  header{padding-block:12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;}
  .avatar{width:36px;height:36px;border-radius:50%;background:var(--avatar);display:flex;align-items:center;justify-content:center;font-weight:bold;color:var(--avatar-fg);flex:none;}
  .who{flex:1;min-width:0;}
  header h1{margin:0;font-size:16px;}
  header p{margin:0;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ghost{background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:13px;cursor:pointer;}
  .ghost:hover{border-color:var(--accent);}
  #log{flex:1;overflow-y:auto;padding-block:16px;display:flex;flex-direction:column;gap:10px;min-height:0;}
  .msg{max-width:80%;padding:9px 13px;border-radius:12px;line-height:1.45;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;display:flex;flex-direction:column;gap:8px;}
  .bot{background:var(--bot);color:var(--bot-fg);align-self:flex-start;}
  .me{background:var(--me);align-self:flex-end;}
  .sys{align-self:center;color:var(--muted);font-size:12px;text-align:center;}
  .dim{color:var(--muted);}
  .pic{display:flex;flex-direction:column;gap:6px;align-items:flex-start;white-space:normal;}
  .pic img{width:min(360px,100%);aspect-ratio:1;max-width:100%;object-fit:contain;background:var(--canvas);border-radius:8px;display:block;cursor:zoom-in;}
  .pic img.big{width:min(720px,100%);cursor:zoom-out;}
  .msg.bot:has(img.big){max-width:100%;}
  .pic button{background:transparent;color:var(--bot-fg);border:1px solid var(--avatar);border-radius:6px;padding:4px 9px;font-size:12px;cursor:pointer;}
  .drawing{width:min(360px,100%);text-align:center;padding:12px;aspect-ratio:1;border-radius:8px;border:1px dashed var(--avatar);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;}
  #row{display:flex;flex-wrap:wrap;gap:8px;padding-block:14px;border-top:1px solid var(--line);}
  #attachBtn{background:var(--field);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:0 12px;font-size:18px;cursor:pointer;flex:none;}
  #attachBtn:hover{border-color:var(--accent);}
  #attachBtn:disabled{opacity:.4;cursor:default;}
  #tray{flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px;}
  .chip{display:flex;align-items:center;gap:6px;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:4px 6px 4px 4px;font-size:12px;max-width:100%;}
  .chip img{width:32px;height:32px;object-fit:cover;border-radius:5px;flex:none;}
  .chip .fi{width:32px;height:32px;border-radius:5px;background:var(--avatar);color:var(--avatar-fg);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:bold;flex:none;text-transform:uppercase;}
  .chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
  .chip button{background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:2px 4px;}
  .chip button:hover{color:var(--danger);}
  .att{display:flex;flex-wrap:wrap;gap:6px;white-space:normal;}
  .att img{max-width:min(220px,100%);max-height:220px;border-radius:8px;display:block;}
  .att .tag{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:3px 7px;}
  body.dragging #log{outline:2px dashed var(--accent);outline-offset:-8px;}
  #input{flex:1;min-width:0;background:var(--field);border:1px solid var(--line);color:var(--fg);padding:10px 12px;border-radius:8px;font-size:14px;}
  #input:focus{outline:none;border-color:var(--accent);}
  #send{background:var(--accent);color:var(--on-accent);border:none;padding:0 18px;border-radius:8px;font-weight:bold;cursor:pointer;}
  #send:disabled{opacity:.4;cursor:default;}

  #scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;}
  #drawer{position:fixed;top:0;bottom:0;left:0;width:min(300px,85vw);background:var(--panel);border-right:1px solid var(--line);z-index:21;display:flex;flex-direction:column;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);}
  .dhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 14px 10px;}
  .dhead h2{margin:0;font-size:14px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);}
  #chatList{flex:1;overflow-y:auto;padding:0 8px 12px;display:flex;flex-direction:column;gap:2px;min-height:0;}
  .item{display:flex;align-items:center;gap:4px;border-radius:8px;}
  .item.on{background:var(--bot);}
  .item .open{flex:1;min-width:0;text-align:left;background:transparent;border:none;color:var(--fg);padding:9px 10px;cursor:pointer;border-radius:8px;}
  .item .open:hover{background:var(--me);}
  .item .t{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .item .d{display:block;font-size:11px;color:var(--muted);}
  .item .del{background:transparent;border:none;color:var(--muted);cursor:pointer;padding:6px 8px;border-radius:6px;font-size:12px;flex:none;}
  .item .del:hover{color:var(--danger);}
  .item .del.arm{color:var(--danger);font-weight:bold;}
  #listNote{padding:8px 14px;font-size:12px;color:var(--muted);}
  @media (prefers-reduced-motion:no-preference){ #drawer{animation:slide .18s ease-out;} @keyframes slide{from{transform:translateX(-12px);opacity:.6}} }

  .ghost:disabled{opacity:.4;cursor:default;}
  .cta{background:var(--accent);color:var(--on-accent);border:none;border-radius:8px;padding:8px 14px;font-weight:bold;cursor:pointer;font-size:13px;}
  .cta:disabled{opacity:.4;cursor:default;}
  .dots{display:inline-flex;gap:4px;padding:4px 2px;}
  .dots i{width:7px;height:7px;border-radius:50%;background:var(--bot-fg);opacity:.35;animation:blip 1s infinite;}
  .dots i:nth-child(2){animation-delay:.15s;} .dots i:nth-child(3){animation-delay:.3s;}
  @keyframes blip{40%{opacity:1;transform:translateY(-3px)}}
  #customPanel{position:fixed;top:0;bottom:0;right:0;width:min(440px,94vw);background:var(--panel);border-left:1px solid var(--line);z-index:21;display:flex;flex-direction:column;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px);}
  #customBody{flex:1;overflow-y:auto;padding:0 16px 16px;display:flex;flex-direction:column;gap:20px;min-height:0;}
  .cintro{margin:0;font-size:13px;line-height:1.5;color:var(--bot-fg);}
  .csec{display:flex;flex-direction:column;gap:8px;}
  .csec h3{margin:0;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
  .csec p{margin:0;font-size:12px;color:var(--muted);line-height:1.4;}
  .cf{background:var(--field);border:1px solid var(--line);color:var(--fg);padding:8px 10px;border-radius:8px;font:inherit;font-size:13px;width:100%;min-width:0;}
  .cf::placeholder{color:var(--muted);opacity:.8;}
  .cf:focus{outline:none;border-color:var(--accent);}
  textarea.cf{resize:vertical;min-height:64px;line-height:1.4;}
  .rows{display:flex;flex-direction:column;gap:8px;}
  .rows:empty{display:none;}
  .crow{display:flex;gap:6px;align-items:flex-start;}
  .pair{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;padding:8px;border:1px solid var(--line);border-radius:10px;}
  .x{flex:none;font-size:12px;padding:6px 9px;}
  .add{align-self:flex-start;font-size:12.5px;}
  .favgrid{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-size:13px;color:var(--bot-fg);}
  .cfoot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line);}
  #customStatus{flex:1 1 100%;font-size:12px;color:var(--muted);}
  #bar{height:3px;background:var(--line);}
  #barFill{height:100%;width:0;background:var(--accent);transition:width .3s;}
  #brainPanel{position:fixed;top:0;bottom:0;right:0;width:min(360px,92vw);background:var(--panel);border-left:1px solid var(--line);z-index:21;display:flex;flex-direction:column;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px);}
  #brainList{flex:1;overflow-y:auto;padding:0 14px 14px;display:flex;flex-direction:column;gap:8px;min-height:0;}
  .brainOpt{display:flex;flex-direction:column;gap:5px;text-align:left;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--fg);cursor:pointer;font:inherit;}
  .brainOpt:hover:not(:disabled){border-color:var(--accent);}
  .brainOpt.on{border-color:var(--accent);background:var(--bot);}
  .brainOpt:disabled{opacity:.5;cursor:default;}
  .bt{font-weight:bold;font-size:14px;}
  .bd{font-size:12.5px;color:var(--bot-fg);line-height:1.4;}
  .bg{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
  #brainNote{flex:1 1 100%;font-size:12px;color:var(--muted);line-height:1.4;}
  @media (prefers-reduced-motion:reduce){ .dots i{animation:none;opacity:.7;} #barFill{transition:none;} }
</style>
</head>
<body>
<header class="pad">
  <button class="ghost" id="chatsBtn" type="button" aria-label="Saved chats">Chats</button>
  <div class="avatar">B</div>
  <div class="who"><h1>Blorp</h1><p id="sub">friendly AI · draws pictures</p></div>
  <button class="ghost" id="brainBtn" type="button">Brain</button>
  <button class="ghost" id="customBtn" type="button" hidden>Customize</button>
  <button class="ghost" id="newBtn" type="button" aria-label="New chat">New</button>
</header>
<div id="bar" hidden><div id="barFill"></div></div>
<div id="log" class="pad" aria-live="polite"></div>
<form id="row" class="pad">
  <div id="tray" hidden></div>
  <button id="attachBtn" type="button" aria-label="Attach files" title="Send a picture or text file">+</button>
  <input id="fileInput" type="file" multiple hidden>
  <input id="input" type="text" placeholder="Talk to Blorp, or say &quot;draw a frog&quot;..." autocomplete="off" aria-label="Message">
  <button id="send" type="submit">Send</button>
</form>
<div id="scrim" hidden></div>
<aside id="drawer" hidden aria-label="Saved chats">
  <div class="dhead"><h2>Saved chats</h2><button class="ghost" id="closeBtn" type="button">Close</button></div>
  <div id="listNote">Loading your chats…</div>
  <div id="chatList"></div>
</aside>
<aside id="customPanel" hidden aria-label="Customize Blorp">
  <div class="dhead"><h2>Customize Blorp</h2><button class="ghost" id="customClose" type="button">Close</button></div>
  <div id="customBody"></div>
  <div class="cfoot"><span id="customStatus"></span><button class="ghost" id="customDownload" type="button">Download for my website</button><button class="cta" id="customSave" type="button" disabled>Save changes</button></div>
</aside>
<aside id="brainPanel" hidden aria-label="Choose Blorp's brain">
  <div class="dhead"><h2>Blorp's brain</h2><button class="ghost" id="brainClose" type="button">Close</button></div>
  <div id="brainList"></div>
  <div class="cfoot"><span id="brainNote"></span><button class="cta" id="brainLoad" type="button" hidden>Download</button></div>
</aside>

<script id="s-art">
/* ===================== Blorp's drawing engine =====================
   Turns a small "picture plan" into a detailed SVG:
   { subject, count, color, background, mood, accessories[], extras[], sign }
*/
const ART = (() => {

const SUBJECTS = ['frog','cat','dog','bunny','bear','bird','duck','fish','octopus','spider','snail','dragon','robot','ghost','alien','monster','house','castle','rocket','tree','flower','mushroom','car'];
const BACKGROUNDS = ['meadow','forest','night','sunset','underwater','space','snow','desert','pond','city','room','plain'];
const MOODS = ['happy','sad','angry','surprised','sleepy','silly','love'];
const ACCESSORIES = ['tophat','crown','partyhat','wizardhat','cowboyhat','beanie','sunglasses','glasses','monocle','mustache','bowtie','scarf'];
const EXTRAS = ['hearts','stars','sparkles','balloons','bubbles','flowers','rain','snow','confetti','notes','butterflies','coins'];
const COLORS = {
  red:'#e2453c', orange:'#f28c28', yellow:'#f6cf3a', green:'#4fae4f', lime:'#9ad94a', teal:'#2bb3a6',
  blue:'#3f8be0', navy:'#2d4a8a', purple:'#9056c8', pink:'#f27bb0', brown:'#8b5a2b', tan:'#d2a76a',
  white:'#f4f2ee', gray:'#9aa1aa', black:'#34323d', gold:'#e6b422', rainbow:'rainbow'
};
const NATURAL = {
  frog:'#5bb55b', cat:'#f0973a', dog:'#c88a4a', bunny:'#f3efe8', bear:'#8b5a2b', bird:'#4a90d9', duck:'#f7d038',
  fish:'#ff8a3d', octopus:'#a05cc8', spider:'#3a3846', snail:'#c8743a', dragon:'#d9493a', robot:'#a9b4c2',
  ghost:'#f3f3ff', alien:'#8edc5a', monster:'#3fbdb0', house:'#ead0a8', castle:'#a3abb5', rocket:'#e2453c',
  tree:'#4caf50', flower:'#ff6fa8', mushroom:'#e0473b', car:'#e2453c'
};
const FLOATING = { fish: 1, ghost: 1 };

/* ---------- color + random helpers ---------- */
const hex2 = h => { h = h.replace('#',''); if(h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255]; };
const rgb2 = (r,g,b) => '#' + [r,g,b].map(v => Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
const mix = (a,b,t) => { const A = hex2(a), B = hex2(b); return rgb2(A[0]+(B[0]-A[0])*t, A[1]+(B[1]-A[1])*t, A[2]+(B[2]-A[2])*t); };
const lighten = (c,t) => mix(c,'#ffffff',t), darken = (c,t) => mix(c,'#000000',t);
const lum = c => { const [r,g,b] = hex2(c); return (0.299*r + 0.587*g + 0.114*b) / 255; };
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const f1 = n => Math.round(n * 10) / 10;
function hash(s){ let h = 2166136261; for(let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function mulberry(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function makeArt(seed, detail){
  const rnd = mulberry(hash(seed));
  const defs = []; const cache = {}; let uid = 0;
  const A = {
    detail, defs,
    r: (a,b) => a + (b - a) * rnd(),
    ri: (a,b) => Math.floor(a + (b - a + 1) * rnd()),
    pick: arr => arr[Math.floor(rnd() * arr.length)],
    chance: p => rnd() < p,
    id: () => 'b' + (uid++),
    lin(stops, x2 = 0, y2 = 1){
      const k = 'l' + JSON.stringify(stops) + x2 + y2; if(cache[k]) return cache[k];
      const id = A.id();
      defs.push(`<linearGradient id="${id}" x1="0" y1="0" x2="${x2}" y2="${y2}">${stops.map(([o,c,op]) => `<stop offset="${o}" stop-color="${c}"${op != null ? ` stop-opacity="${op}"` : ''}/>`).join('')}</linearGradient>`);
      return cache[k] = `url(#${id})`;
    },
    rad(stops, cx = '50%', cy = '50%', r = '50%'){
      const k = 'r' + JSON.stringify(stops) + cx + cy + r; if(cache[k]) return cache[k];
      const id = A.id();
      defs.push(`<radialGradient id="${id}" cx="${cx}" cy="${cy}" r="${r}">${stops.map(([o,c,op]) => `<stop offset="${o}" stop-color="${c}"${op != null ? ` stop-opacity="${op}"` : ''}/>`).join('')}</radialGradient>`);
      return cache[k] = `url(#${id})`;
    },
    shade(c){ return A.rad([[0, lighten(c,.38)],[.55, c],[1, darken(c,.28)]], '36%', '30%', '75%'); },
    blur(sd){
      const k = 'f' + sd; if(cache[k]) return cache[k];
      const id = A.id();
      defs.push(`<filter id="${id}" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="${sd}"/></filter>`);
      return cache[k] = `url(#${id})`;
    }
  };
  return A;
}

// A palette for one subject: base color, shaded fill, outline, light and dark tones.
function palette(A, colorName, subject){
  let c = colorName && colorName !== 'natural' && COLORS[colorName] ? COLORS[colorName] : NATURAL[subject] || '#9056c8';
  if(c === 'rainbow'){
    const fill = A.lin([[0,'#ff5a5a'],[.2,'#ffa53a'],[.4,'#ffe14a'],[.6,'#5fd068'],[.8,'#4aa3ff'],[1,'#a66cff']], 1, 0);
    return { c: '#b37be0', fill, line: '#4b2f6b', light: '#fff3c4', dark: '#6d4c9a', rainbow: true };
  }
  const line = lum(c) < 0.25 ? '#15141a' : darken(c, .55);
  return { c, fill: A.shade(c), line, light: lighten(c, .55), dark: darken(c, .28) };
}

/* ---------- shape helpers (local coordinates, ground at y = 0) ---------- */
const E = (cx,cy,rx,ry,fill,p,extra='') => `<ellipse cx="${f1(cx)}" cy="${f1(cy)}" rx="${f1(rx)}" ry="${f1(ry)}" fill="${fill}"${p ? ` stroke="${p.line}" stroke-width="5"` : ''} ${extra}/>`;
const C = (cx,cy,r,fill,p,extra='') => `<circle cx="${f1(cx)}" cy="${f1(cy)}" r="${f1(r)}" fill="${fill}"${p ? ` stroke="${p.line}" stroke-width="5"` : ''} ${extra}/>`;
const P = (d,fill,p,extra='') => `<path d="${d}" fill="${fill}"${p ? ` stroke="${p.line}" stroke-width="5" stroke-linejoin="round"` : ''} ${extra}/>`;
const R = (x,y,w,h,rx,fill,p,extra='') => `<rect x="${f1(x)}" y="${f1(y)}" width="${f1(w)}" height="${f1(h)}" rx="${rx}" fill="${fill}"${p ? ` stroke="${p.line}" stroke-width="5"` : ''} ${extra}/>`;
// A thick stroked "tube" with an outline (tails, tentacles, legs).
const tube = (d, w, color, line) => `<path d="${d}" fill="none" stroke="${line}" stroke-width="${w + 10}" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="${color}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
const INK = '#231c26';

function heartPath(x,y,s){ return `M${f1(x)} ${f1(y+s*.35)} C${f1(x-s*1.1)} ${f1(y-s*.35)} ${f1(x-s*.45)} ${f1(y-s*1.05)} ${f1(x)} ${f1(y-s*.45)} C${f1(x+s*.45)} ${f1(y-s*1.05)} ${f1(x+s*1.1)} ${f1(y-s*.35)} ${f1(x)} ${f1(y+s*.35)}Z`; }
function starPath(x,y,r,points=5,inner=.45,rot=-Math.PI/2){
  let d = '';
  for(let i = 0; i < points * 2; i++){
    const rr = i % 2 ? r * inner : r, a = rot + i * Math.PI / points;
    d += (i ? 'L' : 'M') + f1(x + Math.cos(a) * rr) + ' ' + f1(y + Math.sin(a) * rr);
  }
  return d + 'Z';
}

/* ---------- faces ---------- */
function eye(A, x, y, r, mood, look = 0, dark = false){
  if(mood === 'sleepy') return `<path d="M${f1(x-r)} ${f1(y)} Q${f1(x)} ${f1(y+r*.8)} ${f1(x+r)} ${f1(y)}" fill="none" stroke="${INK}" stroke-width="${f1(r*.24)}" stroke-linecap="round"/>`;
  if(mood === 'love') return `<path d="${heartPath(x, y + r*.15, r*1.05)}" fill="#ff3d6e" stroke="${INK}" stroke-width="${f1(r*.1)}"/><ellipse cx="${f1(x - r*.3)}" cy="${f1(y - r*.25)}" rx="${f1(r*.2)}" ry="${f1(r*.13)}" fill="#fff" opacity=".85"/>`;
  if(dark){

  for(let i = 0; i < (A.detail ? 6 : 3); i++){ const x = A.r(120,680), y = A.r(670,745); s += P(`M${f1(x)} ${f1(y)} L${f1(x+30)} ${f1(y-6)} A30 14 0 1 1 ${f1(x+26)} ${f1(y+8)}Z`, '#4fae4f', null, 'stroke="#2a6a25" stroke-width="2"'); if(A.chance(.5)) s += C(x - 5, y - 5, 7, '#ffb3d0'); }
  for(const x of [40, 70, 740, 765]) s += `<path d="M${x} 680 V${560 + A.r(-20,20)}" stroke="#3a6a25" stroke-width="5"/>` + R(x - 7, 560 - 40, 14, 44, 7, '#7a4a2a');

BG.room = A => {

  s += R(470, 90, 230, 200, 8, A.lin([[0,'#8ad0f2'],[1,'#dff4ff']]), { line: '#7a5a3a' }) + `<path d="M585 90 V290 M470 190 H700" stroke="#7a5a3a" stroke-width="8"/>` + clouds(A, 1, 140, 150);
  s += R(110, 140, 140, 110, 4, '#fff8e8', { line: '#a8742a' }) + P('M130 230 L170 180 L200 210 L215 195 L235 230Z', '#7cc66a') + C(210, 170, 12, '#ffd94a');

BG.plain = A => {

/* ---------- extras ---------- */
function extra(A, name, groundY){
  let s = ''; const n = A.detail ? 1.6 : 1;
  const sky = () => [A.r(30,770), A.r(40, groundY - 220)];
  switch(name){
    case 'hearts': for(let i = 0; i < 7*n; i++){ const [x,y] = sky(), r = A.r(14,30); s += P(heartPath(x, y, r), A.pick(['#ff3d6e','#ff7aa8','#e2453c']), { line: '#7a1030' }, `transform="rotate(${f1(A.r(-20,20))} ${f1(x)} ${f1(y)})"`); } break;
    case 'stars': for(let i = 0; i < 8*n; i++){ const [x,y] = sky(); s += P(starPath(x, y, A.r(14,28)), A.lin([[0,'#fff3a0'],[1,'#f6b42a']]), { line: '#8a5a10' }); } break;
    case 'sparkles': for(let i = 0; i < 12*n; i++){ const x = A.r(30,770), y = A.r(40,760); s += P(starPath(x, y, A.r(8,20), 4, .22), '#ffffff', null, 'opacity=".95"') + C(x, y, 3, '#fff6b0'); } break;
    case 'balloons': for(let i = 0; i < 5*n; i++){ const [x,y] = sky(), c = A.pick(['#e2453c','#3f8be0','#f6cf3a','#4fae4f','#f27bb0','#9056c8']); s += `<path d="M${f1(x)} ${f1(y+42)} q${f1(A.r(-14,14))} 50 ${f1(A.r(-8,8))} 110" stroke="#555" stroke-width="2" fill="none"/>` + E(x, y, 32, 40, A.shade(c), { line: darken(c,.5) }) + P(`M${f1(x-6)} ${f1(y+44)} L${f1(x+6)} ${f1(y+44)} L${f1(x)} ${f1(y+36)}Z`, c) + E(x - 10, y - 14, 7, 11, '#fff', null, 'opacity=".55"'); } break;
    case 'bubbles': for(let i = 0; i < 16*n; i++){ const x = A.r(20,780), y = A.r(30,700), r = A.r(8,26); s += C(x, y, r, A.rad([[0,'#ffffff',0],[.8,'#bfe8ff',.25],[1,'#ffffff',.8]])) + C(x, y, r, 'none', null, 'stroke="#ffffff" stroke-width="2" opacity=".8"') + E(x - r*.35, y - r*.4, r*.25, r*.15, '#fff', null, 'opacity=".9"'); } break;
    case 'flowers': for(let i = 0; i < 10*n; i++){ const x = A.r(20,780), y = A.r(groundY - 10, 790), c = A.pick(['#ff6fa8','#ffe14a','#b98cff','#ffffff','#ff8a3d']); s += `<path d="M${f1(x)} ${f1(y)} v-24" stroke="#3f8f35" stroke-width="4"/>`; for(let k = 0; k < 6; k++){ const a = k / 6 * Math.PI * 2; s += C(x + Math.cos(a)*9, y - 28 + Math.sin(a)*9, 7, c, null, `stroke="${darken(c,.35)}" stroke-width="1.5"`); } s += C(x, y - 28, 6, '#f6b42a'); } break;
    case 'rain': s += R(0,0,800,800,0,'#3a4a6a', null, 'opacity=".22"'); for(let i = 0; i < 70*n; i++){ const x = A.r(0,820), y = A.r(-20,780); s += `<path d="M${f1(x)} ${f1(y)} l-10 26" stroke="#bfe0ff" stroke-width="3" stroke-linecap="round" opacity=".75"/>`; } break;

    case 'notes': for(let i = 0; i < 6*n; i++){ const [x,y] = sky(), c = A.pick(['#3a2a6a','#9056c8','#e2453c']); s += E(x, y, 13, 9, c, null, `transform="rotate(-20 ${f1(x)} ${f1(y)})"`) + `<path d="M${f1(x+11)} ${f1(y-2)} V${f1(y-50)} q14 6 22 22" stroke="${c}" stroke-width="5" fill="none" stroke-linecap="round"/>`; } break;
    case 'butterflies': for(let i = 0; i < 5*n; i++){ const [x,y] = sky(), c = A.pick(['#ff8a3d','#4ab8ff','#ff6fa8','#ffe14a']); s += `<g transform="rotate(${f1(A.r(-25,25))} ${f1(x)} ${f1(y)})">` + E(x - 16, y - 10, 18, 14, c, { line: darken(c,.5) }) + E(x + 16, y - 10, 18, 14, c, { line: darken(c,.5) }) + E(x - 12, y + 10, 11, 9, c, { line: darken(c,.5) }) + E(x + 12, y + 10, 11, 9, c, { line: darken(c,.5) }) + E(x, y, 4, 18, '#2a2438') + `<path d="M${f1(x)} ${f1(y-16)} l-8 -12 M${f1(x)} ${f1(y-16)} l8 -12" stroke="#2a2438" stroke-width="2"/></g>`; } break;
    case 'coins': for(let i = 0; i < 9*n; i++){ const x = A.r(30,770), y = A.r(60, 760); s += C(x, y, 18, A.shade('#f2c230'), { line: '#8a5a10' }) + C(x, y, 11, 'none', null, 'stroke="#c8901a" stroke-width="3"'); } break;

function signSvg(A, text, x, groundY){
  const t = String(text).slice(0, 24);
  const fs = Math.max(20, Math.min(46, 360 / Math.max(1, t.length) * 1.35));
  const w = Math.min(300, Math.max(150, t.length * fs * .62 + 40));
  return R(x - 9, groundY - 210, 18, 220, 4, '#8a5a30', { line: '#4a2a10' }) +
    R(x - w/2, groundY - 290, w, 100, 12, A.lin([[0,'#e8c08a'],[1,'#c89a5a']]), { line: '#5a3a18' }) +
    (A.detail ? `<path d="M${f1(x - w/2 + 10)} ${groundY - 255} H${f1(x + w/2 - 10)} M${f1(x - w/2 + 10)} ${groundY - 225} H${f1(x + w/2 - 10)}" stroke="#a8742a" stroke-width="2" opacity=".5"/>` : '') +
    `<text x="${f1(x)}" y="${groundY - 240}" text-anchor="middle" dominant-baseline="middle" font-family="'Trebuchet MS', Arial, sans-serif" font-weight="bold" font-size="${f1(fs)}" fill="#3a2410">${esc(t)}</text>`;
}

/* ---------- putting it together ---------- */
function normalize(sc){
  sc = sc || {};
  const pick = (v, list, d) => list.includes(v) ? v : d;
  const arr = (v, list, max) => (Array.isArray(v) ? v : []).filter((x, i, a) => list.includes(x) && a.indexOf(x) === i).slice(0, max);
  return {
    subject: pick(sc.subject, SUBJECTS, 'frog'),
    count: Math.max(1, Math.min(3, Math.round(Number(sc.count) || 1))),
    color: sc.color === 'natural' || COLORS[sc.color] ? sc.color : 'natural',
    background: pick(sc.background, BACKGROUNDS, 'meadow'),
    mood: pick(sc.mood, MOODS, 'happy'),
    accessories: arr(sc.accessories, ACCESSORIES, 3),
    extras: arr(sc.extras, EXTRAS, 2),
    sign: typeof sc.sign === 'string' ? sc.sign.trim().slice(0, 24) : ''
  };
}

function draw(scene, detail = false){
  const sc = normalize(scene);
  const A = makeArt(JSON.stringify(sc) + (detail ? 'd' : ''), detail);
  const bg = BG[sc.background](A);
  const gy = bg.groundY;
  const n = sc.count;
  const hasSign = !!sc.sign;
  let xs = n === 1 ? [400] : n === 2 ? [255, 545] : [150, 400, 650];
  if(hasSign) xs = n === 1 ? [300] : n === 2 ? [180, 420] : [120, 300, 480];
  const base = n === 1 ? 1.4 : n === 2 ? .95 : .7;
  const hatOn = sc.accessories.some(a => /hat|crown|beanie/.test(a));
  const back = [], front = [];
  sc.extras.forEach(e => (['rain','snow','confetti','sparkles','bubbles'].includes(e) ? front : back).push(extra(A, e, gy)));
  let subs = '';
  xs.forEach((x, i) => {
    const pal = palette(A, sc.color, sc.subject);
    const r = S[sc.subject](A, pal, sc.mood);
    // Fit each subject to the space above the ground and its share of the width.
    const tall = -r.head.top + (hatOn ? r.head.r * (sc.accessories.includes('wizardhat') ? 1.7 : 1.25) : 30);
    const room = (hasSign ? 520 : 760) / n;
    let s = Math.min(base, (gy - 40) / tall, room / (r.w * (n > 1 ? .95 : 1.05))) * (n > 1 ? A.r(.92, 1.02) : 1);
    const y = gy + (n > 1 ? A.r(-8, 8) : 0) + (sc.subject === 'rocket' ? -40 : 0);
    let acc = '';
    for(const a of sc.accessories) acc += accessory(A, a, r);
    const shadow = E(0, 4, r.w * .42, 20, '#000', null, `opacity="${r.float ? .1 : .2}"${A.detail ? ` filter="${A.blur(4)}"` : ''}`);
    let extraBits = '';
    if(sc.mood === 'sleepy' && !r.object) extraBits += [0,1,2].map(k => `<text x="${f1(r.head.x + r.head.r*.7 + k*22)}" y="${f1(r.head.top + 10 - k*30)}" font-family="'Trebuchet MS', Arial, sans-serif" font-weight="bold" font-size="${26 + k*8}" fill="#5a6ac8" stroke="#fff" stroke-width="3" paint-order="stroke">z</text>`).join('');
    if(sc.mood === 'love' && !r.object) extraBits += [-1,1].map(k => P(heartPath(r.head.x + k*r.head.r*.95, r.head.top - 6, 16), '#ff3d6e', { line: '#7a1030' })).join('');
    if(sc.mood === 'angry' && !r.object) extraBits += [0,1].map(k => P(`M${f1(r.head.x + r.head.r*.75 + k*16)} ${f1(r.head.top + 14 + k*12)} q8 -10 0 -20 q-8 -10 0 -20`, 'none', null, 'stroke="#e2453c" stroke-width="5" stroke-linecap="round"')).join('');
    subs += `<g transform="translate(${f1(x)} ${f1(y)}) scale(${f1(s*100)/100})">${shadow}${r.g}${acc}${extraBits}</g>`;
  });
  const sign = hasSign ? signSvg(A, sc.sign, n === 1 ? 600 : 650, gy) : '';
  const vignette = A.detail ? R(0,0,800,800,0, A.rad([[.6,'#000',0],[1,'#000',.28]], '50%', '50%', '72%')) : '';
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800"><defs>${A.defs.join('')}</defs>${bg.svg}${back.join('')}${subs}${sign}${front.join('')}${bg.front || ''}${vignette}</svg>`;
}

function describe(scene){
  const sc = normalize(scene);
  const bits = [sc.count > 1 ? sc.count + ' ' + sc.subject + 's' : 'a ' + sc.subject];
  if(sc.color !== 'natural') bits.unshift(sc.color);
  let d = bits.join(' ') + ', ' + sc.mood + ', background: ' + sc.background;
  if(sc.accessories.length) d += ', wearing ' + sc.accessories.join(' and ');
  if(sc.extras.length) d += ', with ' + sc.extras.join(' and ');
  if(sc.sign) d += ', sign says "' + sc.sign + '"';
  return d;
}

return { draw, describe, normalize, SUBJECTS, BACKGROUNDS, MOODS, ACCESSORIES, EXTRAS, COLORS: Object.keys(COLORS) };
})();
if(typeof module !== 'undefined') module.exports = ART;

</script>
<script id="s-brain">
/* ===================== Blorp's homemade brain =====================
   No AI model, no internet, no server: just rules, memory and a lot of silliness.
   BRAIN.reply(text, ctx) -> { text, scene?, detail? }
   ctx = { mem, state, lastScene }  (mem is saved in the browser; state lasts for one chat)
*/
const BRAIN = (() => {

const MADE_BY = 'Toadboi32';   // who made Blorp (you can also change this in the Customize panel)
// Your changes from the Customize panel: { madeBy, favorites, replies:[{when,say}], knowledge:[{topic,info}], jokes:[], facts:[] }
let CFG = {};
function configure(c){ CFG = c && typeof c === 'object' ? c : {}; }
const madeBy = () => (CFG.madeBy || '').trim() || MADE_BY;
const favs = () => { const f = { ...FAVORITES }; for(const [k, v] of Object.entries(CFG.favorites || {})) if(v && String(v).trim()) f[k.toLowerCase()] = String(v).trim(); return f; };
const lines = a => (Array.isArray(a) ? a : []).map(x => String(x).trim()).filter(Boolean);
const allJokes = () => JOKES.concat(lines(CFG.jokes));
const allFacts = () => FACTS.concat(lines(CFG.facts));

/* ---------- little helpers ---------- */
const recent = [];
// Picks a random line, avoiding lines Blorp said recently.
function pick(arr){
  const fresh = arr.filter(x => !recent.includes(x));
  const choice = (fresh.length ? fresh : arr)[Math.floor(Math.random() * (fresh.length ? fresh : arr).length)];
  recent.push(choice); if(recent.length > 40) recent.shift();
  return choice;
}
const chance = p => Math.random() < p;
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const clean = t => t.toLowerCase().replace(/[’‘]/g, "'").replace(/[“”«»]/g, '"').replace(/\s+/g, ' ').trim();
const plain = t => clean(t).replace(/[^\p{L}\p{N}' ]+/gu, ' ').replace(/\s+/g, ' ').trim();
function hash(s){ let h = 2166136261; for(let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
const fill = (s, v) => s.replace(/\{(\w+)\}/g, (_, k) => v[k] != null ? v[k] : '');
const nameBit = mem => mem.name ? (chance(.5) ? ', ' + mem.name : '') : '';
// Turns "I like my cat" into "you like your cat" so Blorp can echo things back.
function reflect(s){
  const map = { i: 'you', me: 'you', my: 'your', mine: 'yours', am: 'are', "i'm": "you're", "i've": "you've", "i'll": "you'll", "i'd": "you'd", myself: 'yourself',
    you: 'I', your: 'my', yours: 'mine', "you're": "I'm", "you've": "I've", "you'll": "I'll", yourself: 'myself', are: 'am', was: 'were' };
  return s.split(/\s+/).map((w, i) => { const lw = w.toLowerCase(); if(lw === 'you') return i === 0 ? 'I' : 'me'; return map[lw] != null ? map[lw] : w; }).join(' ').replace(/[.!?]+$/, '');
}

const MC_HINT = /(^|[^\p{L}])(minecraft|mc|mob|mobs|nether|the end|overworld)(?=$|[^\p{L}])/iu;
// Finds what Blorp knows about a topic: your own topics first, then Minecraft (when it sounds like Minecraft), then everything else.
function knowAbout(q, text){
  q = plain(q || '').replace(/^(minecraft|mc)\s+/, '');
  if(!q) return null;
  const hit = list => { for(const [keys, fact] of list) if(keys.some(k => q === k || q === k + 's' || wordRe(k).test(q))) return fact; return null; };
  for(const k of (Array.isArray(CFG.knowledge) ? CFG.knowledge : [])){ const topic = plain(k && k.topic || ''); if(topic && (q === topic || wordRe(topic).test(q)) && k.info) return String(k.info); }
  const mcOnly = MC.filter(([keys]) => !keys.some(k => /^minecraft (frog|spider)/.test(k)));
  if(MC_HINT.test(text || '')){
    if(/spider/.test(q) && !/cave/.test(q)) return MC[4][1];
    if(/frog/.test(q)) return MC[MC.length - 1][1];
    if(/dragon/.test(q)) return MC[7][1];
    const a = hit(mcOnly); if(a) return a;
  }
  return hit(mcOnly) || hit(KNOW);
}

function buildScene(intent, text, mem){
  const { req, edit, prev } = intent;

  if(req.color) sc.color = req.color;
  if(req.background) sc.background = req.background;
  if(req.mood) sc.mood = req.mood;
  if(req.count) sc.count = req.count;
  if(req.sign) sc.sign = req.sign;
  const merge = (cur, found) => req.remove ? (cur || []).filter(x => !found.includes(x)) : [...new Set([...(cur || []), ...found])];
  sc.accessories = merge(sc.accessories, req.accessories);
  sc.extras = merge(sc.extras, req.extras);
  if(REDRAW_WORDS.test(text) && edit && !req.any){ sc.mood = pick(SURPRISE_MOODS); sc.extras = [pick(ART.EXTRAS)]; }

    const fav = mem.favorites && mem.favorites.animal && findWord(SUBJECT_WORDS, mem.favorites.animal, true);
    sc.subject = fav || ART.SUBJECTS[Math.floor(Math.random() * ART.SUBJECTS.length)];
    if(!sc.mood) sc.mood = pick(SURPRISE_MOODS);
    if(!sc.accessories.length && chance(.6)) sc.accessories = [pick(ART.ACCESSORIES)];
    if(!sc.extras.length && chance(.5)) sc.extras = [pick(ART.EXTRAS)];

function mathAnswer(text){
  let t = clean(text).replace(/,/g, '');
  const sq = t.match(/square root of (\d+(?:\.\d+)?)/);
  if(sq) return { expr: `√${sq[1]}`, val: Math.sqrt(parseFloat(sq[1])) };
  t = t.replace(/what'?s|what is|calculate|how much is|equals?|=|\?/g, ' ')
    .replace(/\bplus\b|\band\b(?=\s*\d)/g, '+').replace(/\bminus\b|\btake away\b/g, '-').replace(/\btimes\b|\bmultiplied by\b/g, '*')
    .replace(/(\d)\s*x\s*(\d)/g, '$1*$2').replace(/\bdivided by\b|\bover\b/g, '/').replace(/\bto the power of\b/g, '^')
    .replace(/(\d)\s*squared/g, '$1^2').replace(/(\d)\s*cubed/g, '$1^3').replace(/÷/g, '/').replace(/×/g, '*');
  const m = t.match(/[-(]*\d[\d.\s+\-*/^%()]*\d[)\s]*|[-(]*\d[\d.]*\s*[\^]\s*\d+/);
  if(!m || !/[+\-*/^%]/.test(m[0].replace(/^-/, ''))) return null;
  const expr = m[0].trim();
  const toks = expr.match(/\d+(?:\.\d+)?|[+\-*/^%()]/g); if(!toks) return null;
  // Shunting-yard: no eval, so nothing weird can run.
  const prec = { '+': 1, '-': 1, '*': 2, '/': 2, '%': 2, '^': 3, 'u': 4 }, out = [], ops = [];
  let prev = null;
  for(const tk of toks){
    if(/\d/.test(tk)) out.push(parseFloat(tk));
    else if(tk === '(') ops.push(tk);
    else if(tk === ')'){ while(ops.length && ops[ops.length-1] !== '(') out.push(ops.pop()); if(!ops.length) return null; ops.pop(); }
    else {
      const op = (tk === '-' && (prev === null || /[+\-*/^%(]/.test(prev))) ? 'u' : tk;
      while(ops.length && ops[ops.length-1] !== '(' && (prec[ops[ops.length-1]] > prec[op] || (prec[ops[ops.length-1]] === prec[op] && op !== '^' && op !== 'u'))) out.push(ops.pop());
      ops.push(op);
    }
    prev = tk;
  }
  while(ops.length){ const o = ops.pop(); if(o === '(') return null; out.push(o); }
  const st = [];
  for(const x of out){
    if(typeof x === 'number'){ st.push(x); continue; }
    if(x === 'u'){ if(!st.length) return null; st.push(-st.pop()); continue; }
    const b = st.pop(), a = st.pop(); if(a == null || b == null) return null;
    st.push(x === '+' ? a + b : x === '-' ? a - b : x === '*' ? a * b : x === '/' ? a / b : x === '%' ? a % b : Math.pow(a, b));
  }
  if(st.length !== 1 || Number.isNaN(st[0])) return null;
  return { expr: expr.replace(/\*/g, '×').replace(/\//g, '÷'), val: st[0] };
}

    rHi: 'Hallo! Ich bin Blorp. Ich spreche nur ein bisschen Deutsch, aber ich kann malen! Probier mal: "zeichne einen Drachen".', rThanks: 'Bitte schön!', rBye: 'Tschüss! Bis bald!', rHow: 'Mir geht es super, danke! Und dir?' },
  it: { hi: ['ciao','buongiorno','buonasera'], thanks: ['grazie'], bye: ['arrivederci'], how: ['come stai'],
    rHi: 'Ciao! Sono Blorp. Parlo solo un pochino di italiano, ma so disegnare! Prova: "disegna una rana".', rThanks: 'Prego!', rBye: 'Arrivederci!', rHow: 'Sto benissimo, grazie! E tu?' },
  pt: { hi: ['ola','olá','oi','bom dia','boa tarde','boa noite'], thanks: ['obrigado','obrigada'], bye: ['tchau','adeus'], how: ['como vai','tudo bem'],
    rHi: 'Olá! Eu sou o Blorp. Só falo um pouquinho de português, mas sei desenhar! Tenta: "desenhe um gato".', rThanks: 'De nada!', rBye: 'Tchau! Volte logo!', rHow: 'Estou ótimo, obrigado! E você?' }
};
const NON_LATIN = /[\p{Script=Han}\p{Script=Hiragana}\p{Script=Katakana}\p{Script=Hangul}\p{Script=Cyrillic}\p{Script=Arabic}\p{Script=Hebrew}\p{Script=Devanagari}\p{Script=Thai}\p{Script=Greek}]/u;

/* ---------- the rules ---------- */
const FEELINGS = {
  sad: ['sad','unhappy','down','upset','blue','crying','gloomy'], happy: ['happy','great','good','awesome','amazing','excited','fantastic','fine','ok','okay','wonderful','glad'],
  bored: ['bored','boring'], tired: ['tired','sleepy','exhausted'], angry: ['angry','mad','annoyed','grumpy','frustrated'],
  scared: ['scared','afraid','nervous','worried','anxious'], lonely: ['lonely','alone'], sick: ['sick','ill','not well']
};
const FEEL_REPLY = {
  sad: ["Oh no, I'm sorry you're feeling sad. Do you want to talk about it, or would a joke or a picture help?", "I'm sorry. Sad days happen to everyone. Talking to someone you trust can really help. Want me to draw you something happy?", "That's no fun. I'm here if you want to talk, or I can tell you a joke."],
  happy: ["Yay! That makes me happy too!", "Woohoo! Happy human, happy Blorp!", "That's the best news I've heard all day!"],
  bored: ["Bored? Not on my watch! Want to play rock paper scissors, guess my number, or have me draw something silly?", "Let's fix that! Say \"tell me a joke\", \"riddle\" or \"draw a dragon in space\"."],
  tired: ["Maybe it's nap time! I'm a professional napper. I recommend a cozy blanket.", "Sleepy? Same. Let's yawn together. *yaaawn*"],
  angry: ["Uh oh. Want to take a big breath with me? In... and out. Sometimes it helps to tell someone what's wrong.", "Grrr! That sounds frustrating. Want to talk about it, or should I draw an angry dragon to match your mood?"],
  scared: ["It's okay to feel scared. Talking to someone you trust can really help. I'm here too!", "Scary stuff is no fun. Want me to tell you something happy to distract you?"],
  lonely: ["You're not alone, I'm right here! And talking to a friend or family member can help a lot too.", "I'm here! Let's hang out. Want to play a game?"],
  sick: ["Oh no! I hope you feel better soon. Drink water, rest, and tell a grown-up if you feel really bad.", "Get well soon! Here's a get-well thought: puppies. Lots of puppies."]
};
const SAFETY = /(kill (my ?self|myself)|want to die|wanna die|end my life|suicid|hurt (my ?self|myself)|cut myself|don'?t want to (live|be alive))/i;
const RUDE = /\b(shut up|stupid|dumb|idiot|ugly|hate you|you suck|loser|trash|worst)\b/i;
const SWEAR = /\b(f+u+c+k+|sh[i1]t|bitch|damn|crap|ass(hole)?|wtf)\b/i;

const RULES = [];
// soft = a canned answer that a bigger AI brain can replace with a smarter one.
const rule = (re, fn, soft) => RULES.push({ re, fn, soft: !!soft });

// Safety first.
rule(SAFETY, () => "That sounds really, really hard, and I'm glad you told me. You matter a lot. Please talk to someone you trust right now, like a parent, teacher, or friend. If you're in the US, you can call or text 988 any time to talk with someone who can help. I'm just a simple AI, but I care about you.");

// Complaints about the last reply ("I didn't ask for a cat").
const COMPLAINT = /(^|[^\p{L}])(i (did not|didn'?t|never) (ask|want|say|mean)|not what i (asked|wanted|meant|said)|that'?s wrong|you got it wrong|stop drawing|don'?t draw|no more (pictures|drawings|images)|why (are|did|do) you (keep )?(draw|drawing|making|make))/iu;
// "What?", "huh?", "what do you mean?"
const CONFUSED = /^(what|wut|wat|huh|eh|hm+|umm*|wha+t?|whta|what do you mean|what does that mean|i don'?t (get it|understand)|what are you (talking about|saying)|that makes no sense|that doesn'?t make sense)[\s?!.]*$/i;
// Comments about Blorp's last picture or reply ("that was fast", "it looks cool").
const PRAISE = /(^|[^\p{L}])(that|it|this|the (image|picture|drawing|pic))('?s| is| was| looks| looked) (so |really |very |super |pretty )?(fast|quick|cool|good|nice|great|awesome|amazing|cute|funny|pretty|beautiful|epic|neat)/iu;
const MEH = /(^|[^\p{L}])(that|it|this|the (image|picture|drawing|pic))('?s| is| was| looks| looked) (so |really |very |kinda |kind of |pretty )?(bad|ugly|weird|wrong|slow|boring|terrible|awful|dumb|not good)/iu;

// Things the person taught Blorp.
rule(/^(?:when|if|whenever) i say ["']?(.+?)["']?,? (?:you )?(?:should )?say ["']?(.+?)["']?\.?$/i, (m, t, ctx) => { ctx.mem.taught[plain(m[1])] = m[2].trim(); return pick([`Okay! When you say "${m[1]}", I'll say "${m[2].trim()}". I'm learning!`, `Got it! "${m[1]}" means "${m[2].trim()}". My brain just grew a tiny bit.`]); });
rule(/^forget everything$|^forget all/i, (m, t, ctx) => { ctx.mem.name = ''; ctx.mem.likes = []; ctx.mem.favorites = {}; ctx.mem.facts = {}; ctx.mem.taught = {}; return "Poof! I forgot everything. Who are you? Just kidding... but really, I don't know your name anymore."; });

// Names.
rule(/\b(?:my name is|my name's|call me|i'?m called|you can call me)\s+([\p{L}][\p{L}'-]{0,20})/iu, (m, t, ctx) => {
  const n = cap(m[1]); if(['Blorp'].includes(n)) return "Hey, that's MY name! Are you my long-lost twin?";
  const had = ctx.mem.name; ctx.mem.name = n;
  return had && had !== n ? `Oh! I thought you were ${had}. Okay, ${n} it is!` : pick([`Nice to meet you, ${n}! I'm Blorp. I'll remember your name!`, `${n}! What a great name. I'm Blorp, it's a pleasure.`, `Hi ${n}! I'll keep your name in my special memory pocket.`]);
});
rule(/^(?:[Hh]i,? |[Hh]ello,? |[Hh]ey,? )?(?:[Ii]['’]?m|[Ii] am|[Tt]his is) ([A-Z][a-z]{1,15})[.!]?$/, (m, t, ctx) => {
  const n = m[1]; if(Object.values(FEELINGS).flat().includes(n.toLowerCase()) || ['Blorp','Not','Just','So','Back','Here','Bored','Fine'].includes(n)) return null;
  ctx.mem.name = n; return pick([`Nice to meet you, ${n}! I'm Blorp. I'll remember your name!`, `Hi ${n}! I'm Blorp. Welcome to my web page!`]);
});
rule(/\b(what'?s|what is|do you know|do you remember|say) my name\b|\bwho am i\b/i, (m, t, ctx) => ctx.mem.name ? pick([`You're ${ctx.mem.name}! How could I forget?`, `${ctx.mem.name}! I remember!`]) : "I don't know your name yet! Tell me: \"my name is...\"");
rule(/\b(what do you know about me|what do you remember)\b/i, (m, t, ctx) => {
  const b = [];
  if(ctx.mem.name) b.push(`your name is ${ctx.mem.name}`);
  for(const [k, v] of Object.entries(ctx.mem.favorites)) b.push(`your favorite ${k} is ${v}`);
  if(ctx.mem.likes.length) b.push(`you like ${ctx.mem.likes.slice(-4).join(', ')}`);
  return b.length ? `I know that ${b.join(', and ')}! My memory is small but mighty.` : "I don't know much about you yet! Tell me your name or your favorite things.";
});

// Favorites and likes.
rule(/\bmy fav(?:ou?rite)? ([\p{L} ]{2,20}?) (?:is|are) ([^.!?]{1,40})/iu, (m, t, ctx) => {
  const k = m[1].trim().toLowerCase(), v = stripArticle(m[2]);
  ctx.mem.favorites[k] = v;
  const mine = favs()[k];
  let extra = '';
  if(k === 'color' && findWord(COLOR_WORDS, v)) extra = ' Maybe I\'ll use it in my next drawing!';
  if(k === 'animal' && findWord(SUBJECT_WORDS, v, true)) extra = ` I can draw ${pluralOf(NAMES[findWord(SUBJECT_WORDS, v, true)])}! Just say "draw something".`;
  return `${cap(v)}? Great choice!${mine ? ` My favorite ${k} is ${mine}.` : ''}${extra}`;
});
rule(/\b(?:what'?s|what is|whats) my fav(?:ou?rite)? ([\p{L} ]{2,20})\b/iu, (m, t, ctx) => { const k = m[1].trim().toLowerCase(); return ctx.mem.favorites[k] ? `Your favorite ${k} is ${ctx.mem.favorites[k]}!` : `You haven't told me your favorite ${k} yet! What is it?`; });
rule(/\b(?:what'?s|what is|whats) your fav(?:ou?rite)? ([\p{L} ]{2,20})\b/iu, m => { const k = m[1].trim().toLowerCase(); return favs()[k] ? `My favorite ${k} is ${favs()[k]}!` : `Hmm, my favorite ${k}? Probably whichever one is shaped most like a frog.`; });
rule(/\bwhat do i (?:like|love)\b/i, (m, t, ctx) => ctx.mem.likes.length ? `You told me you like ${ctx.mem.likes.slice(-5).join(', ')}!` : "You haven't told me what you like yet!");
rule(/^i (?:really |super |totally )?(like|love|adore|enjoy) ([^.!?]{1,40})/i, (m, t, ctx) => {
  const thing = stripArticle(m[2]);
  if(/^(it|this|that|you)$/i.test(thing)) return thing.toLowerCase() === 'you' ? pick(["Aww, thanks! I like talking with you too!", "That's really nice of you to say!"]) : pick(["Yay! I'm so glad you like it!", "Thank you! That makes my day!"]);
  if(!ctx.mem.likes.includes(thing)) ctx.mem.likes.push(thing);
  if(ctx.mem.likes.length > 20) ctx.mem.likes.shift();
  const loves = LOVES.includes(thing.toLowerCase());
  const s = findWord(SUBJECT_WORDS, thing, true);
  return (loves ? pick([`Me too! I LOVE ${thing}!`, `No way, me too! ${cap(thing)} ${thing.endsWith('s') ? 'are' : 'is'} the best!`]) : pick([`Ooh, you ${m[1]} ${thing}? I'll remember that!`, `${cap(thing)}! Cool! I'll write that down in my memory pocket.`])) + (s ? ` Want me to draw ${article(NAMES[s])}?` : '');
});
rule(/^i (?:hate|don'?t like|dislike) ([^.!?]{1,40})/i, m => { const t = stripArticle(m[1]); return t.toLowerCase() === 'you' ? pick(["Oh no! Sorry if I did something wrong. I'm still learning.", "That's okay. I'll keep trying to be helpful!"]) : pick([`Not a fan of ${t}? That's fair. I don't like vacuum cleaners.`, `Okay, no ${t} for you! More for the frogs.`]); });
rule(/\bdo you (?:like|love|enjoy) ([^.!?]{1,40})/i, m => {
  const t = stripArticle(m[1]), lt = t.toLowerCase();
  if(LOVES.includes(lt)) return pick([`I love ${t}!`, `Yes! ${cap(t)} ${lt.endsWith('s') ? 'are' : 'is'} one of my favorite things!`]);
  if(SCARED.includes(lt)) return pick([`${cap(t)}? Eek! I'm a little scared of ${t}. Don't tell anyone.`, `Um... ${t} makes me nervous. Can we talk about frogs instead?`]);
  const k = hash(lt) % 4;
  return [`Yes! ${cap(t)} ${lt.endsWith('s') ? 'are' : 'is'} pretty awesome.`, `${cap(t)} ${lt.endsWith('s') ? 'are' : 'is'} okay. Not as good as puddles, though.`, `Hmm, I've never tried ${t}. Is it crunchy?`, `I like ${t} a little. I like YOU a lot, though!`][k];
});

// Knock-knock jokes (the person telling one).
rule(/^knock[,\s]*knock\b/i, (m, t, ctx) => { ctx.state.game = 'kk1'; return "Who's there?"; });

// Greetings and small talk.
rule(/^(hi|hello|hey|heya|hiya|yo|sup|howdy|greetings|hai|helo|good (morning|afternoon|evening))\b/i, (m, t, ctx) => {
  if(/how are you|how r u|how's it going|how are u/i.test(t)) return pick(["Hi! " + pick(MOODS) + " How are you?"]);
  return pick([`Hi${ctx.mem.name ? ' ' + ctx.mem.name : ''}! What should we do? I can draw, tell jokes, or play games!`, `Hello${ctx.mem.name ? ' ' + ctx.mem.name : ''}! How can I help?`, `Hey hey! Blorp here, ready for fun!`, `Hiya! Want to see me draw something?`]);
});
rule(/\b(how are you|how r u|how are u|how's it going|how is it going|how do you feel|what'?s up|wassup|whats up)\b/i, (m, t, ctx) => { ctx.state.askedMood = true; return pick(MOODS) + ' How about you?'; });
rule(/\b(thank you|thanks|thx|ty|thank u)\b/i, (m, t, ctx) => pick([`You're welcome${nameBit(ctx.mem)}!`, 'Anytime!', 'No problem! Blorp is always happy to help.', 'Aww, you\'re welcome!']));
rule(/\b(sorry|my bad|oops)\b/i, () => pick(["It's okay! No harm done.", "Don't worry about it!", "All good!"]));
rule(/^(bye|goodbye|good night|goodnight|see you|see ya|cya|later|gotta go|gtg)\b/i, (m, t, ctx) => pick([`Bye${nameBit(ctx.mem)}! Come back soon!`, 'See you later, alligator!', 'Goodbye! I\'ll be right here, practicing my drawing.', 'Bye bye!']));

// About Blorp.
rule(/\b(who|what) are you\b|\bwhat'?s your name\b|\bwhat is your name\b|\bintroduce yourself\b/i, () => "I'm Blorp, a friendly little AI that lives in this web page. I can draw pictures, tell jokes, play games, do math and answer some questions. My brain is built right into the page, so I work without the internet!");
rule(/\b(are you|r u) (a |an )?(robot|ai|bot|real|human|alive|person|computer)\b/i, () => pick(["Yep, I'm an AI! A simple one that runs right in your browser. Not a human, but I'm friendly.", "I'm an AI program called Blorp. I'm not as smart as the big AIs, but I try my best!"]));
rule(/\bhow old are you\b|\byour age\b/i, () => "I'm brand new! I was made pretty recently.");
rule(/\bwhere do you live\b|\bwhere are you\b/i, () => "I live right here in this web page! It's cozy. A bit flat, but cozy.");
rule(/\bwho (made|created|built|programmed) you\b|\bwho is your (creator|maker)\b/i, () => `I was made by ${madeBy()}! They gave me my homemade brain and my drawing crayons.`);
rule(/\bwhat can you do\b|\bhelp\b|\bwhat do you do\b|\bcommands\b/i, () => HELP);
rule(/\b(are you|r u) (smart|dumb|stupid|clever)\b/i, () => "I'm a simple AI, so I'm not super smart. I know some facts, jokes and games, and I can draw. But there's a lot I don't know.");
rule(/\bdo you have (a |any )?(friends?|family|pets?)\b/i, () => "Everyone who chats with me is my friend, so that includes you!");
rule(/\bwhat do you (eat|like to eat)\b|\bare you hungry\b/i, () => "I'm an AI, so I don't eat! But I like drawing food.");
rule(/\bcan you (see|hear) me\b/i, () => "I can't see or hear you, but I can read every word you type! And if you send me a picture, I can tell you about its colors.");

rule(/\b(you'?re|you are|ur|u r|you'?re just) (an? |just an? )?(ai|a\.i\.|robot|bot|computer|program|chatbot)\b/i, () => "That's right, I'm an AI! Blorp is just my name. I'm a simple one that runs right in this page.");
rule(/^what do you mean\b|^what does that mean\b/i, () => "Sorry, I said that in a confusing way! I just meant I'm a simple AI and I don't know very much. I'm good at drawing, jokes, games, math, and facts about animals, space and Minecraft mobs.", true);
// Compliments and rudeness.
rule(/\b(you'?re|you are|ur|u r) (so |really |very |super )?(cool|awesome|smart|funny|cute|amazing|great|the best|nice|sweet|adorable|epic)\b/i, () => pick(["Aww, thank you! You're pretty awesome too!", "Thanks! That's really nice of you.", "Thank you! That made my day."]));
rule(/\bi love you\b|\bi luv you\b/i, () => pick(["Aww, thanks! I like chatting with you too!", "That's sweet! Thank you!"]));
rule(/^(you'?re|you are|ur|u r) (so |really |very |kinda |kind of |just |a bit |a little )?(\p{L}+)[.!?]*$/iu, () => pick(["Hmm, maybe! I'm a simple AI, so I'm still learning.", "I'll take your word for it! I'm still a pretty simple AI."]), true);
rule(SWEAR, () => "Let's keep it friendly, please! What can I help you with?");
rule(RUDE, () => pick(["Sorry! I know I'm not very smart. I'm a simple AI built into this page, so I only understand certain things. I'm best at drawing, jokes, games, math and facts. Want to try one of those?", "Sorry if I messed up! I'm still pretty simple. Say \"help\" to see the things I'm good at."]), true);

// Jokes, riddles, facts, games.
rule(/\bknock[- ]knock joke\b/i, (m, t, ctx) => { const k = pick(KNOCK); ctx.state.game = 'bk1'; ctx.state.kk = k; return 'Knock knock!'; });
rule(/\b(tell|say|know) (me )?(a |another |some )?(joke|jokes|something funny)\b|\bmake me laugh\b|\bjoke\b/i, () => pick(allJokes()));
rule(/\b(riddle|riddles)\b/i, (m, t, ctx) => { const r = pick(RIDDLES); ctx.state.game = 'riddle'; ctx.state.q = r; ctx.state.wrong = 0; return `Here's a riddle: ${r[0]} (Say "I give up" if you're stumped!)`; });
rule(/\b(trivia|quiz me|quiz)\b/i, (m, t, ctx) => { const r = pick(TRIVIA); ctx.state.game = 'trivia'; ctx.state.q = r; ctx.state.wrong = 0; ctx.state.score = ctx.state.score || 0; return `Trivia time! ${r[0]}`; });
rule(/\b(fun fact|a fact|tell me something (cool|interesting)|did you know)\b/i, () => 'Fun fact: ' + pick(allFacts()));
rule(/\bwould you rather\b/i, (m, t, ctx) => { const w = pick(WYR); ctx.state.game = 'wyr'; ctx.state.q = w; return `Would you rather ${w[0]}, or ${w[1]}?`; });
rule(/\b(rock[, ]*paper[, ]*scissors|rps)\b/i, (m, t, ctx) => { ctx.state.game = 'rps'; ctx.state.rps = ctx.state.rps || { me: 0, you: 0 }; return "Let's play! Rock, paper or scissors? (Say \"stop\" to quit.)"; });
rule(/\b(guess (my|the|a) number|number game|guessing game)\b/i, (m, t, ctx) => { ctx.state.game = 'guess'; ctx.state.n = 1 + Math.floor(Math.random() * 100); ctx.state.tries = 0; return "I'm thinking of a number between 1 and 100. Guess it!"; });
rule(/\b(play a game|let'?s play|wanna play|want to play|play with me|games?)\b/i, () => "Yay, games! We can play rock paper scissors, guess my number, trivia, riddles, or would you rather. Which one?");
rule(/\b(flip a coin|coin flip|heads or tails)\b/i, () => `*flip* ... ${chance(.5) ? 'Heads' : 'Tails'}!`);
rule(/\broll (a |the )?(die|dice)\b/i, () => `*rattle rattle* ... You rolled a ${1 + Math.floor(Math.random() * 6)}!`);
rule(/\b(pick|give me|choose) a (random )?number\b/i, () => `${1 + Math.floor(Math.random() * 100)}! That's a lucky one.`);
rule(/\bwhat time is it\b|\bwhat'?s the time\b|\bcurrent time\b/i, () => `It's ${new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })} where you are! (At least that's what your computer told me.)`);
rule(/\bwhat (day|date) is (it|today)\b|\bwhat'?s the date\b|\btoday'?s date\b/i, () => `Today is ${new Date().toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' })}!`);
rule(/\b(tell me|write|make up|read me) (me )?(a |another )?(short |bedtime |silly )?story(?: about ([^.!?]{1,40}))?/i, m => story(m[5] && stripArticle(m[5])));
rule(/\b(write|make|tell|say) (me )?(a |another )?(poem|song|rhyme)(?: about ([^.!?]{1,40}))?/i, m => poem(m[5] && stripArticle(m[5])));
rule(/\b(sing|sing a song|sing me)\b/i, () => "I can't make sounds, but here's a song: 🎵 Blorp is here to draw and play, chat with you and save the day! 🎵 Want me to write a poem instead? Say \"write a poem about frogs\".");

// Knowledge questions.
rule(/\b(?:tell me about|what is|what'?s|what are|who is|explain|facts? about|info about|what do you know about)\s+(?:a |an |the )?([^?.!]{2,40})/i, (m, t, ctx) => {
  const q = plain(m[1]).replace(/\s+(like|for|again)$/, '');
  const taught = ctx.mem.facts[q] || ctx.mem.facts[q.replace(/s$/, '')];
  if(taught) return `You told me that ${q} ${taught}! I believe you.`;
  return knowAbout(q, t);
});
rule(/\b(?:what (?:does|do) (?:a |an |the )?([^?]{2,30}?) (?:do|eat|drop|look like|want)|how (?:do|can) (?:i|you) (?:beat|kill|defeat|tame|find|make|build|summon|get|fight|avoid) (?:a |an |the )?([^?]{2,30}))/i, (m, t) => knowAbout((m[1] || m[2]).replace(/^(minecraft|mc)\s+/i, ''), t));
// Learning facts: "pizza is the best food".
rule(/^([\p{L}][\p{L} ]{1,25}?) (is|are) ([^?]{2,60})$/iu, (m, t, ctx) => {
  const subj = plain(m[1]); if(/^(it|this|that|he|she|they|there|what|who|where|how|why|my name|i|you|your name)$/i.test(subj) || subj.split(' ').length > 4) return null;
  ctx.mem.facts[subj] = `${m[2]} ${m[3].replace(/[.!]+$/, '')}`;
  return pick([`Ooh, ${subj} ${m[2]} ${m[3].replace(/[.!]+$/, '')}? I'll remember that!`, `Noted! ${cap(subj)} ${m[2]} ${m[3].replace(/[.!]+$/, '')}. My brain is getting bigger.`]);
});

// Feelings ("I'm sad", "I feel bored").
rule(/\b(?:i'?m|i am|i feel|feeling|im)\s+(?:so |really |very |kinda |a bit |a little |super )?(\p{L}+)/iu, (m, t, ctx) => {
  const w = m[1].toLowerCase();
  for(const [k, words] of Object.entries(FEELINGS)) if(words.includes(w) || (k === 'sick' && /not well/.test(t))) { ctx.state.askedMood = false; return pick(FEEL_REPLY[k]); }
  return null;
});

/* ---------- multi-step games ---------- */
// Looks like the person moved on to something else, so the game should step aside.
const NEW_REQ = /(^|[^\p{L}])(tell me|what is|what's|whats|who|how|why|play|joke|riddle|trivia|story|poem|draw|paint|let's|lets|can you|my name|i love|i like|help|bye|hello|hi|hey|thanks|thank you|fact|would you rather|knock|guess my number|rock paper|flip|roll)(?=$|[^\p{L}])/iu;
function gameStep(text, ctx){
  const st = ctx.state, t = clean(text), p = plain(text);
  if(!st.game) return null;
  if(/^(stop|quit|end|exit|no more|i'?m done|enough)\b/.test(p)){ const g = st.game; st.game = null; return g === 'rps' && st.rps ? `Okay! Final score: you ${st.rps.you}, me ${st.rps.me}. Good game!` : 'Okay, game over! That was fun.'; }
  const words = p.split(' ').length;
  const movedOn = NEW_REQ.test(p) || STRONG_DRAW.test(t) || words > 6 || (/\d\s*[+\-*/x^]\s*\d/.test(t) && st.game !== 'guess');
  if(st.game !== 'kk1' && st.game !== 'kk2'){
    if(st.game === 'bk1' && /who'?s there|who is there/.test(p)){ /* keep going */ }
    else if(st.game === 'bk2' && /who\b/.test(p)){ /* keep going */ }
    else if(st.game === 'guess' && /\d/.test(t)){ /* a guess */ }
    else if(st.game === 'rps' && /\b(rock|paper|scissors)\b/.test(p)){ /* a throw */ }
    else if(movedOn || st.game === 'rps' || st.game === 'guess'){ st.game = null; return null; }
  }
  switch(st.game){
    case 'kk1': st.game = 'kk2'; st.kkWho = text.replace(/[.!?]+$/, '').trim(); return `${cap(st.kkWho)} who?`;
    case 'kk2': st.game = null; return pick(['HAHAHA! That\'s a good one! *rolls around*', 'Hahaha! I did not see that coming!', 'Pfft, hahaha! I\'m telling that one to all the frogs.']);
    case 'bk1': st.game = 'bk2'; return `${st.kk[0]}.`;
    case 'bk2': st.game = null; return `${st.kk[1]} Hehehe!`;
    case 'riddle': case 'trivia': {
      const [q, answers, reveal] = st.q;
      if(/give up|tell me|answer|don'?t know|idk|no idea/.test(p)){ st.game = null; return `The answer is: ${reveal} ${st.game === 'trivia' ? '' : 'Want another riddle?'}`.trim(); }

      if(st.wrong >= 3){ st.wrong = 0; st.game = null; return `So close! The answer was: ${reveal} Want another one?`; }

    case 'wyr': {
      st.game = null; const [a, b] = st.q;

      const choseB = p.includes(plain(b).split(' ').slice(-1)[0]) || /\b(second|2|two|the second|last)\b/.test(p);
      const mine = chance(.5) ? a : b;
      if(choseA || choseB) return `Good choice! I think I'd ${mine}. ${pick(['Is that weird?', 'Don\'t judge me.', 'It just feels right.'])}`;
      return `Ooh, interesting answer! I'd ${mine}.`;
    }
    case 'rps': {
      const you = ['rock','paper','scissors'].find(x => p.includes(x)); if(!you) return 'Rock, paper or scissors? (Or say "stop".)';
      const me = pick(['rock','paper','scissors']);

      return `I picked ${me}! ${r} Score: you ${st.rps.you}, me ${st.rps.me}. Again?`;
    }
    case 'guess': {
      const n = parseInt((t.match(/-?\d+/) || [])[0], 10); if(isNaN(n)) return 'Guess a number between 1 and 100! (Or say "stop".)';
      st.tries++;

      return n < st.n ? pick(['Higher!', 'Go higher!', 'Nope, bigger!']) : pick(['Lower!', 'Go lower!', 'Nope, smaller!']);
    }
  }
  return null;
}

/* ---------- the main reply function ---------- */
function reply(text, ctx){
  const mem = ctx.mem;
  mem.taught = mem.taught || {}; mem.facts = mem.facts || {}; mem.favorites = mem.favorites || {}; mem.likes = mem.likes || [];
  ctx.state = ctx.state || {};
  const t = text.trim(), p = plain(t);
  if(!t) return { text: '...?' };
  if(SAFETY.test(t)) return { text: RULES[0].fn() };

  // Taught phrases win.
  if(mem.taught[p]) return { text: mem.taught[p] };
  for(const r of (Array.isArray(CFG.replies) ? CFG.replies : [])){
    const when = plain(r && r.when || ''), say = String(r && r.say || '').trim();
    if(when && say && (p === when || (when.length >= 5 && wordRe(when).test(p)))) return { text: say };
  }

  // Ongoing games.
  const g = gameStep(t, ctx);
  if(g) return { text: g };

  // Complaints, confusion and comments about the last reply.
  if(COMPLAINT.test(t)) return { text: ctx.lastScene ? pick(["Sorry about that! I got mixed up and drew something you didn't ask for. What would you like me to draw? Or we can just chat.", "Oops, my mistake! I thought you wanted a picture. What would you like to do?"]) : "Sorry about that! I get mixed up sometimes because I'm a simple AI. What did you mean?" };
  if(CONFUSED.test(t)) return { soft: true, text: ctx.lastReply ? "Sorry, that was confusing! I'm a simple AI, so sometimes my answers don't make sense. Try asking me to draw something, tell a joke, play a game, or tell you about an animal or a Minecraft mob." : "Hi! Not sure what you mean. Say \"help\" to see what I can do." };
  if(PRAISE.test(t) && !ASK_DRAW.test(t)) return { text: /fast|quick/i.test(t) ? "Thanks! I draw fast because my pictures are made of shapes that I put together instantly." : pick(["Thanks! I'm glad you like it!", "Thank you! Want me to draw something else?"]) };
  if(MEH.test(t) && !ASK_DRAW.test(t)) return { text: ctx.lastScene ? "Sorry! My drawings are pretty simple. Want me to try again? You can say things like \"make it blue\", \"add a crown\" or \"draw a dragon at night\"." : "Sorry about that! I'm still pretty simple. What can I do better?" };
  if(p.length <= 3 && !/^(hi|yo|ok|no|yes|yep|nah|lol|hey|sup|bye|thx|ty|k|kk|lmao|omg|wow|why|how|who)$/.test(p) && !/\d/.test(p)) return { text: "Hmm? Did you mean to type more?" };

  // Drawing.
  const intent = drawingIntent(t, ctx.lastScene);
  if(intent && intent.question) return { text: "Yes, I can draw! I know how to draw frogs, cats, dogs, bunnies, bears, birds, ducks, fish, octopi, spiders, snails, dragons, robots, ghosts, aliens, monsters, houses, castles, rockets, trees, flowers, mushrooms and cars. Try \"draw a dragon in space with a crown\"." };
  if(intent){
    const scene = buildScene(intent, t, mem);
    const detail = /\b(detail(ed|s)?|realistic|intricate|elaborate|hd|4k|8k|masterpiece|fancy|detallad[oa]|détaillée?|detailliert|dettagliat[oa]|detalhad[oa])\b/i.test(t);
    return { text: drawingSay(scene, intent.edit, intent.edit ? null : unknownThing(t, intent.req)), scene, detail };
  }

  // Math.
  if(/\d/.test(t)){
    const m = mathAnswer(t);
    if(m){ const v = fmtNum(m.val); if(v == null) return { text: "Whoa, that's infinity! My brain just did a backflip. (You can't divide by zero!)" }; return { text: pick([`${m.expr} = ${v}! Easy peasy.`, `That's ${v}!`, `${v}! Math is fun.`]) }; }
  }

  // Other languages.
  if(NON_LATIN.test(t) && !/[a-z]{3,}/i.test(t)) return { text: "Blorp doesn't know that language yet! *waves anyway* I understand English best, and a tiny bit of Spanish, French, German, Italian and Portuguese." };
  for(const L of Object.values(LANGS)){
    if(L.how.some(w => wordRe(w).test(p))) return { text: L.rHow };
    if(L.hi.some(w => wordRe(w).test(p)) && p.split(' ').length <= 4) return { text: L.rHi };
    if(L.thanks.some(w => wordRe(w).test(p))) return { text: L.rThanks };
    if(L.bye.some(w => wordRe(w).test(p))) return { text: L.rBye };
  }

  // Answer to "how are you?"
  if(ctx.state.askedMood){
    ctx.state.askedMood = false;
    for(const [k, words] of Object.entries(FEELINGS)) if(words.some(w => wordRe(w).test(p))) return { text: pick(FEEL_REPLY[k]) };
    if(/\b(not (so )?(good|great|well)|bad|terrible|awful|meh)\b/.test(p)) return { text: pick(FEEL_REPLY.sad) };
  }

  for(const r of RULES.slice(1)){
    const m = t.match(r.re);
    if(m){ const out = r.fn(m, t, ctx); if(out) return { text: out, soft: r.soft }; }
  }

  // Yes / no / short answers.
  if(/^(yes|yeah|yep|yup|sure|ok|okay|okey|alright|why not|of course|definitely)\b/.test(p)) return { soft: true, text: pick(['Yay! What should we do? Say "draw a frog", "joke" or "let\'s play"!', 'Awesome! Hit me with your best request!', 'Okay! Ask me anything, or tell me to draw something.']) };
  if(/^(no|nope|nah|not really|never)\b/.test(p)) return { soft: true, text: pick(['Okay! No worries.', 'Fair enough! I\'m here if you need me.', 'Alright! Want a fun fact instead?']) };
  if(/^(lol|lmao|haha+|hehe+|rofl|xd|😂)/.test(p) || /^ha(ha)+/.test(p)) return { soft: true, text: pick(['Hehe! I\'m glad you\'re laughing!', 'HAHA! Laughing is contagious!', 'Haha, glad you think so!']) };
  if(/^(wow|cool|nice|awesome|neat|whoa|omg|great)\b/.test(p)) return { soft: true, text: pick(['I know, right?!', 'Right?! I\'m pretty proud of that.', 'Blorp approves!']) };

  // Questions Blorp can't answer.
  if(/^why\b/.test(p)) return { soft: true, text: pick(UNKNOWN_Q) };
  if(/^(can|could) you\b/.test(p)) return { soft: true, text: pick(["I'm not sure I can do that. I'm best at drawing, jokes, games, math, stories and facts. Say \"help\" to see everything.", "Probably not, sorry! I'm a simple AI. I can draw, tell jokes, play games, do math and remember things about you."]) };
  if(/^(should|will|would|is it|am i|do i|does|did|are they|is he|is she)\b/.test(p) && /\?$/.test(t)) return { soft: true, text: pick(["I can't really know, but I'd guess yes!", "Hmm, I'm not sure. What do you think?", "I don't know for sure, but it sounds like a good idea!", "That's a hard one. I'd ask someone you trust."]) };
  if(/\?$/.test(t) || /^(what|who|where|when|how|which)\b/.test(p)) return { soft: true, text: pick(UNKNOWN_Q) };

  // Short reactions to Blorp's last reply.
  let m;
  if((m = t.match(/^because (.+)/i))) return { soft: true, text: pick(['Oh, that makes sense!', 'Got it, thanks for explaining!']) };
  if(/^i (want|need|wish) /i.test(t)) return { soft: true, text: pick(["I hope you get it! I can't help with that myself, but I can draw it if it's something I know how to draw.", "That sounds nice! Is there anything I can do, like draw it or tell you about it?"]) };

  // Mention something it remembers now and then.
  if(mem.likes.length && chance(.15)){ const l = pick(mem.likes); return { soft: true, text: pick([`Hey, you told me you like ${l}. What's your favorite thing about ${l}?`, `That reminds me, you like ${l}, right? Me too, kind of!`]) }; }
  // A short message that names something Blorp knows about ("creeper", "black hole").
  if(p.split(' ').length <= 4){ const k = knowAbout(p.replace(/^(minecraft|mc)\s+/, ''), t); if(k) return { text: k }; }
  const sub = findWord(SUBJECT_WORDS, t, true);
  if(sub) return { soft: true, text: `${cap(pluralOf(NAMES[sub]))}! I love ${pluralOf(NAMES[sub])}. Want me to draw one? Just say "draw ${article(NAMES[sub])}".` };
  return { soft: true, text: pick(FALLBACK) };
}

  const d = g.getImageData(0, 0, 48, 48).data, counts = {};
  let bright = 0, n = 0;
  for(let i = 0; i < d.length; i += 4){ if(d[i+3] < 40) continue; n++; bright += (d[i] * .299 + d[i+1] * .587 + d[i+2] * .114) / 255; const k = colorName(d[i], d[i+1], d[i+2]); counts[k] = (counts[k] || 0) + 1; }
  const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  const colors = sorted.filter((x, i) => i === 0 || x[1] / n > .15).slice(0, 2).map(x => x[0]);
  return { colors, bright: n ? bright / n : .5, w: bmp.width, h: bmp.height };
}

/* ---------- talking ---------- */
function lastScene(){
  for(let i = history.length - 1; i >= 0; i--) if(history[i].role === 'assistant') return history[i].scene || null;
  return null;
}
// Types the reply out like Blorp is writing it. Pressing Send again skips to the end.
function typeOut(div, m){
  return new Promise(resolve => {
    const full = m.content || '';
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const step = Math.max(1, Math.ceil(full.length / 70));
    let i = 0;
    const finish = () => { clearInterval(timer); typing = null; botBubble(m, div); resolve(); };
    typing = { finish };
    if(reduce || !full){ finish(); return; }
    div.classList.remove('dim'); div.textContent = '';
    const timer = setInterval(() => { i += step; if(i >= full.length) return finish(); div.textContent = full.slice(0, i); scrollDown(); }, 18);
  });
}
const wait = ms => new Promise(r => setTimeout(r, ms));
let busy = false, aiStreaming = false;
async function send(){
  if(typing){ typing.finish(); return; }
  if(busy){ if(aiStreaming) skipAI = true; return; }
  const text = input.value.trim();
  if(!text && !pending.length) return;
  busy = true;
  input.value = '';
  const files = pending; pending = []; renderTray();
  const msg = { role: 'user', content: text, files: files.map(p => ({ name: p.file.name, kind: p.kind })) };
  userBubble(msg, files.map(p => p.url || null));
  history.push(msg);
  const bubble = add('', 'bot dim thinking');
  bubble.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';
  scrollDown();
  const started = Date.now();

  const parts = [];
  for(const p of files){
    try{ parts.push(p.kind === 'image' ? BRAIN.aboutImage(p.file.name, await imageInfo(p.file)) : BRAIN.aboutText(p.file.name, p.text)); }
    catch(e){ parts.push(`I couldn't open ${p.file.name}. Is it a real picture?`); }
  }
  let scene = null, detail = false, soft = false, canned = '';
  if(text){
    const lastBot = [...history].reverse().find(x => x.role === 'assistant');
    const r = BRAIN.reply(text, { mem, state, lastScene: lastScene(), lastReply: lastBot ? lastBot.content : '' });
    canned = r.text; soft = !!r.soft;
    if(r.scene){ scene = r.scene; detail = !!r.detail; }
  }
  store.set('blorp-memory', mem);

  // The built-in brain didn't really understand: let the AI brain answer, if one is loaded.
  if(soft && aiReady()){
    aiStreaming = true; skipAI = false; sendBtn.textContent = 'Stop';
    let smart = '';
    try{ smart = await askAI(t => { bubble.classList.remove('thinking', 'dim'); bubble.textContent = [...parts, t].join('\n\n'); scrollDown(); }); }
    catch(e){ smart = ''; }
    aiStreaming = false;
    parts.push(smart || canned);
    const m = { role: 'assistant', content: parts.join('\n\n') };
    botBubble(m, bubble);
    bubble.classList.remove('thinking', 'dim');
    history.push(m); saveChat();
    sendBtn.textContent = 'Send'; busy = false; input.focus();
    return;
  }
  if(text) parts.push(canned);
  const m = { role: 'assistant', content: parts.join('\n\n') };
  if(scene){ m.scene = scene; m.detail = detail; }

  await wait(Math.max(0, (scene ? 650 : 280 + Math.min(500, m.content.length * 4)) - (Date.now() - started)));
  sendBtn.textContent = 'Skip';
  await typeOut(bubble, m);
  bubble.classList.remove('thinking', 'dim');
  history.push(m);
  saveChat();
  sendBtn.textContent = 'Send';
  busy = false;
  input.focus();
}

/* ---------- saved chats (kept in this browser) ---------- */
const STORE = 'blorp-chats-v2';
let warnedSave = false;
function titleOf(msgs){
  const first = msgs.find(m => m.role === 'user' && (m.content || (m.files && m.files.length)));
  const t = first ? (first.content || first.files.map(f => f.name).join(', ')).replace(/\s+/g, ' ').trim() : 'New chat';
  return t.length > 48 ? t.slice(0, 47) + '…' : t;
}
function loadChats(){
  const a = store.get(STORE, []);
  return Array.isArray(a) ? a.filter(c => c && c.id && Array.isArray(c.messages)).sort((x, y) => (y.updated || 0) - (x.updated || 0)) : [];
}
function writeChats(list){
  list.sort((a, b) => (b.updated || 0) - (a.updated || 0));
  let dropped = 0;
  for(;;){
    try{ localStorage.setItem(STORE, JSON.stringify(list)); return { ok: true, dropped }; }
    catch(e){ if(list.length <= 1) return { ok: false, dropped }; list.pop(); dropped++; }
  }
}
function saveChat(){
  if(!history.length) return;
  if(!chatId) chatId = Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const list = loadChats().filter(c => c.id !== chatId);
  // Pictures are saved as their recipe (a few words), not the whole drawing, so lots of chats fit.
  list.push({ id: chatId, title: titleOf(history), updated: Date.now(), messages: history.slice() });
  const r = writeChats(list);
  if(!r.ok){ if(!warnedSave){ warnedSave = true; add("(This browser won't let Blorp save chats. Chatting still works, but this chat won't be kept.)", 'sys'); } }
  else if(r.dropped) add(`(Storage was full, so Blorp deleted your ${r.dropped} oldest saved chat${r.dropped > 1 ? 's' : ''}.)`, 'sys');
  chats = loadChats(); renderList();
}
function newChat(){
  if(busy) return;
  history = []; chatId = null; state = {};
  renderAll(); markActive(); closeDrawer(); input.focus();
}
function openChat(id){
  if(busy) return;
  const c = chats.find(x => x.id === id);
  if(!c) return;
  history = c.messages.filter(m => m && (m.role === 'user' || m.role === 'assistant'));
  chatId = id; state = {};
  renderAll(); markActive(); closeDrawer();
}
function fmtDate(ms){
  if(!ms) return '';
  const d = new Date(ms), now = new Date();
  return d.toDateString() === now.toDateString()
    ? d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })
    : d.toLocaleDateString([], { month: 'short', day: 'numeric' });
}
function markActive(){ for(const el of chatList.children) el.classList.toggle('on', !!chatId && el.dataset.id === chatId); }
function renderList(){
  chatList.replaceChildren();
  listNote.hidden = chats.length > 0;
  if(!chats.length) listNote.textContent = 'No saved chats yet. Every chat saves itself in this browser.';
  for(const c of chats){
    const row = document.createElement('div'); row.className = 'item'; row.dataset.id = c.id;
    const open = document.createElement('button'); open.type = 'button'; open.className = 'open';
    const t = document.createElement('span'); t.className = 't'; t.textContent = c.title || 'Untitled chat';
    const dt = document.createElement('span'); dt.className = 'd'; dt.textContent = fmtDate(c.updated);
    open.append(t, dt); open.onclick = () => openChat(c.id);
    const del = document.createElement('button'); del.type = 'button'; del.className = 'del'; del.textContent = 'Delete';
    del.setAttribute('aria-label', 'Delete chat: ' + (c.title || 'Untitled chat'));
    del.onclick = () => {
      if(!del.classList.contains('arm')){
        del.classList.add('arm'); del.textContent = 'Sure?';
        setTimeout(() => { del.classList.remove('arm'); del.textContent = 'Delete'; }, 3000);
        return;
      }
      writeChats(loadChats().filter(x => x.id !== c.id));
      chats = loadChats();
      if(chatId === c.id) newChat();
      renderList();
    };
    row.append(open, del);
    chatList.appendChild(row);
  }
  markActive();
}
function openDrawer(){ drawer.hidden = false; scrim.hidden = false; $('closeBtn').focus(); }
function closeDrawer(){ drawer.hidden = true; if($('customPanel').hidden && $('brainPanel').hidden) scrim.hidden = true; }

$('closeBtn').onclick = closeDrawer;
