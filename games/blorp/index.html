/* ---------- Brain size: built-in, or a real AI brain that runs on your computer ---------- */
// The AI brains use WebLLM (needs Chrome or Edge with WebGPU). They download once, then load from the browser.
const WEBLLM_URL = 'https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.83/+esm';
const SIZES = {
  builtin: { name: 'Built-in brain', short: 'Built-in', blurb: 'Instant and works everywhere. Knows drawing, games, math, jokes and facts, but gets confused by anything else.', tag: 'No download' },
  small: { name: 'Small AI brain', short: 'Small AI', blurb: 'A real AI that runs on your computer. Quick, but not super smart.', tag: 'About a 1 GB download', match: [/^Qwen3-1\.7B-q4f16_1/, /^Qwen3-1\.7B/, /^Qwen2\.5-1\.5B-Instruct-q4f16_1/, /^Llama-3\.2-1B-Instruct-q4f16_1/] },
  big: { name: 'Big AI brain', short: 'Big AI', blurb: 'Smarter AI. Needs a decent graphics card.', tag: 'About a 2.5 GB download', match: [/^Qwen3-4B-q4f16_1/, /^Qwen3-4B/, /^Qwen2\.5-3B-Instruct-q4f16_1/, /^Llama-3\.2-3B-Instruct-q4f16_1/] },
  huge: { name: 'Huge AI brain', short: 'Huge AI', blurb: 'The smartest one. Needs a strong graphics card.', tag: 'About a 5 GB download', match: [/^Qwen3-8B-q4f16_1/, /^Qwen3-8B/, /^Llama-3\.1-8B-Instruct-q4f16_1/] }
};
const IN_CLAUDE = !!(window.claude && typeof window.claude.use === 'function');
const HAS_GPU = 'gpu' in navigator;
let brainSize = store.get('blorp-brain-size', 'builtin');
if(!SIZES[brainSize] || IN_CLAUDE) brainSize = 'builtin';
const ai = { lib: null, engine: null, loadedId: null, loadedSize: null, state: 'asleep', pct: 0, error: '', ids: {} };
const aiReady = () => brainSize !== 'builtin' && ai.state === 'ready' && ai.loadedSize === brainSize;
const bar = $('bar'), barFill = $('barFill'), sub = $('sub');

function setSub(){
  if(brainSize === 'builtin'){ sub.textContent = 'friendly AI · built-in brain'; return; }
  const n = SIZES[brainSize].short;
  sub.textContent = ai.state === 'ready' && ai.loadedSize === brainSize ? `${n} brain · ready` : ai.state === 'loading' ? `${n} brain · loading ${Math.round(ai.pct * 100)}%` : ai.state === 'error' ? `${n} brain · couldn't load` : `${n} brain · not loaded yet`;
}
function resolveIds(){
  const list = (ai.lib && ai.lib.prebuiltAppConfig && ai.lib.prebuiltAppConfig.model_list) || [];
  for(const [key, s] of Object.entries(SIZES)){
    if(!s.match) continue;
    let found = null;
    for(const re of s.match){ found = list.find(m => re.test(m.model_id)); if(found) break; }
    ai.ids[key] = found ? { id: found.model_id, vram: found.vram_required_MB } : null;
  }
}
async function loadAI(){
  if(brainSize === 'builtin' || ai.state === 'loading') return;
  ai.state = 'loading'; ai.pct = 0; ai.error = ''; bar.hidden = false; barFill.style.width = '0%'; setSub(); renderBrains();
  try{
    if(!ai.lib){ ai.lib = await import(WEBLLM_URL); resolveIds(); }
    const pickId = ai.ids[brainSize];
    if(!pickId) throw new Error('That brain size is not available right now. Try another one.');
    const progress = r => { if(typeof r.progress === 'number') ai.pct = r.progress; barFill.style.width = Math.round(ai.pct * 100) + '%'; setSub(); const t = $('brainNote'); if(t) t.textContent = r.text || ''; };
    if(ai.engine && ai.loadedId !== pickId.id){ if(ai.engine.setInitProgressCallback) ai.engine.setInitProgressCallback(progress); await ai.engine.reload(pickId.id); }
    else if(!ai.engine) ai.engine = await ai.lib.CreateMLCEngine(pickId.id, { initProgressCallback: progress });
    ai.loadedId = pickId.id; ai.loadedSize = brainSize; ai.state = 'ready';
    const done = store.get('blorp-brains-downloaded', []); if(!done.includes(brainSize)){ done.push(brainSize); store.set('blorp-brains-downloaded', done); }
    add(`(${SIZES[brainSize].name} is ready! Blorp is smarter now.)`, 'sys');
  }catch(e){
    ai.state = 'error'; ai.error = String((e && e.message) || e).slice(0, 200);
    add(`(The ${SIZES[brainSize].name} couldn't load: ${ai.error} Blorp will use his built-in brain for now.)`, 'sys');
  }
  bar.hidden = true; setSub(); renderBrains();
}
function chooseBrain(key){
  if(busy || !SIZES[key]) return;
  brainSize = key; store.set('blorp-brain-size', key);
  if(key !== 'builtin' && ai.loadedSize !== key && ai.state !== 'loading') ai.state = 'asleep';
  setSub(); renderBrains();
}
function renderBrains(){
  const list = $('brainList'); if(!list) return;
  list.replaceChildren();
  for(const [key, s] of Object.entries(SIZES)){
    const blocked = key !== 'builtin' && (IN_CLAUDE || !HAS_GPU);
    const b = el('button', { type: 'button', className: 'brainOpt' + (brainSize === key ? ' on' : ''), disabled: busy || blocked });
    const info = ai.ids[key];
    const downloaded = store.get('blorp-brains-downloaded', []).includes(key);
    b.append(
      el('span', { className: 'bt', textContent: s.name + (brainSize === key ? ' · using now' : '') }),
      el('span', { className: 'bd', textContent: s.blurb + (info && info.vram ? ` Needs about ${(info.vram / 1024).toFixed(1)} GB of graphics memory.` : '') }),
      el('span', { className: 'bg', textContent: key === 'builtin' ? s.tag : downloaded ? 'Downloaded' : s.tag })
    );
    b.onclick = () => chooseBrain(key);
    list.append(b);
  }
  const note = $('brainNote'), go = $('brainLoad');
  go.hidden = true;
  if(IN_CLAUDE) note.textContent = "The AI brains can't load inside Claude, because Claude blocks big downloads here. They work when Blorp is on your website.";
  else if(!HAS_GPU) note.textContent = "This browser can't run the AI brains. They need WebGPU, which works in Chrome or Edge on most computers.";
  else if(brainSize === 'builtin') note.textContent = 'Pick an AI brain to make Blorp smarter.';
  else if(ai.state === 'loading') note.textContent = 'Loading…';
  else if(aiReady()) note.textContent = `${SIZES[brainSize].name} is ready.`;
  else { go.hidden = false; go.textContent = store.get('blorp-brains-downloaded', []).includes(brainSize) ? `Load the ${SIZES[brainSize].name}` : `Download the ${SIZES[brainSize].name}`; note.textContent = ai.state === 'error' ? `Last try failed: ${ai.error}` : `${SIZES[brainSize].tag}. It downloads once, then it's saved in your browser.`; }
}
function openBrains(){ closeDrawer(); closeCustom(); renderBrains(); $('brainPanel').hidden = false; scrim.hidden = false; $('brainClose').focus(); }
function closeBrains(){ const p = $('brainPanel'); if(!p) return; p.hidden = true; if(drawer.hidden && $('customPanel').hidden) scrim.hidden = true; }
$('brainBtn').onclick = openBrains;
$('brainClose').onclick = closeBrains;
$('brainLoad').onclick = loadAI;

// The AI brain answers what the built-in brain couldn't. It knows who Blorp is and what Blorp remembers about you.
function aiRules(){
  const facts = [];
  if(mem.name) facts.push(`The user's name is ${mem.name}.`);
  for(const [k, v] of Object.entries(mem.favorites || {})) facts.push(`The user's favorite ${k} is ${v}.`);
  if(mem.likes && mem.likes.length) facts.push(`The user likes ${mem.likes.slice(-6).join(', ')}.`);
  const know = (draft.knowledge || []).filter(k => k.topic && k.info).slice(0, 12).map(k => `${k.topic}: ${k.info}`);
  return `You are Blorp, a friendly, curious and playful AI chatbot that lives on a web page. Blorp is just your name.
Reply in the same language the user writes in. Keep replies short: one to three sentences, like a chat message.
Be kind and clear. If you don't know something, say so honestly instead of making it up.
You can draw pictures, but only when the user asks with words like "draw a frog". If they want a picture, tell them to ask that way. Never write code or SVG.
You were made by ${(draft.madeBy || '').trim() || BRAIN.MADE_BY}.` + (facts.length ? '\nWhat you remember about the user: ' + facts.join(' ') : '') + (know.length ? '\nThings you know:\n' + know.join('\n') : '');
}
const noThink = () => /qwen3/i.test(ai.loadedId || '') ? ' /no_think' : '';
const stripThink = t => t.replace(/<think>[\s\S]*?<\/think>/g, '').replace(/<think>[\s\S]*$/, '').replace(/^\s+/, '');
async function askAI(onText){
  const turns = [];
  for(const m of history.slice(-10)){
    let c = m.role === 'assistant' && m.scene ? (m.content + ' [drew a picture: ' + ART.describe(m.scene) + ']') : (m.content || (m.files && m.files.length ? '[sent a file]' : ''));
    if(!c) continue;
    turns.push({ role: m.role, content: c.slice(0, 1500) });
  }
  while(turns.length && turns[0].role !== 'user') turns.shift();
  if(!turns.length) return '';
  turns[turns.length - 1].content += noThink();
  const chunks = await ai.engine.chat.completions.create({ messages: [{ role: 'system', content: aiRules() }, ...turns], stream: true, temperature: .7, max_tokens: 300 });
  let raw = '';
  for await (const ch of chunks){
    if(skipAI){ try{ ai.engine.interruptGenerate(); }catch(e){} break; }
    raw += (ch.choices && ch.choices[0] && ch.choices[0].delta && ch.choices[0].delta.content) || '';
    const shown = stripThink(raw);
    if(shown) onText(shown);
  }
  return stripThink(raw).trim();
}
let skipAI = false;

setSub();
// If this AI brain was downloaded before, load it from the browser right away.
if(brainSize !== 'builtin' && HAS_GPU && !IN_CLAUDE && store.get('blorp-brains-downloaded', []).includes(brainSize)) loadAI();

form.addEventListener('submit', e => { e.preventDefault(); send(); });
chats = loadChats(); renderList();
renderAll();
input.focus();

</script>
