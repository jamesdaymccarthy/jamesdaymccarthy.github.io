<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>fishing</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0a1420;overflow:hidden;font-family:'Georgia',serif;cursor:none;}
canvas{display:block;}
#catch-log{position:fixed;right:14px;top:14px;display:flex;flex-direction:column;gap:5px;pointer-events:none;max-width:200px;}
.ce{background:rgba(5,15,25,.85);border:1px solid rgba(100,180,220,.18);border-radius:5px;padding:5px 10px;font-size:.65rem;color:rgba(180,220,240,.85);letter-spacing:1px;animation:fi .35s ease;}
@keyframes fi{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
#hud-left{position:fixed;top:14px;left:14px;display:flex;flex-direction:column;gap:4px;pointer-events:none;}
.hud-line{font-size:.65rem;letter-spacing:2px;}
#spot-lbl{color:rgba(180,220,240,.6);}
#fish-lbl{color:rgba(180,220,240,.3);}
#pts-lbl{color:rgba(255,200,80,.35);}
#weather-lbl{color:rgba(180,220,240,.25);font-style:italic;}
#bait-lbl{color:rgba(180,200,150,.45);}
#info{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);color:rgba(180,220,240,.4);font-size:.65rem;letter-spacing:3px;text-align:center;pointer-events:none;max-width:500px;}
#reel-wrap{position:fixed;bottom:48px;left:50%;transform:translateX(-50%);width:220px;display:none;flex-direction:column;gap:4px;}
#reel-top{display:flex;justify-content:space-between;font-size:.58rem;color:rgba(180,220,240,.5);letter-spacing:2px;}
#reel-bg{height:10px;background:rgba(255,255,255,.08);border-radius:5px;overflow:hidden;position:relative;}
#reel-fill{height:100%;width:0%;border-radius:5px;transition:width .04s;}
#reel-zone{position:absolute;top:0;height:100%;background:rgba(80,255,120,.2);border:1px solid rgba(80,255,120,.4);border-radius:3px;}
#tension-bg{height:5px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden;}
#tension-fill{height:100%;width:0%;background:linear-gradient(90deg,#4f4,#ff4,#f44);border-radius:3px;transition:width .05s;}
#spot-bar{position:fixed;bottom:44px;left:50%;transform:translateX(-50%);display:flex;gap:6px;pointer-events:all;flex-wrap:wrap;justify-content:center;max-width:700px;}
.spot-btn{padding:4px 10px;border-radius:4px;font-size:.58rem;font-family:Georgia,serif;letter-spacing:1px;cursor:pointer;border:1px solid rgba(100,180,220,.2);background:rgba(5,15,25,.7);color:rgba(120,180,210,.6);transition:all .12s;}
.spot-btn:hover{border-color:rgba(100,180,220,.5);color:rgba(180,220,240,.9);}
.spot-btn.active{background:rgba(20,50,80,.8);border-color:rgba(100,200,240,.5);color:rgba(200,235,255,.95);}
.spot-btn.locked{opacity:.3;cursor:default;}
#bait-bar{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:5px;pointer-events:all;}
.bait-btn{padding:3px 8px;border-radius:3px;font-size:.58rem;font-family:Georgia,serif;letter-spacing:1px;cursor:pointer;border:1px solid rgba(150,200,120,.2);background:rgba(5,15,10,.7);color:rgba(140,190,110,.5);}
.bait-btn.active{border-color:rgba(150,220,100,.5);color:rgba(180,240,130,.9);background:rgba(20,40,15,.8);}
/* CUSTOM FISH CREATOR */
#custom-panel{display:none;flex-direction:column;gap:10px;padding:16px 24px;border-top:1px solid rgba(100,180,220,.1);background:rgba(5,12,22,.6);}
#custom-panel.open{display:flex;}
#custom-panel h3{color:rgba(180,220,240,.7);font-size:.72rem;letter-spacing:4px;font-weight:normal;}
.cf-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.cf-label{color:rgba(140,180,210,.5);font-size:.6rem;letter-spacing:2px;min-width:50px;}
.cf-input{background:rgba(10,25,40,.8);border:1px solid rgba(100,180,220,.2);color:rgba(200,230,250,.9);font-family:'Courier New',monospace;font-size:.65rem;padding:4px 8px;border-radius:3px;width:90px;}
.cf-input:focus{outline:none;border-color:rgba(100,200,240,.5);}
.cf-slider{width:120px;accent-color:#4af;}
.cf-val{color:rgba(100,200,240,.7);font-size:.6rem;min-width:30px;}
#cf-draw-canvas{border:1px solid rgba(100,180,220,.2);border-radius:4px;background:#050f18;cursor:crosshair;touch-action:none;}
#cf-tools{display:flex;gap:6px;flex-wrap:wrap;}
.cf-tool{background:none;border:1px solid rgba(100,180,220,.15);color:rgba(140,180,210,.6);font-family:'Courier New',monospace;font-size:.58rem;padding:3px 8px;border-radius:3px;cursor:pointer;}
.cf-tool.active{border-color:rgba(100,200,240,.5);color:rgba(180,230,255,.9);background:rgba(10,30,50,.6);}
#cf-color{width:36px;height:28px;border:1px solid rgba(100,180,220,.2);border-radius:3px;cursor:pointer;background:none;}
#cf-save{background:rgba(10,40,20,.8);border:1px solid rgba(80,180,100,.3);color:rgba(140,220,150,.8);font-family:'Courier New',monospace;font-size:.68rem;letter-spacing:2px;padding:7px 18px;border-radius:4px;cursor:pointer;}
#cf-save:hover{border-color:rgba(80,200,100,.6);color:rgba(180,255,180,.9);}
#cf-clear{background:none;border:1px solid rgba(180,80,80,.25);color:rgba(200,100,100,.6);font-family:'Courier New',monospace;font-size:.58rem;padding:3px 8px;border-radius:3px;cursor:pointer;}
#cf-err{color:rgba(255,100,100,.7);font-size:.6rem;letter-spacing:1px;}
#pedia-btn{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:rgba(5,15,25,.85);border:1px solid rgba(100,180,220,.25);border-radius:5px;padding:5px 16px;color:rgba(150,200,230,.65);font-family:Georgia,serif;font-size:.65rem;letter-spacing:3px;cursor:pointer;pointer-events:all;transition:all .15s;}
#pedia-btn:hover{border-color:rgba(100,200,240,.6);color:rgba(200,235,255,.9);}
#pedia{position:fixed;inset:0;background:rgba(4,10,18,.97);z-index:100;display:none;flex-direction:column;}
#pedia.open{display:flex;}
#pedia-header{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid rgba(100,180,220,.12);}
#pedia-header h2{color:rgba(180,220,240,.85);font-size:1.1rem;letter-spacing:6px;font-weight:normal;}
#pedia-progress{color:rgba(255,200,80,.5);font-size:.68rem;letter-spacing:2px;}
#pedia-close{background:none;border:1px solid rgba(100,180,220,.25);color:rgba(150,200,230,.6);font-family:Georgia,serif;font-size:.7rem;letter-spacing:2px;padding:5px 14px;border-radius:4px;cursor:pointer;}
#pedia-close:hover{border-color:rgba(100,200,240,.5);color:rgba(200,235,255,.9);}
#pedia-filters{display:flex;gap:6px;padding:10px 24px;border-bottom:1px solid rgba(100,180,220,.08);align-items:center;flex-wrap:wrap;}
.pf-sel{background:rgba(10,25,40,.8);border:1px solid rgba(100,180,220,.2);color:rgba(160,200,230,.7);font-family:'Courier New',monospace;font-size:.6rem;padding:3px 6px;border-radius:3px;cursor:pointer;}
.pf-sel:focus{outline:none;border-color:rgba(100,200,240,.4);}
.pf-btn{background:none;border:1px solid rgba(100,180,220,.15);color:rgba(120,170,200,.5);font-family:Georgia,serif;font-size:.6rem;letter-spacing:2px;padding:3px 10px;border-radius:3px;cursor:pointer;}
.pf-btn.on{border-color:rgba(100,200,240,.45);color:rgba(180,230,255,.85);background:rgba(10,30,50,.6);}
#pedia-grid{flex:1;overflow-y:auto;padding:16px 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;}
#pedia-grid::-webkit-scrollbar{width:4px;}
#pedia-grid::-webkit-scrollbar-thumb{background:rgba(100,180,220,.2);border-radius:2px;}
.pedia-card{background:rgba(8,18,30,.8);border:1px solid rgba(100,180,220,.1);border-radius:6px;padding:12px;transition:border-color .12s;position:relative;}
.pedia-card.caught{border-color:rgba(100,180,220,.25);}
.pedia-card.caught:hover{border-color:rgba(100,200,240,.5);}
.pedia-card.uncaught{opacity:.55;}
.pedia-card .pc-emoji{font-size:1.6rem;display:block;margin-bottom:6px;}
.pedia-card.uncaught .pc-emoji{filter:grayscale(1) brightness(.3);}
.pedia-card .pc-name{font-size:.72rem;letter-spacing:2px;margin-bottom:2px;}
.pedia-card.caught .pc-name{color:rgba(200,230,250,.9);}
.pedia-card.uncaught .pc-name{color:rgba(100,130,150,.6);}
.pedia-card .pc-desc{font-size:.58rem;color:rgba(130,170,200,.5);line-height:1.5;margin-top:4px;}
.pedia-card.uncaught .pc-desc{color:rgba(80,100,120,.4);}
.pedia-card .pc-pts{font-size:.58rem;color:rgba(255,200,80,.5);margin-top:4px;}
.pedia-card .pc-stats{display:flex;gap:8px;margin-top:6px;}
.pc-stat{font-size:.55rem;color:rgba(120,160,190,.4);letter-spacing:1px;}
.pedia-card.caught .pc-stat{color:rgba(120,180,210,.6);}
.pc-tier{position:absolute;top:8px;right:8px;font-size:.5rem;letter-spacing:1px;padding:2px 5px;border-radius:2px;}
.pedia-card .pc-caught-badge{position:absolute;bottom:8px;right:8px;font-size:.55rem;color:rgba(80,200,120,.7);letter-spacing:1px;}
.pedia-card .pc-times{font-size:.55rem;color:rgba(100,160,200,.4);margin-top:2px;}
#msg{position:fixed;top:45%;left:50%;transform:translate(-50%,-50%);color:rgba(255,220,100,.8);font-size:1rem;letter-spacing:4px;pointer-events:none;opacity:0;transition:opacity .3s;text-shadow:0 0 20px rgba(255,200,60,.5);}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="pedia-btn" onclick="openPedia()">📖 fishpedia</button>

<div id="pedia">
  <div id="pedia-header">
    <h2>FISHPEDIA</h2>
    <span id="pedia-progress">0 / 35 discovered</span>
    <button id="pedia-close" onclick="closePedia()">✕ close</button>
  </div>
  <div id="pedia-filters">
    <button class="pf-btn on" onclick="setPFilter('all',this)">all</button>
    <button class="pf-btn" onclick="setPFilter('caught',this)">caught</button>
    <button class="pf-btn" onclick="setPFilter('uncaught',this)">undiscovered</button>

    <span style="color:rgba(100,150,180,.3);font-size:.6rem;margin:0 4px">|</span>

      <option value="common">common</option>

      <option value="rare">rare</option>

    </select>
    <span style="color:rgba(100,150,180,.3);font-size:.6rem;margin:0 4px">|</span>
    <span style="color:rgba(140,180,210,.4);font-size:.58rem;letter-spacing:1px">type:</span>
    <select class="pf-sel" id="type-sel" onchange="setPFilterSel(this.value,this)">
      <option value="">—</option>
      <option value="seadevil">🔱 seadevil</option>
      <option value="non-fish">👁 non-fish</option>
      <option value="anomaly">⬛ anomaly</option>
      <option value="salmonid">🌈 salmonid</option>
      <option value="cyprinid">🐟 cyprinid</option>
      <option value="panfish">☀️ panfish</option>
      <option value="predator">⚡ predator</option>
      <option value="eel">🐍 eel</option>
      <option value="pelagic">🌊 pelagic</option>
      <option value="ancient">🏮 ancient</option>
      <option value="megafish">🐊 megafish</option>
      <option value="marine">🐟 marine</option>
      <option value="catfish">😼 catfish</option>
      <option value="ray">🟦 ray</option>
      <option value="cephalopod">🦑 cephalopod</option>
      <option value="crustacean">🦀 crustacean</option>
      <option value="flatfish">🐟 flatfish</option>
    </select>
    <button style="margin-left:auto;border:1px solid rgba(80,180,100,.3);color:rgba(140,220,150,.6);background:none;font-family:'Courier New',monospace;font-size:.6rem;letter-spacing:1px;padding:3px 10px;border-radius:3px;cursor:pointer" onclick="toggleCreator()">+ create fish</button>
  </div>
  <div id="custom-panel">
    <h3>CREATE A FISH</h3>
    <div class="cf-row">
      <span class="cf-label">name</span>
      <input class="cf-input" id="cf-name" placeholder="my fish" style="width:160px">
    </div>
    <div class="cf-row">
      <span class="cf-label">fight</span>
      <input type="range" class="cf-slider" id="cf-fight" min="0" max="100" value="50" oninput="document.getElementById('cf-fight-val').textContent=this.value+'%'">
      <span class="cf-val" id="cf-fight-val">50%</span>
      <span class="cf-label" style="margin-left:10px">slip</span>
      <input type="range" class="cf-slider" id="cf-slip" min="0" max="100" value="30" oninput="document.getElementById('cf-slip-val').textContent=this.value+'%'">
      <span class="cf-val" id="cf-slip-val">30%</span>
    </div>
    <div class="cf-row">
      <span class="cf-label">pts</span>
      <input class="cf-input" id="cf-pts" type="number" value="10" min="0" style="width:70px">
      <span class="cf-label" style="margin-left:10px">rarity</span>
      <select class="cf-input" id="cf-rarity" style="width:110px">
        <option value=".15">common</option>
        <option value=".04">uncommon</option>
        <option value=".008">rare</option>
        <option value=".001">legendary</option>
      </select>
    </div>
    <div class="cf-row" style="align-items:flex-start;gap:14px;flex-wrap:nowrap">
      <div>
        <div style="font-size:.58rem;color:rgba(140,180,210,.5);letter-spacing:2px;margin-bottom:6px">draw your fish</div>
        <canvas id="cf-draw-canvas" width="200" height="110"></canvas>
        <div id="cf-tools" style="margin-top:6px">
          <button class="cf-tool active" id="cft-draw" onclick="setCFTool('draw',this)">✏ draw</button>
          <button class="cf-tool" id="cft-erase" onclick="setCFTool('erase',this)">⬜ erase</button>
          <button class="cf-tool" id="cft-fill" onclick="setCFTool('fill',this)">🪣 fill</button>
          <input type="color" id="cf-color" value="#44aaff" title="color">
          <input type="range" id="cf-brush" min="1" max="20" value="4" style="width:60px;accent-color:#4af" title="brush size">
          <button class="cf-clear" id="cf-clear" onclick="cfClear()">✕ clear</button>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px;padding-top:22px">
        <div style="font-size:.55rem;color:rgba(120,160,190,.4);letter-spacing:1px">preview</div>
        <canvas id="cf-preview" width="120" height="70" style="border:1px solid rgba(100,180,220,.15);border-radius:4px;background:#050f18;"></canvas>

      </div>

  <div id="pedia-grid"></div>
</div>

<div id="hud-left">
  <div class="hud-line" id="spot-lbl">calm lake</div>
  <div class="hud-line" id="fish-lbl">caught: 0</div>
  <div class="hud-line" id="pts-lbl">score: 0</div>
  <div class="hud-line" id="weather-lbl">clear</div>
  <div class="hud-line" id="bait-lbl">bait: worm</div>
</div>
<div id="catch-log"></div>
<div id="reel-wrap">
  <div id="reel-top"><span id="reel-name">reeling...</span><span id="reel-pct">0%</span></div>
  <div id="reel-bg"><div id="reel-fill"></div><div id="reel-zone"></div></div>
  <div id="tension-bg" style="display:none;"><div id="tension-fill"></div></div>
</div>
<div id="info">click water to cast</div>
<div id="msg"></div>

<div id="spot-bar"></div>
<div id="bait-bar"></div>

<script>
const W=window.innerWidth,H=window.innerHeight;
const cv=document.getElementById('c');const ctx=cv.getContext('2d');
cv.width=W;cv.height=H;
const WATER_Y=H*.42;

// ══════════════════════════════════════════════════════
// AUDIO
// ══════════════════════════════════════════════════════
const ac=new(window.AudioContext||window.webkitAudioContext)();
document.addEventListener('click',()=>ac.resume(),{once:true});

function tone(freq,dur,vol=.05,type='sine',when){
  const t=when??ac.currentTime;
  const o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.04);
  g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur+.05);
}
function noise(dur,vol,freq,q){
  const buf=ac.createBuffer(1,ac.sampleRate*dur,ac.sampleRate);
  const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1.5);
  const src=ac.createBufferSource();src.buffer=buf;
  const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=freq||600;f.Q.value=q||1;
  const g=ac.createGain();g.gain.value=vol||.2;
  src.connect(f);f.connect(g);g.connect(ac.destination);src.start();
}
const PENTA=[130.8,146.8,164.8,196,220,261.6,293.7,329.6,392,440,523.3,587.3];
let melIdx=0;
function melTick(){
  if(Math.random()<.4){
    const n=PENTA[melIdx%PENTA.length];
    tone(n,1.4,.022);
    if(Math.random()<.3) tone(n*1.5,1,.012,null,ac.currentTime+.2);
  }
  melIdx++;
  setTimeout(melTick,1600+Math.random()*2800);
}
melTick();
// ambient
(()=>{
  const buf=ac.createBuffer(1,ac.sampleRate*3,ac.sampleRate);
  const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*.25;
  const src=ac.createBufferSource();src.buffer=buf;src.loop=true;
  const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=280;
  const g=ac.createGain();g.gain.value=.035;
  const lfo=ac.createOscillator();const lg=ac.createGain();
  lfo.frequency.value=.06;lg.gain.value=50;lfo.connect(lg);lg.connect(lp.frequency);
  src.connect(lp);lp.connect(g);g.connect(ac.destination);src.start();lfo.start();
})();

// ══════════════════════════════════════════════════════
// DATA
// ══════════════════════════════════════════════════════
const BAITS=[
  {id:'worm',    name:'worm',    emoji:'🪱', mult:1,    rareMult:1,   desc:'standard'},
  {id:'fly',     name:'fly',     emoji:'🪰', mult:.8,   rareMult:1.4, desc:'attracts rare fish'},
  {id:'lure',    name:'lure',    emoji:'🎣', mult:1.3,  rareMult:.8,  desc:'bites more often'},
  {id:'bread',   name:'bread',   emoji:'🍞', mult:1.5,  rareMult:.5,  desc:'common fish love it'},
  {id:'shrimp',  name:'shrimp',  emoji:'🦐', mult:1.1,  rareMult:1.6, desc:'deep water bait'},
  {id:'cricket', name:'cricket',  emoji:'🦗', mult:.9,  rareMult:1.8, desc:'ultra-rare bonus'},
  {id:'lucky',   name:'lucky bait', emoji:'🍀', mult:1, rareMult:1,   desc:'fortune favors the lucky'},
  {id:'legendary', name:'legendary bait', emoji:'⭐', mult:1, rareMult:1, desc:'only the finest will bite'},
  {id:'mega',      name:'mega bait',      emoji:'🐊', mult:1, rareMult:1, desc:'something enormous will come'},
  {id:'anomaly',   name:'anomaly bait',   emoji:'🪱', mult:1, rareMult:1, desc:'something is wrong with this'},
  {id:'nonfish',   name:'non-bait',       emoji:'👁', mult:1, rareMult:1, desc:'they will come'},
];
let baitIdx=0;

const FISH=[
  // ── COMMON ─────────────────────────────────────────────
  {name:'minnow',          emoji:'🐟',col:'#88ccff',size:.3, rare:.18,time:[1,3],  pts:1,  fight:.15,slip:.2, desc:'finger-length · silver-blue flash in shallow water · swims in panicked bursts when hooked · barely bends the rod', spots:null, kind:'panfish'},
  {name:'bro hes not a fish!', emoji:'👁', col:'#44aa44',size:.5, rare:.15,time:[1,4],  pts:5,  fight:.4, slip:.3, desc:'oval green body · orange eye · definitely not a fish', spots:null, oneShot:true, kind:'non-fish'},
  {name:'lil guy',             emoji:'👁', col:'#88ddff',size:.3, rare:.13,time:[1,3],  pts:3,  fight:.2, slip:.2, desc:'tiny · pale blue · waves at you · extremely small · where did it come from', spots:null, oneShot:true, kind:'non-fish'},
  {name:'the round one',       emoji:'👁', col:'#ffcc88',size:.5, rare:.11,time:[1,4],  pts:4,  fight:.3, slip:.25,desc:'just a sphere · yellow · one eye · no limbs · rolls when reeled · content', spots:null, oneShot:true, kind:'non-fish'},
  {name:'greg',                emoji:'👁', col:'#99aacc',size:.55,rare:.10,time:[2,5],  pts:4,  fight:.35,slip:.28,desc:'grey · average in every way · his name is greg · he does not want to be here either', spots:null, oneShot:true, kind:'non-fish'},

// ── Fish illustration renderer ──────────────────────
function drawFishIllustration(cv2, f){
  // custom fish — draw saved image
  if(f.custom&&f.imgData){
    const x2=cv2.getContext('2d');
    x2.clearRect(0,0,cv2.width,cv2.height);
    const img=new Image();img.src=f.imgData;
    img.onload=()=>x2.drawImage(img,0,0,cv2.width,cv2.height);
    if(img.complete) x2.drawImage(img,0,0,cv2.width,cv2.height);
    return;
  }
  const w=cv2.width, h=cv2.height;
  const x2=cv2.getContext('2d');
  x2.clearRect(0,0,w,h);
  const cx=w/2, cy=h/2;
  const col=f.col;

  // parse hex color to rgb
  function hexRgb(hex){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return[r,g,b];}
  function lighter(hex,amt){const[r,g,b]=hexRgb(hex);return`rgb(${Math.min(255,r+amt)},${Math.min(255,g+amt)},${Math.min(255,b+amt)})`;}
  function darker(hex,amt){const[r,g,b]=hexRgb(hex);return`rgb(${Math.max(0,r-amt)},${Math.max(0,g-amt)},${Math.max(0,b-amt)})`;}
  function rgba(hex,a){const[r,g,b]=hexRgb(hex);return`rgba(${r},${g},${b},${a})`;}

  const n=f.name;

  // ── minnow ─────────────────────────────────────────
  if(n==='minnow'){
    x2.fillStyle=col;x2.beginPath();x2.ellipse(cx,cy,28,9,0,0,Math.PI*2);x2.fill();
    x2.fillStyle=lighter(col,40);x2.beginPath();x2.ellipse(cx-4,cy-2,14,5,0,0,Math.PI*2);x2.fill();
    x2.fillStyle=darker(col,20);x2.beginPath();x2.moveTo(cx-28,cy);x2.lineTo(cx-40,cy-10);x2.lineTo(cx-40,cy+10);x2.closePath();x2.fill();
    x2.fillStyle='#111';x2.beginPath();x2.arc(cx+20,cy-2,2.5,0,Math.PI*2);x2.fill();
    x2.fillStyle='rgba(255,255,255,.6)';x2.beginPath();x2.arc(cx+21,cy-3,1,0,Math.PI*2);x2.fill();
  }
  // ── bluegill ───────────────────────────────────────
  else if(n==='bluegill'){
    // round disk shape
    x2.fillStyle=col;x2.beginPath();x2.ellipse(cx,cy,26,22,0,0,Math.PI*2);x2.fill();
    x2.fillStyle=lighter(col,50);x2.beginPath();x2.ellipse(cx-2,cy-3,14,10,0,0,Math.PI*2);x2.fill();
    // vertical stripes
    x2.strokeStyle=darker(col,30);x2.lineWidth=1.5;
    for(let i=0;i<4;i++){const sx=cx-10+i*7;x2.beginPath();x2.moveTo(sx,cy-18+i*2);x2.lineTo(sx-2,cy+18-i*2);x2.stroke();}
    // dorsal fin
    x2.fillStyle=darker(col,15);x2.beginPath();x2.moveTo(cx-10,cy-22);x2.quadraticCurveTo(cx,cy-36,cx+10,cy-22);x2.fill();
    // tail
    x2.fillStyle=darker(col,20);x2.beginPath();x2.moveTo(cx-26,cy);x2.lineTo(cx-40,cy-14);x2.lineTo(cx-40,cy+14);x2.closePath();x2.fill();
    x2.fillStyle='#111';x2.beginPath();x2.arc(cx+18,cy-4,2.5,0,Math.PI*2);x2.fill();
    x2.fillStyle='rgba(255,255,255,.5)';x2.beginPath();x2.arc(cx+19,cy-5,1,0,Math.PI*2);x2.fill();

// CUSTOM FISH CREATOR
// ══════════════════════════════════════════════════════
const customFish=[];
let cfTool='draw';
let cfDrawing=false;
let cfCtx=null;

function initCFCanvas(){
  if(cfCtx) return;
  const cv2=document.getElementById('cf-draw-canvas');
  cfCtx=cv2.getContext('2d');
  cfCtx.fillStyle='#050f18';cfCtx.fillRect(0,0,200,110);
  cv2.addEventListener('mousedown',e=>{cfDrawing=true;cfPaint(e);});
  cv2.addEventListener('mousemove',e=>{if(cfDrawing)cfPaint(e);});
  cv2.addEventListener('mouseup',()=>cfDrawing=false);
  cv2.addEventListener('mouseleave',()=>cfDrawing=false);
  // live preview
  setInterval(()=>{
    const pv=document.getElementById('cf-preview');if(!pv)return;
    const pc=pv.getContext('2d');pc.clearRect(0,0,120,70);
    pc.drawImage(document.getElementById('cf-draw-canvas'),0,0,120,70);
  },100);
}

function cfPaint(e){
  const cv2=document.getElementById('cf-draw-canvas');
  const rect=cv2.getBoundingClientRect();
  const x=e.clientX-rect.left,y=e.clientY-rect.top;
  const size=parseInt(document.getElementById('cf-brush').value)||4;
  const col=document.getElementById('cf-color').value;
  if(cfTool==='draw'){
    cfCtx.fillStyle=col;cfCtx.beginPath();cfCtx.arc(x,y,size,0,Math.PI*2);cfCtx.fill();
  } else if(cfTool==='erase'){
    cfCtx.fillStyle='#050f18';cfCtx.beginPath();cfCtx.arc(x,y,size*2,0,Math.PI*2);cfCtx.fill();
  } else if(cfTool==='fill'){
    cfCtx.fillStyle=col;cfCtx.fillRect(0,0,200,110);cfDrawing=false;
  }
}

function setCFTool(t,btn){
  cfTool=t;
  document.querySelectorAll('.cf-tool').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

function cfClear(){
  if(!cfCtx)return;
  cfCtx.fillStyle='#050f18';cfCtx.fillRect(0,0,200,110);
}

function toggleCreator(){
  const p=document.getElementById('custom-panel');
  const open=p.classList.toggle('open');
  if(open) initCFCanvas();
}

function saveCustomFish(){
  const name=document.getElementById('cf-name').value.trim();
  const err=document.getElementById('cf-err');
  if(!name){err.textContent='name required';return;}
  if([...FISH,...SKY_FISH,...customFish].some(f=>f.name===name)){err.textContent='name already used';return;}
  err.textContent='';

  // capture drawing as dataURL
  const imgData=document.getElementById('cf-draw-canvas').toDataURL();
  const fight=parseInt(document.getElementById('cf-fight').value)/100;
  const slip=parseInt(document.getElementById('cf-slip').value)/100;
  const pts=parseInt(document.getElementById('cf-pts').value)||10;
  const rare=parseFloat(document.getElementById('cf-rarity').value);

  const fish={
    name,emoji:'✏️',col:'#aaddff',
    size:.8,rare,time:[3,8],pts,fight,slip,
    desc:'custom fish',custom:true,imgData,
    spots:null,
  };
  customFish.push(fish);
  // also add to FISH pool so it can be caught in game
  FISH.push(fish);

  // reset form
  document.getElementById('cf-name').value='';
  cfClear();
  renderPedia();
  // flash confirmation
  const btn=document.getElementById('cf-save');
  btn.textContent='✓ added!';btn.style.borderColor='rgba(80,255,120,.5)';
  setTimeout(()=>{btn.textContent='+ add to fishpedia';btn.style.borderColor='';},1500);
}



const caughtData={};
let pediaFilter='all';

function getTier(f){
  if(f.rare>=.07) return{name:'common',col:'rgba(150,200,180,.6)'};
  if(f.rare>=.015) return{name:'uncommon',col:'rgba(100,160,240,.6)'};
  if(f.rare>=.001) return{name:'rare',col:'rgba(200,150,255,.65)'};
  return{name:'legendary',col:'rgba(255,200,80,.7)'};
}

function openPedia(){
  document.getElementById('pedia').classList.add('open');
  renderPedia();
}
function closePedia(){
  document.getElementById('pedia').classList.remove('open');
}

function setPFilter(f,btn){
  pediaFilter=f;
  document.querySelectorAll('.pf-btn').forEach(b=>b.classList.remove('on'));
  if(btn&&btn.classList) btn.classList.add('on');
  // reset dropdowns
  const ts=document.getElementById('tier-sel');const ks=document.getElementById('type-sel');
  if(ts) ts.value='';if(ks) ks.value='';
  if(f!=='cust') document.getElementById('custom-panel').classList.remove('open');
  renderPedia();
}
function setPFilterSel(f,sel){
  if(!f){setPFilter('all',null);return;}
  pediaFilter=f;
  document.querySelectorAll('.pf-btn').forEach(b=>b.classList.remove('on'));
  // reset the other select
  const other=sel.id==='tier-sel'?document.getElementById('type-sel'):document.getElementById('tier-sel');
  if(other) other.value='';
  document.getElementById('custom-panel').classList.remove('open');
  renderPedia();
}

function renderPedia(){
  const allFish=[...FISH,...SKY_FISH];
  const caught=Object.keys(caughtData).length;
  document.getElementById('pedia-progress').textContent=`${caught} / ${allFish.length} discovered`;

  const grid=document.getElementById('pedia-grid');
  grid.innerHTML='';

  const filtered=allFish.filter(f=>{
    const isCaught=!!caughtData[f.name];
    const tier=getTier(f).name;
    if(pediaFilter==='caught') return isCaught;
    if(pediaFilter==='uncaught') return !isCaught;
    if(pediaFilter==='sky') return !!f.sky;
    if(pediaFilter==='cust') return !!f.custom;
    const KINDS=['seadevil','non-fish','salmonid','cyprinid','panfish','predator','eel','pelagic','ancient','megafish','marine','catfish','anomaly','ray','cephalopod','crustacean','flatfish'];
    if(KINDS.includes(pediaFilter)) return f.kind===pediaFilter;
    if(['common','uncommon','rare','legendary'].includes(pediaFilter)) return tier===pediaFilter&&!f.sky&&!f.custom;
    return true;
  });

  for(const f of filtered){
    const data=caughtData[f.name];
    const caught2=!!data;
    const tier=getTier(f);
    const card=document.createElement('div');
    card.className=`pedia-card ${caught2?'caught':'uncaught'}`;
    card.style.borderColor=caught2?f.col+'33':'rgba(100,180,220,.08)';

    const spotsStr=f.spots?f.spots.join(', '):'all spots';
    const fightPct=Math.round(f.fight*100);
    const slipPct=Math.round(f.slip*100);

      ${caught2?`<div style="font-size:.5rem;color:rgba(100,150,180,.35);margin-top:5px;letter-spacing:1px;">found in: ${spotsStr}</div>`:''}

  }

  if(filtered.length===0){
    grid.innerHTML=`<div style="color:rgba(120,160,200,.35);font-size:.7rem;letter-spacing:2px;grid-column:1/-1;padding:40px;text-align:center;">nothing here yet</div>`;
  }
}

}

function buildSpotBar(){

  bar.innerHTML='';
  bar.style.cssText=`position:fixed;bottom:${H*.06}px;left:50%;transform:translateX(-50%);display:flex;gap:6px;pointer-events:all;`;

    bar.appendChild(btn);

let moonUnlocked=false;

let nonBaitUnlocked=false;

function checkMoonClick(ex,ey){
  // check rod click — unlocks non-bait (independent of moon)
  const rodHandleX=rodTipX, rodHandleY=H*.33+26;
  if(Math.abs(ex-rodHandleX)<20&&Math.abs(ey-rodHandleY)<40){
    if(!nonBaitUnlocked){
      nonBaitUnlocked=true;
      showMsg('👁 non-bait unlocked',2000);
      buildBaitBar();
    }
    return false;
  }
  // check all three celestial body positions
  const bodies=[
    {x:W*.15,y:WATER_Y*.25,r:22}, // sun (morning)
    {x:W*.7, y:WATER_Y*.2, r:25}, // sunset sun
    {x:W*.8, y:WATER_Y*.15,r:18}, // moon (night/void)
  ];
  for(const b of bodies){
    if(Math.hypot(ex-b.x,ey-b.y)<b.r+16){
      if(!moonUnlocked){
        moonUnlocked=true;
        showMsg('✨ secret unlocked',2000);
        buildBaitBar();
      }
      return true;
    }
  }
  return false;
}
function buildBaitBar(){
  const bar=document.getElementById('bait-bar');
  bar.innerHTML='';
  bar.style.cssText=`position:fixed;bottom:${H*.02}px;left:50%;transform:translateX(-50%);display:flex;gap:5px;pointer-events:all;`;
  const moonCaught=moonUnlocked;
  BAITS.forEach((b,i)=>{
    // lucky and legendary bait locked until moon is caught
    if((b.id==='lucky'||b.id==='legendary'||b.id==='mega'||b.id==='anomaly')&&!moonCaught) return;
    if(b.id==='nonfish'&&!nonBaitUnlocked) return;
    const btn=document.createElement('button');
    btn.className='bait-btn'+(i===baitIdx?' active':'');
    btn.textContent=`${b.emoji} ${b.name}`;btn.title=b.desc;
    btn.onclick=()=>{baitIdx=i;buildBaitBar();document.getElementById('bait-lbl').textContent=`bait: ${b.name}`;};
    bar.appendChild(btn);
  });
}

function pickFish(){
  if(BAITS[baitIdx].id==='legendary'){
    const pool=FISH.filter(f=>f.rare<.001&&!f.sky&&f.kind!=='anomaly'&&f.kind!=='non-fish'&&!f.isNegative&&!(f.oneShot&&caughtData[f.name]));
    if(!pool.length) return FISH[0];
    // equal weight — every legendary equally likely
    return pool[Math.floor(Math.random()*pool.length)];
  }
  if(BAITS[baitIdx].id==='nonfish'){
    const pool=FISH.filter(f=>f.kind==='non-fish'&&!(f.oneShot&&caughtData[f.name]));
    if(!pool.length) return FISH[0];
    return pool[Math.floor(Math.random()*pool.length)];
  }
  if(BAITS[baitIdx].id==='mega'){
    const pool=FISH.filter(f=>f.kind==='megafish'&&!(f.oneShot&&caughtData[f.name]));
    if(!pool.length) return FISH[0];
    return pool[Math.floor(Math.random()*pool.length)];
  }
  if(BAITS[baitIdx].id==='anomaly'){
    const pool=FISH.filter(f=>f.kind==='anomaly'&&!f.isNegative&&!(f.oneShot&&caughtData[f.name]));
    if(!pool.length) return FISH[0];
    return pool[Math.floor(Math.random()*pool.length)];
  }
  if(BAITS[baitIdx].id==='lucky'){
    // only fish with rare < .015 (rare tier or above)
    const rarePool=FISH.filter(f=>f.rare<.015&&f.name!=='hook reaper'&&!(f.oneShot&&caughtData[f.name])&&(!f.spots||f.spots.includes(SPOTS[spotIdx].id)));
    if(rarePool.length===0) return FISH[0];
    const total=rarePool.reduce((a,f)=>a+f.rare,0);
    const roll=Math.random();let cum2=0;
    for(const f of rarePool){cum2+=f.rare/total;if(roll<cum2)return f;}
    return rarePool[0];
  }
  
  if(skyMode){
    const roll=Math.random();let cum=0;
    const total=SKY_FISH.reduce((a,f)=>a+f.rare,0);
    for(const f of SKY_FISH){cum+=f.rare/total;if(roll<cum)return f;}
    return SKY_FISH[0];
  }
  const spot=SPOTS[spotIdx];const bait=BAITS[baitIdx];const we=WEATHER_EFFECTS[weather];
  // rarity bonus scales with how deep into the game you are
  const spotRarityBonus=spotIdx*.012;
  const roll=Math.random();let cum=0;
  const pool=FISH.map(f=>{
    if(f.spots&&!f.spots.includes(spot.id)) return{f,r:0};
    if(f.oneShot&&caughtData[f.name]) return{f,r:0};
    let r=f.rare;
    if(f.rare<.005) r*=bait.rareMult*1.5*(1+spotRarityBonus*4);
    else if(f.rare<.015) r*=bait.rareMult*(1+spotRarityBonus*2);
    else r*=bait.mult;
    r*=we.biteMult;r+=spot.rareMod*f.rare*10;
    return{f,r:Math.max(0,r)};
  });
  const total=pool.reduce((a,p)=>a+p.r,0);
  for(const p of pool){if(p.r<=0)continue;cum+=p.r/total;if(roll<cum)return p.f;}
  return FISH[0];
}

function addRipple(x,y){ripples.push({x,y,r:4,life:1});}
function burst(x,y,col,n=16){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=.5+Math.random()*4;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,col,r:1.5+Math.random()*3});}}
function showMsg(txt,dur=1800){
  const el=document.getElementById('msg');el.textContent=txt;el.style.opacity=1;
  setTimeout(()=>el.style.opacity=0,dur);
}
function addLog(fish){
  const log=document.getElementById('catch-log');
  const el=document.createElement('div');el.className='ce';
  el.style.borderColor=fish.col+'44';
  el.innerHTML=`<span style="color:${fish.col}">${fish.emoji||'?'} ${fish.name}</span> · ${fish.pts}pts<br><span style="color:rgba(150,180,200,.5);font-size:.58rem">${fish.desc}</span>`;
  log.insertBefore(el,log.firstChild);
  if(log.children.length>6)log.lastChild.remove();
}
function cast(){
  if(state!=='idle')return;
  state='casting';castProg=0;
  if(skyMode){
    castTX=mx;castTY=Math.max(10,Math.min(WATER_Y*.85,my));
    bobberX=castTX;bobberY=castTY;
  } else {
    castTX=mx;castTY=Math.min(H*.72,Math.max(WATER_Y+10,my));
    bobberX=castTX;bobberY=castTY;
  }
  noise(.12,.22,700,.9);
  setTimeout(()=>{
    addRipple(bobberX,bobberY);
    state='waiting';
    currentFish=pickFish();
    const we=WEATHER_EFFECTS[weather];
    waitTimer=(currentFish.time[0]+Math.random()*(currentFish.time[1]-currentFish.time[0]))*60/we.biteMult;
    if(BAITS[baitIdx].id==='lucky') waitTimer=2400+Math.random()*1800;
    if(BAITS[baitIdx].id==='legendary') waitTimer=300+Math.random()*600;
    if(BAITS[baitIdx].id==='mega') waitTimer=120+Math.random()*240;
    if(BAITS[baitIdx].id==='anomaly') waitTimer=30+Math.random()*90;
    if(BAITS[baitIdx].id==='nonfish') waitTimer=20+Math.random()*60;
    
    document.getElementById('info').textContent=skyMode?`🌤 sky fishing · bait: ${BAITS[baitIdx].name}`:`waiting... · bait: ${BAITS[baitIdx].name} · ${weather}`;
  },380);
}


function retract(){
  state='idle';currentFish=null;reelPct=0;tension=0;fishStamina=1;reelIndicator=.5;
  document.getElementById('reel-wrap').style.display='none';
  document.getElementById('info').textContent='click water to cast';
}

function startReel(){
  if(state!=='biting')return;
  state='reeling';reelPct=0;tension=0;reelIndicator=.5;fishStamina=1;
  // randomize zone position based on fish fight style
  const zw=.18+currentFish.fight*.12;
  zoneMin=.2+Math.random()*.3;zoneMax=zoneMin+zw;
  document.getElementById('reel-zone').style.left=`${zoneMin*100}%`;
  document.getElementById('reel-zone').style.width=`${(zoneMax-zoneMin)*100}%`;
  document.getElementById('reel-wrap').style.display='flex';
  document.getElementById('reel-name').textContent=currentFish.name;
  document.getElementById('info').textContent='hold mouse · keep indicator in the green zone!';
  tone(330,.1,.07);
}

function catchFish(){
  state='caught';
  recordCatch(currentFish);
  buildBaitBar();

  // negative fish triggers sky mode
  if(currentFish.isNegative){
    skyMode=true;skyCaught=0;gravityFlipT=60;
    tone(80,.8,.1,'sine');tone(160,.6,.08,'sine',ac.currentTime+.2);
    burst(bobberX,bobberY,'#ffffff',30);
    showMsg('gravity inverted · cast into the sky!',3000);
    document.getElementById('spot-lbl').textContent='↑ sky fishing ↑';
    setTimeout(retract,1200);return;
  }

  // sky fish
  if(skyMode){
    skyCaught++;
    totalCaught++;totalPts+=currentFish.pts;
    document.getElementById('fish-lbl').textContent=`caught: ${totalCaught} (☁ ${skyCaught}/${SKY_LIMIT})`;
    document.getElementById('pts-lbl').textContent=`score: ${totalPts}`;
    tone(523+skyCaught*40,.3,.08);
    burst(bobberX,bobberY,currentFish.col,20);addRipple(bobberX,bobberY);addLog(currentFish);
    showMsg(`${currentFish.name}!`,2200);
    setTimeout(()=>showMsg(currentFish.desc,1800),600);
    if(skyCaught>=SKY_LIMIT){
      setTimeout(()=>{
        skyMode=false;gravityFlipT=60;
        showMsg('gravity restored · welcome back',2500);
        document.getElementById('spot-lbl').textContent=SPOTS[spotIdx].name;
        document.getElementById('fish-lbl').textContent=`caught: ${totalCaught}`;
        tone(220,.6,.08);tone(110,.8,.06,'sine',ac.currentTime+.2);
      },1000);
    }
    setTimeout(retract,1500);return;
  }

  // normal fish
  totalCaught++;totalPts+=currentFish.pts;
  document.getElementById('fish-lbl').textContent=`caught: ${totalCaught}`;
  document.getElementById('pts-lbl').textContent=`score: ${totalPts}`;
  tone(523,.3,.08);tone(659,.3,.06,null,ac.currentTime+.12);tone(784,.5,.07,null,ac.currentTime+.24);
  burst(bobberX,bobberY,currentFish.col,20);
  addRipple(bobberX,bobberY);
  addLog(currentFish);
  showMsg(`${currentFish.name}!`,2200);
  setTimeout(()=>showMsg(currentFish.desc,1800),600);
  const nextSpot=SPOTS.find(s=>s.u===totalCaught);
  if(nextSpot){setTimeout(()=>{showMsg(`📍 unlocked: ${nextSpot.name}`,3000);buildSpotBar();},1000);}
  setTimeout(retract,1500);
}

function breakLine(){
  state='idle';currentFish=null;reelPct=0;tension=0;fishStamina=1;
  document.getElementById('reel-wrap').style.display='none';
  noise(.3,.18,200,.5);
  showMsg('line broke! 😤',2000);
  document.getElementById('info').textContent='the line snapped — cast again';
  burst(bobberX,bobberY,'#fff',12);
}

// ══════════════════════════════════════════════════════
// UPDATE
// ══════════════════════════════════════════════════════
function update(){
  frame++;windT+=.014;

  weatherTimer--;
  if(weatherTimer<=0){changeWeather();buildRain();}

  // floaters
  for(const f of floaters){f.x+=f.vx;f.w+=.018;if(f.x<-10)f.x=W+10;if(f.x>W+10)f.x=-10;}
  // ambient fish
  for(const f of ambFish){f.x+=f.vx;f.ph+=.018;if(f.x>W+30)f.x=-30;}
  // ripples
  ripples.forEach(r=>{r.r+=.7;r.life-=.013;});ripples=ripples.filter(r=>r.life>0);
  // particles
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.07;p.vx*=.94;p.life-=.024;});particles=particles.filter(p=>p.life>0);
  // rain
  const we=WEATHER_EFFECTS[weather];
  for(const r of rainDrops){r.y+=r.speed+we.windStr*2;r.x+=we.windStr*.8;if(r.y>H){r.y=0;r.x=Math.random()*W;}}

  if(state==='casting') castProg=Math.min(1,castProg+.085);

  if(state==='waiting'){
    bobAmt=Math.sin(frame*.04)*2+Math.sin(frame*.07)*.8;
    waitTimer--;
    if(waitTimer<=0){
      state='biting';biteTimer=Math.max(90,180-currentFish.fight*60);
      tone(440,.08,.1);tone(550,.06,.07,null,ac.currentTime+.1);
      addRipple(bobberX,bobberY);
      document.getElementById('info').textContent='🎣 BITE! click now!';
    }
  }

  if(state==='biting'){
    bobAmt=Math.sin(frame*.22)*7+Math.sin(frame*.38)*4;
    biteFlash=Math.sin(frame*.18)>.2?1:0;

    biteTimer--;
    if(biteTimer<=0){addRipple(bobberX,bobberY);retract();showMsg('it got away…',1800);document.getElementById('info').textContent='missed — cast again';}
  }

  if(state==='reeling'){
    bobAmt=Math.sin(frame*.3)*4+Math.sin(frame*.5)*2;

    // holding mouse fills bar; fish randomly slips it back
    if(mouseDown){
      const rate=(currentFish.reelMult||1)*(.006/(currentFish.size||.5));
      reelPct=Math.min(1,reelPct+rate);
      if(frame%6===0) tone(800+reelPct*400,.03,.025,'square');
    } else {
      reelPct=Math.max(0,reelPct-currentFish.slip*.004);
    }

    // indicator just shows hold vs not — cosmetic zone wiggle
    if(mouseDown) reelIndicator=Math.min(1,reelIndicator+.04);
    else reelIndicator=Math.max(0,reelIndicator-currentFish.fight*.03+Math.sin(frame*.18)*currentFish.fight*.025);

    const inZone=reelIndicator>=zoneMin&&reelIndicator<=zoneMax;
    document.getElementById('reel-fill').style.width=`${reelPct*100}%`;
    document.getElementById('reel-fill').style.background=mouseDown?'linear-gradient(90deg,#4f8,#8ff)':'linear-gradient(90deg,#f84,#f44)';
    document.getElementById('reel-pct').textContent=`${(reelPct*100).toFixed(0)}%`;
    document.getElementById('tension-bg').style.display='none';

    if(reelPct>=1) catchFish();
  }
}

// ══════════════════════════════════════════════════════
// DRAW
// ══════════════════════════════════════════════════════
function render(){
  const spot=SPOTS[spotIdx];
  const t=Date.now()/1000;
  const we=WEATHER_EFFECTS[weather];

  // sky
  const sk=ctx.createLinearGradient(0,0,0,WATER_Y);
  sk.addColorStop(0,spot.skyT);sk.addColorStop(1,spot.skyB);
  ctx.fillStyle=sk;ctx.fillRect(0,0,W,WATER_Y);

  // stars
  if(spot.stars){
    for(let i=0;i<120;i++){
      const sx=(i*173)%W,sy=(i*97)%(WATER_Y*.9);
      ctx.globalAlpha=.2+Math.sin(t+i)*.15;
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(sx,sy,i%7===0?1.2:.5,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
  }

  // celestial body
  if(spot.timeOfDay==='morning'||spot.timeOfDay==='day'){
    const sg=ctx.createRadialGradient(W*.15,WATER_Y*.25,0,W*.15,WATER_Y*.25,45);
    sg.addColorStop(0,'rgba(255,240,180,.9)');sg.addColorStop(.5,'rgba(255,200,80,.3)');sg.addColorStop(1,'transparent');
    ctx.fillStyle=sg;ctx.fillRect(0,0,W,WATER_Y);
    ctx.fillStyle='rgba(255,230,150,.85)';ctx.beginPath();ctx.arc(W*.15,WATER_Y*.25,22,0,Math.PI*2);ctx.fill();
  } else if(spot.timeOfDay==='evening'){
    const sg=ctx.createRadialGradient(W*.7,WATER_Y*.2,0,W*.7,WATER_Y*.2,55);
    sg.addColorStop(0,'rgba(255,160,40,.9)');sg.addColorStop(.5,'rgba(255,80,20,.35)');sg.addColorStop(1,'transparent');
    ctx.fillStyle=sg;ctx.fillRect(0,0,W,WATER_Y);
    ctx.fillStyle='rgba(255,140,30,.85)';ctx.beginPath();ctx.arc(W*.7,WATER_Y*.2,25,0,Math.PI*2);ctx.fill();
  } else if(spot.timeOfDay==='night'||spot.timeOfDay==='void'){
    ctx.fillStyle='rgba(200,210,185,.7)';ctx.beginPath();ctx.arc(W*.8,WATER_Y*.15,18,0,Math.PI*2);ctx.fill();
  }

  // cave crystal ceiling
  if(spot.cave){
    for(let i=0;i<20;i++){
      const cx=(i*137)%W,len=20+((i*97)%40);
      const hue=200+i*8;
      ctx.fillStyle=`hsl(${hue},80%,${40+Math.sin(t+i)*10}%)`;
      ctx.beginPath();ctx.moveTo(cx,0);ctx.lineTo(cx-6,len);ctx.lineTo(cx+6,len);ctx.closePath();ctx.fill();
      const cg=ctx.createRadialGradient(cx,len,0,cx,len,20);
      cg.addColorStop(0,`hsla(${hue},90%,70%,.25)`);cg.addColorStop(1,'transparent');
      ctx.fillStyle=cg;ctx.beginPath();ctx.arc(cx,len,20,0,Math.PI*2);ctx.fill();
    }
  }

  // treeline / horizon
  if(!spot.abyss){
    ctx.fillStyle=spot.cave?'rgba(15,5,25,.9)':`rgba(${spot.timeOfDay==='evening'?'25,8,4':'5,14,8'},.9)`;
    ctx.beginPath();ctx.moveTo(0,WATER_Y);
    for(let x=0;x<=W;x+=12){
      const h=spot.cave?8:30+Math.sin(x*.02)*18+Math.sin(x*.007+2)*32+Math.sin(x*.003)*15;
      ctx.lineTo(x,WATER_Y-h);
    }
    ctx.lineTo(W,WATER_Y);ctx.closePath();ctx.fill();
  }

  // water
  const wg=ctx.createLinearGradient(0,WATER_Y,0,H);
  wg.addColorStop(0,spot.watT);wg.addColorStop(1,spot.watB);
  ctx.fillStyle=wg;ctx.fillRect(0,WATER_Y,W,H-WATER_Y);

  // water shimmer
  for(let i=0;i<5;i++){
    const wy=WATER_Y+15+i*20;
    ctx.strokeStyle=`rgba(180,220,255,${.025+Math.sin(t*.4+i)*.015})`;
    ctx.lineWidth=1;ctx.beginPath();
    for(let x=0;x<=W;x+=8) ctx.lineTo(x,wy+Math.sin((x+t*25+i*60)*.022)*(2.5-i*.3));
    ctx.stroke();
  }

  // underwater ambient fish
  for(const f of ambFish){
    ctx.save();ctx.globalAlpha=f.alpha+Math.sin(f.ph)*.02;
    ctx.fillStyle=`hsl(${f.hue},55%,50%)`;
    ctx.translate(f.x,f.y+Math.sin(f.ph)*3);ctx.scale(1,1);
    ctx.beginPath();ctx.ellipse(0,0,f.size,f.size*.45,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=`hsl(${f.hue},35%,35%)`;
    ctx.beginPath();ctx.moveTo(-f.size,0);ctx.lineTo(-f.size-f.size*.55,-f.size*.4);ctx.lineTo(-f.size-f.size*.55,f.size*.4);ctx.closePath();ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha=1;

  // lily pads (lily pond spot)
  if(spot.id==='pond'){
    for(let i=0;i<8;i++){
      const lx=(i*173+50)%W,ly=WATER_Y+10+((i*97)%40);
      ctx.fillStyle='rgba(30,80,30,.7)';
      ctx.beginPath();ctx.ellipse(lx,ly,18+i%4*5,7,0,0,Math.PI*2);ctx.fill();
      if(i%3===0){ctx.fillStyle='rgba(255,180,200,.6)';ctx.beginPath();ctx.arc(lx,ly-5,5,0,Math.PI*2);ctx.fill();}
    }
  }

  // bioluminescence (abyss)
  if(spot.abyss){
    for(let i=0;i<30;i++){
      const bx=(i*137+t*8)%W,by=WATER_Y+50+(i*97)%(H*.5);
      const bg=ctx.createRadialGradient(bx,by,0,bx,by,12);
      bg.addColorStop(0,`hsla(${200+i*8},100%,70%,${.08+Math.sin(t*.5+i)*.05})`);
      bg.addColorStop(1,'transparent');
      ctx.fillStyle=bg;ctx.beginPath();ctx.arc(bx,by,12,0,Math.PI*2);ctx.fill();
    }
  }

  // ripples
  for(const r of ripples){
    ctx.save();ctx.globalAlpha=r.life*.3;
    ctx.strokeStyle=`rgba(180,220,255,${r.life*.45})`;ctx.lineWidth=1+r.life;
    ctx.beginPath();ctx.ellipse(r.x,r.y,r.r,r.r*.32,0,0,Math.PI*2);ctx.stroke();
    ctx.restore();
  }

  // floaters
  for(const f of floaters){
    ctx.save();ctx.globalAlpha=f.alpha;ctx.fillStyle='rgba(100,160,80,.55)';
    ctx.translate(f.x,f.y+Math.sin(f.w)*3);ctx.rotate(f.w*.4);
    ctx.beginPath();ctx.ellipse(0,0,f.size,f.size*.45,0,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }

  // rain
  if(we.rainAlpha>0){
    ctx.save();ctx.globalAlpha=we.rainAlpha*.5;ctx.strokeStyle='rgba(180,210,240,.55)';ctx.lineWidth=1;
    for(const r of rainDrops){
      ctx.beginPath();ctx.moveTo(r.x,r.y);ctx.lineTo(r.x+we.windStr*2,r.y+r.len);ctx.stroke();
      if(r.y>WATER_Y&&r.y<WATER_Y+r.len) addRipple(r.x,WATER_Y);
    }
    ctx.restore();
  }

  // fog
  const fogA=(we.fogAlpha+(spot.fog||0))*.5;
  if(fogA>0){
    for(let i=0;i<4;i++){
      const fx2=(i*W*.28+frame*.15+i*60)%(W*1.2)-W*.1;
      const fog=ctx.createRadialGradient(fx2,WATER_Y+30,0,fx2,WATER_Y+30,W*.22);
      fog.addColorStop(0,`rgba(180,200,210,${fogA})`);fog.addColorStop(1,'transparent');
      ctx.fillStyle=fog;ctx.beginPath();ctx.ellipse(fx2,WATER_Y+30,W*.22,60,0,0,Math.PI*2);ctx.fill();
    }
  }

  // particles
  for(const p of particles){
    ctx.save();ctx.globalAlpha=p.life;ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }

  // sky ambient fish
  if(skyMode){
    for(const f of skyAmbFish){
      f.x+=f.vx;f.ph+=.015;if(f.x>W+30)f.x=-30;if(f.x<-30)f.x=W+30;
      ctx.save();ctx.globalAlpha=f.alpha+Math.sin(f.ph)*.02;
      ctx.fillStyle=`hsl(${f.hue},60%,80%)`;
      ctx.translate(f.x,f.y+Math.sin(f.ph)*5);ctx.scale(f.vx>0?1:-1,1);
      ctx.beginPath();ctx.ellipse(0,0,f.size,f.size*.4,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=`hsl(${f.hue},40%,70%)`;
      ctx.beginPath();ctx.moveTo(-f.size,0);ctx.lineTo(-f.size-f.size*.5,-f.size*.35);ctx.lineTo(-f.size-f.size*.5,f.size*.35);ctx.closePath();ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha=1;
    // drifting clouds
    for(const cl of clouds){
      cl.x+=cl.speed;if(cl.x>W+cl.w)cl.x=-cl.w;
      ctx.save();ctx.globalAlpha=cl.alpha;ctx.fillStyle='#ffffff';
      ctx.beginPath();ctx.ellipse(cl.x,cl.y,cl.w,cl.h,0,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.ellipse(cl.x-cl.w*.35,cl.y,cl.w*.6,cl.h*.7,0,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.ellipse(cl.x+cl.w*.35,cl.y,cl.w*.55,cl.h*.65,0,0,Math.PI*2);ctx.fill();
      ctx.restore();
    }
    // sky fishing line goes UP from rod tip
    if(state!=='idle'&&state!=='casting'){
      ctx.strokeStyle='rgba(210,225,240,.38)';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(rodTipX,rodTipY);
      const mx2=(rodTipX+bobberX)*.5,my2=Math.max(rodTipY,bobberY)+50;
      ctx.quadraticCurveTo(mx2,my2,bobberX,bobberY+bobAmt);ctx.stroke();
      // sky bobber (upside down)
      const by2=bobberY+bobAmt;
      if(state==='biting'&&biteFlash){
        const bg=ctx.createRadialGradient(bobberX,by2,0,bobberX,by2,28);
        bg.addColorStop(0,'rgba(255,255,200,.5)');bg.addColorStop(1,'transparent');
        ctx.fillStyle=bg;ctx.beginPath();ctx.arc(bobberX,by2,28,0,Math.PI*2);ctx.fill();
      }
      ctx.save();ctx.translate(bobberX,by2);ctx.scale(1,-1); // flip upside down
      ctx.fillStyle='rgba(240,240,240,.95)';ctx.beginPath();ctx.arc(0,0,7,Math.PI,0);ctx.fill();
      ctx.fillStyle='rgba(220,30,30,.95)';ctx.beginPath();ctx.arc(0,0,7,0,Math.PI);ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(0,0,7,0,Math.PI*2);ctx.stroke();
      ctx.restore();
    }
  }

  // gravity flip flash
  if(gravityFlipT>0){
    gravityFlipT--;
    ctx.fillStyle=`rgba(255,255,255,${(gravityFlipT/60)*.4})`;
    ctx.fillRect(0,0,W,H);
  }

  // sky mode HUD
  if(skyMode){
    ctx.save();
    ctx.fillStyle='rgba(255,255,255,.08)';ctx.fillRect(0,0,W,WATER_Y);
    ctx.fillStyle='rgba(200,230,255,.5)';ctx.font='.6rem Georgia';ctx.textAlign='center';
    ctx.fillText(`☁ sky fish caught: ${skyCaught} / ${SKY_LIMIT} · gravity returns at ${SKY_LIMIT}`,W/2,20);
    ctx.textAlign='left';ctx.restore();
  }
  // normal water bobber
  if(!skyMode&&state!=='idle'&&state!=='casting'){
    // line
    ctx.strokeStyle='rgba(210,225,240,.38)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(rodTipX,rodTipY);
    const mx2=(rodTipX+bobberX)*.5,my2=Math.min(rodTipY,bobberY)-50;
    ctx.quadraticCurveTo(mx2,my2,bobberX,bobberY+bobAmt);ctx.stroke();
    // water entry line
    ctx.strokeStyle='rgba(150,190,220,.2)';ctx.lineWidth=.8;
    ctx.beginPath();ctx.moveTo(bobberX,bobberY+bobAmt);ctx.lineTo(bobberX,WATER_Y+30);ctx.stroke();

    const by=bobberY+bobAmt;
    // bite glow
    if(state==='biting'&&biteFlash){
      const bg=ctx.createRadialGradient(bobberX,by,0,bobberX,by,28);
      bg.addColorStop(0,'rgba(255,220,50,.4)');bg.addColorStop(1,'transparent');
      ctx.fillStyle=bg;ctx.beginPath();ctx.arc(bobberX,by,28,0,Math.PI*2);ctx.fill();
    }
    // reel indicator (reeling state)
    if(state==='reeling'){
      const ind=bobberX-20+reelIndicator*40;
      ctx.fillStyle=reelIndicator>=zoneMin&&reelIndicator<=zoneMax?'rgba(80,255,120,.7)':'rgba(255,80,60,.7)';
      ctx.beginPath();ctx.arc(ind,by-18,4,0,Math.PI*2);ctx.fill();
    }
    // bobber
    ctx.fillStyle='rgba(240,240,240,.95)';ctx.beginPath();ctx.arc(bobberX,by,7,Math.PI,0);ctx.fill();
    ctx.fillStyle='rgba(220,30,30,.95)';ctx.beginPath();ctx.arc(bobberX,by,7,0,Math.PI);ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(bobberX,by,7,0,Math.PI*2);ctx.stroke();
    ctx.strokeStyle='rgba(220,220,220,.5)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(bobberX,by-7);ctx.lineTo(bobberX,by-12);ctx.stroke();
  }

  // casting arc
  if(state==='casting'){
    const px=rodTipX+(castTX-rodTipX)*castProg;
    const py=rodTipY+(castTY-rodTipY)*castProg-Math.sin(castProg*Math.PI)*90;
    ctx.fillStyle='rgba(200,40,40,.85)';ctx.beginPath();ctx.arc(px,py,5,0,Math.PI*2);ctx.fill();
  }

  // caught fish display
  if(state==='caught'&&currentFish){
    ctx.save();ctx.font=`${32+Math.sin(t*8)*3}px serif`;ctx.textAlign='center';
    ctx.globalAlpha=.9;ctx.fillText(currentFish.emoji||currentFish.name,bobberX,bobberY-36);
    ctx.font='.65rem Georgia';ctx.fillStyle=currentFish.col;ctx.globalAlpha=.85;
    ctx.fillText(currentFish.name,bobberX,bobberY-10);ctx.restore();
  }

  // rod
  ctx.save();
  ctx.fillStyle='#7a4a18';ctx.beginPath();ctx.roundRect(rodTipX-8,H*.33,14,52,4);ctx.fill();
  ctx.fillStyle='#5a3a10';ctx.beginPath();ctx.roundRect(rodTipX-7,H*.33+10,12,8,2);ctx.fill();
  ctx.beginPath();ctx.roundRect(rodTipX-7,H*.33+26,12,8,2);ctx.fill();
  ctx.strokeStyle='#c09040';ctx.lineWidth=3.5;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(rodTipX,H*.33+52);ctx.quadraticCurveTo(rodTipX+4,H*.28,rodTipX+22,H*.26);ctx.stroke();
  ctx.strokeStyle='#e8c060';ctx.lineWidth=1.8;
  ctx.beginPath();ctx.moveTo(rodTipX,H*.33+52);ctx.quadraticCurveTo(rodTipX+4,H*.28,rodTipX+22,H*.26);ctx.stroke();
  rodTipX=rodTipX*.999+W*.855*.001;rodTipY=rodTipY*.999+(WATER_Y-22)*.001;
  ctx.restore();

  // cursor
  ctx.fillStyle='rgba(200,230,255,.6)';ctx.strokeStyle='rgba(100,170,220,.4)';ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(mx,my,4,0,Math.PI*2);ctx.fill();ctx.stroke();
  if(state==='idle'){
    ctx.strokeStyle='rgba(200,230,255,.3)';
    ctx.beginPath();ctx.moveTo(mx-10,my);ctx.lineTo(mx+10,my);ctx.stroke();
    ctx.beginPath();ctx.moveTo(mx,my-10);ctx.lineTo(mx,my+10);ctx.stroke();
  }
}

// ══════════════════════════════════════════════════════
// LOOP
// ══════════════════════════════════════════════════════
buildRain();
function loop(){update();render();requestAnimationFrame(loop);}
loop();
</script>
