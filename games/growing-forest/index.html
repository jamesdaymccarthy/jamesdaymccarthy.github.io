            var uy = ny;
            if (uy > 0) { ux = -ux; uy = -uy; }
            var so = w * 0.42;
            stroke(250, 252, 255, 235 * sn);
            strokeWeight(Math.max(1.2, w * 0.38));
            line(p1.x + ux * so, p1.y + uy * so, x2 + ux * so, y2 + uy * so);
        }

        ex = x2;
        ey = y2;
        ew = w;
    }

    if (g < 1) {
        noStroke();
        fill(tipC);
        var bs = Math.max(2.5 * S, ew * 0.9);
        ellipse(ex, ey, bs, bs);
    }

    return g;
};

var drawBark = function(b, thick, g) {
    var rough = clamp01((t - b.birth - SP.roughStart) / 1500);
    if (rough <= 0) {
        return;
    }

    var mc = SP.markColor;
    var across = SP.barkStyle === "lenticel";
    strokeWeight(Math.max(1, (across ? 1.5 : 1.2) * S));

    for (var i = 0; i < b.bark.length; i++) {
        var f = b.bark[i];
        stroke(mc[0], mc[1], mc[2], 210 * rough * f.dark);

        if (across) {
            if (f.s > g) { continue; }
            var p = pointAt(b, f.s);
            var w = lerp(b.w0, b.w1, f.s) * thick;
            line(
                p.x + p.nx * f.off * w, p.y + p.ny * f.off * w,
                p.x + p.nx * (f.off + f.l) * w, p.y + p.ny * (f.off + f.l) * w
            );
        } else {
            if (f.s + f.l > g) { continue; }
            var p1 = pointAt(b, f.s);
            var p2 = pointAt(b, f.s + f.l);
            var w1 = lerp(b.w0, b.w1, f.s) * thick;
            var w2 = lerp(b.w0, b.w1, f.s + f.l) * thick;
            line(
                p1.x + p1.nx * f.off * w1, p1.y + p1.ny * f.off * w1,
                p2.x + p2.nx * f.off * w2, p2.y + p2.ny * f.off * w2
            );
        }
    }

    noStroke();
    var ka = SP.knotA;
    var kb = SP.knotB;
    for (var k = 0; k < b.knots.length; k++) {
        var kn = b.knots[k];
        if (kn.s > g) { continue; }
        var kp = pointAt(b, kn.s);
        var kw = lerp(b.w0, b.w1, kn.s) * thick;
        var cx = kp.x + kp.nx * kn.off * kw;
        var cy = kp.y + kp.ny * kn.off * kw;
        fill(ka[0], ka[1], ka[2], 220 * rough);
        ellipse(cx, cy, kw * kn.size, kw * kn.size * 1.4);
        fill(kb[0], kb[1], kb[2], 220 * rough);
        ellipse(cx, cy, kw * kn.size * 0.5, kw * kn.size * 0.7);
    }
};

var drawFlare = function(barkC, thick) {
    if (t < curStart + 5) {
        return;
    }
    var tw = branches[0].w0 * thick;
    var fh = tw * 1.1;

    noStroke();
    fill(barkC);
    beginShape();
    for (var k = 0; k <= 8; k++) {
        var u = k / 8;
        vertex(curX - (tw * 0.5 + tw * 0.75 * Math.pow(u, 2.5)), GROUND - fh + fh * u + u * 3 * S);
    }
    for (var j = 8; j >= 0; j--) {
        var v = j / 8;
        vertex(curX + (tw * 0.5 + tw * 0.75 * Math.pow(v, 2.5)), GROUND - fh + fh * v + v * 3 * S);
    }
    endShape(CLOSE);
};

var drawRoots = function() {
    for (var i = 0; i < roots.length; i++) {
        var r = roots[i];
        var thick = 0.35 + 0.65 * ease((t - r.birth) / (YEAR * 0.9));
        drawLimb(r, rootBase, rootHi, rootTip, null, thick, 0);
    }
};

var drawTree = function(sn) {
    var age = 1 - curVigor;
    var barkC = age > 0 ? lerpColor(SP.bark, deadGray, age * 0.8) : SP.bark;
    var hiC = age > 0 ? lerpColor(SP.barkHi, deadGrayHi, age * 0.8) : SP.barkHi;
    if (curDust > 0) {
        barkC = lerpColor(SP.bark, dustRed, curDust);
        hiC = lerpColor(SP.barkHi, dustRed, curDust);
    }

    if (curDust < branches[0].tdust) {
        drawFlare(barkC, 0.3 + 0.7 * ease((t - curStart) / (YEAR * 0.9)));
    }

    var grown = 0;
    for (var i = 0; i < branches.length; i++) {
        var b = branches[i];

        if (curDust > 0) {
            var th = b.depth === 0 ? b.tdust : b.decay * 0.85;
            if (curDust > th) {
                if (!b.dropped) {
                    b.dropped = true;
                    var nd = 2 + Math.floor(b.len / (12 * S));
                    for (var d = 0; d < nd; d++) {
                        var dp = pointAt(b, random(1));
                        spawnDust(toWX(dp.x), toWY(dp.y));
                    }
                }
                continue;
            }
        } else if (curDead > 0 && curDead > b.decay) {
            if (!b.dropped) {
                b.dropped = true;
                if (b.depth <= 3 && t > b.birth + b.dur) {
                    spawnStick(b);
                }
            }
            continue;
        }

        var thick = 0.3 + 0.7 * ease((t - b.birth) / (YEAR * 0.9));
        var g = drawLimb(b, barkC, hiC, budColor, SP.twig, thick, sn);
        if (g >= 1) { grown++; }
        if (b.bark.length > 0 && g > 0) {
            drawBark(b, thick, g);
        }
    }
    return grown;
};

var drawLeaves = function(st, year, wind, sn) {
    if (curVigor <= 0.01) {
        return 0;
    }

    noStroke();
    var visible = 0;
    var ever = SP.evergreen;
    var shift = SP.turnShift;
    var brown = 1 - curVigor;

    var fm = SP.foliageMass;
    if (fm) {
        for (var mi = 0; mi < branches.length; mi++) {
            var mb = branches[mi];
            if (mb.depth < 2) { continue; }
            var mg = clamp01((t - mb.birth) / mb.dur);
            var mAge = ease((t - mb.birth - mb.dur * 0.3) / 240) * curVigor;
            if (mg <= 0 || mAge <= 0) { continue; }

            var mn = mb.pts.length - 1;
            var mcut = mg * mn;
            var mh = clamp01((GROUND - mb.pts[0].y) / (H * 0.6));
            var mx = wind * 1.5 * mh * S;
            var mShade = (mb.depth - 2) * 7;

            stroke(lerp(fm[0] + mShade - sn * 6, 120, brown),
                   lerp(fm[1] + mShade - sn * 10, 85, brown),
                   lerp(fm[2] + mShade - sn * 6, 45, brown));
            strokeWeight(SP.massW * S * mAge * (mb.depth === 2 ? 1 : 0.8));
            for (var mj = 0; mj < mn && mj < mcut; mj++) {
                var q1 = mb.pts[mj];
                var q2 = mb.pts[mj + 1];
                var mk = Math.min(1, mcut - mj);
                line(q1.x + mx, q1.y,
                     q1.x + (q2.x - q1.x) * mk + mx, q1.y + (q2.y - q1.y) * mk);
            }
        }
        noStroke();
    }

    for (var i = 0; i < leaves.length; i++) {
        var L = leaves[i];
        if (L.keep > curVigor) { continue; }

        var ageS = clamp01((t - L.birth) / 90);
        if (ageS <= 0) { continue; }

        var lr = L.gr;
        var lg = L.gg;
        var lb = L.gb;
        var sc = ageS;

        if (ever) {
            lr = lerp(lr - sn * 8, 150, brown);
            lg = lerp(lg - sn * 12, 105, brown);
            lb = lerp(lb, 55, brown);
        } else {
            var m = ease((st - (0.47 + shift + L.turn * 0.1)) / 0.08);
            lr += (L.ar - lr) * m;
            lg += (L.ag - lg) * m;
            lb += (L.ab - lb) * m;

            var fallAt = 0.6 + shift + L.turn * 0.14;
            if (st >= fallAt) {
                if (L.fallYear !== year) {
                    L.fallYear = year;
                    // Only show it falling if it fell just now (not when scrolling
                    // to a tree that's been off-screen)
                    if (ageS >= 1 && st - fallAt < 0.03 && falling.length < 650) {
                        falling.push({
                            type: 0,
                            x: toWX(L.x), y: toWY(L.y),
                            vx: random(-0.3, 0.3), vy: random(0.35, 0.7) * S,
                            rot: L.rot, spin: random(-0.06, 0.06),
                            size: L.size * curScale, wid: L.wid * curScale,
                            r: lr, g: lg, b: lb,
                            phase: random(TWO_PI)
                        });
                    }
                }
                continue;
            }

            var budAt = 0.02 + L.turn * 0.06;
            sc = Math.min(ageS, ease((st - budAt) / 0.07));

            var young = 1 - ease((st - budAt - 0.05) / 0.1);
            lr += young * 30;
            lg += young * 25;
        }

        if (sc <= 0.02) { continue; }
        visible++;

        var h = clamp01((GROUND - L.y) / (H * 0.6));
        var x = L.x + (wind * 2.2 + Math.sin(t * 0.09 + L.phase) * 0.7) * h * S;
        var y = L.y + Math.sin(t * 0.07 + L.phase) * 0.4 * h * S;

        for (var k = 0; k < L.polys.length; k++) {
            var pp = L.polys[k];
            var sh = L.shades[k];
            fill(lr + sh, lg + sh, lb + sh * 0.5);
            if (pp.length === 6) {
                triangle(x + pp[0] * sc, y + pp[1] * sc,
                         x + pp[2] * sc, y + pp[3] * sc,
                         x + pp[4] * sc, y + pp[5] * sc);
            } else {
                quad(x + pp[0] * sc, y + pp[1] * sc,
                     x + pp[2] * sc, y + pp[3] * sc,
                     x + pp[4] * sc, y + pp[5] * sc,
                     x + pp[6] * sc, y + pp[7] * sc);
            }
        }

        if (ever && sn > 0.05) {
            fill(250, 252, 255, 210 * sn);
            ellipse(x + L.cx, y + L.cy - 1 * S, L.size * 0.7, L.size * 0.35);
        }
    }
    return visible;
};

var drawBlossoms = function(st, year) {
    var bl = SP.blossom;
    if (!bl || st > 0.24 || curMature < 0.6 || curVigor < 0.5) {
        return;
    }
    noStroke();
    for (var i = 0; i < blossoms.length; i++) {
        var B = blossoms[i];
        if (t < B.birth) { continue; }

        if (st >= B.drop) {
            if (B.dropYear !== year) {
                B.dropYear = year;
                if (st - B.drop < 0.03) {
                    for (var p = 0; p < 2 && falling.length < 650; p++) {
                        falling.push({
                            type: 1,
                            x: toWX(B.x), y: toWY(B.y),
                            vx: random(-0.3, 0.3), vy: random(0.25, 0.5) * S,
                            rot: 0, spin: 0,
                            c: bl.col,
                            phase: random(TWO_PI)
                        });
                    }
                }
            }
            continue;
        }

        var sc = ease(st / 0.04) * clamp01((t - B.birth) / 60);
        if (sc <= 0.02) { continue; }
        var r = B.r * sc;

        fill(bl.col[0] + (255 - bl.col[0]) * B.pale * 0.5,
             bl.col[1] + (255 - bl.col[1]) * B.pale * 0.5,
             bl.col[2] + (255 - bl.col[2]) * B.pale * 0.5);
        for (var k = 0; k < 5; k++) {
            var a = B.phase + k * TWO_PI / 5;
            ellipse(B.x + Math.cos(a) * r * 0.7, B.y + Math.sin(a) * r * 0.7, r * 1.1, r * 1.1);
        }
        fill(bl.center[0], bl.center[1], bl.center[2]);
        ellipse(B.x, B.y, r * 0.6, r * 0.6);
    }
};

var drawHiveShape = function(x, y, k) {
    noStroke();
    var widths = [9, 13, 14, 12, 8];
    for (var i = 0; i < widths.length; i++) {
        fill(215 - i * 10, 165 - i * 10, 70 - i * 5);
        ellipse(x, y + (3 + i * 3.6) * k, widths[i] * k, 5.5 * k);
    }
    fill(60, 40, 20);
    ellipse(x, y + 12 * k, 3.5 * k, 3 * k);
};

var drawHive = function(h) {
    var k = 1.3 * S;
    var sh = Math.sin(t * 0.9) * h.shake * 2 * S;
    stroke(80, 60, 30);
    strokeWeight(Math.max(1, 1.2 * S));
    line(h.x, h.y - 2 * S, h.x + sh, h.y + 2 * k);
    drawHiveShape(h.x + sh, h.y, k);
};

var drawFoodShape = function(kind, x, y, c, k, rot) {
    noStroke();
    if (kind === "acorn") {
        fillArr(c);
        ellipse(x, y, 3.5 * k, 4.5 * k);
        fill(c[0] * 0.6, c[1] * 0.6, c[2] * 0.6);
        ellipse(x, y - 1.8 * k, 4 * k, 2.2 * k);
    } else if (kind === "cherry") {
        fillArr(c);
        ellipse(x, y, 4 * k, 4 * k);
        fill(255, 255, 255, 110);
        ellipse(x - 0.8 * k, y - 0.8 * k, 1.2 * k, 1.2 * k);
    } else if (kind === "pit") {
        fillArr(c);
        ellipse(x, y, 2.5 * k, 3 * k);
    } else if (kind === "cone") {
        fillArr(c);
        ellipse(x, y, 8 * k, 4.5 * k);
        stroke(c[0] * 0.6, c[1] * 0.6, c[2] * 0.6);
        strokeWeight(1);
        line(x - 1.5 * k, y - 2 * k, x - 1.5 * k, y + 2 * k);
        line(x + 1.5 * k, y - 2 * k, x + 1.5 * k, y + 2 * k);
        noStroke();
    } else if (kind === "samara") {
        var w = Math.cos(rot);
        fillArr(c);
        ellipse(x - 2.5 * k * w, y, 5 * k * Math.abs(w) + 1, 2 * k);
        ellipse(x + 2.5 * k * w, y, 5 * k * Math.abs(w) + 1, 2 * k);
        fill(c[0] * 0.6, c[1] * 0.6, c[2] * 0.5);
        ellipse(x, y, 2 * k, 2 * k);
    } else if (kind === "catkin") {
        fill(245, 243, 235, 230);
        ellipse(x, y, 5 * k, 4 * k);
        fill(120, 100, 70);
        ellipse(x, y + 0.6 * k, 1.5 * k, 1.5 * k);
    } else if (kind === "orb") {
        fill(c[0], c[1], c[2], 70);
        ellipse(x, y, 9 * k, 9 * k);
        fillArr(c);
        ellipse(x, y, 5 * k, 5 * k);
        fill(255, 255, 255, 140);
        ellipse(x - 1 * k, y - 1 * k, 1.6 * k, 1.6 * k);
    } else if (kind === "dust") {
        fill(220, 40, 50, 60);
        ellipse(x, y, 5 * k, 3 * k);
        fillArr(c);
        ellipse(x, y, 2 * k, 1.5 * k);
    }
};

var drawFruits = function(st, wind, year) {
    var F = SP.fruit;
    if (!F || curMature < 0.6 || curVigor < 0.5) {
        return;
    }

    var vis, m;
    if (F.always) {
        vis = 1;
        m = 1;
    } else {
        vis = ease((st - F.from) / 0.04) * (1 - ease((st - F.to) / 0.03));
        m = ease((st - F.from - 0.04) / Math.max(0.01, F.to - F.from - 0.08));
    }
    if (vis <= 0.02) {
        return;
    }

    var cr = lerp(F.unripe[0], F.color[0], m);
    var cg = lerp(F.unripe[1], F.color[1], m);
    var cb = lerp(F.unripe[2], F.color[2], m);

    for (var i = 0; i < fruits.length; i++) {
        var fr = fruits[i];
        if (fr.eatenYear === year) { continue; }

        var sc = vis * clamp01((t - fr.birth) / 150);
        if (sc < 0.05) { continue; }

        var h = clamp01((GROUND - fr.y) / (H * 0.6));
        var hx = fr.x + wind * 3 * h * S;
        var hy = fr.y + F.hang * S;
        var sz = F.size * S * sc * fr.s;

        if (F.food && fr.drops && st >= fr.dropAt) {
            if (fr.fallYear !== year) {
                fr.fallYear = year;
                if (sc > 0.5 && falling.length < 650) {
                    falling.push({
                        type: 3,
                        x: toWX(hx), y: toWY(hy),
                        vx: random(-0.3, 0.3), vy: 0,
                        kind: F.shape,
                        sp: SP,
                        c: [cr, cg, cb],
                        rot: random(TWO_PI),
                        phase: random(TWO_PI)
                    });
                }
            }
            continue;
        }

        stroke(90, 70, 40);
        strokeWeight(Math.max(1, 0.8 * S));
        line(fr.x, fr.y, hx, hy);
        if (F.shape === "cherry") {
            line(fr.x, fr.y, hx + 3 * S, hy + 1 * S);
        }
        noStroke();

        if (F.shape === "cherry") {
            fill(cr, cg, cb);
            ellipse(hx, hy, sz, sz);
            ellipse(hx + 3 * S, hy + 1 * S, sz, sz);
            fill(255, 255, 255, 120);
            ellipse(hx - sz * 0.15, hy - sz * 0.15, sz * 0.3, sz * 0.3);
        } else if (F.shape === "acorn") {
            fill(cr, cg, cb);
            ellipse(hx, hy + sz * 0.45, sz * 0.75, sz);
            fill(cr * 0.6, cg * 0.6, cb * 0.6);
            ellipse(hx, hy + sz * 0.05, sz * 0.85, sz * 0.5);
        } else if (F.shape === "cone") {
            fill(cr, cg, cb);
            ellipse(hx, hy + sz * 0.6, sz * 0.6, sz * 1.3);
            stroke(cr * 0.6, cg * 0.6, cb * 0.6);
            strokeWeight(1);
            for (var k = 1; k <= 3; k++) {
                var ly = hy + sz * (0.1 + k * 0.25);
                line(hx - sz * 0.22, ly, hx + sz * 0.22, ly);
            }
            noStroke();
        } else if (F.shape === "samara") {
            fill(cr, cg, cb);
            ellipse(hx - sz * 0.45, hy + sz * 0.35, sz * 0.9, sz * 0.32);
            ellipse(hx + sz * 0.45, hy + sz * 0.35, sz * 0.9, sz * 0.32);
            fill(cr * 0.7, cg * 0.7, cb * 0.6);
            ellipse(hx, hy + sz * 0.1, sz * 0.35, sz * 0.35);
        } else if (F.shape === "catkin") {
            fill(cr, cg, cb);
            ellipse(hx, hy + sz * 0.8, sz * 0.35, sz * 1.6);
        } else if (F.shape === "orb") {
            fill(cr, cg, cb, 60);
            ellipse(hx, hy, sz * 2, sz * 2);
            fill(cr, cg, cb);
            ellipse(hx, hy, sz, sz);
            fill(255, 255, 255, 140);
            ellipse(hx - sz * 0.2, hy - sz * 0.2, sz * 0.3, sz * 0.3);
        }
    }
};

var drawLog = function(tr) {
    var age = (t - tr.logT) / (YEAR * 1.5);
    if (age >= 1) {
        return true;
    }

    var len = tr.logLen * (1 - age * 0.3);
    var r = Math.max(2 * S, tr.trunkW * tr.sc * 0.42) * (1 - age * 0.5);
    var x0 = tr.x;
    var x1 = tr.x + tr.fallDir * len;
    var left = Math.min(x0, x1);
    var y = GROUND - r * 0.85 + age * r * 0.6;

    var c = lerpColor(lerpColor(SP.bark, deadGray, 0.8), color(85, 70, 55), age);
    noStroke();
    fill(c);
    rect(left, y - r, len, r * 2, r);
    fill(0, 0, 0, 45);
    rect(left, y, len, r, r * 0.5);
    fill(255, 255, 255, 30);
    rect(left + r * 0.5, y - r * 0.8, len - r, r * 0.4, r * 0.2);

    stroke(red(c) * 0.6, green(c) * 0.6, blue(c) * 0.6);
    strokeWeight(Math.max(1, 1.2 * S));
    for (var k = 0; k < 7; k++) {
        var xx = lerp(x0, x1, (k + 0.5) / 7);
        line(xx - 4 * S, y - r * 0.5, xx + 4 * S, y - r * 0.35);
    }
    noStroke();

    fill(190, 160, 120);
    ellipse(x0, y, r * 1.1, r * 2);
    noFill();
    stroke(150, 115, 80);
    strokeWeight(1);
    ellipse(x0, y, r * 0.75, r * 1.4);
    ellipse(x0, y, r * 0.4, r * 0.8);
    noStroke();

    var moss = ease(age / 0.3);
    if (moss > 0.02) {
        fill(85, 135, 60, 210 * moss);
        for (var m = 0; m < tr.moss.length; m++) {
            var ms = tr.moss[m];
            ellipse(lerp(x0, x1, ms.f), y - r * 0.85, r * 1.4 * ms.w, r * 0.5);
        }
    }

    var nm = Math.floor(ease(age / 0.5) * tr.mush.length);
    for (var u = 0; u < nm; u++) {
        var mu = tr.mush[u];
        var mx = lerp(x0, x1, mu.f);
        var mh = 5 * S * mu.s;
        fill(235, 225, 205);
        rect(mx - 0.8 * S, y - r - mh, 1.6 * S, mh);
        if (mu.red) {
            fill(200, 50, 40);
        } else {
            fill(175, 130, 85);
        }
        arc(mx, y - r - mh, 7 * S * mu.s, 6 * S * mu.s, PI, TWO_PI);
        if (mu.red) {
            fill(255);
            ellipse(mx - 1.2 * S, y - r - mh - 1.2 * S, 1.2 * S, 1.2 * S);
            ellipse(mx + 1.3 * S, y - r - mh - 0.8 * S, 1 * S, 1 * S);
        }
    }
    return false;
};

// ================= SEEDS, SEEDLINGS & SPREADING =================

var countKind = function(kind) {
    var n = 0;
    for (var i = 0; i < groundFood.length; i++) {
        if (groundFood[i].kind === kind) { n++; }
    }
    return n;
};

var drawGroundFood = function() {
    noStroke();
    for (var i = 0; i < groundFood.length; i++) {
        var f = groundFood[i];
        if (f.held || !inView(f.x, 20)) { continue; }
        if (f.buried) {
            fill(95, 66, 40);
            ellipse(f.x, f.y + 1 * S, 7 * S, 3 * S);
            continue;
        }

        if (f.kind === "orb") {
            var age = t - f.landT;
            var rot = clamp01(age / (YEAR * 0.3));
            var oc = [lerp(f.c[0], 70, rot), lerp(f.c[1], 40, rot), lerp(f.c[2], 60, rot)];
            drawFoodShape("orb", f.x, f.y, oc, S, 0);
            if (age > 80) {
                var nm = Math.min(5, 1 + Math.floor(age / 300));
                for (var m = 0; m < nm; m++) {
                    var mx = f.x + Math.cos(f.rot + m * 1.6 + t * 0.01) * 5 * S;
                    var my = f.y + 1 * S + Math.sin(f.rot + m * 2.1) * 1.2 * S;
                    var wr = Math.sin(t * 0.3 + m * 2) * 0.8 * S;
                    fill(245, 238, 215);
                    ellipse(mx - 1.6 * S, my + wr, 2 * S, 1.6 * S);
                    ellipse(mx, my - wr, 2.2 * S, 1.8 * S);
                    ellipse(mx + 1.6 * S, my + wr * 0.5, 1.8 * S, 1.5 * S);
                    fill(60, 40, 30);
                    ellipse(mx + 2.4 * S, my + wr * 0.5, 0.8 * S, 0.8 * S);
                }
            }
            continue;
        }

        drawFoodShape(f.kind, f.x, f.y, f.c, S, f.rot);
    }
};

var updateGroundFood = function() {
    for (var i = groundFood.length - 1; i >= 0; i--) {
        var f = groundFood[i];
        if (f.taken) { continue; }

        if (!f.tried && t >= f.sproutAt) {
            f.tried = true;
            var chance;
            if (f.kind === "dust") {
                chance = 0.12;
            } else if (f.sp.noSprout) {
                chance = 0;
            } else if (f.buried) {
                chance = 0.8;
            } else if (f.kind === "catkin") {
                chance = 0.3;
            } else {
                chance = 0.5;
            }
            if (random(1) < chance && seedlings.length < MAX_SEEDLINGS && spotFree(f.x)) {
                seedlings.push({ x: f.x, birth: t, phase: random(TWO_PI), sp: f.sp });
                groundFood.splice(i, 1);
                continue;
            }
        }

        if (t > f.sproutAt + YEAR * 0.15) {
            groundFood.splice(i, 1);
        }
    }
};

var updateSeedlings = function() {
    for (var i = seedlings.length - 1; i >= 0; i--) {
        var sd = seedlings[i];
        var age = t - sd.birth;
        if (sd.sp.noSprout) {
            seedlings.splice(i, 1);
            continue;
        }
        if (age > YEAR * 0.6 && aliveCount() < MAX_TREES && treeSpotFree(sd.x)) {
            makeTree(sd.x, 2, t, 0.12, random(0.85, 1), YEAR * 3, sd.sp);
            useTree(mainTree);
            seedlings.splice(i, 1);
        } else if (age > YEAR * 2.5) {
            seedlings.splice(i, 1);
        }
    }
};

var drawSeedlings = function(st, wind) {
    for (var i = 0; i < seedlings.length; i++) {
        var sd = seedlings[i];
        if (!inView(sd.x, 20)) { continue; }
        var sp = sd.sp;
        var g = ease((t - sd.birth) / (YEAR * 0.6));
        var h = (4 + 24 * g) * S;
        var sway = (wind * 1.5 + Math.sin(t * 0.05 + sd.phase) * 0.5) * S * (h / (28 * S));
        var topX = sd.x + sway;
        var topY = GROUND - h;

        stroke(red(sp.bark), green(sp.bark), blue(sp.bark));
        strokeWeight(Math.max(1, (1 + g * 1.5) * S));
        line(sd.x, GROUND + 2 * S, topX, topY);
        noStroke();

        var gc = sp.green;
        var gr = (gc[0] + gc[1]) / 2;
        var gg = (gc[2] + gc[3]) / 2;
        var gb = (gc[4] + gc[5]) / 2;

        if (sp.leafShape === "needle") {
            var ps = (0.5 + g) * S;
            fill(gr, gg, gb);
            triangle(topX, topY - 7 * ps, topX - 5 * ps, topY + 4 * ps, topX + 5 * ps, topY + 4 * ps);
            fill(gr - 8, gg - 10, gb - 6);
            triangle(topX, topY - 1 * ps, topX - 7 * ps, topY + 10 * ps, topX + 7 * ps, topY + 10 * ps);
        } else {
            var lv = sp.evergreen ? 1 : ease((st - 0.05) / 0.06) * (1 - ease((st - 0.68) / 0.06));
            if (lv > 0.02) {
                var m = sp.evergreen ? 0 : ease((st - 0.5) / 0.08);
                var ac = sp.autumn.length > 0 ? sp.autumn[0] : [gr, gg, gb];
                fill(lerp(gr, ac[0], m), lerp(gg, ac[1], m), lerp(gb, ac[2], m));
                var ls = (3 + 3 * g) * S * lv;
                var pairs = 1 + Math.floor(g * 3);
                for (var j = 0; j < pairs; j++) {
                    var lx = lerp(topX, sd.x, j * 0.28);
                    var ly = lerp(topY, GROUND - 3 * S, j * 0.28);
                    ellipse(lx - ls * 0.7, ly, ls * 1.4, ls * 0.7);
                    ellipse(lx + ls * 0.7, ly, ls * 1.4, ls * 0.7);
                }
            }
        }
    }
};

// ================= DRAWING: GROUND DETAILS =================

var drawLitter = function(st) {
    if (st > 0.02 && st < 0.2) {
        for (var s = 0; s < speed && litter.length > 0; s++) {
            litter.splice(Math.floor(random(litter.length)), 1);
        }
    }

    noStroke();
    for (var i = 0; i < litter.length; i++) {
        var l = litter[i];
        if (!inView(l.x, 10)) { continue; }
        var cr = Math.cos(l.rot);
        var sr = Math.sin(l.rot);
        var ax = cr * l.size / 2;
        var ay = sr * 0.35 * l.size / 2;
        var nx = -sr * l.wid;
        var ny = cr * 0.35 * l.wid;
        fill(l.r, l.g, l.b);
        quad(l.x - ax, l.y - ay, l.x + nx, l.y + ny, l.x + ax, l.y + ay, l.x - nx, l.y - ny);
    }
};

var drawSticks = function() {
    for (var i = sticks.length - 1; i >= 0; i--) {
        var s = sticks[i];
        var age = (t - s.t0) / (YEAR * 1.2);
        if (age >= 1) {
            sticks.splice(i, 1);
            continue;
        }
        if (!inView(s.x, 20)) { continue; }
        var dx = Math.cos(s.rot) * s.len / 2;
        var dy = Math.sin(s.rot) * s.len / 2;
        stroke(lerp(105, 80, age), lerp(95, 65, age), lerp(85, 50, age), 255 * (1 - age * 0.6));
        strokeWeight(s.w);
        line(s.x - dx, s.y - dy, s.x + dx, s.y + dy);
    }
    noStroke();
};

var drawGroundHives = function() {
    for (var i = groundHives.length - 1; i >= 0; i--) {
        var g = groundHives[i];
        if (t - g.t0 > YEAR * 0.3) {
            groundHives.splice(i, 1);
            continue;
        }
        if (!inView(g.x, 20)) { continue; }
        noStroke();
        fill(225, 165, 40, 200);
        ellipse(g.x, g.y + 3 * S, 16 * S, 4 * S);
        pushMatrix();
        translate(g.x, g.y);
        rotate(1.3);
        drawHiveShape(0, -8 * S, 1.1 * S);
        popMatrix();
    }
};

var drawSnowGround = function(sn) {
    if (sn <= 0.01) {
        return;
    }
    var xs = Math.floor(camX / 20) * 20 - 20;
    var xe = camX + W + 40;
    noStroke();
    fill(248, 250, 255, 255 * Math.min(1, sn * 1.5));
    beginShape();
    vertex(xs, GROUND + 6 * S);
    for (var x = xs; x <= xe; x += 20) {
        vertex(x, GROUND - sn * (5 + 2 * Math.sin(x * 0.05)) * S);
    }
    vertex(xe, GROUND + 6 * S);
    endShape(CLOSE);
};

var drawFlowers = function(st, wind, sn) {
    for (var i = 0; i < flowers.length; i++) {
        var f = flowers[i];
        if (!inView(f.x, 10)) { continue; }
        var vis = ease((st - f.bloom) / 0.04) * (1 - ease((st - f.wilt) / 0.04)) * (1 - sn);
        if (vis < 0.02) { continue; }

        var sway = (wind * 2 + Math.sin(t * 0.04 + f.phase)) * S;
        var fx = f.x + sway;
        var fy = GROUND - f.h * vis;

        stroke(60, 130, 50);
        strokeWeight(Math.max(1, 1.2 * S));
        line(f.x, GROUND + 2 * S, fx, fy);

        noStroke();
        var r = 3.2 * S * vis;
        fill(f.c[0], f.c[1], f.c[2]);
        for (var k = 0; k < 5; k++) {
            var a = f.phase + k * TWO_PI / 5;
            ellipse(fx + Math.cos(a) * r * 0.6, fy + Math.sin(a) * r * 0.6, r, r);
        }
        fill(250, 220, 80);
        ellipse(fx, fy, r * 0.6, r * 0.6);
    }
};

var drawGrass = function(st, wind, sn) {
    var gc = seasonColor(grassPal, st);
    var gr = red(gc);
    var gg = green(gc);
    var gb = blue(gc);

    noStroke();
    fill(gr * 0.7, gg * 0.7, gb * 0.7);
    rect(camX - 10, GROUND - 1 * S, W + 20, 5 * S);

    strokeWeight(Math.max(1, 1.4 * S));
    for (var i = 0; i < grass.length; i++) {
        var G = grass[i];
        if (!inView(G.x, 10)) { continue; }
        var hh = G.h * (1 - sn * 0.75);
        if (hh < 1) { continue; }
        var sway = (wind * 3 + Math.sin(t * 0.05 + G.phase)) * S;
        stroke(gr + G.shade, gg + G.shade, gb + G.shade * 0.5);
        line(G.x, GROUND + 3 * S, G.x + G.lean + sway, GROUND - hh);
    }
    noStroke();
};

// ================= PARTICLES =================

var spawnSnow = function(st) {
    if (st > 0.76 && st < 0.97 && falling.length < 650 && random(1) < 0.7) {
        falling.push({
            type: 2,
            x: random(camX - 20, camX + W + 20), y: -5,
            vy: random(0.6, 1.3) * S,
            s: random(1.5, 3.5) * S,
            phase: random(TWO_PI)
        });
    }
};

var updateFalling = function(wind) {
    for (var i = falling.length - 1; i >= 0; i--) {
        var p = falling[i];

        if (p.type === 2) {
            p.x += wind * 0.6 + Math.sin(t * 0.03 + p.phase) * 0.3;
            p.y += p.vy;
            if (p.y > GROUND) {
                falling.splice(i, 1);
            }
            continue;
        }

        if (p.type === 5) {
            p.vy = Math.min(p.vy + 0.01 * S, 0.6 * S);
            p.vx *= 0.98;
            p.x += p.vx + wind * 0.6 + Math.sin(t * 0.05 + p.phase) * 0.3;
            p.y += p.vy;
            if (p.x < -20 || p.x > WW + 20) {
                falling.splice(i, 1);
                continue;
            }
            if (p.y >= GROUND - 1 * S) {
                if (countKind("dust") < 30 && groundFood.length < 120) {
                    groundFood.push({
                        x: p.x,
                        y: GROUND - 1 * S + random(0, 2) * S,
                        kind: "dust",
                        sp: BLOOD,
                        c: [190, 25, 35],
                        rot: 0,
                        landT: t,
                        sproutAt: t + random(0.05, 0.25) * YEAR,
                        taken: false, held: false, buried: false, tried: false
                    });
                }
                falling.splice(i, 1);
            }
            continue;
        }

        if (p.type === 7) {
            p.vy = Math.min(p.vy + 0.15 * S, 5 * S);
            p.y += p.vy;
            if (p.y >= GROUND - 6 * S) {
                groundHives.push({ x: p.x, y: GROUND - 3 * S, t0: t, eaten: false });
                falling.splice(i, 1);
            }
            continue;
        }

        if (p.type === 4) {
            p.vy = Math.min(p.vy + 0.15 * S, 5 * S);
            p.y += p.vy;
            p.x += p.vx;
            p.rot += p.spin;
            if (p.y >= GROUND - 1 * S && p.vy > 0) {
                if (sticks.length < 60) {
                    sticks.push({
                        x: p.x,
                        y: GROUND - 1 * S + random(0, 2) * S,
                        len: p.len,
                        w: p.w,
                        rot: random(-0.15, 0.15),
                        t0: t
                    });
                }
                falling.splice(i, 1);
            }
            continue;
        }

        if (p.type === 3) {
            if (p.kind === "samara") {
                p.rot += 0.35;
                p.y += 0.45 * S;
                p.x += wind * 1.0 + Math.sin(t * 0.04 + p.phase) * 0.4;
            } else if (p.kind === "catkin") {
                p.y += 0.3 * S;
                p.x += wind * 1.4 + Math.sin(t * 0.03 + p.phase) * 0.6;
            } else {
                p.vy = Math.min(p.vy + 0.12 * S, 4 * S);
                p.y += p.vy;
                p.x += p.vx;
            }

            if (p.x < -20 || p.x > WW + 20) {
                falling.splice(i, 1);
                continue;
            }

            if (p.y >= GROUND - 1.5 * S) {
                if (groundFood.length < 120) {
                    groundFood.push({
                        x: p.x,
                        y: GROUND - 1.5 * S + random(0, 2) * S,
                        kind: p.kind,
                        sp: p.sp,
                        c: p.c,
                        rot: random(TWO_PI),
                        landT: t,
                        sproutAt: p.kind === "catkin" ? t + random(0.03, 0.08) * YEAR : nextSpring(),
                        taken: false, held: false, buried: false, tried: false
                    });
                }
                falling.splice(i, 1);
            }
            continue;
        }

        p.vx += wind * 0.03 - p.vx * 0.02;
        p.x += p.vx + Math.sin(t * 0.05 + p.phase) * 0.6;
        p.y += p.vy;
        p.rot += p.spin;

        if (p.y >= GROUND - 1 * S || p.x < -40 || p.x > WW + 40) {
            if (p.type === 0 && p.y >= GROUND - 1 * S && litter.length < 450) {
                litter.push({
                    x: p.x,
                    y: GROUND + random(-2, 4) * S,
                    rot: p.rot,
                    size: p.size,
                    wid: p.wid,
                    r: p.r * 0.85, g: p.g * 0.8, b: p.b * 0.8
                });
            }
            falling.splice(i, 1);
        }
    }
};

var drawFalling = function() {
    noStroke();
    for (var i = 0; i < falling.length; i++) {
        var p = falling[i];
        if (!inView(p.x, 30)) { continue; }
        var flip = Math.cos(t * 0.12 + p.phase);

        if (p.type === 0) {
            var ux = Math.cos(p.rot) * p.size / 2;
            var uy = Math.sin(p.rot) * p.size / 2;
            var nx = -Math.sin(p.rot) * p.wid * flip;
            var ny = Math.cos(p.rot) * p.wid * flip;
            fill(p.r, p.g, p.b);
            quad(p.x - ux, p.y - uy, p.x + nx, p.y + ny, p.x + ux, p.y + uy, p.x - nx, p.y - ny);
        } else if (p.type === 1) {
            fill(p.c[0], p.c[1], p.c[2]);
            ellipse(p.x, p.y, 3 * S, 2 * S * Math.abs(flip) + 1);
        } else if (p.type === 3) {
            drawFoodShape(p.kind, p.x, p.y, p.c, S, p.rot);
        } else if (p.type === 4) {
            var dx = Math.cos(p.rot) * p.len / 2;
            var dy = Math.sin(p.rot) * p.len / 2;
            stroke(105, 95, 85);
            strokeWeight(p.w);
            line(p.x - dx, p.y - dy, p.x + dx, p.y + dy);
            noStroke();
        } else if (p.type === 5) {
            fill(255, 70, 70, 50);
            ellipse(p.x, p.y, p.s * 2.5, p.s * 2.5);
            fill(200, 30, 40, 230);
            ellipse(p.x, p.y, p.s, p.s);
        } else if (p.type === 7) {
            drawHiveShape(p.x, p.y, 1.2 * S);
        } else {
            fill(255, 255, 255, 220);
            ellipse(p.x, p.y, p.s, p.s);
        }
    }
};

// ================= WILDLIFE: HELPERS =================

var countAnimals = function(type) {
    var n = 0;
    for (var i = 0; i < animals.length; i++) {
        if (animals[i].type === type) { n++; }
    }
    return n;
};

var trunkReady = function() {
    var b = mainTree.branches[0];
    return mainTree.state === "alive" && mainTree.sc > 0.45 && t > b.birth + b.dur &&
           inView(mainTree.x, W * 0.3);
};

var climbTop = function() {
    if (mainTree.sp.conifer) {
        return GROUND - 70 * S * mainTree.sc;
    }
    var b = mainTree.branches[0];
    var topY = treeWY(mainTree, b.pts[b.pts.length - 1].y);
    return Math.max(GROUND - 130 * S * mainTree.sc, topY + 10 * S);
};

var findPerch = function(d0, d1) {
    var tr = mainTree;
    if (tr.state !== "alive" || tr.sc < 0.4) { return null; }
    var list = tr.branches;
    for (var tries = 0; tries < 30; tries++) {
        var b = list[Math.floor(random(list.length))];
        if (b.depth < d0 || b.depth > d1) { continue; }
        if (t < b.birth + b.dur) { continue; }
        var s = random(0.3, 0.85);
        var p = pointAt(b, s);
        if (Math.abs(Math.sin(p.a)) > 0.55) { continue; }
        // Only perch on branches you can see (not up in a giant's hidden top)
        if (treeWY(tr, p.y) < 25 * S) { continue; }
        var w = lerp(b.w0, b.w1, s) * (0.3 + 0.7 * ease((t - b.birth) / (YEAR * 0.9)));
        return { x: treeWX(tr, p.x), y: treeWY(tr, p.y - w * 0.5) };
    }
    return null;
};

// Food on the ground near the view
var pickFood = function() {
    var opts = [];
    for (var i = 0; i < groundFood.length; i++) {
        var f = groundFood[i];
        if (!f.taken && !f.buried && f.kind !== "catkin" && f.kind !== "pit" &&
            f.kind !== "orb" && f.kind !== "dust" && inView(f.x, W * 0.3)) {
            opts.push(f);
        }
    }
    if (opts.length === 0) { return null; }
    return opts[Math.floor(random(opts.length))];
};

var removeFood = function(f) {
    var i = groundFood.indexOf(f);
    if (i >= 0) { groundFood.splice(i, 1); }
};

var eatFruitNear = function(a, year) {
    var F = mainTree.sp.fruit;
    if (!F || F.shape !== "cherry" || mainTree.mature < 0.6 || mainTree.state !== "alive") { return; }
    var st = seasonPos();
    if (st < F.from + 0.08 || st > F.to) { return; }

    var list = mainTree.fruits;
    var best = null;
    var bd = 40 * S;
    for (var i = 0; i < list.length; i++) {
        var fr = list[i];
        if (fr.eatenYear === year || fr.fallYear === year || t < fr.birth + 150) { continue; }
        var d = dist(a.x, a.y, treeWX(mainTree, fr.x), treeWY(mainTree, fr.y));
        if (d < bd) {
            bd = d;
            best = fr;
        }
    }
    if (best) {
        best.eatenYear = year;
        a.peck = 1;
        a.dir = treeWX(mainTree, best.x) > a.x ? 1 : -1;
        if (random(1) < 0.6) {
            a.seed = true;
        }
    }
};

var pickHiveTree = function() {
    var opts = [];
    for (var i = 0; i < trees.length; i++) {
        var tr = trees[i];
        if (tr.state === "alive" && tr.hive && tr.sc > 0.5 && inView(tr.x, W * 0.3)) {
            opts.push(tr);
        }
    }
    if (opts.length === 0) { return null; }
    return opts[Math.floor(random(opts.length))];
};

var hiveWorldX = function(tr) {
    return treeWX(tr, tr.hive.x);
};

var hiveWorldY = function(tr) {
    return treeWY(tr, tr.hive.y + 9 * 1.3 * S);
};

// A living, grown Mystic tree near the view (if there is one)
var mysticTree = function() {
    for (var i = 0; i < trees.length; i++) {
        var tr = trees[i];
        if (tr.state === "alive" && tr.sp.dust && tr.mature > 0.4 && inView(tr.x, W * 0.5)) {
            return tr;
        }
    }
    return null;
};

var pickOrb = function() {
    var opts = [];
    for (var i = 0; i < groundFood.length; i++) {
        if (groundFood[i].kind === "orb" && inView(groundFood[i].x, W * 0.3)) {
            opts.push(groundFood[i]);
        }
    }
    if (opts.length === 0) { return null; }
    return opts[Math.floor(random(opts.length))];
};

var pickFlowerInView = function() {
    var f = flowers[0];
    for (var tries = 0; tries < 15; tries++) {
        f = flowers[Math.floor(random(flowers.length))];
        if (inView(f.x, 0)) { return f; }
    }
    return f;
};

// ================= WILDLIFE: SPAWNING (near the view) =================

// Bring one of the 10 snakes into the forest, heading for x
var addRosterSnake = function(who, stx, lure, side) {
    if (side === undefined) { side = random(1) < 0.5 ? -1 : 1; }
    var ssx = viewEdge(side, 50 * S);
    animals.push({
        type: "snake",
        x: ssx, y: GROUND,
        dir: stx > ssx ? 1 : -1, state: "slither",
        tx: constrain(stx, 10, WW - 10),
        phase: random(TWO_PI), timer: 0,
        lured: !!lure, base: who.base, size: 1, evo: who.evo,
        hp: 0, maxHp: 100, foe: null, strike: 0, strikeT: 0, cool: 0, wins: who.wins,
        meal: 0, eater: null, look: null, lookLv: 0,
        col: who.col, who: who, name: who.name
    });
    who.here = true;
    if (who.hatching) {
        snakeMsg = who.name + " has hatched again! (Lv 1)";
        snd("hatch");
    } else if (!who.seen) {
        snakeMsg = "A new snake appears: " + who.name + "!";
    } else if (who.evo >= 30) {
        snakeMsg = "The Serpent King " + who.name + " returns!";
    } else if (who.evo > 1) {
        snakeMsg = who.name + " is back! (Lv " + who.evo + ")";
    }
    who.hatching = false;
    who.seen = true;
    var seenAll = true;
    for (var sai = 0; sai < snakeRoster.length; sai++) {
        if (!snakeRoster[sai].seen) { seenAll = false; }
    }
    if (seenAll) { unlockArena("snake"); }
};

// Bring in the giant Anaconda, heading for x
var addAnaconda = function(atx, side) {
    anaNext = t + YEAR * 5;   // stays ~3 years, then at least 2 years away
    if (fightPit && fightPit.who === ANA_FS) { return; }   // it's busy being an arena
    anaSeenCount++;
    if (anaSeenCount >= 10) { unlockAnaFight("(You've seen it 10 times!) "); }
    if (side === undefined) { side = random(1) < 0.5 ? -1 : 1; }
    var asx = viewEdge(side, 120 * S);
    animals.push({
        type: "snake", ana: true,
        x: asx, y: GROUND,
        dir: atx > asx ? 1 : -1, state: "slither",
        tx: constrain(atx, 10, WW - 10),
        phase: random(TWO_PI), timer: 0,
        lured: true, base: 1, size: 3.3, evo: 1,
        hp: 0, maxHp: 900, foe: null, strike: 0, strikeT: 0, cool: 0, wins: 0,
        meal: 0, eater: null, look: null, lookLv: 0, meals: 0,
        life: YEAR * 3,
        col: { body: [85, 95, 40], band: [85, 95, 40] },
        who: null, name: "The Anaconda"
    });
    snakeMsg = "!!! A giant ANACONDA has entered the forest !!!" + (anaFormerly ? " (It used to be " + anaFormerly + "!)" : "");
    snd("anaconda");
};

var spawnWildlife = function(st, sn) {
    var sp = speed;
    var food = pickFood();
    var F = mainTree.sp.fruit;
    var treeHere = mainTree.state === "alive" && inView(mainTree.x, W * 0.3);
    var ripeCherries = treeHere && F && F.shape === "cherry" && st > F.from + 0.08 && st < F.to;
    var side;

    if (daylight > 0.6 && sn < 0.6 && countAnimals("squirrel") < 2 && (food || trunkReady()) &&
        random(1) < (food ? 0.006 : 0.0015) * sp) {
        side = random(1) < 0.5 ? -1 : 1;
        if (food) { food.taken = true; }
        animals.push({
            type: "squirrel",
            x: viewEdge(side, 20), y: GROUND,
            dir: -side, state: "run",
            tx: food ? food.x : treeX,
            food: food, hop: 0, timer: 0, climbY: 0, leaving: false,
            col: random(1) < 0.6 ? [165, 95, 55] : [125, 120, 115]
        });
    }

    if (treeHere && daylight > 0.5 && st < 0.78 && growFrac > 0.4 && mainTree.mature > 0.5 &&
        countAnimals("bird") < 4 && random(1) < (ripeCherries ? 0.012 : 0.004) * sp) {
        var perch = findPerch(2, 6);
        if (perch) {
            side = random(1) < 0.5 ? -1 : 1;
            animals.push({
                type: "bird",
                x: viewEdge(side, 20), y: random(H * 0.05, H * 0.3),
                dir: -side, state: "fly",
                tx: perch.x, ty: perch.y,
                timer: 0, phase: random(TWO_PI), peck: 0, seed: false,
                kind: birdKinds[Math.floor(random(birdKinds.length))]
            });
        }
    }

    if ((dusk > 0.15 || daylight > 0.7) && countAnimals("deer") < 1 &&
        random(1) < (dusk > 0.15 ? 0.004 : 0.0008) * sp) {
        side = random(1) < 0.5 ? -1 : 1;
        animals.push({
            type: "deer",
            x: viewEdge(side, 60 * S), y: GROUND,
            dir: -side, state: "walk",
            tx: camX + random(0.2, 0.8) * W,
            phase: 0, timer: 0, head: 0, up: true, lookTimer: 0,
            buck: random(1) < 0.5
        });
    }

    if (daylight > 0.35 && sn < 0.3 && countAnimals("rabbit") < 2 && random(1) < 0.002 * sp) {
        side = random(1) < 0.5 ? -1 : 1;
        animals.push({
            type: "rabbit",
            x: viewEdge(side, 20), y: GROUND,
            dir: -side, state: "hop",
            tx: camX + random(0.15, 0.85) * W,
            hop: 0, timer: 0
        });
    }

    if (treeHere && daylight < 0.15 && growFrac > 0.6 && mainTree.mature > 0.6 &&
        countAnimals("owl") < 1 && random(1) < 0.004 * sp) {
        var op = findPerch(1, 3);
        if (op) {
            side = random(1) < 0.5 ? -1 : 1;
            animals.push({
                type: "owl",
                x: viewEdge(side, 30), y: random(H * 0.05, H * 0.25),
                dir: -side, state: "fly",
                tx: op.x, ty: op.y,
                phase: random(TWO_PI), blink: 0
            });
        }
    }

    if (daylight > 0.25 && sn < 0.2 && st < 0.74 && countAnimals("bear") < 1 &&
        random(1) < 0.002 * sp) {
        var ht = pickHiveTree();
        if (ht) {
            side = ht.x < camX + W / 2 ? -1 : 1;
            animals.push({
                type: "bear",
                x: viewEdge(side, 60 * S), y: GROUND,
                dir: -side, state: "walk",
                tree: ht, tx: ht.x,
                phase: 0, timer: 0, climbY: 0, gh: null
            });
        }
    }

    // Snakes wander through on warm days. A Mystic tree (or its orbs)
    // draws them in - more snakes, and they all head straight for it.
    var mt = mysticTree();
    var orb = pickOrb();
    var lure = mt || orb;
    var snakeMax = (lure || fightPit) ? 5 : 2;
    var snakeChance = fightPit ? 0.006 : (lure ? 0.005 : 0.0009);
    var who = null;
    var snakesStaying = 0;
    for (var ci = 0; ci < animals.length; ci++) {
        if (animals[ci].type === "snake" && animals[ci].state !== "leave") { snakesStaying++; }
    }
    if (daylight > 0.3 && sn < 0.2 && snakesStaying < snakeMax &&
        random(1) < snakeChance * sp) {
        var free = [];
        for (var ri = 0; ri < snakeRoster.length; ri++) {
            if (!snakeRoster[ri].here && !snakeRoster[ri].sacrificed && t >= snakeRoster[ri].awayUntil) {
                free.push(snakeRoster[ri]);
            }
        }
        if (free.length > 0) {
            who = free[Math.floor(random(free.length))];
        }
    }
    if (who) {
        var stx;
        if (fightPit) {
            stx = fightPit.x + random(-0.6, 0.6) * pitHalf();
        } else if (orb && random(1) < 0.5) {
            stx = orb.x + random(-6, 6) * S;
        } else if (mt) {
            stx = mt.x + random(-60, 60) * S;
        } else {
            stx = camX + random(0.15, 0.85) * W;
        }
        addRosterSnake(who, stx, lure);
    }

    // Very rarely, a giant ANACONDA slithers in to hunt the snakes
    var anaHere = false;
    for (var ai = 0; ai < animals.length; ai++) {
        if (animals[ai].ana) { anaHere = true; }
    }
    if (!anaHere && t >= anaNext && daylight > 0.3 && sn < 0.2 && random(1) < 0.00012 * sp) {
        addAnaconda(fightPit ? fightPit.x : camX + random(0.25, 0.75) * W);
    }
};

// ================= WILDLIFE: BEHAVIOUR =================

// Animals leave toward the nearer edge of the view and vanish once out of sight
var leaveDir = function(x) {
    return x < camX + W / 2 ? -1 : 1;
};

var updateSquirrel = function(a) {
    var dx;
    if (a.state === "run") {
        dx = a.tx - a.x;
        if (Math.abs(dx) <= 2.2 * S) {
            a.x = a.tx;
            if (a.food) {
                a.food.held = true;
                if (random(1) < 0.45) {
                    var spot = a.x + (random(1) < 0.5 ? -1 : 1) * random(80, 220) * S;
                    a.tx = constrain(spot, 30 * S, WW - 30 * S);
                    a.state = "carry";
                } else {
                    a.state = "eat";
                    a.timer = random(120, 220);
                }
            } else if (trunkReady()) {
                a.state = "climbUp";
                a.climbY = climbTop();
            } else {
                a.state = "leave";
            }
        } else {
            a.dir = dx > 0 ? 1 : -1;
            a.x += a.dir * 2.2 * S;
            a.hop += 0.35;
        }
    } else if (a.state === "carry") {
        dx = a.tx - a.x;
        if (Math.abs(dx) <= 2.2 * S) {
            a.state = "bury";
            a.timer = 80;
        } else {
            a.dir = dx > 0 ? 1 : -1;
            a.x += a.dir * 2.2 * S;
            a.hop += 0.35;
        }
    } else if (a.state === "bury") {
        a.timer--;
        if (a.timer <= 0) {
            var f = a.food;
            f.x = a.x + a.dir * 7 * S;
            f.y = GROUND - 1 * S;
            f.buried = true;
            f.held = false;
            f.taken = false;
            f.tried = false;
            f.sproutAt = nextSpring();
            a.food = null;
            a.state = "leave";
        }
    } else if (a.state === "eat") {
        a.timer--;
        if (a.timer <= 0) {
            removeFood(a.food);
            a.food = null;
            if (trunkReady() && random(1) < 0.5) {
                a.state = "run";
                a.tx = treeX;
            } else {
                a.state = "leave";
            }
        }
    } else if (a.state === "climbUp") {
        a.y -= 1.6 * S;
        if (a.y <= a.climbY) {
            a.state = "perch";
            a.timer = random(150, 300);
        }
    } else if (a.state === "perch") {
        a.timer--;
        if (a.timer <= 0) {
            a.state = "climbDown";
        }
    } else if (a.state === "climbDown") {
        a.y += 1.8 * S;
        if (a.y >= GROUND) {
            a.y = GROUND;
            a.state = "leave";
        }
    } else if (a.state === "leave") {
        if (!a.leaving) {
            a.dir = leaveDir(a.x);
            a.leaving = true;
        }
        a.x += a.dir * 2.6 * S;
        a.hop += 0.4;
        if (offView(a.x, 30)) {
            return true;
        }
    }
    return false;
};

var updateBird = function(a, year) {
    a.phase += 0.45;
    if (a.state === "fly" || a.state === "away") {
        var dx = a.tx - a.x;
        var dy = a.ty - a.y;
        var d = Math.sqrt(dx * dx + dy * dy) || 1;
        if (a.state === "fly" && d < 3 * S) {
            a.x = a.tx;
            a.y = a.ty;
            a.state = "perch";
            a.timer = random(220, 450);
            return false;
        }

        if (a.state === "away" && a.seed && a.x > 20 && a.x < WW - 20 &&
            a.y > 0 && random(1) < 0.03) {
            falling.push({
                type: 3,
                x: a.x, y: a.y,
                vx: 0, vy: 0,
                kind: "pit",
                sp: mainTree.sp,
                c: [205, 185, 150],
                rot: 0,
                phase: random(TWO_PI)
            });
            a.seed = false;
        }

        if (a.state === "away" && (offView(a.x, 40) || a.y < -40)) {
            return true;
        }
        a.x += dx / d * 2.6 * S;
        a.y += dy / d * 2.6 * S + Math.sin(a.phase * 0.5) * 0.3;
        if (Math.abs(dx) > 1) {
            a.dir = dx > 0 ? 1 : -1;
        }
    } else if (a.state === "perch") {
        a.timer--;
        a.peck = Math.max(0, a.peck - 0.08);
        if (random(1) < 0.015) {
            a.peck = 1;
            if (random(1) < 0.3) { a.dir *= -1; }
        }
        if (random(1) < 0.01) {
            eatFruitNear(a, year);
        }
        if (a.timer <= 0 || daylight < 0.3) {
            a.state = "away";
            a.tx = viewEdge(a.dir, 60);
            a.ty = random(H * 0.05, H * 0.25);
        }
    }
    return false;
};

var updateDeer = function(a) {
    if (a.state === "walk" || a.state === "leave") {
        a.phase += 0.12;
        a.x += a.dir * 0.75 * S;
        a.head = Math.max(0, a.head - 0.04);
        if (a.state === "walk" && Math.abs(a.tx - a.x) < 1 * S) {
            a.state = "graze";
            a.timer = random(350, 650);
        }
        if (a.state === "leave" && offView(a.x, 70 * S)) {
            return true;
        }
    } else if (a.state === "graze") {
        a.timer--;
        a.lookTimer--;
        if (a.lookTimer <= 0) {
            a.up = !a.up;
            a.lookTimer = a.up ? random(60, 120) : random(120, 260);
        }
        a.head += ((a.up ? 0 : 1) - a.head) * 0.08;
        if (a.timer <= 0) {
            a.state = "leave";
        }
    }
    return false;
};

var updateRabbit = function(a) {
    if (a.state === "hop" || a.state === "leave") {
        a.hop += 0.22;
        a.x += a.dir * 1.6 * S * (Math.sin(a.hop) > 0 ? 1 : 0.2);
        if (a.state === "hop" && Math.abs(a.tx - a.x) < 2 * S) {
            a.state = "nibble";
            a.timer = random(150, 320);
            a.hop = 0;
        }
        if (a.state === "leave" && offView(a.x, 30)) {
            return true;
        }
    } else {
        a.timer--;
        if (random(1) < 0.008) { a.dir *= -1; }
        if (a.timer <= 0) {
            a.state = "leave";
            a.dir = leaveDir(a.x);
        }
    }
    return false;
};

var updateOwl = function(a) {
    a.phase += 0.25;
    if (a.blink > 0) {
        a.blink--;
    } else if (random(1) < 0.006) {
        a.blink = 10;
    }

    if (a.state === "fly" || a.state === "away") {
        var dx = a.tx - a.x;
        var dy = a.ty - a.y;
        var d = Math.sqrt(dx * dx + dy * dy) || 1;
        if (a.state === "fly" && d < 3 * S) {
            a.x = a.tx;
            a.y = a.ty;
            a.state = "perch";
            return false;
        }
        if (a.state === "away" && (offView(a.x, 40) || a.y < -40)) {
            return true;
        }
        a.x += dx / d * 1.8 * S;
        a.y += dy / d * 1.8 * S;
        if (Math.abs(dx) > 1) {
            a.dir = dx > 0 ? 1 : -1;
        }
    } else if (a.state === "perch") {
        if (daylight > 0.35) {
            a.state = "away";
            a.tx = viewEdge(a.dir, 60);
            a.ty = random(-30, H * 0.1);
        }
    }
    return false;
};

var updateBear = function(a) {
    var tr = a.tree;
    var ok = tr && tr.state === "alive" && tr.hive;

    if (a.state === "leave") {
        a.phase += 0.1;
        a.x += a.dir * 1.0 * S;
        if (offView(a.x, 60 * S)) {
            return true;
        }
    } else if (a.state === "walk" || a.state === "toHive") {
        a.phase += 0.1;
        var dx = a.tx - a.x;
        if (Math.abs(dx) <= 1.5 * S) {
            a.x = a.tx;
            if (a.state === "walk") {
                if (ok) {
                    a.state = "climbUp";
                    a.climbY = hiveWorldY(tr) + 32 * S;
                } else {
                    a.state = "leave";
                    a.dir = leaveDir(a.x);
                }
            } else if (groundHives.indexOf(a.gh) >= 0) {
                a.state = "eat";
                a.timer = random(300, 450);
                a.dir = a.gh.x > a.x ? 1 : -1;
            } else {
                a.state = "leave";
                a.dir = leaveDir(a.x);
            }
        } else {
            a.dir = dx > 0 ? 1 : -1;
            a.x += a.dir * 0.9 * S;
        }
    } else if (a.state === "climbUp") {
        a.phase += 0.1;
        if (!ok) {
            a.state = "climbDown";
            return false;
        }
        a.y -= 0.9 * S;
        if (a.y <= a.climbY) {
            a.state = "raid";
            a.timer = 160;
        }
    } else if (a.state === "raid") {
        a.timer--;
        if (ok) {
            tr.hive.shake = 1;
        }
        if (!ok || a.timer <= 0) {
            if (ok) {
                falling.push({
                    type: 7,
                    x: hiveWorldX(tr), y: treeWY(tr, tr.hive.y),
                    vx: 0, vy: 0, rot: 0, phase: 0
                });
                tr.hive = null;
            }
            a.state = "climbDown";
        }
    } else if (a.state === "climbDown") {
        a.phase += 0.1;
        a.y += 1.1 * S;
        if (a.y >= GROUND) {
            a.y = GROUND;
            var best = null;
            var bd = 120 * S;
            for (var i = 0; i < groundHives.length; i++) {
                var g = groundHives[i];
                var d = Math.abs(g.x - a.x);
                if (!g.eaten && d < bd) {
                    bd = d;
                    best = g;
                }
            }
            if (best) {
                best.eaten = true;
                a.gh = best;
                a.state = "toHive";
                a.tx = best.x - 14 * S * (best.x >= a.x ? 1 : -1);
            } else {
                a.state = "leave";
                a.dir = leaveDir(a.x);
            }
        }
    } else if (a.state === "eat") {
        a.timer--;
        if (a.timer <= 0) {
            var gi = groundHives.indexOf(a.gh);
            if (gi >= 0) {
                groundHives.splice(gi, 1);
            }
            a.gh = null;
            a.state = "leave";
            a.dir = leaveDir(a.x);
        }
    }
    return false;
};

var snakeBurst = function(x, y, n, col, power) {
    for (var i = 0; i < n && snakeFx.length < 120; i++) {
        var ang = random(PI, TWO_PI);
        var v = random(0.4, 1.6) * power * S;
        snakeFx.push({
            x: x, y: y,
            vx: Math.cos(ang) * v, vy: Math.sin(ang) * v,
            life: 0, max: random(25, 50),
            col: col, r: random(1.5, 3.5)
        });
    }
};

var updateSnakeFx = function() {
    for (var i = snakeFx.length - 1; i >= 0; i--) {
        var f = snakeFx[i];
        f.life++;
        f.x += f.vx;
        f.y += f.vy;
        f.vy += 0.05 * S;
        if (f.y > GROUND) { f.y = GROUND; f.vy *= -0.3; f.vx *= 0.6; }
        if (f.life >= f.max) { snakeFx.splice(i, 1); }
    }
};

// How big a snake is at its evolution level
var snakeSizeFor = function(a) {
    if (a.ana) { return 3.3; }
    return a.base * (1 + (a.evo - 1) * 0.03);
};

// The winner eats the loser, then evolves:
// its new level = its level + the loser's level (max 30)
var endSnakeBattle = function(win, lose) {
    sawDeath(lose.x);
    pitEvent("ko", win, lose);
    snd("ko", win.x);
    snd("gulp", win.x);
    win.wrapT = lose.wrapT = 0;
    win.poison = lose.poison = 0;
    sideWord("K.O.!", lose, [255, 70, 50]);
    lose.foe = null;
    lose.state = "eaten";
    lose.eater = win;
    lose.timer = 70;
    lose.cool = 99999;
    if (inView(win.x, 0)) { snakeMsg = win.name + " defeated " + lose.name + "!"; }
    win.foe = null;
    win.state = "eat";
    win.timer = 70;
    win.meal = lose.evo;
    win.mealName = lose.name || "its rival";
    if (win.ana) { win.fights = (win.fights || 0) + 1; }
    if (arenaIs("snake") && inPitX(win.x) && !win.ana) {
        win.blessed = snakeBonus();
        if (anaArena() && random(1) < 0.25) {
            // the Anaconda takes it back!
            win.blessed = 0;
            sideWord("BONUS RESET!", win, [255, 90, 60]);
            pitEvent("bonusreset", win, null);
            snd("hiss", win.x);
        }
        win.meal += win.blessed;
        if (anaArena()) {
            win.anaStreak = (win.anaStreak || 0) + 1;
            if (win.anaStreak >= ANA_STREAK) {
                win.pendingMorph = true;
            } else if (win.anaStreak === 10 || win.anaStreak === 15 || win.anaStreak >= 18) {
                pitEvent("streak", win, null);
            }
        }
    }
    if (lose.ana) {
        // beating the Anaconda makes you a Serpent King!
        win.meal = 29;
        win.mealName = "the ANACONDA";
        var kills = slayerCount(win) + 1;
        if (win.who) { win.who.anaKills = kills; } else { win.anaKills = kills; }
        snakeMsg = kills === 1 ? win.name + " SLEW THE ANACONDA!!!" :
                   win.name + " SLEW THE ANACONDA FOR THE " + ordinal(kills).toUpperCase() + " TIME!!! (ANACONDA SLAYER x" + kills + ")";
        sideWord(kills === 1 ? "ANACONDA SLAYER!" : "ANACONDA SLAYER x" + kills + "!", win, [255, 215, 90]);
        snd("king", win.x);
        snd("cheer", win.x);
        pitEvent("slayer", win, null);
    }
    snakeBurst((win.x + lose.x) / 2, GROUND - 10 * S, 14, [255, 230, 120], 1.4);
};

var evolveSnake = function(a) {
    if (a.ana) {
        // the Anaconda doesn't evolve - it just gets fuller
        a.meal = 0;
        a.meals++;
        a.hp = 0;
        a.state = "evolve";
        a.timer = 60;
        snakeBurst(a.x + a.dir * 16 * S * a.size, GROUND - 20 * S * a.size, 18, [200, 40, 50], 1.6);
        if (inView(a.x, 0)) {
            snakeMsg = "The Anaconda swallowed " + a.mealName + " whole!";
        }
        return;
    }
    var old = a.evo;
    snd(Math.min(30, a.evo + a.meal) >= 30 && old < 30 ? "king" : "levelup", a.x);
    a.evo = Math.min(30, a.evo + a.meal);
    a.meal = 0;
    a.wins++;
    pitEvent("evolve", a, null);
    if (a.blessed) {
        a.lastBonus = a.blessed;
        a.blessed = 0;
        pitEvent("bless", a, null);
        sideWord(bonusText(a.lastBonus), a, [220, 160, 255]);
    }
    if (a.who) {
        a.who.evo = a.evo;
        a.who.wins = a.wins;
        a.who.best = Math.max(a.who.best, a.evo);
    }
    a.hp = 0;
    a.state = "evolve";
    a.timer = 100;
    var hx = a.x + a.dir * 7 * S * a.size;
    snakeBurst(hx, GROUND - 20 * S * a.size, 26, [255, 235, 140], 2);
    snakeBurst(hx, GROUND - 20 * S * a.size, 16, [170, 120, 255], 1.6);
    if (inView(a.x, 0)) {
        if (a.mealName === "the ANACONDA") {
            snakeMsg = a.name + " ate the ANACONDA and became a Lv 30 SERPENT KING!";
        } else if (a.evo === 30 && old < 30) {
            snakeMsg = a.name + " is now the SERPENT KING! (Lv 30)";
        } else if (old === 30) {
            snakeMsg = "Serpent King " + a.name + " devours another challenger!";
        } else {
            snakeMsg = a.name + " ate " + a.mealName + " and evolved to Lv " + a.evo + "!";
        }
    }
};

// Each snake's moves - stronger snakes know more of them
var movesFor = function(evo, name, ana) {
    var m = ["bite", "bite", "bite", "whip"];
    if (evo >= 5 || name === "Lady Venom") { m.push("spit"); }
    if (evo >= 8) { m.push("wrap"); }
    if (ana) { m.push("wrap"); m.push("wrap"); }
    if (evo >= 17) { m.push("flame"); }
    return m;
};
// Inside the Fight SNAKE, everyone can only use the Fight Snake's own moves
var fightSnakeRules = function(a) {
    return arenaIs("snake") && fightPit.who && inPitX(a.x);
};
var snakeMoves = function(a) {
    var m = fightSnakeRules(a) ? movesFor(fightPit.who.evo, fightPit.who.name, !!fightPit.who.isAna) : movesFor(a.evo, a.name, a.ana);
    return m[Math.floor(random(m.length))];
};
// the Fight Snake's bonus: its level, but never more than 6
var snakeBonus = function(who) {
    who = who || (fightPit ? fightPit.who : null);
    if (!who) { return 1; }
    if (who.isAna) { return 7; }
    return Math.max(1, Math.min(6, who.evo));
};
var bonusText = function(n) {
    return "+" + n + " BONUS LEVEL" + (n === 1 ? "" : "S") + "!";
};
// "BITE, TAIL WHIP and VENOM SPIT"
var fightSnakeMoveList = function(who) {
    var m = movesFor(who.evo, who.name, !!who.isAna);
    var names = [];
    for (var i = 0; i < m.length; i++) {
        var n = moveNames[m[i]];
        if (names.indexOf(n) < 0) { names.push(n); }
    }
    if (names.length === 1) { return names[0]; }
    return names.slice(0, -1).join(", ") + " and " + names[names.length - 1];
};
var moveNames = { bite: "BITE", whip: "TAIL WHIP", spit: "VENOM SPIT", wrap: "CONSTRICT", flame: "FLAME TAIL" };

// a landed hit: critical hits, rage bonus and combos
var hurtSnake = function(a, b, dmg) {
    var crit = random(1) < ((arenaIs("cave") && inPitX(a.x)) ? 0.25 : 0.12);
    if (crit) { dmg *= 1.8; }
    if (a.hp < a.maxHp * 0.3) { dmg *= 1.25; }
    b.hp -= dmg;

    b.recoil = crit ? 14 : 8;
    a.combo = (a.combo || 0) + 1;
    b.combo = 0;
    if (crit) {
        pitEvent("crit", a, b);
        sideWord("CRITICAL!", b, [255, 80, 60]);
        snakeBurst(b.x, GROUND - 14 * S, 14, [255, 240, 150], 1.8);
    }
    snd(crit ? "crit" : "hit", b.x);
    if (a.combo >= 3) {
        pitEvent("combo", a, b);
        sideWord(a.combo + " HIT COMBO!", a, [255, 215, 90]);
    }
    if (b.hp > 0 && b.hp < b.maxHp * 0.3 && !b.lowSaid) {
        b.lowSaid = true;
        pitEvent("low", a, b);
        pitEvent("rage", b, a);
        sideWord("RAGE MODE!", b, [255, 60, 40]);
    }
};

// Venom globs fly, then land (poisoning the target if they hit)
var updateSpitShots = function() {
    for (var i = spitShots.length - 1; i >= 0; i--) {
        var sh = spitShots[i];
        sh.t++;
        if (sh.t < sh.max) { continue; }
        spitShots.splice(i, 1);
        if (sh.hit && sh.a.foe === sh.b && sh.b.foe === sh.a && sh.b.state === "fight") {
            hurtSnake(sh.a, sh.b, sh.dmg);
            sh.b.poison = 240;
            sh.b.poisonDmg = 2 + sh.a.evo * 0.25;
            snakeBurst(sh.tx, sh.ty, 12, [120, 230, 70], 1.4);
            snd("splat", sh.tx);
            sideWord("POISONED!", sh.b, [140, 240, 90]);
        } else {
            snakeBurst(sh.tx, GROUND - 2 * S, 8, [120, 200, 70], 1);
            snd("splat", sh.tx, 0.5);
        }
    }
};

var updateSnakeBattle = function(a) {
    var b = a.foe;
    if (!b || animals.indexOf(b) < 0 || b.foe !== a) {
        a.foe = null;
        a.wrapT = 0;
        a.state = "coil";
        a.timer = 120;
        return;
    }
    a.dir = b.x > a.x ? 1 : -1;
    a.timer--;
    if (a.moveAnimT > 0) { a.moveAnimT--; }

    // poison wears me down
    if (a.poison > 0) {
        a.poison--;
        if (a.poison % 30 === 0) {
            a.hp -= a.poisonDmg || 2;
            a.recoil = 4;
            snakeBurst(a.x, GROUND - 10 * S * a.size, 3, [120, 230, 80], 0.6);
            snd("poison", a.x, 0.7);
        }
    }
    // rage steam
    if (a.hp < a.maxHp * 0.3 && a.timer % 12 === 0) {
        snakeBurst(a.x, GROUND - 16 * S * a.size, 1, [255, 70, 40], 0.5);
    }

    if (b.wrapT > 0) {
        // I'm being squeezed! Maybe I can wriggle free...
        a.strike = 0;
        a.strikeT = 0;
        if (random(1) < 0.006) {
            b.wrapT = 0;
            a.x -= a.dir * 16 * S;
            pitEvent("breakfree", a, b);
            snd("breakfree", a.x);
            sideWord("BREAKS FREE!", a, [150, 220, 255]);
            snakeBurst(a.x, GROUND - 8 * S, 10, [190, 230, 255], 1.4);
        }
    } else if (a.wrapT > 0) {
        // squeezing!
        a.wrapT--;
        a.strike = 0;
        a.x = lerp(a.x, b.x, 0.3);
        if (a.wrapT % 20 === 0) {
            b.hp -= a.ana ? 22 : 6 + a.evo * 0.6;
            b.recoil = 6;
            snakeBurst(b.x, GROUND - 10 * S, 5, [190, 120, 255], 1);
            snd("creak", b.x, 0.8);
        }
        if (a.wrapT === 0) { a.x -= a.dir * 18 * S; }
    } else if (a.strikeT > 0) {
        // Strike!
        a.strikeT--;
        a.strike = Math.sin((1 - a.strikeT / 16) * PI);
        if (a.strikeT === 8) {
            var mv = a.move || "bite";
            // it's dark in the Fight Cave: everybody misses more
            var acc = (arenaIs("cave") && inPitX(a.x)) ? 0.8 : 1;
            // in the Fight Pond, snakes dive under the water to dodge
            if (inPond(a)) { acc *= 0.85; }
            // a nervous Anaconda (fighting a snake that's beaten it before) misses more
            if (a.ana && a.nervous) { acc *= Math.max(0.55, 1 - a.nervous * 0.1); }
            var base = random(14, 26) * (a.ana ? 3.2 : 1 + a.evo * 0.08);
            var hx = a.x + a.dir * 18 * S * a.size;
            a.moveName = moveNames[mv];
            a.moveF = frameCount;
            a.moveAnimT = 24;
            if (mv === "whip") {
                sideWord(inPond(a) ? "TIDAL WHIP!" : "TAIL WHIP!", a, inPond(a) ? [140, 220, 255] : [255, 230, 140]);
                snd("whoosh", a.x);
                if (inPond(a)) { snd("splash", a.x); snakeBurst(a.x, GROUND - 4 * S, 14, [190, 230, 245], 1.8); }
                if (random(1) < 0.75 * acc) {
                    hurtSnake(a, b, base * (inPond(a) ? 0.95 : 0.8));
                    b.x = constrain(b.x + a.dir * 16 * S, 10, WW - 10);
                    snakeBurst(b.x, GROUND - 3 * S, 10, [150, 120, 80], 1.6);
                    pitEvent("whip", a, b);
                } else {
                    a.combo = 0;
                    pitEvent("miss", a, b);
                }
            } else if (mv === "spit") {
                sideWord("VENOM SPIT!", a, [140, 240, 90]);
                snd("spit", a.x);
                var willHit = random(1) < 0.7 * acc;
                // a glob of venom arcs through the air and lands a moment later
                spitShots.push({ a: a, b: b, x: a.x + a.dir * 9 * S * a.size, y: GROUND - 26 * S * a.size,
                                 tx: b.x + (willHit ? 0 : a.dir * 26 * S), ty: GROUND - 10 * S * b.size,
                                 t: 0, max: 18, hit: willHit, dmg: base * 0.5 });
                if (willHit) {
                    pitEvent("spit", a, b);
                } else {
                    a.combo = 0;
                    pitEvent("miss", a, b);
                }
            } else if (mv === "wrap") {
                sideWord("CONSTRICT!", a, [200, 150, 255]);
                if (random(1) < 0.6 * acc) {
                    a.wrapT = 120;
                    pitEvent("wrap", a, b);
                    snd("squeeze", a.x);
                } else {
                    a.combo = 0;
                    pitEvent("miss", a, b);
                }
            } else if (mv === "flame") {
                sideWord("FLAME TAIL!", a, [255, 150, 40]);
                snd("flame", a.x);
                snakeBurst(hx, GROUND - 14 * S * a.size, 16, [255, 150, 40], 1.8);
                snakeBurst(hx, GROUND - 14 * S * a.size, 10, [255, 230, 120], 1.4);
                if (inPond(a)) {
                    sideWord("FIZZLE!", a, [180, 200, 220]);
                    snd("fizzle", a.x);
                    snakeBurst(hx, GROUND - 14 * S * a.size, 12, [220, 230, 240], 1.2);
                }
                if (random(1) < 0.7 * acc) {
                    hurtSnake(a, b, base * (inPond(a) ? 0.55 : 1.4));
                    pitEvent(inPond(a) ? "fizzle" : "flame", a, b);
                } else {
                    a.combo = 0;
                    pitEvent("miss", a, b);
                }
            } else {
                if (random(1) < 0.65 * acc) {
                    hurtSnake(a, b, base);
                    snakeBurst(hx, GROUND - 14 * S, 6, [200, 40, 50], 1);
                    snakeBurst(hx, GROUND - 2 * S, 5, [150, 120, 80], 1.2);
                    pitEvent("hit", a, b);
                    snd("bite", a.x);
                } else {
                    a.combo = 0;
                    snakeBurst(hx, GROUND - 2 * S, 4, [150, 120, 80], 0.8);
                    snd("whiff", a.x);
                    pitEvent("miss", a, b);
                }
            }
        }
    } else {
        a.strike = 0;
        var rate = 0.03 + a.evo * 0.001;
        if (a.hp < a.maxHp * 0.3) { rate *= 1.8; }
        if (random(1) < rate && b.strikeT === 0 && !(a.snareT > 0) && !(a.fallT > 0)) {
            a.strikeT = 16;
            a.move = snakeMoves(a);
        }
    }
    if (b.recoil) { b.recoil--; }

    // circle each other a little
    if (!(a.wrapT > 0) && !(b.wrapT > 0)) {
        a.x += Math.sin(a.timer * 0.05 + a.phase) * 0.25 * S;
        var gap = 12 * S * (a.size + b.size);
        var d = b.x - a.x;
        if (Math.abs(d) < gap) {
            a.x -= a.dir * 0.4 * S;
        } else if (Math.abs(d) > gap + 6 * S) {
            a.x += a.dir * 0.4 * S;
        }
    }

    if (b.hp <= 0) {
        endSnakeBattle(a, b);
    } else if (a.hp <= 0) {
        endSnakeBattle(b, a);
    } else if (a.timer <= 0 && b.hp > 0 && a.hp > 0) {
        // long stand-off: the healthier one wins
        if (a.hp / a.maxHp >= b.hp / b.maxHp) { endSnakeBattle(a, b); } else { endSnakeBattle(b, a); }
    }
};

// Is this snake ready for a fight? (not resting, leaving, eating or fighting)
// How many times has this snake beaten the Anaconda?
var slayerCount = function(a) {
    if (!a || a.ana) { return 0; }
    return a.who ? (a.who.anaKills || 0) : (a.anaKills || 0);
};
var ordinal = function(n) {
    var sfx = (n % 100 >= 11 && n % 100 <= 13) ? "th" : (["th", "st", "nd", "rd"][n % 10] || "th");
    return n + sfx;
};
var slayerTag = function(a) {
    var n = slayerCount(a);
    return n > 0 ? "ANACONDA SLAYER x" + n : "";
};
var snakeCanFight = function(b) {
    return b.type === "snake" && !b.foe && b.cool <= 0 &&
           (b.state === "slither" || b.state === "coil" || b.state === "hunt");
};

// The closest snake worth hunting (within most of a screen away)
var findPrey = function(a) {
    var best = null;
    var bestD = a.ana ? W * 1.3 : W * 0.75;
    for (var i = 0; i < animals.length; i++) {
        var b = animals[i];
        if (b === a || !snakeCanFight(b)) { continue; }
        // only the bravest snakes (Lv 15+) dare to hunt the Anaconda
        if (b.ana && a.evo < 15) { continue; }
        // with a Fight Pit, battles only happen inside it
        if (fightPit && !inPitX(b.x)) { continue; }
        var d = Math.abs(b.x - a.x);
        if (d < bestD) {
            bestD = d;
            best = b;
        }
    }
    return best;
};

// Two snakes that touch start a battle
var checkSnakeBattles = function() {
    for (var i = 0; i < animals.length; i++) {
        var a = animals[i];
        if (!snakeCanFight(a)) { continue; }
        for (var j = i + 1; j < animals.length; j++) {
            var b = animals[j];
            if (!snakeCanFight(b)) { continue; }
            // with a Fight Pit, snakes only battle inside it
            if (fightPit && (!inPitX(a.x) || !inPitX(b.x))) { continue; }
            if (arenaIs("flesh")) { continue; }
            if (Math.abs(a.x - b.x) < 16 * S * (a.size + b.size) / 2) {
                var anaS = a.ana ? a : (b.ana ? b : null);
                var slayer = anaS === a ? b : (anaS === b ? a : null);
                if (anaS && slayerCount(slayer) > 0 && random(1) < Math.min(0.85, 0.25 * slayerCount(slayer))) {
                    // "...nope."
                    anaS.cool = 420;
                    anaS.prey = null;
                    anaS.state = "slither";
                    anaS.dir = anaS.x < slayer.x ? -1 : 1;
                    anaS.tx = constrain(anaS.x + anaS.dir * 260 * S, 10, WW - 10);
                    slayer.cool = 60;
                    sideWord(pickLine(["...nope.", "*gulp*", "NOT YOU AGAIN", "uh oh"]), anaS, [200, 220, 255]);
                    pitEvent("anaflee", slayer, null);
                    if (inView(anaS.x, 0)) { snakeMsg = "The Anaconda saw " + slayer.name + " (Anaconda Slayer x" + slayerCount(slayer) + ")... and slithered away?!"; }
                    continue;
                }
                a.foe = b;
                b.foe = a;
                a.prey = b.prey = null;
                a.lowSaid = b.lowSaid = false;
                a.wrapT = b.wrapT = 0;
                a.poison = b.poison = 0;
                a.combo = b.combo = 0;
                a.moveF = b.moveF = -999;
                a.moveAnimT = b.moveAnimT = 0;
                a.hpShow = a.hpGhost = b.hpShow = b.hpGhost = 1;
                a.state = b.state = "fight";
                a.nervous = a.ana ? slayerCount(b) : 0;
                b.nervous = b.ana ? slayerCount(a) : 0;
                if (a.nervous || b.nervous) { sideWord("NERVOUS...", a.ana ? a : b, [200, 220, 255]); }
                a.maxHp = a.hp = a.ana ? 900 : 100 + a.evo * 12;
                b.maxHp = b.hp = b.ana ? 900 : 100 + b.evo * 12;
                a.strikeT = b.strikeT = 0;
                a.timer = b.timer = random(400, 600);
                a.dir = b.x > a.x ? 1 : -1;
                b.dir = -a.dir;
                snakeBurst((a.x + b.x) / 2, GROUND - 2 * S, 10, [150, 120, 80], 1.2);
                pitEvent("start", a, b);
                snd("fightStart", a.x);
                sawFight(a.x);
                if (inPond(a)) { snd("splash", a.x); }
                if (anaArena() && inPitX(a.x) && !a.ana && !b.ana && !a.fused && !b.fused && random(1) < 0.15) {
                    a.mergeIn = random(90, 260);
                }
                if (inView(a.x, 0)) {
                    snakeMsg = "Snake battle! " + a.name + " (" + (a.ana ? "GIANT" : "Lv " + a.evo) + ") vs " +
                               b.name + " (" + (b.ana ? "GIANT" : "Lv " + b.evo) + ")";
                }
                break;
            }
        }
    }
};

// Snakes leave by the nearest edge of the whole forest (not just the screen)
var snakeExitDir = function(x) {
    return x < WW / 2 ? -1 : 1;
};

var updateSnake = function(a) {
    a.phase += 0.25;
    if (a.grabbed || a.morphing || a.merging || a.trialing) { return false; }
    if (a.snareT > 0) { a.snareT--; }
    if (a.fallT > 0) { a.fallT--; }
    if ((a.snareT > 0 || a.fallT > 0) && a.state !== "fight" && a.state !== "eaten") { return false; }
    if (a.cool > 0 && a.cool < 99999) { a.cool--; }
    if (a.state !== "evolve") {
        a.size = snakeSizeFor(a);
    }

    // A Mystic tree lures nearby wandering snakes toward it
    if (a.state === "slither" && !a.lured && !fightPit && !a.bait) {
        var mt = mysticTree();
        if (mt) {
            a.lured = true;
            a.tx = constrain(mt.x + random(-60, 60) * S, 10, WW - 10);
        }
    }

    // The Anaconda stays for 3 years, then leaves the forest.
    // (Called by bait, it only stays for one year or one fight.)
    if (a.ana) {
        a.life--;
        var done = a.life <= 0 || (a.baited && (a.fights || 0) >= 1);
        if (done && a.state !== "leave" &&
            (a.state === "slither" || a.state === "coil" || a.state === "hunt")) {
            a.state = "leave";
            a.prey = null;
            a.bait = null;
            a.life = 0;
            a.dir = snakeExitDir(a.x);
            if (a.baited) {
                snakeMsg = (a.fights || 0) >= 1 ? "The Anaconda had its fight. It slithers back into the wild..." :
                                                  "A year has passed... the Anaconda slithers away.";
            } else {
                snakeMsg = "After 3 years, the Anaconda slithers out of the forest... (ate " +
                           a.meals + " snake" + (a.meals === 1 ? "" : "s") + ")";
            }
        }
    }

    // Is this snake's bait still on the ground?
    if (a.bait && baits.indexOf(a.bait) < 0) { a.bait = null; }

    // Shrewbert announces snakes entering the pit
    var nowInPit = inPitX(a.x);
    if (nowInPit && !a.wasInPit && a.state !== "eaten") {
        pitEvent(a.ana ? "ana" : "enter", a, null);
        anaArenaEnter(a);
    }
    a.wasInPit = nowInPit;

    // The Fight Pit calls every snake to it (after it enjoys any bait it just ate)
    if (a.lingerT > 0) { a.lingerT--; }
    if (fightPit && arenaIs("flesh") && fightPit.trial && !a.bait && !inPitX(a.x) &&
        (a.state === "slither" || a.state === "coil")) {
        // the Flesh Pit is busy: wait in line outside
        var wsp = fleshWaitSpot(a);
        if (Math.abs(a.x - wsp) > 12 * S) {
            a.state = "slither";
            a.tx = wsp;
        } else if (a.state === "slither") {
            a.state = "coil";
            a.timer = 9999;
        }
    } else if (fightPit && !a.bait && !(a.lingerT > 0) && !inPitX(a.x) &&
        ((a.state === "slither" && !inPitX(a.tx)) || a.state === "coil")) {
        a.state = "slither";
        a.tx = constrain(fightPit.x + random(-0.7, 0.7) * pitHalf(), 10, WW - 10);
    }

    // Snakes go looking for each other to battle
    if ((a.state === "slither" || a.state === "coil") && a.cool <= 0 && !a.bait &&
        (!fightPit || inPitX(a.x)) && !arenaIs("flesh")) {
        var prey = findPrey(a);
        if (prey) {
            a.state = "hunt";
            snd("hiss", a.x, 0.7);
            a.prey = prey;
            if (inView(a.x, 0) && snakeMsg === "" && a.name && prey.name) {
                snakeMsg = a.name + " is hunting " + prey.name + "!";
            }
        }
    }

    if (a.state === "hunt") {
        var p = a.prey;
        if (!p || animals.indexOf(p) < 0 || !snakeCanFight(p)) {
            // the prey got away (or someone else got it first)
            a.prey = null;
            a.state = "slither";
            a.tx = constrain(a.x + random(-80, 80) * S, 10, WW - 10);
        } else {
            a.dir = p.x > a.x ? 1 : -1;
            a.x = constrain(a.x + a.dir * (1.5 + (a.evo - 1) * 0.03) * S, 10, WW - 10);
        }
    } else if (a.state === "fight") {
        updateSnakeBattle(a);
    } else if (a.state === "eaten") {
        // pulled into the winner's jaws
        a.timer--;
        var e = a.eater;
        if (e && animals.indexOf(e) >= 0) {
            var mx = e.x + e.dir * 16 * S * e.size;
            a.x = lerp(a.x, mx, 0.08);
            a.dir = e.x > a.x ? 1 : -1;
        }
        if (a.timer <= 0) {
            releaseFused(a, true);
