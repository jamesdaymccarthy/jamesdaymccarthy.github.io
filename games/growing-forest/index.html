<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Growing Forest</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0c1230; }
  canvas { display: block; outline: none; touch-action: none; }
  #fs { position: fixed; left: 50%; top: 8px; transform: translateX(-50%); z-index: 4;
        font: 12px Arial, sans-serif; color: #fff; background: rgba(20, 20, 30, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.35); border-radius: 6px; padding: 4px 10px;
        cursor: pointer; opacity: 0.6; }
  #fs:hover, #snd:hover, #mus:hover { opacity: 1; }
  #fs { transform: translateX(-160%); }
  #mus { position: fixed; left: 50%; top: 8px; transform: translateX(62%); z-index: 4;
         font: 12px Arial, sans-serif; color: #fff; background: rgba(20, 20, 30, 0.55);
         border: 1px solid rgba(255, 255, 255, 0.35); border-radius: 6px; padding: 4px 10px;
         cursor: pointer; opacity: 0.6; }
  #snd { position: fixed; left: 50%; top: 8px; transform: translateX(-50%); z-index: 4;
         font: 12px Arial, sans-serif; color: #fff; background: rgba(20, 20, 30, 0.55);
         border: 1px solid rgba(255, 255, 255, 0.35); border-radius: 6px; padding: 4px 10px;
         cursor: pointer; opacity: 0.6; }
  #fsnote { position: fixed; left: 50%; top: 44px; transform: translateX(-50%); z-index: 6;
            display: none; max-width: 90%; background: rgba(25, 22, 30, 0.92); color: #fff;
            font: 14px/1.5 Arial, sans-serif; padding: 12px 16px; border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.3); text-align: center; }
  #err { position: fixed; left: 10px; right: 10px; bottom: 10px; display: none; z-index: 5;
         background: #3a0d12; color: #ffd9d9; font: 13px monospace; padding: 10px 12px;
         border-radius: 8px; white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="forest" tabindex="1"></canvas>
<button id="fs" title="Full screen (F)">Full screen (F)</button>
<button id="snd" title="Sound on/off (M)">Sound: ON (M)</button>
<button id="mus" title="Music on/off (U)">Music: ON (U)</button>
<div id="fsnote"></div>
<div id="err"></div>
<script>
window.onerror = function (msg, src, line, col) {
  var e = document.getElementById("err");
  e.style.display = "block";
  e.textContent = "Something went wrong: " + msg + " (line " + line + ")";
};
// Tiny Khan-Academy-style Processing runtime on top of Canvas 2D.
// Implements just what the forest program uses.
function makeKA(canvas, ctx, W, H, dpr) {
    var P = {};
    var doFill = true, doStroke = true;
    var fillStr = "rgba(255,255,255,1)", strokeStr = "rgba(0,0,0,1)";
    var sw = 1;
    var tAlignH = 37, tAlignV = 0, tSize = 12;
    var matStack = [];
    var shapePts = null;
    var lastFill = "", lastStroke = "", lastLW = -1, lastFont = "";

    function cl(v) { v = +v; if (!(v > 0)) { return 0; } return v > 255 ? 255 : v; }
    function css(r, g, b, a) {
        return "rgba(" + Math.round(cl(r)) + "," + Math.round(cl(g)) + "," +
            Math.round(cl(b)) + "," + (cl(a) / 255).toFixed(3) + ")";
    }
    function Col(r, g, b, a) { this.r = r; this.g = g; this.b = b; this.a = a; }
    function toCss(args) {
        var n = args.length, a0 = args[0];
        if (a0 instanceof Col) {
            return css(a0.r, a0.g, a0.b, n > 1 ? args[1] : a0.a);
        }
        if (n === 1) { return css(a0, a0, a0, 255); }
        if (n === 2) { return css(a0, a0, a0, args[1]); }
        if (n === 3) { return css(a0, args[1], args[2], 255); }
        return css(a0, args[1], args[2], args[3]);
    }

    P.PI = Math.PI;
    P.TWO_PI = Math.PI * 2;
    P.HALF_PI = Math.PI / 2;
    P.LEFT = 37; P.RIGHT = 39; P.UP = 38; P.DOWN = 40;
    P.CENTER = 3; P.TOP = 101; P.BOTTOM = 102; P.BASELINE = 0;
    P.CLOSE = 2;
    P.width = W;
    P.height = H;
    P.frameCount = 0;
    P.mouseX = 0; P.mouseY = 0;
    P.mouseIsPressed = false;
    P.mouseButton = 37;
    P.keyIsPressed = false;
    P.key = "";
    P.keyCode = 0;
    P.angleMode = "radians";
    P.draw = null;
    P.mousePressed = null;
    P.mouseReleased = null;
    P.mouseDragged = null;
    P.mouseClicked = null;
    P.mouseMoved = null;
    P.keyPressed = null;
    P.keyReleased = null;

    // ---------- math ----------
    P.random = function(a, b) {
        if (b === undefined) { return Math.random() * a; }
        return a + Math.random() * (b - a);
    };
    P.lerp = function(a, b, t) { return a + (b - a) * t; };
    P.map = function(v, a, b, c, d) { return c + (d - c) * ((v - a) / (b - a)); };
    P.constrain = function(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); };
    P.dist = function(x1, y1, x2, y2) {
        var dx = x2 - x1, dy = y2 - y1;
        return Math.sqrt(dx * dx + dy * dy);
    };
    P.abs = Math.abs; P.sqrt = Math.sqrt; P.sin = Math.sin; P.cos = Math.cos;
    P.floor = Math.floor; P.round = Math.round; P.min = Math.min; P.max = Math.max;

    // Perlin noise (2D/3D-ish, 0..1)
    var perm = [];
    (function() {
        var p = [], i;
        for (i = 0; i < 256; i++) { p[i] = i; }
        for (i = 255; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var tmp = p[i]; p[i] = p[j]; p[j] = tmp;
        }
        for (i = 0; i < 512; i++) { perm[i] = p[i & 255]; }
    })();
    function fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
    function grad(h, x, y, z) {
        h = h & 15;
        var u = h < 8 ? x : y, v = h < 4 ? y : (h === 12 || h === 14 ? x : z);
        return ((h & 1) ? -u : u) + ((h & 2) ? -v : v);
    }
    function pnoise(x, y, z) {
        var X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
        x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
        var u = fade(x), v = fade(y), w = fade(z);
        var A = perm[X] + Y, AA = perm[A] + Z, AB = perm[A + 1] + Z;
        var B = perm[X + 1] + Y, BA = perm[B] + Z, BB = perm[B + 1] + Z;
        var L = P.lerp;
        return L(L(L(grad(perm[AA], x, y, z), grad(perm[BA], x - 1, y, z), u),
                   L(grad(perm[AB], x, y - 1, z), grad(perm[BB], x - 1, y - 1, z), u), v),
                 L(L(grad(perm[AA + 1], x, y, z - 1), grad(perm[BA + 1], x - 1, y, z - 1), u),
                   L(grad(perm[AB + 1], x, y - 1, z - 1), grad(perm[BB + 1], x - 1, y - 1, z - 1), u), v), w);
    }
    P.noise = function(x, y, z) {
        y = y || 0; z = z || 0;
        var total = 0, amp = 0.5, freq = 1;
        for (var o = 0; o < 4; o++) {
            total += pnoise(x * freq, y * freq, z * freq) * amp;
            amp *= 0.5; freq *= 2;
        }
        return Math.max(0, Math.min(1, total * 0.9 + 0.5));
    };

    // ---------- colour ----------
    P.color = function(r, g, b, a) {
        if (g === undefined) { return new Col(r, r, r, 255); }
        if (b === undefined) { return new Col(r, r, r, g); }
        return new Col(r, g, b, a === undefined ? 255 : a);
    };
    P.red = function(c) { return c.r; };
    P.green = function(c) { return c.g; };
    P.blue = function(c) { return c.b; };
    P.alpha = function(c) { return c.a; };
    P.lerpColor = function(c1, c2, t) {
        t = t < 0 ? 0 : (t > 1 ? 1 : (t || 0));
        return new Col(c1.r + (c2.r - c1.r) * t, c1.g + (c2.g - c1.g) * t,
                       c1.b + (c2.b - c1.b) * t, c1.a + (c2.a - c1.a) * t);
    };

    // ---------- style ----------
    P.fill = function() { doFill = true; fillStr = toCss(arguments); };
    P.noFill = function() { doFill = false; };
    P.stroke = function() { doStroke = true; strokeStr = toCss(arguments); };
    P.noStroke = function() { doStroke = false; };
    P.strokeWeight = function(w) { sw = w; };
    P.textSize = function(s) { tSize = s; };
    P.textAlign = function(h, v) { tAlignH = h; tAlignV = v === undefined ? 0 : v; };

    function applyFill() {
        if (fillStr !== lastFill) { ctx.fillStyle = fillStr; lastFill = fillStr; }
    }
    function applyStroke() {
        if (strokeStr !== lastStroke) { ctx.strokeStyle = strokeStr; lastStroke = strokeStr; }
        if (sw !== lastLW) { ctx.lineWidth = sw; lastLW = sw; }
    }
    function paint() {
        if (doFill) { applyFill(); ctx.fill(); }
        if (doStroke) { applyStroke(); ctx.stroke(); }
    }

    // ---------- transforms ----------
    P.pushMatrix = function() { matStack.push(ctx.getTransform()); };
    P.popMatrix = function() { if (matStack.length) { ctx.setTransform(matStack.pop()); } };
    P.translate = function(x, y) { ctx.translate(x, y); };
    P.rotate = function(a) { ctx.rotate(a); };
    P.scale = function(x, y) { ctx.scale(x, y === undefined ? x : y); };
    P.resetMatrix = function() { ctx.setTransform(dpr, 0, 0, dpr, 0, 0); matStack.length = 0; };

    // ---------- shapes ----------
    P.line = function(x1, y1, x2, y2) {
        if (!doStroke) { return; }
        applyStroke();
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
    };
    P.ellipse = function(x, y, w, h) {
        w = Math.abs(w) / 2; h = Math.abs(h) / 2;
        if (!(w > 0) || !(h > 0)) { return; }
        ctx.beginPath();
        ctx.ellipse(x, y, w, h, 0, 0, Math.PI * 2);
        paint();
    };
    P.arc = function(x, y, w, h, a0, a1) {
        w = Math.abs(w) / 2; h = Math.abs(h) / 2;
        if (!(w > 0) || !(h > 0)) { return; }
        if (doFill) {
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.ellipse(x, y, w, h, 0, a0, a1);
            ctx.closePath();
            applyFill();
            ctx.fill();
        }
        if (doStroke) {
            ctx.beginPath();
            ctx.ellipse(x, y, w, h, 0, a0, a1);
            applyStroke();
            ctx.stroke();
        }
    };
    P.rect = function(x, y, w, h, r) {
        if (w < 0) { x += w; w = -w; }
        if (h < 0) { y += h; h = -h; }
        ctx.beginPath();
        if (r && r > 0) {
            r = Math.min(r, w / 2, h / 2);
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
        } else {
            ctx.rect(x, y, w, h);
        }
        paint();
    };
    P.triangle = function(x1, y1, x2, y2, x3, y3) {
        ctx.beginPath();
        ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x3, y3);
        ctx.closePath();
        paint();
    };
    P.quad = function(x1, y1, x2, y2, x3, y3, x4, y4) {
        ctx.beginPath();
        ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x3, y3); ctx.lineTo(x4, y4);
        ctx.closePath();
        paint();
    };
    P.point = function(x, y) {
        if (!doStroke) { return; }
        applyFill();
        var s = Math.max(1, sw);
        ctx.fillStyle = strokeStr; lastFill = strokeStr;
        ctx.fillRect(x - s / 2, y - s / 2, s, s);
    };
    P.beginShape = function() { shapePts = []; };
    P.vertex = function(x, y) { if (shapePts) { shapePts.push(x, y); } };
    P.endShape = function(mode) {
        var p = shapePts;
        shapePts = null;
        if (!p || p.length < 4) { return; }
        ctx.beginPath();
        ctx.moveTo(p[0], p[1]);
        for (var i = 2; i < p.length; i += 2) { ctx.lineTo(p[i], p[i + 1]); }
        if (mode === P.CLOSE) { ctx.closePath(); }
        if (doFill) { applyFill(); ctx.fill(); }
        if (doStroke) { applyStroke(); ctx.stroke(); }
    };

    // ---------- text ----------
    function setFont() {
        var f = tSize + "px Arial, Helvetica, sans-serif";
        if (f !== lastFont) { ctx.font = f; lastFont = f; }
    }
    P.textWidth = function(s) { setFont(); return ctx.measureText(String(s)).width; };
    P.text = function(s, x, y) {
        if (!doFill) { return; }
        setFont();
        applyFill();
        ctx.textAlign = tAlignH === P.CENTER ? "center" : (tAlignH === P.RIGHT ? "right" : "left");
        ctx.textBaseline = tAlignV === P.TOP ? "top" : (tAlignV === P.CENTER ? "middle" :
                           (tAlignV === P.BOTTOM ? "bottom" : "alphabetic"));
        ctx.fillText(String(s), x, y);
    };

    // the runner changes this when the window is resized
    P.__setScale = function(s) { dpr = s; };

    // called by the runner before each frame
    P.__beginFrame = function() {
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        matStack.length = 0;
        lastFill = lastStroke = lastFont = ""; lastLW = -1;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
    };
    return P;
}

if (typeof module !== "undefined") { module.exports = makeKA; }

// ---- Sound + music engine: everything is synthesized live (no sound files) ----
function makeSfx(win, opts) {
    opts = opts || {};
    var AC = win.AudioContext || win.webkitAudioContext;
    var ctx = null;
    var master, sfxBus, musicBus, musicFade, revIn, caveIn, noiseBuf, irBuf;
    var MUSVOL = 0.62;
    var caveMode = false;
    var muted = false;
    var musicOn = true;
    var last = {};
    var minGap = { thunder: 0.5, rain: 0.8, crackle: 0.6, ignite: 0.3, pendulum: 0.5, saw: 2.5, rumble: 0.8, trapclick: 0.12, hit: 0.05, bite: 0.07, whiff: 0.08, hiss: 0.7, creak: 0.18, chirp: 0.2,
                   cricket: 0.25, shrew: 0.06, cheer: 1.0, poison: 0.25, hatch: 0.3, click: 0.03,
                   drip: 0.15, splat: 0.08, whoosh: 0.1, crit: 0.1, ko: 0.3, gulp: 0.3 };

    // ---------- plumbing ----------
    var makeIR = function(secs, decay) {
        var len = Math.floor(ctx.sampleRate * secs);
        var b = ctx.createBuffer(2, len, ctx.sampleRate);
        for (var ch = 0; ch < 2; ch++) {
            var d = b.getChannelData(ch);
            for (var i = 0; i < len; i++) {
                d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
            }
        }
        return b;
    };
    var setup = function(c) {
        ctx = c;
        master = ctx.createGain();
        master.gain.value = 0.9;
        var comp = ctx.createDynamicsCompressor();
        comp.threshold.value = -12;
        comp.ratio.value = 4;
        comp.attack.value = 0.004;
        comp.release.value = 0.2;
        master.connect(comp);
        comp.connect(ctx.destination);
        sfxBus = ctx.createGain();
        sfxBus.gain.value = 0.75;
        sfxBus.connect(master);
        musicFade = ctx.createGain();
        musicFade.gain.value = 1;
        musicBus = ctx.createGain();
        musicBus.gain.value = MUSVOL;
        musicFade.connect(musicBus);
        musicBus.connect(master);
        var conv = ctx.createConvolver();
        irBuf = makeIR(2.2, 4);
        conv.buffer = irBuf;
        revIn = ctx.createGain();
        revIn.gain.value = 0.35;
        revIn.connect(conv);
        conv.connect(master);
        // a big echoey cave reverb, only used by the cave music
        var cconv = ctx.createConvolver();
        cconv.buffer = makeIR(4.5, 2.6);
        caveIn = ctx.createGain();
        caveIn.gain.value = 0.5;
        caveIn.connect(cconv);
        cconv.connect(musicFade);
        noiseBuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 2), ctx.sampleRate);
        var nd = noiseBuf.getChannelData(0);
        for (var i = 0; i < nd.length; i++) { nd[i] = Math.random() * 2 - 1; }
    };
    var ensure = function() {
        if (opts.ctx) {
            if (!ctx) { setup(opts.ctx); }
            return ctx;
        }
        if (!AC) { return null; }
        if (!ctx) { setup(new AC()); }
        if (ctx.state === "suspended") { ctx.resume(); }
        return ctx;
    };

    // where a voice goes: volume, stereo pan, reverb send, sfx or music bus
    var route = function(o) {
        var g = ctx.createGain();
        g.gain.value = o.vol;
        var node = g;
        if (ctx.createStereoPanner) {
            var p = ctx.createStereoPanner();
            p.pan.value = Math.max(-1, Math.min(1, o.pan || 0));
            g.connect(p);
            node = p;
        }
        node.connect(o.music ? musicFade : sfxBus);
        if (o.rev) {
            var s = ctx.createGain();
            s.gain.value = o.rev * (o.music ? 0.6 : 1);
            node.connect(s);
            s.connect(revIn);
        }
        if (o.music && caveMode) {
            var cs = ctx.createGain();
            cs.gain.value = 0.7;
            node.connect(cs);
            cs.connect(caveIn);
        }
        return g;
    };

    // an amplitude envelope: quick attack, then a curved fade to silence
    var envelope = function(g, t, a, dur, hold) {
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(1, t + a);
        if (hold) { g.gain.setValueAtTime(1, t + a + hold); }
        g.gain.setTargetAtTime(0.0001, t + a + (hold || 0), Math.max(0.005, (dur - a - (hold || 0)) / 4));
    };

    // ---------- building blocks ----------
    // o: {type, f, to, glide, a, dur, hold, vol, pan, rev, music, lp, lpTo, q, vib, vibDepth, detune, at}
    var osc = function(o) {
        var t = o.at;
        var dur = o.dur;
        var v = ctx.createOscillator();
        v.type = o.type || "sine";
        v.frequency.setValueAtTime(o.f, t);
        if (o.to) { v.frequency.exponentialRampToValueAtTime(Math.max(5, o.to), t + (o.glide || dur)); }
        if (o.detune) { v.detune.value = o.detune; }
        var src = v;
        if (o.vib) {
            var lfo = ctx.createOscillator();
            var lg = ctx.createGain();
            lfo.frequency.value = o.vib;
            lg.gain.value = o.vibDepth || o.f * 0.02;
            lfo.connect(lg);
            lg.connect(v.frequency);
            lfo.start(t);
            lfo.stop(t + dur + 0.1);
        }
        var g = ctx.createGain();
        envelope(g, t, o.a || 0.004, dur, o.hold);
        if (o.lp) {
            var f = ctx.createBiquadFilter();
            f.type = "lowpass";
            f.frequency.setValueAtTime(o.lp, t);
            if (o.lpTo) { f.frequency.exponentialRampToValueAtTime(Math.max(30, o.lpTo), t + dur * 0.8); }
            f.Q.value = o.q || 0.8;
            src.connect(f);
            f.connect(g);
        } else {
            src.connect(g);
        }
        g.connect(route(o));
        v.start(t);
        v.stop(t + dur + 0.2);
        return v;
    };
    // o: {ftype, f, to, q, a, dur, hold, vol, pan, rev, music, at, am, amDepth}
    var nz = function(o) {
        var t = o.at;
        var dur = o.dur;
        var s = ctx.createBufferSource();
        s.buffer = noiseBuf;
        s.loop = true;
        var f = ctx.createBiquadFilter();
        f.type = o.ftype || "lowpass";
        f.frequency.setValueAtTime(o.f, t);
        if (o.to) { f.frequency.exponentialRampToValueAtTime(Math.max(30, o.to), t + (o.glide || dur)); }
        f.Q.value = o.q || 0.8;
        var g = ctx.createGain();
        envelope(g, t, o.a || 0.003, dur, o.hold);
        s.connect(f);
        if (o.am) {
            // flutter / grain: a fast wobble in volume
            var tr = ctx.createGain();
            tr.gain.value = 1 - (o.amDepth || 0.8);
            var lfo = ctx.createOscillator();
            lfo.type = "square";
            lfo.frequency.value = o.am;
            var lg = ctx.createGain();
            lg.gain.value = o.amDepth || 0.8;
            lfo.connect(lg);
            lg.connect(tr.gain);
            lfo.start(t);
            lfo.stop(t + dur + 0.1);
            f.connect(tr);
            tr.connect(g);
        } else {
            f.connect(g);
        }
        g.connect(route(o));
        s.start(t, Math.random() * 1.5);
        s.stop(t + dur + 0.2);
    };
    // metal: inharmonic partials (bells, gongs, chimes)
    var metal = function(base, ratios, amps, decays, t, vol, pan, rev, music) {
        for (var i = 0; i < ratios.length; i++) {
            osc({ type: "sine", f: base * ratios[i], dur: decays[i], a: 0.002, vol: vol * amps[i],
                  pan: pan, rev: rev, music: music, at: t });
        }
    };
    // FM bell / glassy pluck
    var fmBell = function(f, t, dur, vol, pan, ratio, index, rev, music) {
        var car = ctx.createOscillator();
        var mod = ctx.createOscillator();
        var mg = ctx.createGain();
        car.frequency.value = f;
        mod.frequency.value = f * (ratio || 3.5);
        mg.gain.setValueAtTime(f * (index || 2), t);
        mg.gain.exponentialRampToValueAtTime(Math.max(1, f * 0.05), t + dur);
        mod.connect(mg);
        mg.connect(car.frequency);
        var g = ctx.createGain();
        envelope(g, t, 0.003, dur);
        car.connect(g);
        g.connect(route({ vol: vol, pan: pan, rev: rev, music: music }));

var snd = function(name, x, vol, arg) {
    if (typeof sfx !== "function") { return; }
    var v = vol === undefined ? 1 : vol;
    var pan = 0;
    if (x !== undefined && x !== null) {
        if (pitView) {
            if (!fightPit || !inPitX(x)) { return; }
        } else {
            var sx = x - camX;
            if (sx < -W * 0.3 || sx > W * 1.3) { return; }
            if (fightPit && (fightPit.type === "cave" || fightPit.type === "tree") && inPitX(x)) { v *= 0.5; }
            pan = Math.max(-1, Math.min(1, (sx - W / 2) / (W / 2))) * 0.8;
        }

};

    var kw = constrain(tr.trunkW * tr.sc * 0.4, 8 * S, 13 * S);

// Typing "repete" inside the Anaconda: the laser, right now, on the best snake in there

    }
    if (fightPit.morph) {
        showToast("The laser is already happening!");

    for (var i = 0; i < animals.length; i++) {
        var a = animals[i];
        if (a.type !== "snake" || a.ana || !inPitX(a.x) || a.state === "eaten" || a.grabbed) { continue; }
        var score = (a.anaStreak || 0) * 100 + a.evo;

    }

// runs once per frame (so the animations look right at any game speed)

    var L = fightPit.lunge;
    if (L) {
        var age = frameCount - L.f0;
        if (!L.done && age >= 24) {
            L.done = true;
            var v = L.v;
            if (animals.indexOf(v) >= 0) {
                v.grabbed = false;
                v.state = "eaten";
                v.eater = null;
                v.timer = 70;
                fightPit.gift = (fightPit.gift || 0) + v.evo;
                fightPit.giftFrom = v.name;
                sideWord("CHOMP!", v, [255, 80, 60]);
                snakeBurst(v.x, GROUND - 14 * S, 22, [200, 40, 50], 1.8);
                snd("chomp", v.x);
                snd("gulp", v.x);
                pitEvent("anaeat", v, null);
                sawDeath(v.x);

                    snakeMsg = "The Anaconda arena swallowed " + v.name + "! The next snake in gets " + fightPit.gift + " levels!";
                }

        if (mage === 130) { snd("shrivel", a.x); }
        var f = constrain((mage - 110) / 260, 0, 1);
        f = f * f * (3 - 2 * f);

                       random(1) < 0.5 ? [255, 60, 50] : [120, 140, 60], 0.9);
        }
        if (mage >= 60 && mage < 220) { pitShake = Math.min(18, pitShake + 1.2); }

// ---- the Pit of DEATH's booby traps ----
// Every trap is a real thing built into the pit, at its own spot. Snakes set them
// off by crawling over pressure plates, tripwires and snares - and a few of them
// run on their own clockwork. Positions are in "arena units": the floor is a
// circle about 0.85 across, centre (0, 0), as seen in the top view.
var trapNames = {
    spikes: "SPIKE PLATE!", trapdoor: "TRAPDOOR!", blade: "PENDULUM BLADE!", flame: "FLAME JET!",
    darts: "POISON DARTS!", boulder: "ROLLING BOULDER!", saw: "BUZZ SAW!", snare: "SNARE!"
};
var makeDeathTraps = function() {
    return [
        { kind: "spikes", x: 0.42, y: -0.25, r: 0.12, st: "idle", t: 0 },
        { kind: "spikes", x: -0.45, y: 0.22, r: 0.12, st: "idle", t: 0 },
        { kind: "trapdoor", x: 0.02, y: 0.34, r: 0.12, st: "idle", t: 0, who: null },
        { kind: "blade", y: -0.05, amp: 0.74, phase: 0, lastSide: 0 },
        { kind: "flame", ang: PI * 1.08, st: "idle", t: 260 },
        { kind: "flame", ang: -PI * 0.06, st: "idle", t: 520 },
        { kind: "darts", x1: 0.12, x2: 0.66, y: 0.11, st: "idle", t: 0, who: null },
        { kind: "boulder", px: -0.12, py: -0.27, pr: 0.1, ang: -PI * 0.68, st: "idle", t: 0, bx: 0, by: 0, vx: 0, vy: 0, rot: 0 },
        { kind: "saw", x1: -0.74, x2: -0.22, y: -0.22, st: "hidden", t: 500, pos: 0, dir: 1, passes: 0 },
        { kind: "snare", x: 0.5, y: 0.24, r: 0.09, ang: PI * 0.18, st: "idle", t: 0, who: null }
    ];
};
// the top view's size (traps are drawn there and in the forest view)
var topGeom = function() {
    return { cx: W / 2, cy: H / 2 + 18, R: Math.min(W * 0.34, H * 0.31) };
};
// where a snake is, in arena units
var trapPos = function(s) {
    if (pitView && s.topX !== undefined) {
        var g = topGeom();
        return { x: (s.topX - g.cx) / g.R, y: (s.topY - g.cy) / g.R };
    }
    if (s.pitY === undefined) { s.pitY = random(-0.6, 0.6); }
    return { x: (s.x - fightPit.x) / pitHalf() * 0.75, y: s.pitY * 0.62 };
};
// arena units -> forest x
var trapWX = function(ax) {
    return fightPit.x + ax / 0.75 * pitHalf();
};
var distToSeg = function(px, py, x1, y1, x2, y2) {
    var dx = x2 - x1;
    var dy = y2 - y1;
    var u = constrain(((px - x1) * dx + (py - y1) * dy) / (dx * dx + dy * dy), 0, 1);
    return dist(px, py, x1 + u * dx, y1 + u * dy);
};
// a trap gets a snake
var trapHit = function(s, kind, dmg) {
    if (s.ana) { dmg *= 2.5; }
    if (s.state === "fight") { s.hp -= dmg; }
    s.recoil = 10;
    s.trapKind = kind;
    s.trapCool = 50;
    sideWord(trapNames[kind], s, [255, 70, 50]);
    snakeBurst(s.x, GROUND - 14 * S * s.size, 10, kind === "flame" ? [255, 140, 40] : (kind === "darts" ? [140, 230, 80] : [200, 40, 50]), 1.3);
    pitEvent("trap", s, null);
};
var pitSnakes = function() {
    var out = [];
    for (var i = 0; i < animals.length; i++) {
        var s = animals[i];
        if (s.type === "snake" && inPitX(s.x) && s.state !== "eaten" && !s.grabbed && !s.morphing) { out.push(s); }
    }
    return out;
};

// runs every game step
var deathTraps = function() {
    if (!arenaIs("death")) { return; }
    if (!fightPit.traps) { fightPit.traps = makeDeathTraps(); }
    var snakes = pitSnakes();
    var i, j, s, p;
    for (i = 0; i < snakes.length; i++) {
        s = snakes[i];
        if (s.trapCool > 0) { s.trapCool--; }
    }
    // when nobody is watching from above, snakes still wander around the pit floor
    if (!pitView) {
        for (i = 0; i < snakes.length; i++) {
            s = snakes[i];
            if (s.pitY === undefined) { s.pitY = random(-0.6, 0.6); }
            if (s.foe && s.foe.pitY !== undefined) {
                s.pitY = lerp(s.pitY, s.foe.pitY, 0.01);
            }
            s.pitY = constrain(s.pitY + Math.sin(frameCount * 0.013 + (s.phase || 0) * 0.01 + i) * 0.006, -0.75, 0.75);
        }
    }
    var free = function(sn) { return !(sn.trapCool > 0) && !(sn.fallT > 0) && !(sn.snareT > 0); };
    for (j = 0; j < fightPit.traps.length; j++) {
        var tr = fightPit.traps[j];
        if (tr.t > 0) { tr.t--; }
        if (tr.kind === "spikes") {
            // step on the plate: CLICK... then the spikes come up
            if (tr.st === "idle") {
                for (i = 0; i < snakes.length; i++) {
                    p = trapPos(snakes[i]);
                    if (free(snakes[i]) && dist(p.x, p.y, tr.x, tr.y) < tr.r) {
                        tr.st = "armed";
                        tr.t = 22;
                        snd("trapclick", trapWX(tr.x), 0.8);
                        break;
                    }
                }
            } else if (tr.st === "armed" && tr.t <= 0) {
                tr.st = "up";
                tr.t = 70;
                snd("spikes", trapWX(tr.x));
                for (i = 0; i < snakes.length; i++) {
                    p = trapPos(snakes[i]);
                    if (dist(p.x, p.y, tr.x, tr.y) < tr.r * 1.25) { trapHit(snakes[i], "spikes", random(10, 16)); }
                }
            } else if (tr.st === "up" && tr.t <= 0) {
                tr.st = "reset";
                tr.t = 200;
            } else if (tr.st === "reset" && tr.t <= 0) {
                tr.st = "idle";
            }
        } else if (tr.kind === "trapdoor") {
            if (tr.st === "idle") {
                for (i = 0; i < snakes.length; i++) {
                    p = trapPos(snakes[i]);
                    if (free(snakes[i]) && dist(p.x, p.y, tr.x, tr.y) < tr.r) {
                        tr.st = "open";
                        tr.t = 150;
                        tr.who = snakes[i];
                        snakes[i].fallT = 140;
                        snd("trapdoor", trapWX(tr.x));
                        trapHit(snakes[i], "trapdoor", random(7, 12));
                        break;
                    }
                }
            } else if (tr.st === "open" && tr.t <= 0) {
                tr.st = "reset";
                tr.t = 240;
                tr.who = null;
            } else if (tr.st === "reset" && tr.t <= 0) {
                tr.st = "idle";
            }
        } else if (tr.kind === "blade") {
            // the pendulum never stops
            tr.phase += 0.024;
            var bx = Math.sin(tr.phase) * tr.amp;
            var side = bx > 0 ? 1 : -1;
            if (side !== tr.lastSide) {
                tr.lastSide = side;
                tr.hit = [];
                if (pitView) { snd("pendulum", fightPit.x, 0.5); }
            }
            for (i = 0; i < snakes.length; i++) {
                p = trapPos(snakes[i]);
                if (free(snakes[i]) && Math.abs(p.x - bx) < 0.045 && Math.abs(p.y - tr.y) < 0.09 &&
                    (tr.hit || []).indexOf(snakes[i]) < 0) {
                    tr.hit = (tr.hit || []).concat([snakes[i]]);
                    snd("blade", snakes[i].x);
                    trapHit(snakes[i], "blade", random(11, 17));
                }
            }
        } else if (tr.kind === "flame") {
            // pilot light... then a jet of fire across the floor
            if (tr.st === "idle" && tr.t <= 0) {
                tr.st = "warn";
                tr.t = 45;
                snd("trapclick", trapWX(Math.cos(tr.ang) * 0.98), 0.6);
            } else if (tr.st === "warn" && tr.t <= 0) {
                tr.st = "fire";
                tr.t = 75;
                tr.hit = [];
                snd("flame", trapWX(Math.cos(tr.ang) * 0.98));
            } else if (tr.st === "fire") {
                var nx = Math.cos(tr.ang) * 0.98;
                var ny = Math.sin(tr.ang) * 0.98;
                var reach = 0.95 * Math.min(1, (75 - tr.t) / 12);
                for (i = 0; i < snakes.length; i++) {
                    p = trapPos(snakes[i]);
                    var dx = p.x - nx;
                    var dy = p.y - ny;
                    var along = -(dx * Math.cos(tr.ang) + dy * Math.sin(tr.ang));
                    var across = Math.abs(-dx * Math.sin(tr.ang) + dy * Math.cos(tr.ang));
                    if (free(snakes[i]) && along > 0 && along < reach && across < 0.06 + along * 0.22 && tr.hit.indexOf(snakes[i]) < 0) {
                        tr.hit.push(snakes[i]);
                        trapHit(snakes[i], "flame", random(8, 12));
                    }
                }
                if (tr.t <= 0) {
                    tr.st = "idle";
                    tr.t = random(420, 760);
                }
            }
        } else if (tr.kind === "darts") {
            // trip the wire and darts shoot out of the wall
            if (tr.st === "idle") {
                for (i = 0; i < snakes.length; i++) {
                    p = trapPos(snakes[i]);
                    if (free(snakes[i]) && p.x > tr.x1 && p.x < tr.x2 && Math.abs(p.y - tr.y) < 0.035) {
                        tr.st = "fly";
                        tr.t = 30;
                        tr.who = snakes[i];
                        tr.tx = p.x;
                        snd("trapclick", trapWX(p.x), 0.7);
                        snd("darts", trapWX(0.9));
                        break;
                    }
                }
            } else if (tr.st === "fly" && tr.t <= 0) {
                var dv = tr.who;
                if (dv && animals.indexOf(dv) >= 0 && dv.state !== "eaten") {
                    trapHit(dv, "darts", random(4, 7));
                    if (dv.state === "fight") {
                        dv.poison = 240;
                        dv.poisonDmg = 3;
                    }
                }
                tr.st = "reset";
                tr.t = 260;
                tr.who = null;
            } else if (tr.st === "reset" && tr.t <= 0) {
                tr.st = "idle";
            }
        } else if (tr.kind === "boulder") {
            // a loose stone in the floor: step on it and a boulder rolls out of the chute
            var cxw = Math.cos(tr.ang) * 1.0;
            var cyw = Math.sin(tr.ang) * 1.0;
            if (tr.st === "idle") {
                for (i = 0; i < snakes.length; i++) {
                    p = trapPos(snakes[i]);
                    if (free(snakes[i]) && dist(p.x, p.y, tr.px, tr.py) < tr.pr) {
                        tr.st = "rumble";
                        tr.t = 50;
                        snd("trapclick", trapWX(tr.px), 0.8);
                        snd("rumble", trapWX(cxw));
                        break;
                    }
                }
            } else if (tr.st === "rumble" && tr.t <= 0) {
                tr.st = "roll";
                tr.bx = cxw;
                tr.by = cyw;
                tr.vx = -Math.cos(tr.ang) * 0.016;
                tr.vy = -Math.sin(tr.ang) * 0.016;
            } else if (tr.st === "roll") {
                tr.bx += tr.vx;
                tr.by += tr.vy;
                tr.rot += 0.016 / 0.09;
                for (i = 0; i < snakes.length; i++) {
                    p = trapPos(snakes[i]);
                    if (free(snakes[i]) && dist(p.x, p.y, tr.bx, tr.by) < 0.13) {
                        snd("boulder", snakes[i].x);
                        trapHit(snakes[i], "boulder", random(14, 22));
                    }
                }
                if (dist(0, 0, tr.bx, tr.by) > 0.95 && tr.bx * tr.vx + tr.by * tr.vy > 0) {
                    // smashes into the far wall
                    tr.st = "smash";
                    tr.t = 30;
                    snd("boulder", trapWX(tr.bx), 0.7);
                    pitShake = Math.min(18, pitShake + 8);
                }
            } else if (tr.st === "smash" && tr.t <= 0) {
                tr.st = "reset";
                tr.t = 360;
            } else if (tr.st === "reset" && tr.t <= 0) {
                tr.st = "idle";
            }
        } else if (tr.kind === "saw") {
            // a buzz saw rises out of its slot, zooms back and forth, then sinks again
            if (tr.st === "hidden" && tr.t <= 0) {
                tr.st = "rise";
                tr.t = 30;
                tr.pos = 0;
                tr.dir = 1;
                tr.passes = 0;
                snd("saw", trapWX((tr.x1 + tr.x2) / 2));
            } else if (tr.st === "rise" && tr.t <= 0) {
                tr.st = "run";
            } else if (tr.st === "run") {
                tr.pos += tr.dir * 0.011;
                if (tr.pos >= 1 || tr.pos <= 0) {
                    tr.pos = constrain(tr.pos, 0, 1);
                    tr.dir = -tr.dir;
                    tr.passes++;
                    if (tr.passes >= 3) {
                        tr.st = "sink";
                        tr.t = 30;
                    }
                }
                var sx = lerp(tr.x1, tr.x2, tr.pos);
                for (i = 0; i < snakes.length; i++) {
                    p = trapPos(snakes[i]);
                    if (free(snakes[i]) && dist(p.x, p.y, sx, tr.y) < 0.1) {
                        trapHit(snakes[i], "saw", random(9, 14));
                    }
                }
            } else if (tr.st === "sink" && tr.t <= 0) {
                tr.st = "hidden";
                tr.t = random(500, 900);
            }
        } else if (tr.kind === "snare") {
            // a rope loop tied to a bent sapling: step in and WHOOSH, you're hanging upside down
            if (tr.st === "idle") {
                for (i = 0; i < snakes.length; i++) {
                    p = trapPos(snakes[i]);
                    if (free(snakes[i]) && dist(p.x, p.y, tr.x, tr.y) < tr.r) {
                        tr.st = "hang";
                        tr.t = 170;
                        tr.who = snakes[i];
                        snakes[i].snareT = 160;
                        snd("snare", trapWX(tr.x));
                        trapHit(snakes[i], "snare", random(3, 6));
                        break;
                    }
                }
            } else if (tr.st === "hang" && tr.t <= 0) {
                tr.st = "reset";
                tr.t = 300;
                tr.who = null;
            } else if (tr.st === "reset" && tr.t <= 0) {
                tr.st = "idle";
            }
        }
    }
};

// ---------- drawing the traps, seen from above ----------
var drawTrapsTop = function(cx, cy, R, over) {
    if (!fightPit || !fightPit.traps) { return; }
    var i, j, tr;
    var P2 = function(ax, ay) { return { x: cx + ax * R, y: cy + ay * R }; };
    noStroke();
    for (j = 0; j < fightPit.traps.length; j++) {
        tr = fightPit.traps[j];
        var p, q;
        if (tr.kind === "spikes" && !over) {
            p = P2(tr.x, tr.y);
            var pr = tr.r * R;
            fill(40, 36, 36);
            ellipse(p.x, p.y, pr * 2.15, pr * 2.15);
            fill(tr.st === "armed" ? color(150, 140, 120) : color(95, 92, 90));
            ellipse(p.x, p.y + (tr.st === "armed" ? 1.5 : 0), pr * 2, pr * 2);
            fill(30, 28, 28);
            for (i = 0; i < 19; i++) {
                var ha = i * 2.4;
                var hr = Math.sqrt(i / 19) * pr * 0.8;
                ellipse(p.x + Math.cos(ha) * hr, p.y + Math.sin(ha) * hr, pr * 0.16, pr * 0.16);
            }
        }
        if (tr.kind === "spikes" && over && (tr.st === "up" || (tr.st === "reset" && tr.t > 180))) {
            p = P2(tr.x, tr.y);
            var up = tr.st === "up" ? Math.min(1, (70 - tr.t) / 4) : (tr.t - 180) / 20;
            for (i = 0; i < 19; i++) {
                var ha2 = i * 2.4;
                var hr2 = Math.sqrt(i / 19) * tr.r * R * 0.8;
                var sxp = p.x + Math.cos(ha2) * hr2;
                var syp = p.y + Math.sin(ha2) * hr2;
                // seen from above, a spike is a shiny cone pointing at you
                fill(0, 0, 0, 60);
                ellipse(sxp + 3 * up, syp + 4 * up, 9 * up, 9 * up);
                fill(150, 152, 160);
                ellipse(sxp, syp, 10 * up, 10 * up);
                fill(220, 222, 230);
                ellipse(sxp - 1.5 * up, syp - 1.5 * up, 4 * up, 4 * up);
                if (tr.st === "up" && tr.t < 66) {
                    fill(150, 20, 20, 160);
                    ellipse(sxp + 1, syp + 1, 2.5, 2.5);
                }
            }
        }
        if (tr.kind === "trapdoor" && !over) {
            p = P2(tr.x, tr.y);
            var hs = tr.r * R;
            var open = tr.st === "open" ? Math.min(1, (150 - tr.t) / 8) * (tr.t < 12 ? tr.t / 12 : 1) : 0;
            fill(8, 5, 5);
            rect(p.x - hs, p.y - hs, hs * 2, hs * 2);
            if (open > 0) {
                fill(255, 90, 20, 50 + 40 * Math.sin(frameCount * 0.2));
                ellipse(p.x, p.y, hs * 1.4, hs * 1.4);
            }
            // two wooden doors that swing down
            var dw = hs * (1 - open * 0.92);
            fill(92, 66, 44);
            rect(p.x - hs, p.y - hs, dw, hs * 2);
            rect(p.x + hs - dw, p.y - hs, dw, hs * 2);
            stroke(55, 38, 25);
            strokeWeight(2);
            for (i = 1; i < 4; i++) {
                line(p.x - hs, p.y - hs + i * hs / 2, p.x - hs + dw, p.y - hs + i * hs / 2);
                line(p.x + hs - dw, p.y - hs + i * hs / 2, p.x + hs, p.y - hs + i * hs / 2);
            }
            noStroke();
            fill(140, 140, 150);
            ellipse(p.x - hs + 4, p.y - hs * 0.6, 4, 4);
            ellipse(p.x - hs + 4, p.y + hs * 0.6, 4, 4);
            ellipse(p.x + hs - 4, p.y - hs * 0.6, 4, 4);
            ellipse(p.x + hs - 4, p.y + hs * 0.6, 4, 4);
        }
        if (tr.kind === "blade") {
            var bx = Math.sin(tr.phase) * tr.amp;
            var tilt = Math.cos(tr.phase);
            p = P2(bx, tr.y);
            if (!over) {
                // the groove the blade has carved into the floor
                stroke(70, 20, 15, 160);
                strokeWeight(6);
                line(cx - tr.amp * R, cy + tr.y * R, cx + tr.amp * R, cy + tr.y * R);
                noStroke();
            } else {
                // the arm swings from a beam high above (so it shortens as it swings out)
                var pv = P2(0, tr.y - 0.02);
                stroke(70, 70, 75);
                strokeWeight(5);
                line(pv.x, pv.y - R * 1.1, p.x, p.y - 8);
                noStroke();
                fill(0, 0, 0, 70);
                ellipse(p.x + 10, p.y + 10, 70, 16);
                // a crescent blade, edge-on from above
                pushMatrix();
                translate(p.x, p.y);
                fill(175, 180, 192);
                rect(-36, -6, 72, 12, 6);
                fill(225, 230, 240);
                rect(-34, 2 + tilt, 68, 3, 2);
                fill(90, 60, 40);
                rect(-6, -10, 12, 8, 2);
                popMatrix();
                // motion blur
                fill(255, 255, 255, 30 * Math.abs(tilt));
                ellipse(p.x - Math.sign(tilt) * 30, p.y, 60 * Math.abs(tilt), 14);
            }
        }
        if (tr.kind === "flame") {
            var nx = Math.cos(tr.ang) * 0.98;
            var ny = Math.sin(tr.ang) * 0.98;
            p = P2(nx, ny);
            if (!over) {
                // a bronze nozzle in the wall
                fill(110, 75, 35);
                ellipse(p.x, p.y, 26, 26);
                fill(40, 25, 15);
                ellipse(p.x, p.y, 12, 12);
                // scorch marks on the floor
                fill(30, 15, 10, 70);
                for (i = 1; i < 6; i++) {
                    var sd = i / 6 * 0.8;
                    ellipse(cx + (nx - Math.cos(tr.ang) * sd) * R, cy + (ny - Math.sin(tr.ang) * sd) * R, 22 + i * 10, 22 + i * 10);
                }
            } else if (tr.st === "warn") {
                fill(90, 160, 255, 200);
                ellipse(p.x - Math.cos(tr.ang) * 8, p.y - Math.sin(tr.ang) * 8, 8 + Math.random() * 4, 8 + Math.random() * 4);
                if (tr.t < 15) {
                    fill(255, 160, 40, 220);
                    ellipse(p.x - Math.cos(tr.ang) * 14, p.y - Math.sin(tr.ang) * 14, 14, 14);
                }
            } else if (tr.st === "fire") {
                var age = 75 - tr.t;
                var reach = 0.95 * Math.min(1, age / 12) * R;
                var fade = tr.t < 12 ? tr.t / 12 : 1;
                for (i = 0; i < 34; i++) {
                    var f = ((i * 0.618 + frameCount * 0.04) % 1);
                    var d = f * reach;
                    var wob = Math.sin(i * 12.9 + frameCount * 0.5) * (6 + d * 0.22);
                    var fx = p.x - Math.cos(tr.ang) * d - Math.sin(tr.ang) * wob;
                    var fy = p.y - Math.sin(tr.ang) * d + Math.cos(tr.ang) * wob;
                    var sz = 12 + d * 0.3;
                    fill(255, 60 + (1 - f) * 150, 20, 190 * fade * (1 - f * 0.6));
                    ellipse(fx, fy, sz, sz);
                    fill(255, 240, 170, 150 * fade * (1 - f));
                    ellipse(fx, fy, sz * 0.4, sz * 0.4);
                }
            }
        }
        if (tr.kind === "darts") {
            p = P2(tr.x1, tr.y);
            q = P2(tr.x2, tr.y);
            if (!over) {
                // two little posts and a thin tripwire between them
                fill(70, 50, 32);
                ellipse(p.x, p.y, 10, 10);
                ellipse(q.x, q.y, 10, 10);
                if (tr.st !== "fly") {
                    stroke(210, 200, 170, 200);
                    strokeWeight(1.5);
                    line(p.x, p.y, q.x, q.y);
                    noStroke();
                } else {
                    stroke(210, 200, 170, 200);
                    strokeWeight(1.5);
                    line(p.x, p.y, p.x + 8, p.y + 10);
                    line(q.x, q.y, q.x - 8, q.y + 10);
                    noStroke();
                }
                // holes in the wall where the darts come from
                var hx = cx + Math.sqrt(Math.max(0, 0.98 * 0.98 - tr.y * tr.y)) * R;
                fill(20, 15, 12);
                for (i = -1; i <= 1; i++) { ellipse(hx, cy + tr.y * R + i * 10, 7, 7); }
            } else if (tr.st === "fly") {
                var hx2 = Math.sqrt(Math.max(0, 0.98 * 0.98 - tr.y * tr.y));
                var u = Math.min(1, (30 - tr.t) / 30);
                for (i = -1; i <= 1; i++) {
                    var dxp = cx + lerp(hx2, tr.tx, u) * R - i * 14;
                    var dyp = cy + tr.y * R + i * 9;
                    stroke(90, 70, 40);
                    strokeWeight(2);
                    line(dxp, dyp, dxp + 16, dyp);
                    noStroke();
                    fill(170, 175, 185);
                    triangle(dxp - 5, dyp, dxp + 1, dyp - 3, dxp + 1, dyp + 3);
                    fill(120, 220, 80);
                    triangle(dxp + 16, dyp, dxp + 21, dyp - 4, dxp + 21, dyp + 4);
                }
            }
        }
        if (tr.kind === "boulder") {
            var ch = P2(Math.cos(tr.ang) * 1.02, Math.sin(tr.ang) * 1.02);
            if (!over) {
                // the chute in the wall
                fill(18, 14, 12);
                ellipse(ch.x, ch.y, 46, 46);
                // the loose stone that sets it off
                p = P2(tr.px, tr.py);
                fill(tr.st === "rumble" ? color(150, 135, 110) : color(118, 106, 92));
                rect(p.x - tr.pr * R, p.y - tr.pr * R * 0.8 + (tr.st === "rumble" ? 2 : 0), tr.pr * R * 2, tr.pr * R * 1.6, 3);
                stroke(70, 60, 50);
                strokeWeight(1.5);
                line(p.x - tr.pr * R * 0.6, p.y - 2, p.x + tr.pr * R * 0.5, p.y + 3);
                noStroke();
            } else {
                if (tr.st === "rumble") {
                    // dust trickles out of the chute
                    for (i = 0; i < 6; i++) {
                        fill(180, 160, 130, 150);
                        ellipse(ch.x + random(-14, 14), ch.y + random(-14, 14), random(4, 9), random(4, 9));
                    }
                }
                if (tr.st === "roll") {
                    p = P2(tr.bx, tr.by);
                    var br = 0.09 * R;
                    fill(0, 0, 0, 80);
                    ellipse(p.x + br * 0.25, p.y + br * 0.35, br * 2.1, br * 1.9);
                    fill(108, 98, 88);
                    ellipse(p.x, p.y, br * 2, br * 2);
                    // cracks and lumps turn as it rolls
                    for (i = 0; i < 5; i++) {
                        var la = tr.rot + i * 1.26;
                        var lr = br * (0.35 + (i % 2) * 0.3);
                        fill(i % 2 ? color(85, 77, 70) : color(132, 122, 110));
                        ellipse(p.x + Math.cos(la) * lr, p.y + Math.sin(la) * lr * 0.9, br * 0.55, br * 0.45);
                    }
                    fill(160, 150, 138, 150);
                    ellipse(p.x - br * 0.35, p.y - br * 0.4, br * 0.7, br * 0.5);
                    if (frameCount % 2 === 0 && pitDust.length < 80) {
                        pitDust.push({ x: p.x - tr.vx * 600, y: p.y - tr.vy * 600, r: random(10, 20), life: 0 });
                    }
                }
                if (tr.st === "smash") {
                    p = P2(tr.bx, tr.by);
                    var sa = (30 - tr.t) / 30;
                    for (i = 0; i < 9; i++) {
                        var ra = i / 9 * TWO_PI;
                        fill(118, 106, 92, 255 * (1 - sa));
                        ellipse(p.x + Math.cos(ra) * sa * 50, p.y + Math.sin(ra) * sa * 50, 16 - sa * 8, 14 - sa * 8);
                    }
                }
            }
        }
        if (tr.kind === "saw") {
            p = P2(tr.x1, tr.y);
            q = P2(tr.x2, tr.y);
            if (!over) {
                fill(25, 20, 18);
                rect(p.x - 4, p.y - 4, q.x - p.x + 8, 8, 4);
                fill(80, 75, 72);
                rect(p.x - 7, p.y - 7, 14, 14, 3);
                rect(q.x - 7, q.y - 7, 14, 14, 3);
            } else if (tr.st !== "hidden") {
                var rise = tr.st === "rise" ? 1 - tr.t / 30 : (tr.st === "sink" ? tr.t / 30 : 1);
                var spx = lerp(p.x, q.x, tr.pos);
                var srad = 26 * rise;
                pushMatrix();
                translate(spx, p.y);
                // seen from above a saw is a thin line... so we tilt it a bit so you can see the teeth
                fill(0, 0, 0, 70);
                ellipse(4, 6, srad * 2, srad * 0.7);
                fill(170, 175, 185);
                ellipse(0, 0, srad * 2, srad * 0.75);
                fill(120, 125, 135);
                for (i = 0; i < 14; i++) {
                    var ta = i / 14 * TWO_PI + frameCount * 0.6;
                    triangle(Math.cos(ta) * srad, Math.sin(ta) * srad * 0.37,
                             Math.cos(ta + 0.25) * srad * 1.18, Math.sin(ta + 0.25) * srad * 0.44,
                             Math.cos(ta + 0.4) * srad, Math.sin(ta + 0.4) * srad * 0.37);
                }
                fill(70, 72, 78);
                ellipse(0, 0, srad * 0.4, srad * 0.16);
                popMatrix();
                if (tr.st === "run" && frameCount % 2 === 0) {
                    pitPops.push({ kind: "spark", x: spx + random(-10, 10), y: p.y + random(-4, 4), f: frameCount });
                }
            }
        }
        if (tr.kind === "snare") {
            p = P2(tr.x, tr.y);
            var an = P2(Math.cos(tr.ang) * 1.05, Math.sin(tr.ang) * 1.05);
            if (!over) {
                if (tr.st !== "hang") {
                    // a loop of rope hidden in some leaves, tied to a bent sapling
                    fill(60, 90, 40, 200);
                    for (i = 0; i < 6; i++) { ellipse(p.x + Math.cos(i) * tr.r * R * 0.8, p.y + Math.sin(i * 1.7) * tr.r * R * 0.6, 14, 9); }
                    noFill();
                    stroke(190, 165, 110);
                    strokeWeight(2.5);
                    ellipse(p.x, p.y, tr.r * R * 2, tr.r * R * 1.6);
                    line(p.x + tr.r * R, p.y, an.x, an.y);
                    noStroke();
                }
                fill(85, 60, 35);
                ellipse(an.x, an.y, 18, 18);
                fill(70, 120, 50);
                ellipse(an.x + 6, an.y - 5, 20, 14);
            } else if (tr.st === "hang" && tr.who && tr.who.topX !== undefined) {
                stroke(190, 165, 110);
                strokeWeight(3);
                line(an.x, an.y - 40, tr.who.topX, tr.who.topY - 10);
                noStroke();
            }
        }
    }
};

// ---------- drawing the traps, from the side (forest view) ----------
var drawDeathSide = function(x, hw) {
    var i, j, tr;
    noStroke();
    // skulls on the stakes
    for (i = 0; i <= 14; i += 2) {
        var f = i / 14;
        var sx = x - hw + f * 2 * hw;
        var sy = GROUND - 1 * S - Math.sin(f * PI) * 5 * S - 19 * S;
        fill(235, 228, 205);
        ellipse(sx, sy - 2 * S, 7 * S, 6.5 * S);
        rect(sx - 2.2 * S, sy, 4.4 * S, 3 * S);
        fill(30, 20, 20);
        ellipse(sx - 1.4 * S, sy - 2 * S, 1.8 * S, 2 * S);
        ellipse(sx + 1.4 * S, sy - 2 * S, 1.8 * S, 2 * S);
    }
    // the pendulum frame: two posts and a beam over the whole pit
    fill(66, 46, 30);
    rect(x - hw * 0.95 - 2 * S, GROUND - 88 * S, 4 * S, 88 * S);
    rect(x + hw * 0.95 - 2 * S, GROUND - 88 * S, 4 * S, 88 * S);
    rect(x - hw * 0.95 - 4 * S, GROUND - 90 * S, hw * 1.9 + 8 * S, 5 * S);
    fill(50, 34, 22);
    triangle(x - hw * 0.95, GROUND - 70 * S, x - hw * 0.95, GROUND - 85 * S, x - hw * 0.8, GROUND - 85 * S);
    triangle(x + hw * 0.95, GROUND - 70 * S, x + hw * 0.95, GROUND - 85 * S, x + hw * 0.8, GROUND - 85 * S);
    if (!fightPit.traps) { fightPit.traps = makeDeathTraps(); }
    for (j = 0; j < fightPit.traps.length; j++) {
        tr = fightPit.traps[j];
        if (tr.kind === "blade") {
            var bx = Math.sin(tr.phase) * tr.amp;
            var tx = trapWX(bx);
            var py = GROUND - 88 * S;
            var by = GROUND - 12 * S;
            stroke(80, 80, 86);
            strokeWeight(Math.max(1, 1.5 * S));
            line(x, py, tx, by);
            noStroke();
            var ang = Math.atan2(tx - x, py - by);
            pushMatrix();
            translate(tx, by);
            rotate(-ang);
            fill(180, 186, 198);
            arc(0, 0, 30 * S, 18 * S, 0, PI);
            fill(225, 230, 240);
            arc(0, 0.5 * S, 30 * S, 16 * S, 0.15, PI - 0.15);
            fill(80, 55, 35);
            rect(-2 * S, -3 * S, 4 * S, 4 * S);
            popMatrix();
        } else if (tr.kind === "spikes") {
            var spx = trapWX(tr.x);
            fill(80, 78, 76);
            rect(spx - 9 * S, GROUND + 1 * S, 18 * S, 2 * S);
            var upS = tr.st === "up" ? Math.min(1, (70 - tr.t) / 4) : (tr.st === "reset" && tr.t > 180 ? (tr.t - 180) / 20 : 0);
            if (upS > 0) {
                for (i = 0; i < 7; i++) {
                    var kx = spx - 8 * S + i * 2.7 * S;
                    fill(160, 162, 170);
                    triangle(kx - 1 * S, GROUND + 1 * S, kx + 1 * S, GROUND + 1 * S, kx, GROUND + 1 * S - 13 * S * upS);
                }
            }
        } else if (tr.kind === "trapdoor") {
            var tdx = trapWX(tr.x);
            fill(tr.st === "open" ? color(8, 5, 5) : color(92, 66, 44));
            rect(tdx - 10 * S, GROUND, 20 * S, 3 * S);
        } else if (tr.kind === "flame") {
            var side = Math.cos(tr.ang) > 0 ? 1 : -1;
            var nxw = x + side * hw * 1.0;
            fill(110, 75, 35);
            rect(nxw - 4 * S, GROUND - 9 * S, 8 * S, 9 * S, 2 * S);
            fill(40, 25, 15);
            ellipse(nxw - side * 3 * S, GROUND - 6 * S, 3 * S, 3 * S);
            if (tr.st === "warn") {
                fill(90, 160, 255);
                ellipse(nxw - side * 5 * S, GROUND - 6 * S, 3 * S, 3 * S);
            } else if (tr.st === "fire") {
                var age = 75 - tr.t;
                var reach = hw * 1.2 * Math.min(1, age / 12);
                for (i = 0; i < 22; i++) {
                    var ff = (i * 0.618 + frameCount * 0.05) % 1;
                    var fx = nxw - side * ff * reach;
                    var fy = GROUND - 6 * S + Math.sin(i * 7 + frameCount * 0.6) * (1 + ff * 6) * S - ff * 4 * S;
                    fill(255, 60 + (1 - ff) * 160, 20, 200 * (1 - ff * 0.6));
                    ellipse(fx, fy, (4 + ff * 8) * S, (4 + ff * 8) * S);
                }
            }
        } else if (tr.kind === "darts") {
            fill(70, 50, 32);
            rect(trapWX(tr.x1) - 1 * S, GROUND - 4 * S, 2 * S, 4 * S);
            rect(trapWX(tr.x2) - 1 * S, GROUND - 4 * S, 2 * S, 4 * S);
            if (tr.st === "fly") {
                var u = Math.min(1, (30 - tr.t) / 30);
                var dx = lerp(x + hw, trapWX(tr.tx), u);
                stroke(90, 70, 40);
                strokeWeight(Math.max(1, 0.8 * S));
                for (i = 0; i < 3; i++) {
                    line(dx + i * 6 * S, GROUND - (6 + i * 3) * S, dx + i * 6 * S + 6 * S, GROUND - (6 + i * 3) * S);
                }
                noStroke();
            } else {
                stroke(210, 200, 170, 180);
                strokeWeight(Math.max(1, 0.5 * S));
                line(trapWX(tr.x1), GROUND - 3 * S, trapWX(tr.x2), GROUND - 3 * S);
                noStroke();
            }
        } else if (tr.kind === "boulder") {
            var bside = Math.cos(tr.ang) > 0 ? 1 : -1;
            fill(30, 24, 20);
            ellipse(x + bside * hw * 1.0, GROUND - 10 * S, 16 * S, 18 * S);
            if (tr.st === "roll") {
                var rbx = trapWX(tr.bx);
                var rr = 9 * S;
                fill(0, 0, 0, 60);
                ellipse(rbx, GROUND + 1 * S, rr * 2.2, 4 * S);
                fill(108, 98, 88);
                ellipse(rbx, GROUND - rr, rr * 2, rr * 2);
                fill(85, 77, 70);
                ellipse(rbx + Math.cos(tr.rot) * rr * 0.5, GROUND - rr + Math.sin(tr.rot) * rr * 0.5, rr * 0.6, rr * 0.5);
                ellipse(rbx + Math.cos(tr.rot + 2.5) * rr * 0.5, GROUND - rr + Math.sin(tr.rot + 2.5) * rr * 0.5, rr * 0.5, rr * 0.4);
            }
        } else if (tr.kind === "saw") {
            var s1 = trapWX(tr.x1);
            var s2 = trapWX(tr.x2);
            fill(25, 20, 18);
            rect(s1, GROUND, s2 - s1, 2 * S);
            if (tr.st !== "hidden") {
                var riseS = tr.st === "rise" ? 1 - tr.t / 30 : (tr.st === "sink" ? tr.t / 30 : 1);
                var swx = lerp(s1, s2, tr.pos);
                var swr = 8 * S;
                pushMatrix();
                translate(swx, GROUND + swr - riseS * swr * 1.6);
                rotate(frameCount * 0.5);
                fill(170, 175, 185);
                ellipse(0, 0, swr * 2, swr * 2);
                fill(120, 125, 135);
                for (i = 0; i < 12; i++) {
                    var sa = i / 12 * TWO_PI;
                    triangle(Math.cos(sa) * swr, Math.sin(sa) * swr, Math.cos(sa + 0.26) * swr * 1.25, Math.sin(sa + 0.26) * swr * 1.25,
                             Math.cos(sa + 0.4) * swr, Math.sin(sa + 0.4) * swr);
                }
                fill(70, 72, 78);
                ellipse(0, 0, swr * 0.5, swr * 0.5);
                popMatrix();
                fill(140, 95, 60);
                rect(s1 - 2 * S, GROUND - 1 * S, s2 - s1 + 4 * S, 3 * S);
            }
        } else if (tr.kind === "snare") {
            // the bent sapling the snare is tied to
            var sxw = x + hw * 0.98;
            var bend = tr.st === "hang" ? 0 : 1;
            stroke(90, 62, 36);
            strokeWeight(Math.max(1, 2 * S));
            var topX = sxw - bend * 22 * S;
            var topY = GROUND - (60 - bend * 34) * S;
            line(sxw, GROUND, lerp(sxw, topX, 0.5) + 4 * S, lerp(GROUND, topY, 0.5));
            line(lerp(sxw, topX, 0.5) + 4 * S, lerp(GROUND, topY, 0.5), topX, topY);
            noStroke();
            fill(70, 120, 50);
            ellipse(topX, topY, 14 * S, 9 * S);
            stroke(190, 165, 110);
            strokeWeight(Math.max(1, 0.8 * S));
            if (tr.st === "hang" && tr.who) {
                line(topX, topY, tr.who.x, GROUND - 40 * S);
            } else {
                line(topX, topY, trapWX(tr.x), GROUND - 1 * S);
                noFill();
                ellipse(trapWX(tr.x), GROUND - 1 * S, 8 * S, 2 * S);
            }
            noStroke();
        }
    }
    // braziers of green fire
    for (var bs = -1; bs <= 1; bs += 2) {
        var bxx = x + bs * hw * 0.35;
        var fl = Math.sin(frameCount * 0.35 + bs) * 1.5 * S;
        fill(60, 55, 58);
        rect(bxx - 5 * S, GROUND - 14 * S, 10 * S, 4 * S, 1 * S);
        rect(bxx - 1.5 * S, GROUND - 10 * S, 3 * S, 10 * S);
        fill(110, 255, 90, 50);
        ellipse(bxx, GROUND - 20 * S, 26 * S, 26 * S);
        fill(90, 230, 70);
        ellipse(bxx, GROUND - 19 * S - fl * 0.5, 7 * S, 11 * S + fl);
        fill(220, 255, 200);
        ellipse(bxx, GROUND - 17 * S, 3 * S, 4 * S);
    }
};

// the Pit of DEATH floor from above: dark red, glowing cracks, a giant skull, spikes around the wall
var drawDeathFloor = function(cx, cy, R) {
    var i;
    noStroke();
    fill(70, 4, 4, 150);
    ellipse(cx, cy, R * 2.25, R * 2.25);
    stroke(255, 90, 30, 110 + 60 * Math.sin(frameCount * 0.05));
    strokeWeight(3);
    for (i = 0; i < 9; i++) {
        var ca = i / 9 * TWO_PI + 0.3;
        var r1 = R * 0.25;
        var r2 = R * 0.62;
        var r3 = R * 0.95;
        line(cx + Math.cos(ca) * r1, cy + Math.sin(ca) * r1, cx + Math.cos(ca + 0.15) * r2, cy + Math.sin(ca + 0.15) * r2);
        line(cx + Math.cos(ca + 0.15) * r2, cy + Math.sin(ca + 0.15) * r2, cx + Math.cos(ca - 0.05) * r3, cy + Math.sin(ca - 0.05) * r3);
    }
    noStroke();
    fill(220, 205, 180, 70);
    ellipse(cx, cy - 8, R * 0.42, R * 0.38);
    rect(cx - R * 0.1, cy + R * 0.06, R * 0.2, R * 0.11, 4);
    fill(60, 10, 10, 110);
    ellipse(cx - R * 0.075, cy - 8, R * 0.11, R * 0.12);
    ellipse(cx + R * 0.075, cy - 8, R * 0.11, R * 0.12);
    for (i = 0; i < 40; i++) {
        var wa = i / 40 * TWO_PI;
        var w0 = R * 1.1;
        var w1 = R * 0.99;
        fill(150, 150, 160);
        triangle(cx + Math.cos(wa - 0.05) * w0, cy + Math.sin(wa - 0.05) * w0,
                 cx + Math.cos(wa + 0.05) * w0, cy + Math.sin(wa + 0.05) * w0,
                 cx + Math.cos(wa) * w1, cy + Math.sin(wa) * w1);
    }
    for (i = 0; i < 4; i++) {
        var ba = i / 4 * TWO_PI + PI / 4;
        var bx = cx + Math.cos(ba) * R * 1.02;
        var by = cy + Math.sin(ba) * R * 1.02;
        var fl = 0.8 + 0.2 * Math.sin(frameCount * 0.3 + i);
        fill(100, 255, 80, 30);
        ellipse(bx, by, R * 0.7 * fl, R * 0.7 * fl);
        fill(60, 60, 64);
        ellipse(bx, by, 26, 26);
        fill(90, 230, 70);
        ellipse(bx, by, 16 * fl, 16 * fl);
        fill(230, 255, 210);
        ellipse(bx, by, 6, 6);
    }
    drawTrapsTop(cx, cy, R, false);
};

// trapdoors and snares: where to draw a snake (forest view)
var snakeTrapLift = function(a) {
    if (a.snareT > 0) {
        var up = Math.min(1, (160 - a.snareT) / 8) * Math.min(1, a.snareT / 10);
        return -up * 30 * S + Math.sin(frameCount * 0.12) * 2 * S * up;
    }
    if (a.fallT > 0) {
        var down = Math.min(1, (140 - a.fallT) / 10) * Math.min(1, a.fallT / 20);
        return down * 40 * S;
    }
    return 0;
};

// ================= MERGING (inside the Anaconda) & THE FLESH PIT =================
var fleshUnlocked = false;
var deathsSeen = 0;            // snake deaths you've watched happen
var FLESH_DEATHS = 1000;

// You watched a snake die (in the forest view or the arena view)
var sawDeath = function(x) {
    if (!(inView(x, 0) || (pitView && inPitX(x)))) { return; }
    deathsSeen++;
    if (arenaIs("flesh") && inPitX(x)) { fightPit.fed = (fightPit.fed || 0) + 1; }
    if (deathsSeen >= FLESH_DEATHS && !fleshUnlocked) { unlockArena("flesh"); }
};

// "Noodle" + "Sir Hissalot" = "Noosalot";  "Captain Fang" + "Lady Venom" = "Captain Venom"
var mergeName = function(n1, n2) {
    var w1 = n1.split(" ");
    var w2 = n2.split(" ");
    if (w1.length > 1 && w2.length > 1) { return w1[0] + " " + w2[w2.length - 1]; }
    var a = w1[w1.length - 1];
    var b = w2[w2.length - 1];
    var name = a.substring(0, Math.ceil(a.length / 2)) + b.substring(Math.max(1, b.length - Math.ceil(b.length * 0.6)));
    if (w1.length > 1) { name = w1[0] + " " + name; }
    if (w2.length > 1 && w1.length === 1) { name = w2[0] + " " + name; }
    return name;
};

// The second snake in a merged snake goes back to the roster when it dies or leaves
var releaseFused = function(a, died) {
    if (!a.fused) { return; }
    var f = a.fused;
    f.here = false;
    f.fusedInto = "";
    if (died) {
        f.evo = 1;
        f.deaths++;
        f.wins = 0;
        f.anaKills = 0;
        f.hatching = true;
        f.awayUntil = t + YEAR * random(0.4, 0.8);
    } else {
        f.awayUntil = t + random(DAY * 0.5, DAY * 2.5);
    }
    a.fused = null;
};

var startMerge = function(a, b) {
    fightPit.merge = { a: a, b: b, f0: frameCount };
    var both = [a, b];
    for (var i = 0; i < 2; i++) {
        var s = both[i];
        s.foe = null;
        s.state = "coil";
        s.wrapT = 0;
        s.poison = 0;
        s.strikeT = 0;
        s.merging = true;
        s.cool = 99999;
        s.mergeIn = 0;
    }
    snd("merge", a.x);
    pitEvent("mergestart", a, b);
    snakeMsg = a.name + " and " + b.name + " are... MERGING?!";
};

var finishMerge = function() {
    var m = fightPit.merge;
    fightPit.merge = null;
    var a = m.a;
    var b = m.b;
    a.merging = false;
    if (animals.indexOf(b) < 0) { a.cool = 60; return; }
    if (animals.indexOf(a) < 0) { b.merging = false; b.cool = 60; return; }
    var oldA = a.name;
    var head2 = snakeLook(b);
    a.head2 = { body: head2.body.slice(0), band: head2.band.slice(0) };
    a.name = mergeName(a.name, b.name);
    a.evo = Math.min(30, a.evo + b.evo);
    a.col = { body: mixArr(a.col.body, b.col.body, 0.5), band: mixArr(a.col.band, b.col.band, 0.5) };
    a.look = null;
    a.lookLv = 0;
    a.base = Math.max(a.base || 1, b.base || 1);
    a.anaStreak = Math.max(a.anaStreak || 0, b.anaStreak || 0);
    a.mergedFrom = [oldA, b.name];
    if (b.who) {
        a.fused = b.who;
        b.who.fusedInto = a.name;
        b.who.here = true;
    }
    if (a.who) {
        a.who.evo = a.evo;
        a.who.best = Math.max(a.who.best, a.evo);
    }
    animals.splice(animals.indexOf(b), 1);
    a.state = "evolve";
    a.timer = 100;
    a.cool = 120;
    snakeBurst(a.x, GROUND - 16 * S * a.size, 30, [220, 120, 255], 2);
    snakeBurst(a.x, GROUND - 16 * S * a.size, 20, [255, 120, 140], 1.6);
    snd("levelup", a.x);
    pitEvent("merge", a, null);
    snakeMsg = oldA + " and " + b.name + " MERGED into " + a.name + "! (Lv " + a.evo + ", two heads!)";
};

var updateMerge = function() {
    if (!fightPit || !fightPit.merge) { return; }
    var m = fightPit.merge;
    var age = frameCount - m.f0;
    var a = m.a;
    var b = m.b;
    if (animals.indexOf(a) < 0 || animals.indexOf(b) < 0) {
        a.merging = b.merging = false;
        fightPit.merge = null;
        return;
    }
    // they spiral into each other
    b.x = lerp(b.x, a.x, 0.04);
    if (a.pitY !== undefined && b.pitY !== undefined) { b.pitY = lerp(b.pitY, a.pitY, 0.05); }
    if (age % 3 === 0) {
        snakeBurst(lerp(a.x, b.x, 0.5) + random(-12, 12) * S, GROUND - random(4, 24) * S, 1,
                   random(1) < 0.5 ? [220, 120, 255] : [255, 120, 140], 0.9);
    }
    if (age >= 100) { finishMerge(); }
};

// A second head, from the side
var drawHead2Side = function(a, hx, hy, k, tongue, lv) {
    if (!a.fused || !a.head2) { return; }
    var h2x = hx - a.dir * 6 * k;
    var h2y = hy - 7 * k;
    var c = snakeLook(a);
    for (var i = 0; i < 4; i++) {
        var f = i / 3;
        fill(20, 15, 10, 170);
        ellipse(lerp(hx - a.dir * 8 * k, h2x, f), lerp(hy + 4 * k, h2y + 2 * k, f), 5.5 * k, 5.5 * k);
        fillArr(i % 2 ? c.band : c.body);
        ellipse(lerp(hx - a.dir * 8 * k, h2x, f), lerp(hy + 4 * k, h2y + 2 * k, f), 4.6 * k, 4.6 * k);
    }
    var wob = Math.sin(t * 0.13 + a.phase) * 1.5 * k;
    drawSnakeHead(h2x, h2y + wob, -a.dir * (Math.sin(t * 0.02) > 0.7 ? -1 : 1), a.head2, tongue, k * 0.92, lv);
};
// A second head, from above
var drawHead2Top = function(a, hx, hy, ang, k) {
    if (!a.fused || !a.head2) { return; }
    var ca = Math.cos(ang);
    var sa = Math.sin(ang);
    var side = Math.sin(frameCount * 0.05 + a.phase) * 0.3;
    var h2x = hx - ca * 5 * k - sa * 9 * k;
    var h2y = hy - sa * 5 * k + ca * 9 * k;
    fill(20, 15, 10, 170);
    ellipse((hx + h2x) / 2 - ca * 3 * k, (hy + h2y) / 2 - sa * 3 * k, 8 * k, 8 * k);
    fillArr(a.head2.body);
    ellipse((hx + h2x) / 2 - ca * 3 * k, (hy + h2y) / 2 - sa * 3 * k, 6.5 * k, 6.5 * k);
    pushMatrix();
    translate(h2x, h2y);
    rotate(ang + 0.5 + side);
    fill(20, 15, 10, 170);
    ellipse(0.5 * k, 0, 11.5 * k, 8.8 * k);
    fillArr(a.head2.body);
    ellipse(0.5 * k, 0, 9.6 * k, 7.2 * k);
    fill(255, 120, 60);
    ellipse(1.5 * k, -2.4 * k, 2.2 * k, 2.2 * k);
    ellipse(1.5 * k, 2.4 * k, 2.2 * k, 2.2 * k);
    fill(10);
    ellipse(1.8 * k, -2.4 * k, 0.7 * k, 1.5 * k);
    ellipse(1.8 * k, 2.4 * k, 0.7 * k, 1.5 * k);
    popMatrix();
};

// ---------- THE FLESH PIT ----------
// a heartbeat: two quick thumps, then a rest
var fleshBeat = function() {
    var p = (frameCount % 70) / 70;
    var b1 = Math.max(0, 1 - Math.abs(p - 0.05) * 14);
    var b2 = Math.max(0, 1 - Math.abs(p - 0.2) * 14) * 0.7;
    return Math.max(b1, b2);
};
// ----- THE FLESH PIT, in the style of the Rot -----
// Dark and gross: ragged torn flesh, purple rot, black goo, thorns, sinew,
// almond eyes in the folds, jagged mouths, glowing cracks and bones.
var RT_OUT = [10, 3, 10];         // near-black outline
var RT_DARK = [62, 12, 30];       // deep, dark flesh
var RT_RED = [104, 20, 42];       // flesh
var RT_MID = [140, 34, 62];       // lighter flesh
var RT_ORANGE = [226, 62, 160];   // the magenta glow
var RT_PUS = [255, 150, 220];     // brightest glow
var RT_PURP = [58, 20, 70];       // purple rot
var RT_GOO = [14, 6, 18];         // black goo
var BONE = [214, 198, 172];
var BONE_SH = [150, 130, 108];
var FL_OUT = RT_OUT;
var flFill = function(c, a) { fill(c[0], c[1], c[2], a === undefined ? 255 : a); };
// a fixed random number for (seed, i) so shapes don't flicker
var rh = function(seed, i) {
    var v = Math.sin(seed * 12.9898 + i * 78.233) * 43758.5453;
    return v - Math.floor(v);
};
// a ragged polygon around (x, y): rough edges and a few sharp spikes
var jagShape = function(x, y, w, h, seed, spiky, grow) {
    var n = 16;
    beginShape();
    for (var i = 0; i < n; i++) {
        var a = i / n * TWO_PI;
        var r = 0.72 + rh(seed, i) * 0.38;
        if (spiky && i % 5 === 2) { r *= 1.55; }
        vertex(x + Math.cos(a) * (w / 2 + grow) * r, y + Math.sin(a) * (h / 2 + grow) * r);
    }
    endShape(CLOSE);
};
// a ragged chunk of flesh with a dark fold in it
var fleshLump = function(x, y, w, h, c, seed) {
    seed = seed === undefined ? x * 0.13 + y * 0.07 : seed;
    flFill(RT_OUT);
    jagShape(x, y, w, h, seed, true, 3);
    flFill(c || RT_RED);
    jagShape(x, y, w, h, seed, true, 0);
    flFill(RT_DARK);
    jagShape(x + w * 0.1, y + h * 0.15, w * 0.55, h * 0.4, seed + 3, false, 0);
    stroke(175, 50, 80, 150);
    strokeWeight(Math.max(1, w * 0.04));
    line(x - w * 0.3, y - h * 0.1, x + w * 0.2, y - h * 0.25);
    noStroke();
};
// a glowing crack
var glowCrack = function(x, y, len, ang, beat, seed) {
    var pts = [];
    var i;
    for (i = 0; i <= 5; i++) {
        var f = i / 5;
        var off = (rh(seed, i) - 0.5) * len * 0.35;
        pts.push([x + Math.cos(ang) * len * f - Math.sin(ang) * off, y + Math.sin(ang) * len * f + Math.cos(ang) * off]);
    }
    stroke(RT_ORANGE[0], RT_ORANGE[1], RT_ORANGE[2], 40 + beat * 60);
    strokeWeight(Math.max(4, len * 0.18));
    for (i = 0; i < 5; i++) { line(pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1]); }
    stroke(RT_ORANGE[0], RT_ORANGE[1], RT_ORANGE[2], 170 + beat * 85);
    strokeWeight(Math.max(1.5, len * 0.06));
    for (i = 0; i < 5; i++) { line(pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1]); }
    noStroke();
};
var pustule = function(x, y, r, beat, seed) {
    glowCrack(x - r, y, r * 2.4, rh(seed, 9) * PI, beat, seed);
};
// a bone (dog-bone shape) from (x1,y1) to (x2,y2)
var drawBone = function(x1, y1, x2, y2, w) {
    stroke(RT_OUT[0], RT_OUT[1], RT_OUT[2]);
    strokeWeight(w + 5);
    line(x1, y1, x2, y2);
    stroke(BONE[0], BONE[1], BONE[2]);
    strokeWeight(w);
    line(x1, y1, x2, y2);
    noStroke();
    var ang = Math.atan2(y2 - y1, x2 - x1);
    var px = -Math.sin(ang) * w * 0.55;
    var py = Math.cos(ang) * w * 0.55;
    var ends = [[x1, y1], [x2, y2]];
    var i;
    for (i = 0; i < 2; i++) {
        flFill(RT_OUT);
        ellipse(ends[i][0] + px, ends[i][1] + py, w * 1.2 + 5, w * 1.2 + 5);
        ellipse(ends[i][0] - px, ends[i][1] - py, w * 1.2 + 5, w * 1.2 + 5);
    }
    for (i = 0; i < 2; i++) {
        flFill(BONE);
        ellipse(ends[i][0] + px, ends[i][1] + py, w * 1.2, w * 1.2);
        ellipse(ends[i][0] - px, ends[i][1] - py, w * 1.2, w * 1.2);
    }
};
// an almond-shaped eye in a fold of flesh, following (lx, ly) and blinking
var fleshEye = function(x, y, r, lx, ly, seed) {
    var bl = (frameCount + seed * 97) % 230;
    var shut = bl < 10 ? 1 - Math.abs(bl - 5) / 5 : 0;
    var lens = function(w, h) {
        beginShape();
        var i;
        for (i = 0; i <= 12; i++) { vertex(x - w + i / 12 * 2 * w, y - Math.sin(i / 12 * PI) * h); }
        for (i = 12; i >= 0; i--) { vertex(x - w + i / 12 * 2 * w, y + Math.sin(i / 12 * PI) * h); }
        endShape(CLOSE);
    };
    flFill(RT_OUT);
    lens(r * 1.35 + 4, r * 0.8 + 4);
    flFill(RT_DARK);
    lens(r * 1.3, r * 0.75);
    var open = 1 - shut;
