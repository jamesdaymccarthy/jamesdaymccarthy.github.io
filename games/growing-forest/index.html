        if (an.pitY === undefined) { an.pitY = random(-0.6, 0.6); }
        list.push(an);
    }
    for (i = 0; i < list.length; i++) {
        var b = list[i];
        var aim = null;
        if (b.foe) { aim = b.foe; }
        if (b.state === "hunt" && b.prey) { aim = b.prey; }
        if (b.state === "eaten" && b.eater) { aim = b.eater; }
        if (aim && aim.pitY !== undefined) {
            b.pitY = lerp(b.pitY, aim.pitY, b.foe ? 0.08 : 0.03);
        } else {
            b.pitY = constrain(b.pitY + Math.sin(frameCount * 0.01 + b.phase) * 0.004, -0.75, 0.75);
        }
    }
    for (i = 0; i < list.length; i++) {
        for (j = i + 1; j < list.length; j++) {
            var u1 = list[i];
            var u2 = list[j];
            if (u1.foe === u2 || u1.eater === u2 || u2.eater === u1) { continue; }
            if (Math.abs(u1.x - u2.x) < hw * 0.9 && Math.abs(u1.pitY - u2.pitY) < 0.45) {
                var push = u1.pitY <= u2.pitY ? -0.012 : 0.012;
                u1.pitY = constrain(u1.pitY + push, -0.8, 0.8);
                u2.pitY = constrain(u2.pitY - push, -0.8, 0.8);
                if (u1.foe) { u1.foe.pitY = constrain(u1.foe.pitY + push, -0.8, 0.8); }
                if (u2.foe) { u2.foe.pitY = constrain(u2.foe.pitY - push, -0.8, 0.8); }
            }
        }
    }
    var kBase = R / 92;
    for (i = 0; i < list.length; i++) {
        var r0s = list[i];
        r0s.topX = cx + (r0s.x - fightPit.x) / hw * R * 0.75;
        r0s.topY = cy + r0s.pitY * R * 0.62;
    }
    // fighters circle each other
    var mainFight = null;
    for (i = 0; i < list.length; i++) {
        var f1 = list[i];
        var f2 = f1.foe;
        if (!f2 || list.indexOf(f2) < i) { continue; }
        if (!mainFight) { mainFight = f1; }
        var mxp = (f1.topX + f2.topX) / 2;
        var myp = (f1.topY + f2.topY) / 2;
        var gapD = 26 * kBase * ((f1.size || 1) + (f2.size || 1)) / 2 + 16;
        if (f1.orbit === undefined) { f1.orbit = f1.x <= f2.x ? PI : 0; }
        f1.orbit += 0.008 + pitHype * 0.006;
        f1.topX = mxp + Math.cos(f1.orbit) * gapD / 2;
        f1.topY = myp + Math.sin(f1.orbit) * gapD / 2 * 0.8;
        f2.topX = mxp - Math.cos(f1.orbit) * gapD / 2;
        f2.topY = myp - Math.sin(f1.orbit) * gapD / 2 * 0.8;
        if (f1.wrapT > 0) {
            f1.topX = f2.topX;
            f1.topY = f2.topY;
        } else if (f2.wrapT > 0) {
            f2.topX = f1.topX;
            f2.topY = f1.topY;
        }
    }
    for (i = 0; i < list.length; i++) {
        var r1 = list[i];
        var dd = dist(cx, cy, r1.topX, r1.topY);
        if (dd > R * 0.85) {
            r1.topX = cx + (r1.topX - cx) * R * 0.85 / dd;
            r1.topY = cy + (r1.topY - cy) * R * 0.85 / dd;
        }
        // kick up dust when moving fast
        if ((r1.state === "hunt" || r1.strike > 0.5 || r1.recoil) && frameCount % 3 === 0 && pitDust.length < 80) {
            pitDust.push({ x: r1.topX + random(-8, 8), y: r1.topY + random(-8, 8), r: random(8, 16), life: 0 });
        }
    }
    // dust under the snakes
    for (i = pitDust.length - 1; i >= 0; i--) {
        var pd = pitDust[i];
        pd.life++;
        pd.r += 0.4;
        if (pd.water) { fill(215, 240, 250, 150 * (1 - pd.life / 40)); } else { fill(205, 180, 135, 120 * (1 - pd.life / 40)); }
        ellipse(pd.x, pd.y, pd.r, pd.r);
        if (pd.life >= 40) { pitDust.splice(i, 1); }
    }
    list.sort(function(p, q) { return (p.wrapT > 0 ? 100 : 0) + p.size - ((q.wrapT > 0 ? 100 : 0) + q.size); });
    for (i = 0; i < list.length; i++) {
        var s = list[i];
        var aimS = s.foe || (s.state === "hunt" ? s.prey : null) || (s.state === "eaten" ? s.eater : null);
        var ang;
        if (aimS && list.indexOf(aimS) >= 0) {
            ang = Math.atan2(aimS.topY - s.topY, aimS.topX - s.topX);
        } else {
            ang = (s.dir > 0 ? 0 : PI) + Math.sin(frameCount * 0.02 + s.phase) * 0.3;
        }
        var tk = kBase * (s.size || 1);
        var tsx = s.topX;
        var tsy = s.topY;
        if (s.fallT > 0) {
            // falling down the trapdoor
            var fd = Math.min(1, (140 - s.fallT) / 10) * Math.min(1, s.fallT / 20);
            tk *= 1 - fd * 0.75;
        } else if (s.snareT > 0) {
            // hanging upside down from the snare, swinging (closer to us, so bigger)
            var su = Math.min(1, (160 - s.snareT) / 8) * Math.min(1, s.snareT / 10);
            tk *= 1 + su * 0.3;
            tsx += Math.sin(frameCount * 0.1) * 10 * su;
            tsy -= 10 * su;
            fill(0, 0, 0, 50);
            ellipse(s.topX + 14 * su, s.topY + 18 * su, 40, 24);
        }
        if (s.merging && fightPit && fightPit.merge) {
            var mga = Math.min(1, (frameCount - fightPit.merge.f0) / 60);
            for (var mgl = 3; mgl >= 1; mgl--) {
                fill(mgl % 2 ? color(230, 120, 255, 40 + mga * 40) : color(255, 120, 150, 40 + mga * 40));
                ellipse(tsx, tsy, (60 + mgl * 26) * (1 + 0.15 * Math.sin(frameCount * 0.3 + mgl)) * (0.6 + mga * 0.6),
                        (60 + mgl * 26) * (1 + 0.15 * Math.sin(frameCount * 0.3 + mgl)) * (0.6 + mga * 0.6));
            }
        }
        if (s.merging && fightPit && fightPit.merge) {
            var mga = Math.min(1, (frameCount - fightPit.merge.f0) / 60);
            for (var mgl = 3; mgl >= 1; mgl--) {
                var mgr = (60 + mgl * 26) * (1 + 0.15 * Math.sin(frameCount * 0.3 + mgl)) * (0.6 + mga * 0.6);
                fill(mgl % 2 ? color(230, 120, 255, 40 + mga * 40) : color(255, 120, 150, 40 + mga * 40));
                ellipse(tsx, tsy, mgr, mgr);
            }
        }
        var trialSaved = null;
        if (s.trialing) {
            if (s.trialAim) {
                var tap = trialScreen(s.trialAim.x, s.trialAim.y);
                ang = Math.atan2(tap.y - tsy, tap.x - tsx);
            }
            trialSaved = s.state;
            s.state = "fight";
            s.strike = s.trialMoveT > 0 ? Math.sin((1 - s.trialMoveT / 16) * PI) : 0;
        }
        drawSnakeTop(s, tsx, tsy, ang + (s.snareT > 0 ? Math.sin(frameCount * 0.1) * 0.4 : 0), tk);
        if (trialSaved) {
            s.state = trialSaved;
            s.strike = 0;
        }
        if (s.state !== "eaten" && !(s.foe && s === mainFight) && !(s.foe && s.foe === mainFight)) {
            var tag = s.ana ? "THE ANACONDA" : s.name + "  " + (s.evo >= 30 ? "SERPENT KING" : "Lv " + s.evo) +
                      (slayerCount(s) ? "  - ANACONDA SLAYER x" + slayerCount(s) : "");
            var ty2 = s.topY - 22 * kBase * (s.size || 1) - 6;
            var tc = s.ana ? [240, 70, 50] : (s.evo > 1 ? evoColor(s.evo) : [235, 235, 225]);
            outlinedText(tag, s.topX, ty2, 12, [Math.min(255, tc[0] + 60), Math.min(255, tc[1] + 60), Math.min(255, tc[2] + 60)], 255);
            if (s.state === "fight") { hpBar(s.topX - 22, ty2 + 10, 44, 5, s, false); }
        }
    }

    // new things that happened -> effects
    for (i = 0; i < pitEvents.length; i++) {
        var ev = pitEvents[i];
        if (ev.done) { continue; }
        ev.done = true;
        if (frameCount - ev.f > 30) { continue; }
        var vic = ev.b || ev.a;
        if (vic.topX === undefined) { continue; }
        if (ev.kind === "turtle") {
            pitPops.push({ kind: "turtle", x: vic.topX, y: vic.topY, f: frameCount });
            pitPops.push({ kind: "word", text: "SNAP!", x: vic.topX, y: vic.topY - 40, f: frameCount + 8,
                           col: [140, 220, 120], rot: random(-0.2, 0.2), sz: 28 });
            pitShake = Math.min(18, pitShake + 6);
        } else if (ev.kind === "fizzle") {
            pitPops.push({ kind: "word", text: "FIZZLE...", x: vic.topX, y: vic.topY - 30, f: frameCount,
                           col: [190, 210, 230], rot: random(-0.2, 0.2), sz: 24 });
        }
        if (ev.kind === "trap") {
            var trk = ev.a.trapKind;
            pitPops.push({ kind: "spark", x: vic.topX, y: vic.topY, f: frameCount, big: trk === "boulder" || trk === "blade" });
            pitPops.push({ kind: "word", text: trapNames[trk], x: vic.topX, y: vic.topY - 46, f: frameCount + 6,
                           col: [255, 60, 40], rot: random(-0.2, 0.2), sz: 28 });
            pitShake = Math.min(18, pitShake + 9);
            pitHype = Math.min(1, pitHype + 0.25);
        } else if (ev.kind === "anaeat") {
            pitPops.push({ kind: "word", text: "CHOMP!!", x: vic.topX, y: vic.topY - 40, f: frameCount,
                           col: [255, 70, 50], rot: random(-0.2, 0.2), sz: 40 });
            pitShake = 20;
            pitHype = 1;
        } else if (ev.kind === "gift") {
            pitPops.push({ kind: "word", text: "+" + (ev.a.lastGift || 0) + " FREE LEVELS!", x: vic.topX, y: vic.topY - 46,
                           f: frameCount, col: [140, 240, 120], rot: 0, sz: 26 });
        } else if (ev.kind === "bonusreset") {
            pitPops.push({ kind: "word", text: "BONUS RESET!", x: vic.topX, y: vic.topY - 60, f: frameCount + 20,
                           col: [255, 90, 60], rot: random(-0.2, 0.2), sz: 30 });
        } else if (ev.kind === "streak") {
            pitPops.push({ kind: "word", text: (ev.a.anaStreak || 0) + " IN A ROW!", x: vic.topX, y: vic.topY - 70,
                           f: frameCount + 30, col: [255, 215, 90], rot: 0, sz: 26 });
        } else if (ev.kind === "morph") {
            pitPops.push({ kind: "word", text: ANA_STREAK + " IN A ROW!!!", x: vic.topX, y: vic.topY - 60, f: frameCount,
                           col: [255, 215, 90], rot: 0, sz: 38 });
        }
        if (ev.kind === "hit") {
            pitPops.push({ kind: "word", text: pickLine(["CHOMP!", "BITE!", "SNAP!", "CRUNCH!", "WHAM!"]),
                           x: vic.topX + random(-10, 10), y: vic.topY - 20, f: frameCount,
                           col: [255, 220, 60], rot: random(-0.3, 0.3), sz: ev.a.ana ? 34 : 26 });
            pitPops.push({ kind: "spark", x: vic.topX, y: vic.topY, f: frameCount });
            pitShake = Math.min(18, pitShake + (ev.a.ana ? 10 : 5));
            pitHype = Math.min(1, pitHype + 0.2);
        } else if (ev.kind === "miss") {
            pitPops.push({ kind: "word", text: pickLine(["MISS!", "DODGE!", "WHIFF!"]),
                           x: vic.topX, y: vic.topY - 20, f: frameCount, col: [230, 240, 255], rot: random(-0.2, 0.2), sz: 18 });
        } else if (ev.kind === "start") {
            snd("cheer", null, 0.7);
            pitBig = { text: "FIGHT!", f: frameCount, col: [255, 170, 40] };
            pitHype = Math.min(1, pitHype + 0.4);
        } else if (ev.kind === "ko") {
            snd("cheer", null, 1);
            pitBig = { text: "K.O.!", f: frameCount, col: [255, 70, 50] };
            pitFlash = 1;
            pitShake = 18;
            pitHype = 1;
            pitSlow = 60;
            pitPops.push({ kind: "spark", x: vic.topX, y: vic.topY, f: frameCount, big: true });
        } else if (ev.kind === "evolve") {
            pitPops.push({ kind: "word", text: "LEVEL UP!", x: ev.a.topX, y: ev.a.topY - 30, f: frameCount,
                           col: [255, 230, 120], rot: 0, sz: 22 });
        } else if (ev.kind === "ana") {
            pitBig = { text: "!!! ANACONDA !!!", f: frameCount, col: [150, 210, 70] };
            pitShake = 14;
        } else if (ev.kind === "whip" && ev.a.topX !== undefined) {
            pitPops.push({ kind: "swoosh", x: ev.a.topX, y: ev.a.topY, f: frameCount, dir: Math.atan2(vic.topY - ev.a.topY, vic.topX - ev.a.topX) });
            pitPops.push({ kind: "word", text: "TAIL WHIP!", x: vic.topX, y: vic.topY - 24, f: frameCount,
                           col: [255, 230, 140], rot: random(-0.2, 0.2), sz: 26 });
            pitPops.push({ kind: "spark", x: vic.topX, y: vic.topY, f: frameCount });
            pitShake = Math.min(18, pitShake + 8);
            pitHype = Math.min(1, pitHype + 0.25);
        } else if (ev.kind === "spit" && ev.a.topX !== undefined) {
            pitPops.push({ kind: "spit", x: ev.a.topX, y: ev.a.topY, tx: vic.topX, ty: vic.topY, f: frameCount });
            pitPops.push({ kind: "word", text: "POISONED!", x: vic.topX, y: vic.topY - 24, f: frameCount + 12,
                           col: [140, 240, 90], rot: random(-0.2, 0.2), sz: 22 });
            pitHype = Math.min(1, pitHype + 0.2);
        } else if (ev.kind === "wrap") {
            pitPops.push({ kind: "word", text: "CONSTRICT!", x: vic.topX, y: vic.topY - 30, f: frameCount,
                           col: [205, 160, 255], rot: random(-0.2, 0.2), sz: 28 });
            pitShake = Math.min(18, pitShake + 6);
            pitHype = Math.min(1, pitHype + 0.3);
        } else if (ev.kind === "breakfree") {
            pitPops.push({ kind: "word", text: "BREAKS FREE!", x: vic.topX, y: vic.topY - 30, f: frameCount,
                           col: [160, 225, 255], rot: random(-0.2, 0.2), sz: 26 });
            pitPops.push({ kind: "spark", x: vic.topX, y: vic.topY, f: frameCount });
        } else if (ev.kind === "flame" && ev.a.topX !== undefined) {
            pitPops.push({ kind: "fire", x: ev.a.topX, y: ev.a.topY, tx: vic.topX, ty: vic.topY, f: frameCount, seed: random(100) });
            pitPops.push({ kind: "word", text: "FLAME TAIL!", x: vic.topX, y: vic.topY - 26, f: frameCount,
                           col: [255, 150, 40], rot: random(-0.2, 0.2), sz: 30 });
            pitShake = Math.min(18, pitShake + 10);
            pitHype = Math.min(1, pitHype + 0.3);
        } else if (ev.kind === "crit") {
            pitPops.push({ kind: "word", text: "CRITICAL!", x: vic.topX, y: vic.topY - 44, f: frameCount,
                           col: [255, 70, 50], rot: random(-0.15, 0.15), sz: 34 });
            pitPops.push({ kind: "spark", x: vic.topX, y: vic.topY, f: frameCount, big: true });
            pitShake = 20;
            pitSlow = Math.max(pitSlow, 14);
        } else if (ev.kind === "acorn" && ev.a.topX !== undefined) {
            pitPops.push({ kind: "acorn", x: ev.a.topX, y: ev.a.topY, f: frameCount });
            pitPops.push({ kind: "word", text: "BONK!", x: ev.a.topX, y: ev.a.topY - 34, f: frameCount + 10,
                           col: [220, 170, 100], rot: random(-0.3, 0.3), sz: 26 });
            pitShake = Math.min(18, pitShake + 5);
        } else if (ev.kind === "bless" && ev.a.topX !== undefined) {
            pitPops.push({ kind: "word", text: bonusText(ev.a.lastBonus || 1), x: ev.a.topX, y: ev.a.topY - 50, f: frameCount,
                           col: [220, 160, 255], rot: 0, sz: 24 });
        } else if (ev.kind === "combo" && ev.a.topX !== undefined) {
            pitPops.push({ kind: "word", text: ev.a.combo + " HIT COMBO!", x: ev.a.topX, y: ev.a.topY - 50, f: frameCount,
                           col: [255, 215, 90], rot: 0, sz: 24 });
        } else if (ev.kind === "rage" && ev.a.topX !== undefined) {
            pitPops.push({ kind: "word", text: "RAGE MODE!", x: ev.a.topX, y: ev.a.topY - 40, f: frameCount,
                           col: [255, 60, 40], rot: random(-0.15, 0.15), sz: 26 });
        }
    }
    for (i = pitPops.length - 1; i >= 0; i--) {
        var pp = pitPops[i];
        var age = frameCount - pp.f;
        if (age < 0) { continue; }
        if (pp.kind === "acorn") {
            if (age > 14) { pitPops.splice(i, 1); continue; }
            var adrop = Math.min(1, age / 10);
            var ay = lerp(pp.y - 160, pp.y, adrop * adrop);
            var asz = lerp(30, 14, adrop);
            fill(0, 0, 0, 60 * adrop);
            ellipse(pp.x + 3, pp.y + 4, 14, 10);
            fill(150, 100, 50);
            ellipse(pp.x, ay, asz, asz * 1.2);
            fill(95, 65, 35);
            ellipse(pp.x, ay - asz * 0.35, asz * 1.05, asz * 0.55);
            continue;
        }
        if (pp.kind === "turtle") {
            if (age > 40) { pitPops.splice(i, 1); continue; }
            drawTurtlePop(pp, age);
            continue;
        }
        if (pp.kind === "jaws") {
            if (age > 16) { pitPops.splice(i, 1); continue; }
            var jc = pp.col || [240, 230, 210];
            var gap = age < 7 ? (1 - age / 7) * 20 : 0;
            pushMatrix();
            translate(pp.x, pp.y);
            rotate(pp.dir + HALF_PI);
            for (var jside = -1; jside <= 1; jside += 2) {
                fill(20, 8, 12, 230);
                arc(0, jside * (gap + 2), 46, 30, jside > 0 ? 0 : PI, jside > 0 ? PI : TWO_PI);
                fill(jc[0], jc[1], jc[2]);
                for (var jt = 0; jt < 5; jt++) {
                    var jtx = -16 + jt * 8;
                    triangle(jtx - 3.5, jside * (gap + 2), jtx + 3.5, jside * (gap + 2), jtx, jside * (gap + 2) - jside * 10);
                }
            }
            popMatrix();
            if (age === 7) { pitPops.push({ kind: "spark", x: pp.x, y: pp.y, f: frameCount }); }
            continue;
        }
        if (pp.kind === "coil") {
            if (age > 40) { pitPops.splice(i, 1); continue; }
            var cc = pp.col || [200, 150, 255];
            var tight = 1 - Math.min(1, age / 12) * 0.45;
            noFill();
            for (var ci2 = 0; ci2 < 3; ci2++) {
                stroke(20, 10, 15, 200 * (1 - age / 40));
                strokeWeight(12);
                ellipse(pp.x, pp.y + (ci2 - 1) * 8, 70 * tight, 40 * tight);
                stroke(cc[0], cc[1], cc[2], 255 * (1 - age / 40));
                strokeWeight(8);
                ellipse(pp.x, pp.y + (ci2 - 1) * 8, 70 * tight, 40 * tight);
            }
            noStroke();
            continue;
        }
        if (pp.kind === "swoosh") {
            if (age > 14) { pitPops.splice(i, 1); continue; }
            noFill();
            for (j = 0; j < 3; j++) {
                stroke(255, 255, 255, (180 - j * 50) * (1 - age / 14));
                strokeWeight(5 - j * 1.5);
                arc(pp.x, pp.y, 70 + j * 14 + age * 3, 70 + j * 14 + age * 3,
                    pp.dir - 1.2 + age * 0.12, pp.dir + 0.5 + age * 0.12);
            }
            noStroke();
            continue;
        }
        if (pp.kind === "spit") {
            if (age > 30) { pitPops.splice(i, 1); continue; }
            var sf = Math.min(1, age / 14);
            var spx = lerp(pp.x, pp.tx, sf);
            var spy = lerp(pp.y, pp.ty, sf) - Math.sin(sf * PI) * 30;
            noStroke();
            if (age <= 14) {
                for (j = 1; j <= 4; j++) {
                    var tf = Math.max(0, sf - j * 0.06);
                    fill(120, 230, 70, 160 - j * 35);
                    ellipse(lerp(pp.x, pp.tx, tf), lerp(pp.y, pp.ty, tf) - Math.sin(tf * PI) * 30, 12 - j * 2, 12 - j * 2);
                }
                fill(150, 255, 90);
                ellipse(spx, spy, 13, 13);
                fill(230, 255, 200);
                ellipse(spx - 2, spy - 2, 5, 5);
            } else {
                var sp3 = (age - 14) / 16;
                for (j = 0; j < 10; j++) {
                    var spa = j / 10 * TWO_PI;
                    fill(120, 230, 70, 220 * (1 - sp3));
                    ellipse(pp.tx + Math.cos(spa) * (6 + sp3 * 30), pp.ty + Math.sin(spa) * (6 + sp3 * 30), 7 - sp3 * 4, 7 - sp3 * 4);
                }
            }
            continue;
        }
        if (pp.kind === "fire") {
            if (age > 34) { pitPops.splice(i, 1); continue; }
            noStroke();
            var fa2 = Math.atan2(pp.ty - pp.y, pp.tx - pp.x);
            for (j = 0; j < 22; j++) {
                var spread = Math.sin(j * 7.3 + pp.seed) * 0.45;
                var spd = 3 + (j % 5) * 0.9;
                var fd = age * spd;
                var fx = pp.x + Math.cos(fa2 + spread) * fd;
                var fy = pp.y + Math.sin(fa2 + spread) * fd;
                var fade = 1 - age / 34;
                fill(255, 90 + (j % 3) * 50, 20, 200 * fade);
                ellipse(fx, fy, (14 - age * 0.25) + (j % 4) * 2, (14 - age * 0.25) + (j % 4) * 2);
                fill(255, 240, 150, 160 * fade);
                ellipse(fx, fy, 5, 5);
            }
            continue;
        }
        if (pp.kind === "spark") {
            var sparkLen = pp.big ? 28 : 16;
            if (age > sparkLen) { pitPops.splice(i, 1); continue; }
            stroke(255, 240, 160, 255 * (1 - age / sparkLen));
            strokeWeight(pp.big ? 5 : 3);
            for (j = 0; j < (pp.big ? 16 : 10); j++) {
                var sa3 = j / (pp.big ? 16 : 10) * TWO_PI + pp.f;
                var l0 = 6 + age * (pp.big ? 3.5 : 2.2);
                var l1 = l0 + (pp.big ? 20 : 10) - age * 0.4;
                line(pp.x + Math.cos(sa3) * l0, pp.y + Math.sin(sa3) * l0, pp.x + Math.cos(sa3) * l1, pp.y + Math.sin(sa3) * l1);
            }
            noStroke();
            fill(255, 255, 230, 200 * (1 - age / 16));
            ellipse(pp.x, pp.y, 22 - age, 22 - age);
        } else {
            if (age > 50) { pitPops.splice(i, 1); continue; }
            var pop = age < 6 ? 0.6 + age / 6 * 0.6 : (age < 10 ? 1.2 - (age - 6) * 0.05 : 1);
            pushMatrix();
            translate(pp.x, pp.y - age * 0.7);
            rotate(pp.rot);
            outlinedText(pp.text, 0, 0, pp.sz * pop, pp.col, 255 * Math.min(1, (50 - age) / 15));
            popMatrix();
        }
    }

    if (aType !== "pit" && aType !== "death") { drawArenaTopFront(aType, cx, cy, R); }
    if (aType === "death") { drawTrapsTop(cx, cy, R, true); }
    // torches on the wall
    for (i = 0; i < torchA.length; i++) {
        var tx = cx + Math.cos(torchA[i]) * R * 1.2;
        var ty = cy + Math.sin(torchA[i]) * R * 1.2;
        var fl = Math.sin(frameCount * 0.3 + i) * 3;
        fill(255, 150, 40, 30);
        ellipse(tx, ty, 100 + fl * 2, 100 + fl * 2);
        fill(255, 150, 40, 55);
        ellipse(tx, ty, 46 + fl, 46 + fl);
        fill(60, 40, 25);
        ellipse(tx, ty, 16, 16);
        fill(255, 120, 20);
        ellipse(tx, ty, 12 + fl * 0.6, 12 + fl * 0.6);
        fill(255, 200, 70);
        ellipse(tx, ty, 7 + fl * 0.3, 7 + fl * 0.3);
        fill(255, 250, 200);
        ellipse(tx, ty, 3, 3);
    }
    popMatrix();

    // dark edges
    noFill();
    for (i = 0; i < 6; i++) {
        stroke(0, 0, 0, 50);
        strokeWeight(70);
        ellipse(cx, cy, W * 1.05 + i * 70, H * 1.2 + i * 70);
    }
    noStroke();
    if (pitFlash > 0.02) {
        fill(255, 245, 220, 200 * pitFlash);
        rect(0, 0, W, H);
    }

    // ---- fighting-game HUD ----
    if (mainFight && mainFight.foe) {
        var L = mainFight.topX <= mainFight.foe.topX ? mainFight : mainFight.foe;
        var Rf = L === mainFight ? mainFight.foe : mainFight;
        var bw = W / 2 - 80;
        hpBar(24, 44, bw, 18, L, false);
        hpBar(W - 24 - bw, 44, bw, 18, Rf, true);
        var nameL = L.ana ? "THE ANACONDA" + (L.nervous ? " (nervous)" : "") : L.name + "  Lv " + L.evo + (slayerCount(L) ? "  - ANACONDA SLAYER x" + slayerCount(L) : "");
        var nameR = Rf.ana ? "THE ANACONDA" + (Rf.nervous ? " (nervous)" : "") : Rf.name + "  Lv " + Rf.evo + (slayerCount(Rf) ? "  - ANACONDA SLAYER x" + slayerCount(Rf) : "");
        textSize(14);
        fill(0, 0, 0, 160);
        text(nameL, 27, 83);
        fill(255, 240, 210);
        text(nameL, 26, 82);
        textAlign(RIGHT, BASELINE);
        fill(0, 0, 0, 160);
        text(nameR, W - 25, 83);
        fill(255, 240, 210);
        text(nameR, W - 26, 82);
        textAlign(LEFT, BASELINE);
        // "used TAIL WHIP!" under each fighter's name
        textSize(13);
        if (frameCount - (L.moveF || -999) < 70 && L.moveName) {
            fill(255, 215, 120, 255 * Math.min(1, (70 - (frameCount - L.moveF)) / 20));
            text("used " + L.moveName + "!", 26, 102);
        }
        if (frameCount - (Rf.moveF || -999) < 70 && Rf.moveName) {
            textAlign(RIGHT, BASELINE);
            fill(255, 215, 120, 255 * Math.min(1, (70 - (frameCount - Rf.moveF)) / 20));
            text("used " + Rf.moveName + "!", W - 26, 102);
            textAlign(LEFT, BASELINE);
        }
        // status effects
        textSize(11);
        var stL = (L.poison > 0 ? "POISONED  " : "") + (L.hp < L.maxHp * 0.3 ? "RAGE  " : "") + (Rf.wrapT > 0 ? "SQUEEZED" : "");
        var stR = (Rf.poison > 0 ? "POISONED  " : "") + (Rf.hp < Rf.maxHp * 0.3 ? "RAGE  " : "") + (L.wrapT > 0 ? "SQUEEZED" : "");
        fill(255, 120, 90);
        text(stL, 26 + textWidth(nameL) * 14 / 11 + 14, 82);
        textAlign(RIGHT, BASELINE);
        text(stR, W - 26 - textWidth(nameR) * 14 / 11 - 14, 82);
        textAlign(LEFT, BASELINE);
        if (pitSlow > 0) {
            textAlign(CENTER, CENTER);
            textSize(12);
            fill(255, 255, 255, 180);
            text("~ slow motion ~", W / 2, 122);
            textAlign(LEFT, BASELINE);
        }
        var vsP = 1 + Math.sin(frameCount * 0.15) * 0.06;
        outlinedText("VS", W / 2, 54, 30 * vsP, [255, 200, 60], 255);
        var others = 0;
        for (i = 0; i < list.length; i++) {
            if (list[i].foe && list[i] !== mainFight && list[i] !== mainFight.foe) { others++; }
        }
        if (others > 0) {
            textAlign(CENTER, CENTER);
            textSize(11);
            fill(220, 200, 170);
            text("+" + (others / 2) + " more fight" + (others > 2 ? "s" : ""), W / 2, 80);
            textAlign(LEFT, BASELINE);
        }
    } else if (aType === "flesh" && fightPit.trial) {
        drawTrialHUD();
    } else {
        var arenaTitle = aType === "snake" && fightPit.who ? "INSIDE " + fightPit.who.name.toUpperCase() + ", THE FIGHT SNAKE" :
                         (aType === "tree" ? "INSIDE THE FIGHT KNOT" + (fightPit.tree ? " (" + fightPit.tree.sp.name.toUpperCase() + " TREE)" : "") :
                         (aType === "cave" ? "INSIDE THE FIGHT CAVE" : "THE " + arenaName(aType).toUpperCase()));
        outlinedText(arenaTitle, W / 2, 52, aType === "pit" ? 28 : 22, [255, 205, 110], 255);
        var inside = 0;
        for (i = 0; i < list.length; i++) {
            if (inPitX(list[i].x) && list[i].state !== "eaten") { inside++; }
        }
        textAlign(CENTER, CENTER);
        textSize(12);
        fill(225, 212, 190);
        text(inside === 0 ? "The " + arenaWord() + " is empty... waiting for snakes" :
             inside + (inside === 1 ? " snake" : " snakes") + " in the " +
             (aType === "death" ? "Pit of DEATH" : arenaName(aType).substring(6).toLowerCase()), W / 2, 78);
        if (anaArena()) {
            var bestS = null;
            for (i = 0; i < list.length; i++) {
                if ((list[i].anaStreak || 0) > 0 && (!bestS || list[i].anaStreak > bestS.anaStreak)) { bestS = list[i]; }
            }
            fill(255, 215, 90);
            text("Winners get +7 levels (25% chance it's RESET)" + (fightPit.gift > 0 ? "   |   " + fightPit.gift + " free levels for the next snake in" : "") +
                 (bestS ? "   |   Best streak: " + bestS.name + " " + bestS.anaStreak + " / " + ANA_STREAK : ""), W / 2, H - 36);
        }
        textAlign(LEFT, BASELINE);
    }
    // FIGHT! / K.O.!
    var bigAge = frameCount - pitBig.f;
    if (bigAge < 75) {
        var bsz = bigAge < 8 ? 30 + bigAge * 9 : 100 - Math.min(20, (bigAge - 8) * 1.5);
        outlinedText(pitBig.text, W / 2, H * 0.42, bsz, pitBig.col, 255 * Math.min(1, (75 - bigAge) / 20));
    }

    // ---- Shrewbert at the commentator's desk ----
    var deskX = W - 250;
    var deskY = H - 62;
    var talking = frameCount - shrewT < 200;
    drawShrew(W - 150, deskY + 4, 2.3, -1, talking);
    fill(95, 60, 35);
    rect(deskX, deskY, 230, 50, 6);
    fill(120, 80, 48);
    rect(deskX, deskY, 230, 10, 4);
    fill(60, 38, 22);
    rect(deskX + 20, deskY + 18, 190, 22, 4);
    fill(255, 215, 140);
    textAlign(CENTER, CENTER);
    textSize(11);
    text("SHREWBERT SNOUTLEY - COMMENTARY", deskX + 115, deskY + 29);
    textAlign(LEFT, BASELINE);
    if (frameCount - shrewT < 360) {
        drawBubble(shrewLine, W - 250, H - 140, 300, W - 150 - 52, H - 105, 14);
    }
    textAlign(CENTER, CENTER);
    textSize(11);
    fill(170, 165, 150);
    text("Click anywhere to go back to the forest", W / 2, H - 14);
    textAlign(LEFT, BASELINE);
};

var drawSnakeFx = function() {
    noStroke();
    for (var i = 0; i < snakeFx.length; i++) {
        var f = snakeFx[i];
        if (!inView(f.x, 10)) { continue; }
        var al = 255 * (1 - f.life / f.max);
        fill(f.col[0], f.col[1], f.col[2], al);
        ellipse(f.x, f.y, f.r * S, f.r * S);
    }
    // venom globs in flight
    for (var g = 0; g < spitShots.length; g++) {
        var sh = spitShots[g];
        if (!inView(sh.x, 40)) { continue; }
        for (var tr3 = 4; tr3 >= 0; tr3--) {
            var gf = Math.max(0, (sh.t - tr3 * 1.2) / sh.max);
            var gx = lerp(sh.x, sh.tx, gf);
            var gy = lerp(sh.y, sh.ty, gf) - Math.sin(gf * PI) * 22 * S;
            fill(120, 230, 70, tr3 === 0 ? 255 : 150 - tr3 * 30);
            ellipse(gx, gy, (tr3 === 0 ? 9 : 7 - tr3 * 0.9) * S, (tr3 === 0 ? 9 : 7 - tr3 * 0.9) * S);
            if (tr3 === 0) {
                fill(220, 255, 190);
                ellipse(gx - 1 * S, gy - 1 * S, 2 * S, 2 * S);
            }
        }
    }
    // move names floating over fighters
    for (var j = sideWords.length - 1; j >= 0; j--) {
        var w = sideWords[j];
        var age = frameCount - w.f;
        if (age > 60) {
            sideWords.splice(j, 1);
            continue;
        }
        var pop = age < 6 ? 0.6 + age / 6 * 0.5 : 1.1 - Math.min(0.1, (age - 6) * 0.02);
        outlinedText(w.text, w.x, w.y - age * 0.5, Math.max(10, 11 * S) * pop, w.col, 255 * Math.min(1, (60 - age) / 15));
    }
};

var drawAnimals = function() {
    var order = ["snake", "deer", "rabbit", "bear", "squirrel", "bird", "owl"];
    for (var o = 0; o < order.length; o++) {
        for (var i = 0; i < animals.length; i++) {
            var a = animals[i];
            if (a.type !== order[o] || !inView(a.x, 80 * S)) { continue; }
            // snakes inside the Fight Cave / Fight Knot can't be seen from out here
            if (a.type === "snake" && arenaHides() && inPitX(a.x)) { continue; }
            if (a.type === "deer") {
                drawDeer(a);
            } else if (a.type === "rabbit") {
                drawRabbit(a);
            } else if (a.type === "squirrel") {
                drawSquirrel(a);
            } else if (a.type === "bird") {
                drawBird(a);
            } else if (a.type === "owl") {
                drawOwl(a);
            } else if (a.type === "bear") {
                drawBear(a);
            } else if (a.type === "snake") {
                if (a.merging) {
                    var mgs = 0.6 + 0.4 * Math.sin(frameCount * 0.3);
                    fill(230, 120, 255, 70 * mgs);
                    ellipse(a.x, GROUND - 14 * S * a.size, 60 * S * mgs, 50 * S * mgs);
                    fill(255, 140, 170, 60 * mgs);
                    ellipse(a.x, GROUND - 14 * S * a.size, 36 * S, 30 * S);
                }
                if (a.merging) {
                    var mgs = 0.6 + 0.4 * Math.sin(frameCount * 0.3);
                    fill(230, 120, 255, 70 * mgs);
                    ellipse(a.x, GROUND - 14 * S * a.size, 60 * S * mgs, 50 * S * mgs);
                }
                var lift = snakeTrapLift(a);
                if (lift > 18 * S) { continue; }
                if (a.trialing) {
                    var tSaved = a.state;
                    a.state = "fight";
                    a.strikeT = a.trialMoveT || 0;
                    a.strike = a.trialMoveT > 0 ? Math.sin((1 - a.trialMoveT / 16) * PI) : 0;
                    a.move = a.trialMove || "bite";
                    if (a.trialAim) { a.dir = a.trialAim.x < 0 ? -1 : 1; }
                    drawSnake(a);
                    a.state = tSaved;
                    a.strike = 0;
                    a.strikeT = 0;
                    continue;
                }
                if (lift !== 0) {
                    pushMatrix();
                    translate(0, lift);
                    drawSnake(a);
                    popMatrix();
                } else {
                    drawSnake(a);
                }
            }
        }
    }
    if (arenaIs("cave")) { drawCaveOutside(); }
    if (arenaIs("tree")) { drawKnotOutside(); }
    for (var wi = 0; wi < animals.length; wi++) {
        var wa = animals[wi];
        if (wa.type === "snake" && wa.wrapT > 0 && wa.foe && wa.state === "fight" && inView(wa.x, 80 * S) &&
            !(arenaHides() && inPitX(wa.x))) {
            drawWrapRings(wa, true);
        }
    }
    drawSnakeFx();
};

var drawNightGlows = function() {
    if (daylight > 0.5) {
        return;
    }
    for (var i = 0; i < animals.length; i++) {
        var a = animals[i];
        if (a.type === "owl" && a.state === "perch" && a.blink <= 0 && inView(a.x, 20)) {
            noStroke();
            fill(255, 220, 90, 40 * (1 - daylight));
            ellipse(a.x, a.y - 13.5 * S, 16 * S, 9 * S);
            drawOwlEyes(a);
        }
    }
};

var drawHiveBees = function(st) {
    if (daylight < 0.25 || st > 0.76) {
        return;
    }
    noStroke();
    for (var i = 0; i < trees.length; i++) {
        var tr = trees[i];
        if (!tr.hive || tr.state !== "alive" || !inView(tr.x, 250 * S)) { continue; }
        var hx = hiveWorldX(tr);
        var hy = hiveWorldY(tr);
        for (var k = 0; k < 6; k++) {
            var ang = t * 0.04 * (1 + k * 0.15) + k * 1.7;
            var r = (10 + Math.sin(t * 0.03 + k) * 5) * S;
            drawBee(hx + Math.cos(ang) * r * 1.4, hy + Math.sin(ang) * r, daylight);
        }
    }
};

var drawBees = function(st) {
    var mt = mysticTree();
    var endSt = mt ? 0.72 : 0.55;
    var vis = daylight * ease((st - 0.03) / 0.03) * (1 - ease((st - endSt) / 0.03));
    if (vis <= 0.05) {
        return;
    }
    var bl = mainTree.blossoms;
    var useBlossoms = mainTree.sp.blossom && mainTree.state === "alive" &&
                      st < 0.2 && bl.length > 0 && mainTree.mature > 0.6;
    var mf = mt && mt.fruits.length > 0 && mt.mature > 0.6;

    noStroke();
    for (var i = 0; i < bees.length; i++) {
        var b = bees[i];

        for (var s = 0; s < speed; s++) {
            b.timer--;
            if (b.timer <= 0) {
                var r = random(1);
                if (mf && r < 0.5) {
                    var fr = mt.fruits[Math.floor(random(mt.fruits.length))];
                    b.tx = treeWX(mt, fr.x);
                    b.ty = treeWY(mt, fr.y + mt.sp.fruit.hang * S);
                } else if (useBlossoms && r < 0.8) {
                    var B = bl[Math.floor(random(bl.length))];
                    b.tx = treeWX(mainTree, B.x);
                    b.ty = treeWY(mainTree, B.y);
                } else {
                    var f = pickFlowerInView();
                    b.tx = f.x;
                    b.ty = GROUND - f.h;
                }
                b.timer = random(90, 200);
            }
            b.x += (b.tx - b.x) * 0.03 + random(-1, 1) * S;
            b.y += (b.ty - b.y) * 0.03 + random(-1, 1) * S;
        }

        if (inView(b.x, 10)) {
            drawBee(b.x, b.y, vis);
        }
    }
};

var drawButterflies = function(st) {
    var vis = ease((st - 0.2) / 0.03) * (1 - ease((st - 0.52) / 0.03)) * daylight;
    if (vis <= 0.01) {
        return;
    }

    var cx = treeX;
    var cy = GROUND - H * 0.3;

    for (var i = 0; i < butterflies.length; i++) {
        var bf = butterflies[i];

        for (var s = 0; s < speed; s++) {
            bf.heading += random(-0.25, 0.25);
            bf.x += Math.cos(bf.heading) * 1.1 * S;
            bf.y += Math.sin(bf.heading) * 0.8 * S;
            if (dist(bf.x, bf.y, cx, cy) > W * 0.35) {
                bf.heading = Math.atan2(cy - bf.y, cx - bf.x) + random(-0.5, 0.5);
            }
        }

        if (!inView(bf.x, 10)) { continue; }
        var flap = Math.abs(Math.sin(t * 0.35 + bf.phase));
        var ws = 6 * S;
        noStroke();
        fill(bf.c[0], bf.c[1], bf.c[2], 255 * vis);
        ellipse(bf.x - ws * 0.5 * flap, bf.y - 2 * S, ws * flap, ws * 0.9);
        ellipse(bf.x + ws * 0.5 * flap, bf.y - 2 * S, ws * flap, ws * 0.9);
        ellipse(bf.x - ws * 0.4 * flap, bf.y + 2 * S, ws * 0.7 * flap, ws * 0.6);
        ellipse(bf.x + ws * 0.4 * flap, bf.y + 2 * S, ws * 0.7 * flap, ws * 0.6);
        stroke(40, 30, 30, 255 * vis);
        strokeWeight(1);
        line(bf.x, bf.y - 3 * S, bf.x, bf.y + 3 * S);
        noStroke();
    }
};

// ================= NIGHT EFFECTS & MAGIC =================

var drawNightShade = function() {
    noStroke();
    var dark = (1 - daylight) * 125;
    if (dark > 1) {
        fill(8, 12, 40, dark);
        rect(0, 0, W, H);
    }
    if (dusk > 0.01) {
        fill(255, 120, 60, dusk * 30);
        rect(0, 0, W, H);
    }
};

var drawFireflies = function(st) {
    var vis = (1 - daylight) * ease((st - 0.22) / 0.03) * (1 - ease((st - 0.58) / 0.03));
    if (vis <= 0.01) {
        return;
    }

    noStroke();
    for (var i = 0; i < fireflies.length; i++) {
        var f = fireflies[i];

        for (var s = 0; s < speed; s++) {
            f.heading += random(-0.2, 0.2);
            f.x += Math.cos(f.heading) * 0.4 * S;
            f.y += Math.sin(f.heading) * 0.3 * S;
            if (f.x < 0 || f.x > WW || f.y < GROUND - 140 * S || f.y > GROUND - 4 * S) {
                f.heading += PI;
            }
        }

        if (!inView(f.x, 10)) { continue; }
        var b = Math.max(0, Math.sin(t * f.blink + f.phase));
        b = b * b;
        if (b < 0.02) { continue; }
        fill(255, 240, 120, 45 * b * vis);
        ellipse(f.x, f.y, 12 * S, 12 * S);
        fill(255, 250, 170, 230 * b * vis);
        ellipse(f.x, f.y, 2.5 * S, 2.5 * S);
    }
};

var updateSparkles = function() {
    for (var i = 0; i < trees.length; i++) {
        var tr = trees[i];
        if (tr.state !== "alive" || !tr.sp.dust || tr.mature < 0.3 || !inView(tr.x, 200 * S)) {
            continue;
        }
        if (random(1) < 0.25 * speed && sparkles.length < 60) {
            sparkles.push({
                x: tr.x + random(-70, 70) * S * tr.sc,
                y: GROUND - random(40, 260) * S * tr.sc,
                life: 0,
                max: random(60, 120)
            });
        }
    }
    for (var j = sparkles.length - 1; j >= 0; j--) {
        var s = sparkles[j];
        s.life += speed;
        s.y -= 0.25 * S * speed;
        if (s.life >= s.max) {
            sparkles.splice(j, 1);
        }
    }
};

var drawSparkles = function() {
    noStroke();
    for (var i = 0; i < sparkles.length; i++) {
        var s = sparkles[i];
        if (!inView(s.x, 10)) { continue; }
        var a = Math.sin(s.life / s.max * PI);
        fill(140, 190, 255, 50 * a);
        ellipse(s.x, s.y, 8 * S, 8 * S);
        fill(220, 240, 255, 230 * a);
        ellipse(s.x, s.y, 2.2 * S, 2.2 * S);
    }
};

// ================= UI =================

var wildlifeText = function() {
    var names = ["squirrel", "bird", "deer", "rabbit", "owl", "bear", "snake"];
    var plural = ["squirrels", "birds", "deer", "rabbits", "owls", "bears", "snakes"];
    var parts = [];
    for (var i = 0; i < names.length; i++) {
        var n = countAnimals(names[i]);
        if (n === 1) {
            parts.push(names[i]);
        } else if (n > 1) {
            parts.push(n + " " + plural[i]);
        }
    }
    return parts.length > 0 ? parts.join(", ") : "none right now";
};

var countSeeds = function() {
    var n = 0;
    for (var i = 0; i < groundFood.length; i++) {
        if (!groundFood[i].taken || groundFood[i].buried) { n++; }
    }
    return n;
};

var countHives = function() {
    var n = 0;
    for (var i = 0; i < trees.length; i++) {
        if (trees[i].hive) { n++; }
    }
    return n;
};

var statusText = function(tr) {
    if (tr.state === "dust") { return "crumbling to dust"; }
    if (tr.state === "dead" || tr.state === "falling") { return "dead"; }
    if (tr.state === "log") { return "fallen log"; }
    if (tr.vigor < 1) { return "old & dying"; }
    if (tr.mature < 0.98) { return "growing"; }
    return "healthy";
};

var buttonRect = function(i) {
    var n = speciesList.length;
    var bw = (W - 20 - 5 * (n - 1)) / n;
    return { x: 10 + i * (bw + 5), y: H - 34, w: bw, h: 26 };
};

// Mini-map of the whole forest (top right)
// The mini-map shows the WHOLE forest in one long strip. The view box stays
// the size it was when the forest was MINI_BOX_SCREENS screens wide, so a
// wider forest just makes the mini-map longer.
var MINI_BOX_SCREENS = 3;

var miniRect = function() {
    var baseX = Math.max(275, W - 160);
    var baseInner = W - 10 - baseX - 8;
    var inner = Math.min(W - 28, baseInner * WORLD_SCREENS / MINI_BOX_SCREENS);
    var w = inner + 8;
    // Always in the top-right corner
    return { x: W - 10 - w, y: 10, w: w, h: 28, top: true };
};

var miniLocked = false;
var miniLockStart = 0;

var miniSpan = function() {
    return WW;
};

var miniStart = function() {
    return 0;
};

var drawMinimap = function() {
    if (!mouseIsPressed) {
        miniLocked = false;
    }
    var m = miniRect();
    var inner = m.w - 8;
    var span = miniSpan();
    var ms = miniStart();
    var sx = inner / span;

    noStroke();
    fill(255, 255, 255, 195);
    rect(m.x, m.y, m.w, m.h, 6);
    fill(110, 150, 90);
    rect(m.x + 4, m.y + m.h - 8, inner, 3);

    // Arrows show there's more forest beyond the mini-map
    fill(40, 35, 30, 170);
    if (ms > 1) {
        triangle(m.x + 1, m.y + m.h / 2, m.x + 5, m.y + m.h / 2 - 4, m.x + 5, m.y + m.h / 2 + 4);
    }
    if (ms + span < WW - 1) {
        triangle(m.x + m.w - 1, m.y + m.h / 2, m.x + m.w - 5, m.y + m.h / 2 - 4,
                 m.x + m.w - 5, m.y + m.h / 2 + 4);
    }

    for (var i = 0; i < trees.length; i++) {
        var tr = trees[i];
        if (tr.x < ms - 4 || tr.x > ms + span + 4) { continue; }
        var px = m.x + 4 + (tr.x - ms) * sx;
        var by = m.y + m.h - 8;
        if (tr.state === "alive") {
            var th = 4 + 12 * tr.sc;
            fill(90, 65, 45);
            rect(px - 0.5, by - th * 0.4, 1.5, th * 0.4);
            fill(tr.sp.icon[0], tr.sp.icon[1], tr.sp.icon[2]);
            ellipse(px, by - th * 0.65, 3 + 4 * tr.sc, th * 0.6);
        } else if (tr.state === "log") {
            fill(120, 100, 80);
            rect(Math.min(px, px + tr.fallDir * 6), by - 2, 6, 2);
        } else {
            fill(140, 130, 120);
            rect(px - 0.5, by - 10, 1.5, 10);
        }
    }

    // The part of the forest you're looking at
    noFill();
    stroke(40, 35, 30);
    strokeWeight(1.5);
    rect(m.x + 4 + (camX - ms) * sx, m.y + 2, W * sx, m.h - 4, 3);
    noStroke();

    fill(255, 255, 255, 220);
    textSize(9);
    if (m.top) {
        textAlign(RIGHT, TOP);
        text("Drag to explore", m.x + m.w, m.y + m.h + 3);
    } else {
        textAlign(RIGHT, BOTTOM);
        text("Drag to explore", m.x + m.w, m.y - 2);
    }
    textAlign(LEFT, BASELINE);
};

// The row of bait dots above the tree buttons
var baitSlots = function() {
    var slots = [];
    var y = H - 62;
    var x = 50;
    var nx = x;
    if (baitUnlocked) {
        for (var i = 0; i < snakeRoster.length; i++) {
            slots.push({ kind: "bait", who: snakeRoster[i], x: x + i * 24, y: y, w: 20, h: 20 });
        }
        nx = x + snakeRoster.length * 24 + 8;
    }
    if (anaBaitUnlocked) {
        slots.push({ kind: "ana", who: null, x: nx, y: y, w: 20, h: 20 });
        nx += 30;
    }
    if (anyArenaUnlocked()) {
        var arenas = ["pit", "pond", "cave", "tree", "snake", "death", "flesh"];
        var labels = ["Pit", "Pond", "Cave", "Tree", "SNAKE", "DEATH", "FLESH"];
        for (var ai = 0; ai < 7; ai++) {
            slots.push({ kind: "pit", arena: arenas[ai], label: labels[ai], who: null, x: nx, y: y - 1, w: 50, h: 22 });
            nx += 54;
        }
    }
    return slots;
};

var baitSlotAt = function(mx, my) {
    var slots = baitSlots();
    for (var i = 0; i < slots.length; i++) {
        var s = slots[i];
        if (mx >= s.x && mx <= s.x + s.w && my >= s.y && my <= s.y + s.h) { return s; }
    }
    return null;
};

var toolIs = function(s) {
    if (placeTool === null) { return false; }
    if (s.kind === "pit") {
        return (placeTool.kind === "pit" || placeTool.kind === "choose") && placeTool.arena === s.arena;
    }
    return placeTool.kind === s.kind && placeTool.who === s.who;
};

// picking a snake to sacrifice for the Fight SNAKE
var chooserSlot = function(i) {
    return { x: 50 + i * 60, y: H - 150, w: 56, h: 58 };
};
var drawChooser = function() {
    if (!placeTool || placeTool.kind !== "choose") { return; }
    noStroke();
    fill(25, 15, 35, 230);
    rect(40, H - 196, (snakeRoster.length + 1) * 60 + 20, 130, 8);
    fill(230, 200, 255);
    textSize(12);
    text("Choose a snake to SACRIFICE. It becomes the giant FIGHT SNAKE arena!", 52, H - 180);
    var info = "Inside, winners get bonus levels (its level, max 6), and everyone can ONLY use its moves.";
    for (var hi = 0; hi < snakeRoster.length; hi++) {
        var hr = chooserSlot(hi);
        if (mouseX >= hr.x && mouseX <= hr.x + hr.w && mouseY >= hr.y && mouseY <= hr.y + hr.h) {
            var hw = snakeRoster[hi];
            info = hw.name + ": winners get " + bonusText(snakeBonus(hw)) + "  Allowed moves: " + fightSnakeMoveList(hw);
        }
    }
    var ar = chooserSlot(snakeRoster.length);
    var overA = mouseX >= ar.x && mouseX <= ar.x + ar.w && mouseY >= ar.y && mouseY <= ar.y + ar.h;
    if (overA) {
        info = anaFightUnlocked ? "THE ANACONDA: winners get +7 levels (but sometimes it RESETS them), it eats snakes that come in, " +
                                  "and " + ANA_STREAK + " wins in a row means... something" :
                                  "THE ANACONDA is locked: see it " + anaSeenCount + " / 10 times - or type 'anny'";
    }
    fill(255, 225, 140);
    textSize(10);
    text(info, 52, H - 163);
    for (var i = 0; i < snakeRoster.length; i++) {
        var r = chooserSlot(i);
        var w = snakeRoster[i];
        var over = mouseX >= r.x && mouseX <= r.x + r.w && mouseY >= r.y && mouseY <= r.y + r.h;
        fill(255, 255, 255, over ? 60 : 20);
        rect(r.x, r.y, r.w, r.h, 6);
        var c = baitColor(w);
        fill(c[0], c[1], c[2]);
        ellipse(r.x + r.w / 2, r.y + 18, 22, 22);
        fill(w.col.band[0], w.col.band[1], w.col.band[2]);
        ellipse(r.x + r.w / 2, r.y + 18, 9, 9);
        fill(240);
        textAlign(CENTER, CENTER);
        textSize(9);
        text(w.name, r.x + r.w / 2, r.y + 38);
        fill(190, 180, 210);
        text("Lv " + w.evo, r.x + r.w / 2, r.y + 50);
        fill(255, 225, 140);
        textSize(9);
        text("+" + snakeBonus(w), r.x + r.w - 9, r.y + 8);
        textAlign(LEFT, BASELINE);
    }
    // the Anaconda
    fill(anaFightUnlocked ? color(120, 20, 20, overA ? 200 : 140) : color(255, 255, 255, overA ? 40 : 15));
    rect(ar.x, ar.y, ar.w, ar.h, 6);
    fill(anaFightUnlocked ? color(85, 95, 40) : color(90, 90, 90));
    ellipse(ar.x + ar.w / 2, ar.y + 18, 26, 26);
    fill(anaFightUnlocked ? color(58, 66, 26) : color(70, 70, 70));
    ellipse(ar.x + ar.w / 2, ar.y + 18, 12, 12);
    textAlign(CENTER, CENTER);
    fill(anaFightUnlocked ? 255 : 150);
    textSize(9);
    text(anaFightUnlocked ? "ANACONDA" : "???", ar.x + ar.w / 2, ar.y + 38);
    fill(255, 225, 140);
    text(anaFightUnlocked ? "Lv ??" : anaSeenCount + "/10", ar.x + ar.w / 2, ar.y + 50);
    if (anaFightUnlocked) { text("+7", ar.x + ar.w - 9, ar.y + 8); }
    textAlign(LEFT, BASELINE);
};

var arenaLockHint = function(type) {
    if (type === "cave") {
        return "Fight CAVE is locked: unlocks after 10 years (now year " + (Math.floor(t / YEAR) + 1) + ") - or type 'cave'";
    }
    if (type === "tree") {
        return "Fight TREE is locked: grow 100 trees (" + Math.min(100, treesGrownCount) + " / 100) - or type 'tree'";
    }
    if (type === "snake") {
        var seen = 0;
        for (var i = 0; i < snakeRoster.length; i++) {
            if (snakeRoster[i].seen) { seen++; }
        }
        return "Fight SNAKE is locked: see all 10 snakes (" + seen + " / 10 seen) - or type 'snake'";
    }
    if (type === "pond") {
        return "Fight POND is locked: watch " + POND_FIGHTS + " snake fights (" + Math.min(POND_FIGHTS, fightsSeen) + " / " + POND_FIGHTS + ") - or type 'pond'";
    }
    if (type === "flesh") {
        return "FLESH PIT is locked: witness " + FLESH_DEATHS + " snake deaths (" + Math.min(FLESH_DEATHS, deathsSeen) + " / " + FLESH_DEATHS + ") - or type 'flesh'";
    }
    if (type === "death") {
        return "PIT OF DEATH is locked: a snake must win " + ANA_STREAK + " in a row inside the Anaconda Fight Snake - or type 'death'";
    }
    return "Fight PIT is locked: grow 20 trees (" + Math.min(20, treesGrownCount) + " / 20) - or type 'fight'";
};

var drawBaitBar = function() {
    drawChooser();
    var slots = baitSlots();
    var last = slots.length > 0 ? slots[slots.length - 1] : null;
    var textX = last ? last.x + last.w + 14 : 50;
    var locked = [];
    if (!baitUnlocked) { locked.push("Bait locked: " + Math.min(40, treesGrownCount) + " / 40 trees grown"); }
    if (!anyArenaUnlocked()) { locked.push("Fight Pit locked: " + Math.min(20, treesGrownCount) + " / 20 trees grown"); }
    var lockedText = locked.join("     ");
    textSize(10);
    var endX = textX + (lockedText !== "" ? textWidth(lockedText) + 10 : -6);
    noStroke();
    fill(255, 255, 255, 120);
    rect(8, H - 66, endX - 8, 28, 6);
    fill(40, 35, 30);
    textSize(11);
    text(baitUnlocked ? "Bait" : "Soon", 16, H - 48);
    var hover = null;
    for (var i = 0; i < slots.length; i++) {
        var s = slots[i];
        var cx = s.x + s.w / 2;
        var cy = s.y + s.h / 2;
        var over = mouseX >= s.x && mouseX <= s.x + s.w && mouseY >= s.y && mouseY <= s.y + s.h;
        if (over) { hover = s; }
        if (s.kind === "pit") {
            var built = arenaIs(s.arena);
            var btnCol = s.arena === "cave" ? [80, 78, 90] : (s.arena === "tree" ? [70, 110, 50] :
                         (s.arena === "snake" ? [110, 50, 120] : [120, 85, 50]));
            if (!arenaUnlocked(s.arena)) { btnCol = [150, 145, 140]; }
            if (toolIs(s)) {
                fill(255, 220, 140);
            } else {
                fill(btnCol[0], btnCol[1], btnCol[2], over ? 255 : 220);
            }
            rect(s.x, s.y, s.w, s.h, 5);
            if (built) {
                noFill();
                stroke(255, 230, 120);
                strokeWeight(2);
                rect(s.x, s.y, s.w, s.h, 5);
                noStroke();
            }
            fill(toolIs(s) ? color(60, 40, 20) : (arenaUnlocked(s.arena) ? color(255, 235, 190) : color(210, 205, 200)));
            textAlign(CENTER, CENTER);
            text(arenaUnlocked(s.arena) ? s.label : s.label + "?", cx, cy);
            textAlign(LEFT, BASELINE);
            continue;
        }
        if (toolIs(s)) {
            fill(255);
            ellipse(cx, cy, 22, 22);
        } else if (over) {
            fill(255, 255, 255, 150);
            ellipse(cx, cy, 20, 20);
        }
        var c = s.kind === "ana" ? [85, 95, 40] : baitColor(s.who);
        var band = s.kind === "ana" ? [25, 25, 15] : s.who.col.band;
        var faded = s.kind === "bait" && s.who.hatching;
        fill(c[0], c[1], c[2], faded ? 110 : 255);
        ellipse(cx, cy, s.kind === "ana" ? 17 : 14, s.kind === "ana" ? 17 : 14);
        fill(band[0], band[1], band[2], faded ? 110 : 255);
        ellipse(cx, cy, 6, 6);
        // a little flag when this snake's bait is on the ground
        for (var b = 0; b < baits.length; b++) {
            if ((s.kind === "ana" && baits[b].ana) || (s.kind === "bait" && baits[b].who === s.who)) {
                fill(255, 255, 255);
                triangle(cx + 5, s.y - 4, cx + 5, s.y + 2, cx + 10, s.y - 1);
            }
        }
    }
    if (lockedText !== "") {
        fill(80, 70, 60);
        textSize(10);
        text(lockedText, textX, H - 48);
    }
    if (hover) {
        var label;
        if (hover.kind === "pit") {
            if (hover.arena === "snake") {
                label = "Fight SNAKE: sacrifice a snake to become a giant snake arena (winners get bonus levels, fighters use its moves)";
            } else if (hover.arena === "cave") {
                label = "Fight CAVE: a little cave - snakes fight inside in the dark (sneak-attack criticals!)";
            } else if (hover.arena === "tree") {
                label = "Fight TREE: pick a tree - the arena goes in a knot in its trunk (acorns fall!)";
            } else if (hover.arena === "pond") {
                label = "Fight POND: snakes battle in the water - they dive, Flame Tail fizzles, and watch out for the snapping turtle!";
            } else if (hover.arena === "flesh") {
                label = "FLESH PIT: snakes go in ONE AT A TIME - the pit attacks them with flesh snakes and tentacles!";
            } else if (hover.arena === "death") {
                label = "PIT OF DEATH: a fight pit full of BOOBY TRAPS - spikes, boulders, fire, blades and trapdoors!";
            } else {
                label = "Fight PIT: the classic sand arena";
            }
            label += fightPit ? " (replaces your " + arenaName() + ")" : "";
            if (!arenaUnlocked(hover.arena)) { label = arenaLockHint(hover.arena); }
        } else if (hover.kind === "ana") {
            label = "ANACONDA bait - summons the giant!";
        } else {
            var w = hover.who;
            label = w.name + " (Lv " + w.evo + ")" + (w.anaKills ? " - ANACONDA SLAYER x" + w.anaKills : "") + (w.fusedInto ? " - merged into " + w.fusedInto : "") + (w.sacrificed ? " - is the FIGHT SNAKE" : (w.here ? "" : (w.hatching ? " - hatching..." : (w.seen ? " - away" : " - not seen yet"))));
        }
        textSize(11);
        var tw = textWidth(label) + 14;
        var lx = constrain(hover.x + hover.w / 2 - tw / 2, 4, W - tw - 4);
        fill(25, 22, 30, 220);
        rect(lx, H - 92, tw, 20, 5);
        fill(255);
        textAlign(CENTER, CENTER);
        text(label, lx + tw / 2, H - 82);
        textAlign(LEFT, BASELINE);
    }
};

var drawButtons = function() {
    textSize(11);
    textAlign(CENTER, CENTER);

    for (var i = 0; i < speciesList.length; i++) {
        var r = buttonRect(i);
        var sp = speciesList[i];
        var sel = (sp === selected);
        var hover = mouseX >= r.x && mouseX <= r.x + r.w && mouseY >= r.y && mouseY <= r.y + r.h;

        noStroke();
        fill(255, 255, 255, sel ? 240 : (hover ? 205 : 150));
        rect(r.x, r.y, r.w, r.h, 6);

        if (sel) {
            noFill();
            stroke(60, 45, 30);
            strokeWeight(2);
            rect(r.x, r.y, r.w, r.h, 6);
        }

        var narrow = r.w < 56;
        if (narrow) {
            noStroke();
            fill(sp.icon[0], sp.icon[1], sp.icon[2]);
            rect(r.x + 4, r.y + r.h - 5, r.w - 8, 3, 2);
        } else {
            stroke(0, 0, 0, 70);
            strokeWeight(1);
            fill(sp.icon[0], sp.icon[1], sp.icon[2]);
            ellipse(r.x + 9, r.y + r.h / 2, 8, 8);
        }

        noStroke();
        fill(40, 35, 30);
        textSize(narrow ? 9 : 11);
        text(sp.name, r.x + r.w / 2 + (narrow ? 0 : 5), r.y + r.h / 2 - (narrow ? 2 : 0));
    }

    textAlign(LEFT, BASELINE);
};

// The info panel can be closed (X) and opened again (Info button or the I key)
var showInfo = true;

var infoToggleRect = function() {

        return { x: 243, y: 14, w: 18, h: 18 };

    return { x: 10, y: 10, w: 52, h: 22 };
};

    textSize(10);
    text(msp.desc, 20, 62);

    textSize(11);
    text("Nearest tree: " + ((t - mainTree.start) / YEAR).toFixed(1) + " of ~" +
         (mainTree.life / YEAR).toFixed(1) + " yrs (" + statusText(mainTree) + ")", 20, 80);
    text("Branches: " + grown + " / " + mainTree.branches.length +
         "   " + (msp.leafShape === "needle" ? "Tufts: " : "Leaves: ") + leafCount +
         "   Hives: " + countHives(), 20, 94);
    text("Seeds on ground: " + countSeeds() + "   Seedlings: " + seedlings.length, 20, 108);
    text("Trees alive: " + aliveCount() + " / " + MAX_TREES + "   Dead & fallen: " + logs, 20, 122);
    text("Wildlife: " + wildlifeText(), 20, 136);
    text("Speed " + speed + "x  |  SPACE speed  |  1-" + speciesList.length + " tree", 20, 150);

    var cols = [color(150, 210, 110), color(70, 150, 60), color(220, 140, 50), color(190, 210, 235)];
    for (var i = 0; i < 4; i++) {
        fill(cols[i]);
        rect(20 + i * 56, 161, 56, 6);
    }
    fill(40, 35, 30);
    rect(20 + st * 224 - 1, 158, 3, 12);
};

// ================= PLANTING WITH THE MOUSE =================

var toastText = "";
var toastFrame = -1000;

var showToast = function(msg) {
    toastText = msg;
    toastFrame = frameCount;
};

// Is the mouse over the scene (not the buttons, panel or mini-map)?
var mouseInScene = function() {
    var m = miniRect();
    if (mouseY > H - 68) { return false; }
    if (showInfo && mouseX < 265 && mouseY < 178) { return false; }
    if (!showInfo && mouseX < 62 && mouseY < 32) { return false; }
    if (mouseX > m.x && mouseX < m.x + m.w &&
        mouseY > m.y - 14 && mouseY < m.y + m.h + 14) { return false; }
    return true;
};

var plantProblem = function(x) {
    if (x < 30 * S || x > WW - 30 * S) { return "Too close to the edge of the world"; }
    if (aliveCount() >= MAX_TREES) { return "The forest is full (" + MAX_TREES + " trees)"; }
    if (!treeSpotFree(x)) { return "Too close to another tree"; }
    return "";
};

var plantAt = function(x) {
    var problem = plantProblem(x);
    if (problem !== "") {
        showToast(problem);
        return;
    }
    makeTree(x, 2, t, 0.15, random(0.85, 1), YEAR * 3, selected);
    if (mainTree) {
        useTree(mainTree);
    }
    showToast("Planted a " + selected.name + " tree");
    snd("plant");
};

// You can only plant when the mouse is close to the ground
var nearGround = function() {
    return Math.abs(mouseY - GROUND) <= 50 * S;
};

// ---- Tree stats when you hover over a tree ----

// The tree's outline at full size (worked out once)
var treeBounds = function(tr) {
    if (!tr.bb) {
        var l = tr.x, r = tr.x, top = GROUND;
        for (var i = 0; i < tr.branches.length; i++) {
            var p = tr.branches[i].pts;
            for (var j = 0; j < p.length; j++) {
                l = Math.min(l, p[j].x);
                r = Math.max(r, p[j].x);
                top = Math.min(top, p[j].y);
            }
        }
        tr.bb = { l: l - 12 * S, r: r + 12 * S, top: top - 14 * S };
    }
    return tr.bb;
};

var statsTree = null;     // the tree whose stats are showing (right-click)
var statsBox = null;

var treeUnderMouse = function() {
    if (!mouseInScene()) { return null; }
    var mx = mouseX + camX;
    var my = mouseY;
    var best = null;
    var bestD = 1e9;
    for (var i = 0; i < trees.length; i++) {
        var tr = trees[i];
        var hit = false;
        if (tr.state === "log") {
            var x1 = Math.min(tr.x, tr.x + tr.fallDir * tr.logLen);
            var x2 = Math.max(tr.x, tr.x + tr.fallDir * tr.logLen);
            hit = mx > x1 && mx < x2 && Math.abs(my - (GROUND - 8 * S)) < 16 * S;
        } else {
            var bb = treeBounds(tr);
            var trunkHalf = Math.max(8 * S, tr.trunkW * tr.sc * 0.7);
            var inTrunk = Math.abs(mx - tr.x) < trunkHalf &&
                          my < GROUND + 4 * S && my > treeWY(tr, GROUND - tr.trunkH);
            var inCrown = mx > treeWX(tr, bb.l) && mx < treeWX(tr, bb.r) &&
                          my > treeWY(tr, bb.top) && my < treeWY(tr, GROUND - tr.trunkH * 0.35);
            hit = inTrunk || (inCrown && tr.state !== "falling");
        }
        if (hit) {
            var d = Math.abs(mx - tr.x);
            if (d < bestD) {
                bestD = d;
                best = tr;
            }
        }
    }
    return best;
};

var placeProblem = function(x) {
    if (placeTool.kind === "pit") {
        if (x < pitHalf() + 20 * S || x > WW - pitHalf() - 20 * S) { return "Too close to the edge of the world"; }
    } else if (x < 20 * S || x > WW - 20 * S) {
        return "Too close to the edge of the world";
    }
    return "";
};

var placeAt = function(x) {
    var problem = placeProblem(x);
    if (problem !== "") {
        showToast(problem);
        return;
    }
    var tool = placeTool;
    placeTool = null;
    if (tool.kind === "pit") {
        var oldWho = arenaIs("snake") ? fightPit.who : null;
        fightPit = { x: x, type: tool.arena || "pit", who: tool.arena === "snake" ? tool.who : null };
        snd(tool.arena === "snake" ? "sacrifice" : "build");
        if (oldWho && oldWho !== fightPit.who) {
            // the old Fight Snake is set free
            oldWho.sacrificed = false;
            oldWho.awayUntil = t + DAY;
            snakeMsg = oldWho.name + " is free again and will be back soon!";
        }
        var name = arenaName(fightPit.type);
        if (fightPit.type === "snake") {
            var vic = fightPit.who;
            vic.sacrificed = true;
            vic.here = false;
            for (var si = animals.length - 1; si >= 0; si--) {
                if (animals[si].who === vic) {
                    snakeBurst(animals[si].x, GROUND - 10 * S, 20, [200, 130, 255], 2);
                    animals.splice(si, 1);
                }
            }
            for (var bi = baits.length - 1; bi >= 0; bi--) {
                if (baits[bi].who === vic) { baits.splice(bi, 1); }
            }
            fightPit.gift = 0;
            if (vic.isAna) {
                for (var ai2 = animals.length - 1; ai2 >= 0; ai2--) {
                    if (animals[ai2].ana) {
                        snakeBurst(animals[ai2].x, GROUND - 10 * S, 30, [120, 140, 60], 2);
                        animals.splice(ai2, 1);
                    }
                }
                for (var bj = baits.length - 1; bj >= 0; bj--) {
                    if (baits[bj].ana) { baits.splice(bj, 1); }
                }
                showToast("THE ANACONDA is now the Fight Snake! Enter at your own risk...");
                shrewSay("Ladies and gentlemen... THE ANACONDA IS THE ARENA! Winners get +7 levels... if it lets them keep them. " +
                         "And it might EAT you on the way in! Good luck!", 5);
                snd("anaconda");
            } else {
            showToast(vic.name + " has become the giant FIGHT SNAKE!");
            shrewSay("Ladies and gentlemen... " + vic.name + " has become THE FIGHT SNAKE! Winners get " + bonusText(snakeBonus(vic)) +
                     " And in here, everyone can ONLY use " + vic.name + "'s moves: " + fightSnakeMoveList(vic) + "!", 4);
            }
        } else if (fightPit.type === "cave") {
            showToast("Fight Cave built! It's dark in there...");
            shrewSay("Welcome to the FIGHT CAVE! It's dark, it's damp, and I think something just touched my tail.", 3);
        } else if (fightPit.type === "pond") {
            showToast("The Fight POND is dug and filled! Splash!");
            shrewSay("Welcome to the FIGHT POND! I'm commentating from this lovely damp log. The frogs are LOUD today, folks!", 4);
        } else if (fightPit.type === "flesh") {
            showToast("The FLESH PIT has grown! It's... breathing.");
            shrewSay("Welcome to the FLESH PIT! One snake goes in at a time... and the PIT fights it. Flesh snakes! Tentacles! Survive 5 waves for 6 levels!", 4);
        } else if (fightPit.type === "death") {
            showToast("The PIT OF DEATH is built! Mind the traps...");
            shrewSay("Welcome to... THE PIT OF DEATH! Spikes! Boulders! Fire! Blades! Trapdoors! I'll be over here. Far away.", 4);
        } else if (fightPit.type === "tree") {
            showToast("Fight Tree grown! Watch out for acorns.");
            shrewSay("Welcome to the FIGHT TREE! Mind the acorns, folks. They HURT.", 3);
        } else {
            showToast("Fight Pit built! Snakes will come here to battle. Click it to watch.");
            shrewSay("Welcome to the Fight Pit! I'm Shrewbert Snoutley, your commentator! Let's get ready to RUMBLE!", 3);
        }
        return;
    }
    for (var i = baits.length - 1; i >= 0; i--) {
        if ((tool.kind === "ana" && baits[i].ana) || (tool.kind === "bait" && baits[i].who === tool.who)) {
            baits.splice(i, 1);
        }
    }
    baits.push({ x: x, who: tool.who, ana: tool.kind === "ana" });
    snd("place");
    if (inPitX(x)) {
        if (tool.kind === "ana") {
            shrewSay("Wait. Is that... ANACONDA BAIT? IN MY {PU}?! WHO DID THIS?!", 4);
        } else {
            shrewSay("Ooh! Someone dropped bait for " + tool.who.name + " right in the {P}! Here they come!", 2);
        }
    }
    showToast(tool.kind === "ana" ? "Anaconda bait placed... something BIG is coming" :
              "Placed " + tool.who.name + "'s bait");
};

// Carve the Fight Knot into a tree
var placeTreeArena = function(tr) {
    var oldWho = arenaIs("snake") ? fightPit.who : null;
    placeTool = null;
    fightPit = { x: tr.x, type: "tree", who: null, tree: tr };

};

var drawToolCursor = function() {
    if (placeTool.kind === "choose") { return; }
    if (placeTool.kind === "pit" && placeTool.arena === "tree") {
        if (!mouseInScene()) { return; }
        var htr = treeUnderMouse();
        var lbl = "Click one of your trees to carve the Fight Knot into it";
        if (htr && htr.state === "alive" && htr.mature > 0.25) {
            var hsx = htr.x - camX;
            var hky = GROUND - Math.max(30 * S, htr.trunkH * htr.sc * 0.36);

        textSize(11);

        fill(problem === "" ? color(255, 220, 140, 90) : color(255, 90, 90, 90));
        ellipse(x, GROUND + 5 * S, pitHalf() * 2, 26 * S);
        label = problem === "" ? (placeTool.arena === "snake" && placeTool.who ?
                "Click to turn " + placeTool.who.name + " into the FIGHT SNAKE here" :
                "Click to build the " + arenaName(placeTool.arena) + " here") : problem;
    } else {
        var c = placeTool.kind === "ana" ? [85, 95, 40] : baitColor(placeTool.who);
        var band = placeTool.kind === "ana" ? [25, 25, 15] : placeTool.who.col.band;
        drawBaitPellet(x, GROUND - 2 * S, c, band, S * (placeTool.kind === "ana" ? 1.6 : 1), 1);

                (placeTool.kind === "ana" ? "Click to place ANACONDA bait" :
                 "Click to place " + placeTool.who.name + "'s bait");

    textAlign(CENTER, BASELINE);
    textSize(11);
    fill(0, 0, 0, 130);
    text(label, x + 1, GROUND - 28 * S + 1);

    text(label, x, GROUND - 28 * S);

    fill(255, 255, 255, 200);

var drawPlantCursor = function() {
    if (placeTool) {
        drawToolCursor();
        return;
    }
    if (!mouseInScene() || (mouseIsPressed && dragMoved > 6)) {
        return;
    }
    if (overPit()) {
        var hint = arenaIs("cave") ? "Click to go inside the Fight Cave" :
                   (arenaIs("tree") ? "Click to climb into the Fight Knot" : "Click to watch the " + arenaName() + " from above");
        var hy = arenaIs("tree") ? mouseY - 24 : GROUND - 74 * S;
        textAlign(CENTER, BASELINE);
        textSize(11);
        fill(0, 0, 0, 130);
        text(hint, mouseX + 1, hy + 1);
        fill(255, 225, 150);
        text(hint, mouseX, hy);
        textAlign(LEFT, BASELINE);
        return;
    }
    if (!nearGround()) {
        return;
    }
    var x = mouseX;
    var problem = plantProblem(mouseX + camX);
    var ok = problem === "";
    var sp = selected;
    var gc = sp.green;

    text("Drag to explore  |  N = new forest", x, GROUND - 28 * S + 12);

};

var drawToast = function() {
    var age = frameCount - toastFrame;

    }
    var a = 255 * Math.min(1, (120 - age) / 30);
    textSize(13);
    var w = textWidth(toastText) + 24;

    var ty = miniRect().top ? H - 70 : H - 108;   // stay clear of the mini-map
    rect(W / 2 - w / 2, ty, w, 26, 8);
    fill(255, 255, 255, a);
    textAlign(CENTER, CENTER);
    text(toastText, W / 2, ty + 13);

};

var drawTreeTip = function() {
    statsBox = null;
    var tr = statsTree;
    if (!tr) { return; }
    if (trees.indexOf(tr) < 0) {
        statsTree = null;       // the tree is gone
        return;
    }
    var sx = tr.x - camX;
    if (sx < -60 || sx > W + 60) { return; }   // scrolled away: hide until it's back
    var sp = tr.sp;
    var age = (t - tr.start) / YEAR;
    var life = tr.life / YEAR;
    var standing = tr.state !== "log";
    var heightFt = Math.round((GROUND - treeWY(tr, treeBounds(tr).top + 14 * S)) / S / 4);
    var lines = [];
    lines.push("Age: " + age.toFixed(1) + " of ~" + life.toFixed(1) + " years");
    if (tr.burn) { lines.push("ON FIRE!!! (rain could put it out)"); }
    if (tr.burnt) { lines.push("Burned down in a fire"); } else if (tr.scorched) { lines.push("Scorched by a fire, but it survived"); }
    if (standing) {
        lines.push("Height: ~" + heightFt + " ft     Grown: " + Math.round(tr.mature * 100) + "%");
        lines.push("Health: " + Math.round(Math.max(0, tr.vigor) * 100) + "%" +
                   (tr.hive ? "     Beehive: yes" : ""));
        if (tr.shownGrown !== undefined && tr.state === "alive") {
            lines.push("Branches: " + tr.shownGrown + " / " + tr.branches.length + "     " +
                       (sp.leafShape === "needle" ? "Tufts: " : "Leaves: ") + tr.shownLeaves);
        }
    } else {
        lines.push("Log length: ~" + Math.round(tr.logLen / S / 4) + " ft");
        lines.push("Moss patches: " + tr.moss.length + "     Mushrooms: " + tr.mush.length);
    }
    if (sp.fruit) {
        lines.push("Fruit: " + sp.fruit.shape);
    }
    if (sp.dust && tr.state === "alive" && tr.mature > 0.4) {
        lines.push("Snakes are drawn to this tree...");
    }
    lines.push(sp.desc);
    lines.push("(right-click again to close)");

    textSize(11);
    var title = sp.name + " tree  (" + statusText(tr) + ")";
    var w = textWidth(title) + 16;
    for (var i = 0; i < lines.length; i++) {
        w = Math.max(w, textWidth(lines[i]) + 16);
    }
    var h = 22 + lines.length * 14 + 8;
    var anchorY = tr.state === "log" ? GROUND - 20 * S :
                  treeWY(tr, GROUND - tr.trunkH * 0.6);
    var x = sx + Math.max(14 * S, tr.trunkW * tr.sc * 0.6) + 12;
    var y = anchorY - h / 2;
    if (x + w > W - 6) { x = sx - Math.max(14 * S, tr.trunkW * tr.sc * 0.6) - 12 - w; }
    x = constrain(x, 6, W - w - 6);
    y = constrain(y, 6, H - 40 - h);
    statsBox = { x: x, y: y, w: w, h: h };

    noStroke();
    fill(25, 22, 30, 225);
    rect(x, y, w, h, 7);
    var ic = sp.icon;
    fill(ic[0], ic[1], ic[2]);
    rect(x, y, 5, h, 7);
    fill(255, 245, 225);
    textSize(12);
    text(title, x + 10, y + 16);
    fill(220, 220, 210);
    textSize(11);
    for (var j = 0; j < lines.length; j++) {
        if (j === lines.length - 2) { fill(170, 175, 160); }
        if (j === lines.length - 1) { fill(130, 130, 125); }
        text(lines[j], x + 10, y + 34 + j * 14);
    }

    // marker under the chosen tree
    var bob = Math.sin(frameCount * 0.12) * 2;
    fill(255, 245, 200, 220);
    triangle(sx - 6, GROUND + 14 * S + bob, sx + 6, GROUND + 14 * S + bob, sx, GROUND + 6 * S + bob);
};

// The list of all 10 snakes (press L)
var drawRoster = function() {

    text("Wins", x + 178, y + 38);

    for (var i = 0; i < snakeRoster.length; i++) {
        var r = snakeRoster[i];
        var ry = y + 56 + i * rowH;
        var c = r.evo > 1 ? evoColor(r.evo) : r.col.body;
        fill(c[0], c[1], c[2]);

        }

        var where;

            fill(210, 150, 255);

        } else if (r.here) {
            fill(140, 230, 120);
            where = "in the forest";
        } else if (r.hatching) {
            fill(240, 190, 110);
            where = "hatching...";
        } else if (!r.seen) {
            fill(140, 140, 135);
            where = "not seen yet";
        } else {
            fill(170, 170, 200);
            where = "away";
        }

    for (var si2 = 0; si2 < snakeRoster.length; si2++) { if (snakeRoster[si2].anaKills) { anySlayer = true; } }
    if (anySlayer) {
        fill(255, 120, 80);

        text("red x# = how many times that snake has slain the Anaconda", x + 12, y + h - 22);
        textSize(11);
    }
    for (var ai = 0; ai < animals.length; ai++) {
        if (animals[ai].ana) {
            fill(240, 90, 70);
            text("THE ANACONDA IS HERE!", x + 150, y + h - 8);
        }
    }
};

// Shrewbert squeaks while his words type out; the forest has birds, crickets and owls
var ambientSounds = function() {
    // Shrewbert's little voice (only when you can see his speech bubble)
    var seeShrew = pitView || (fightPit && inView(fightPit.x, 40 * S));
    if (seeShrew && frameCount - shrewT < shrewLine.length / 1.5 && frameCount % 3 === 0) {
        snd("shrew", null, 0.8, 650 + random(550));
    }
    if (pitView) {
        if (arenaIs("cave") && random(1) < 0.012) { snd("drip", null, 0.7); }
        if (arenaIs("tree") && random(1) < 0.004) { snd("chirp", null, 0.4, random(1)); }
        return;
    }
    var winter = Math.floor(((t % YEAR) / YEAR) * 4) === 3;
    if (daylight > 0.5 && !winter && random(1) < 0.005) {
        snd("chirp", camX + random(W), 0.6, random(1));
    }
    if (daylight < 0.25 && !winter && frameCount % 45 === 0) {
        snd("cricket", camX + random(W), 0.5);
    }
    if (daylight < 0.2 && random(1) < 0.0012) {
        snd("hoot", camX + random(W), 0.7);
    }
};

// Pick the music for what's going on right now
var musicMoodNow = function() {
    var fightSeen = false;
    var anaSeen = false;
    for (var i = 0; i < animals.length; i++) {
        var s = animals[i];
        if (s.type !== "snake") { continue; }
        var visible = pitView ? inPitX(s.x) : inView(s.x, 0);
        if (!visible) { continue; }
        if (s.ana) { anaSeen = true; }
        if (s.state === "fight") { fightSeen = true; }
    }
    if (pitView) {
        if (anaSeen) { return "anaconda"; }
        if (anaArena()) { return fightSeen || fightPit.morph ? "anaFight" : "anaconda"; }
        if (arenaIs("flesh")) { return fightPit.trial ? "fleshFight" : "fleshIdle"; }
        var kind = fightPit && fightPit.type ? fightPit.type : "pit";
        return kind + (fightSeen ? "Fight" : "Idle");
    }
    if (anaSeen) { return "anaconda"; }
    if (fightSeen || (arenaIs("flesh") && fightPit.trial && inView(fightPit.x, 0))) { return "fight"; }
    if (Math.floor(((t % YEAR) / YEAR) * 4) === 3) { return "winter"; }
    return daylight < 0.3 ? "night" : "day";
};

        textAlign(LEFT, BASELINE);
    }
    var pAge = frameCount - pitBannerFrame;
    if (pitBannerFrame >= 0 && pAge <= 300) {
        var pa = 255 * Math.min(1, (300 - pAge) / 40);

                   (arenaBannerType === "snake" ? "Click 'SNAKE' above the tree buttons and choose a snake to sacrifice" :
                   "Click '" + (arenaBannerType === "cave" ? "Cave" : (arenaBannerType === "death" ? "DEATH" : (arenaBannerType === "flesh" ? "FLESH" : (arenaBannerType === "pond" ? "Pond" : "Pit")))) + "' above the tree buttons, then click the ground");
        text(bTitle, W / 2, H * 0.3 + 17);
        textSize(11);
        text(bSub, W / 2, H * 0.3 + 36);
        textAlign(LEFT, BASELINE);
    }

        showToast(snakeMsg);
        snakeMsg = "";
    }
    var age = frameCount - unlockFrame;
    if (unlockFrame >= 0 && age <= 240) {
        var a = 255 * Math.min(1, (240 - age) / 40);
        noStroke();
        fill(30, 20, 60, a * 0.85);
        rect(W / 2 - 150, H * 0.42, 300, 46, 10);
        fill(180, 200, 255, a);
        textAlign(CENTER, CENTER);
        textSize(15);
        text("The Mystic tree has been unlocked!", W / 2, H * 0.42 + 15);
        textSize(11);
        text("Click its button or press " + (speciesList.indexOf(MYSTIC) + 1),
             W / 2, H * 0.42 + 33);
        textAlign(LEFT, BASELINE);
    }

    if (!pitView) {
        drawPlantCursor();
    }
    drawToast();
};
