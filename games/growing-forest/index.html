            if (a.who) {
                // eaten... but it will hatch again someday
                a.who.here = false;
                a.who.evo = 1;
                a.who.deaths++;
                // a fresh start: its wins and Anaconda kills are gone
                a.who.wins = 0;
                a.who.anaKills = 0;
                a.who.hatching = true;
                a.who.awayUntil = t + YEAR * random(0.4, 0.8);
            }
            return true;
        }
    } else if (a.state === "eat") {
        a.timer--;
        if (a.timer % 14 === 0) {
            snakeBurst(a.x + a.dir * 14 * S * a.size, GROUND - 16 * S * a.size, 2, [200, 40, 50], 0.6);
        }
        if (a.timer <= 0) {
            evolveSnake(a);
        }
    } else if (a.state === "evolve") {
        a.timer--;
        a.size = lerp(a.size, snakeSizeFor(a), 0.06);
        if (a.timer % 6 === 0) {
            snakeBurst(a.x + random(-14, 14) * S * a.size, GROUND - random(4, 30) * S * a.size,
                       1, random(1) < 0.5 ? [255, 235, 140] : [170, 120, 255], 0.8);
        }
        if (a.timer <= 0) {
            a.state = "coil";
            a.timer = random(200, 400);
            a.cool = a.ana ? DAY * 1.5 : 200;
        }
    } else if (a.state === "slither" || a.state === "leave" || a.state === "flee") {
        if (a.state === "slither") {
            a.dir = a.tx > a.x ? 1 : -1;
        }
        var spd = 0.8 + (a.evo - 1) * 0.02;
        if (a.state === "flee") { spd = 2.2; }
        if (a.state === "leave") { spd = 1.6; }
        a.x += a.dir * spd * S;
        if (a.state === "slither" && Math.abs(a.tx - a.x) < 1.5 * S) {
            a.state = "coil";
            a.timer = random(300, 500);
            if (a.bait && Math.abs(a.bait.x - a.x) < 4 * S) {
                // gobble up the bait
                baits.splice(baits.indexOf(a.bait), 1);
                snakeBurst(a.x, GROUND - 4 * S, 10, [255, 240, 200], 1);
                snakeMsg = a.name + " found its bait and gobbled it up!";
                snd("munch", a.x);
                a.bait = null;
                a.timer = 400;
                a.cool = 90;
                a.lingerT = 400;
            }
        }
        // gone once it slithers past the edge of the whole map
        if (a.state !== "slither" && (a.x < -90 * S * a.size || a.x > WW + 90 * S * a.size)) {
            releaseFused(a, false);
            if (a.who) {
                a.who.here = false;
                a.who.awayUntil = t + random(DAY * 0.5, DAY * 2.5);
            }
            return true;
        }
    } else {
        a.timer--;
        if (a.timer <= 0) {
            var home = mysticTree();
            if (fightPit && (a.ana || random(1) < 0.75)) {
                // stay in the Fight Pit looking for the next battle
                a.state = "slither";
                a.tx = constrain(fightPit.x + random(-0.7, 0.7) * pitHalf(), 10, WW - 10);
            } else if (a.ana) {
                // the Anaconda keeps prowling until it's done
                a.state = "slither";
                a.tx = constrain(a.x + random(-1.5, 1.5) * W, 10, WW - 10);
            } else if (a.evo > 1 && home && random(1) < 0.65) {
                // evolved snakes guard the Mystic tree, looking for challengers
                a.state = "slither";
                a.tx = constrain(home.x + random(-70, 70) * S, 10, WW - 10);
            } else {
                a.state = "leave";
                a.dir = snakeExitDir(a.x);
            }
        }
    }
    return false;
};

// Every bait calls its own snake (it comes even from far away)
var updateBaits = function() {
    for (var i = baits.length - 1; i >= 0; i--) {
        var bt = baits[i];
        var s = null;
        for (var j = 0; j < animals.length; j++) {
            var a = animals[j];
            if (a.type !== "snake" || a.state === "eaten") { continue; }
            if ((bt.ana && a.ana) || (!bt.ana && a.who === bt.who)) { s = a; }
        }
        if (!s) {
            if (bt.ana) {
                var anyAna = false;
                for (var k = 0; k < animals.length; k++) {
                    if (animals[k].ana) { anyAna = true; }
                }
                if (!anyAna) {
                    addAnaconda(bt.x, bt.x < camX + W / 2 ? -1 : 1);
                    var baitedAna = animals[animals.length - 1];
                    baitedAna.baited = true;
                    baitedAna.life = YEAR;          // a bait only buys one year...
                    anaNext = t + YEAR * 2;
                    snakeMsg = "The ANACONDA smells the bait... and it's coming! (for one fight)";
                }
            } else if (!bt.who.here && !bt.who.sacrificed && !(bt.who.hatching && t < bt.who.awayUntil)) {
                addRosterSnake(bt.who, bt.x, false, bt.x < camX + W / 2 ? -1 : 1);
                snakeMsg = bt.who.name + " smells its bait and is coming!";
            }
            continue;
        }
        if (s.ana && s.life <= 0) { continue; }   // its 3 years are up - bait can't keep it
        s.bait = bt;
        if (s.state === "coil" || s.state === "hunt" || s.state === "leave" ||
            (s.state === "slither" && s.tx !== bt.x)) {
            s.state = "slither";
            s.prey = null;
            s.tx = bt.x;
        }
    }
};

// The Fight Tree drops acorns on fighting snakes
var arenaHazards = function() {
    if (!caveUnlocked && t >= YEAR * 10) { unlockArena("cave"); }
    deathTraps();
    fleshTrial();
    pondTurtle();
    if (anaArena() && !fightPit.merge) {
        for (var mgi = 0; mgi < animals.length; mgi++) {
            var mg = animals[mgi];
            if (mg.mergeIn > 0 && mg.state === "fight" && mg.foe && mg.foe.state === "fight") {
                mg.mergeIn--;
                if (mg.mergeIn <= 0) {
                    startMerge(mg, mg.foe);
                    break;
                }
            } else if (mg.mergeIn > 0 && mg.state !== "fight") {
                mg.mergeIn = 0;
            }
        }
    }
    if (anaArena() && !fightPit.morph) {
        for (var mi = 0; mi < animals.length; mi++) {
            var ms = animals[mi];
            if (ms.type === "snake" && ms.pendingMorph && ms.state === "coil" && inPitX(ms.x)) {
                startAnaMorph(ms);
                break;
            }
        }
    }
    if (!arenaIs("tree")) { return; }
    var ft = fightPit.tree;
    if (!ft || trees.indexOf(ft) < 0 || ft.state === "falling" || ft.state === "log" || ft.state === "dust") {
        fightPit = null;
        pitView = false;
        snakeMsg = "The Fight Tree has fallen! The Fight Knot is gone...";
        return;
    }
    for (var i = 0; i < animals.length; i++) {
        var s = animals[i];
        if (s.type !== "snake" || s.state !== "fight" || !inPitX(s.x)) { continue; }
        if (random(1) < 0.0015) {
            s.hp -= random(5, 10);
            s.recoil = 8;
            sideWord("BONK!", s, [210, 160, 90]);
            snakeBurst(s.x, GROUND - 20 * S * s.size, 6, [140, 95, 50], 1);
            pitEvent("acorn", s, null);
            snd("bonk", s.x);
        }
    }
};

var updateAnimals = function(year) {
    // slow motion in the pit view for K.O.s and critical hits
    if (pitSlow > 0 && pitView && frameCount % 3 !== 0) { return; }
    updateSpitShots();
    for (var i = animals.length - 1; i >= 0; i--) {
        var a = animals[i];
        var gone = false;
        if (a.type === "squirrel") {
            gone = updateSquirrel(a);
        } else if (a.type === "bird") {
            gone = updateBird(a, year);
        } else if (a.type === "deer") {
            gone = updateDeer(a);
        } else if (a.type === "rabbit") {
            gone = updateRabbit(a);
        } else if (a.type === "owl") {
            gone = updateOwl(a);
        } else if (a.type === "bear") {
            gone = updateBear(a);
        } else if (a.type === "snake") {
            gone = updateSnake(a);
        }
        if (gone) {
            animals.splice(i, 1);
        }
    }
    checkSnakeBattles();
    arenaHazards();
    updateBaits();
    updateSnakeFx();
};

// ================= WILDLIFE: DRAWING =================

var drawBee = function(x, y, vis) {
    var wing = Math.sin(t * 1.5 + x) * 0.6 * S;
    fill(255, 255, 255, 150 * vis);
    ellipse(x - 1 * S, y - 2.5 * S + wing, 3 * S, 2 * S);
    ellipse(x + 1 * S, y - 2.5 * S - wing, 3 * S, 2 * S);
    fill(240, 190, 40, 255 * vis);
    ellipse(x, y, 5 * S, 3.5 * S);
    fill(30, 30, 30, 255 * vis);
    rect(x - 0.6 * S, y - 1.7 * S, 1.2 * S, 3.4 * S);
};

var drawSquirrel = function(a) {
    var k = S;
    var c = a.col;
    var climbing = a.state === "climbUp" || a.state === "perch" || a.state === "climbDown";
    var moving = a.state === "run" || a.state === "leave" || a.state === "carry";
    var hy = moving ? -Math.abs(Math.sin(a.hop)) * 4 * k : 0;
    var digging = a.state === "bury";

    pushMatrix();
    translate(a.x, a.y + hy);
    if (climbing) {
        rotate(a.state === "climbDown" ? PI / 2 : -PI / 2);
    } else {
        scale(a.dir, 1);
    }
    noStroke();

    fill(c[0] * 0.85, c[1] * 0.85, c[2] * 0.85);
    ellipse(-9 * k, -11 * k, 8 * k, 15 * k);
    ellipse(-10 * k, -19 * k, 9 * k, 8 * k);
    fill(c[0], c[1], c[2]);
    ellipse(-8.5 * k, -12 * k, 5 * k, 11 * k);

    ellipse(0, -6 * k, 14 * k, 9 * k);
    fill(Math.min(255, c[0] + 60), Math.min(255, c[1] + 70), Math.min(255, c[2] + 70));
    ellipse(2 * k, -4.5 * k, 8 * k, 5 * k);

    var nib = 0;
    if (a.state === "eat") {
        nib = Math.sin(t * 0.6) * 0.8 * k;
    } else if (digging) {
        nib = 3 * k + Math.sin(t * 0.8) * 1.2 * k;
    }
    fill(c[0], c[1], c[2]);
    ellipse(6.5 * k, -10.5 * k + nib, 7.5 * k, 6.5 * k);
    triangle(4.5 * k, -13 * k + nib, 5.5 * k, -16.5 * k + nib, 7 * k, -13.5 * k + nib);
    fill(20, 15, 15);
    ellipse(7.8 * k, -11.3 * k + nib, 1.6 * k, 1.6 * k);
    fill(40, 25, 20);
    ellipse(10.2 * k, -10.2 * k + nib, 1.2 * k, 1.2 * k);

    fill(c[0] * 0.8, c[1] * 0.8, c[2] * 0.8);
    ellipse(-3 * k, -1 * k, 5 * k, 3 * k);
    ellipse(4 * k, -1 * k, 3 * k, 2.5 * k);

    if (a.food && (a.state === "eat" || a.state === "carry" || a.state === "bury")) {
        fillArr(a.food.c);
        ellipse(9 * k, -7 * k + nib, 3 * k, 3.5 * k);
    }

    if (digging) {
        fill(100, 70, 42);
        ellipse(11 * k + Math.sin(t * 0.5) * 2 * k, -2 * k - Math.abs(Math.sin(t * 0.7)) * 4 * k, 2 * k, 2 * k);
        ellipse(13 * k + Math.cos(t * 0.6) * 2 * k, -1 * k - Math.abs(Math.sin(t * 0.9)) * 5 * k, 1.5 * k, 1.5 * k);
    }
    popMatrix();
};

var drawBird = function(a) {
    var k = S;
    var c = a.kind;
    var flying = a.state !== "perch";

    pushMatrix();
    translate(a.x, a.y - (flying ? 0 : 4 * k));
    scale(a.dir, 1);
    noStroke();

    if (!flying) {
        stroke(90, 70, 50);
        strokeWeight(1);
        line(-1 * k, 3 * k, -1 * k, 4.5 * k);
        line(1 * k, 3 * k, 1 * k, 4.5 * k);
        noStroke();
    }

    fillArr(c.wing);
    triangle(-4 * k, 0, -10 * k, -3 * k, -10 * k, 2 * k);
    fillArr(c.body);
    ellipse(0, 0, 11 * k, 7 * k);
    fillArr(c.breast);
    ellipse(2 * k, 1.2 * k, 6.5 * k, 4.5 * k);

    var pk = a.peck * 2.5 * k;
    fillArr(c.body);
    ellipse(5 * k, -3 * k + pk, 6 * k, 5.5 * k);
    fill(240, 170, 50);
    triangle(7.5 * k, -3.6 * k + pk, 10.5 * k, -2.6 * k + pk, 7.5 * k, -1.8 * k + pk);
    fill(15);
    ellipse(6.2 * k, -3.6 * k + pk, 1.4 * k, 1.4 * k);

    fillArr(c.wing);
    if (flying) {
        var fl = Math.sin(a.phase);
        triangle(-3 * k, -1 * k, 3 * k, -1 * k, -1 * k, -1 * k - 9 * k * fl);
    } else {
        ellipse(-1 * k, -0.5 * k, 7 * k, 4 * k);
    }
    popMatrix();
};

var drawDeer = function(a) {
    var k = S;

    fill(240, 235, 225);
    ellipse(-19 * k, -30 * k, 4 * k, 7 * k);
    fill(150, 105, 65);
    ellipse(0, -29 * k, 38 * k, 16 * k);
    fill(195, 165, 125);
    ellipse(1 * k, -24 * k, 26 * k, 6 * k);

    if (a.buck) {

        strokeWeight(1.5 * k);
        line(hx - 2 * k, hy - 3 * k, hx - 6 * k, hy - 14 * k);
        line(hx - 4 * k, hy - 8 * k, hx - 9 * k, hy - 10 * k);
        line(hx - 5.5 * k, hy - 12 * k, hx - 2 * k, hy - 16 * k);

        line(hx + 0.5 * k, hy - 8 * k, hx + 4 * k, hy - 11 * k);

var drawRabbit = function(a) {

var drawOwlEyes = function(a) {

var drawOwl = function(a) {

var drawBear = function(a) {
    var k = S;
    var climbing = a.state === "climbUp" || a.state === "raid" || a.state === "climbDown";

    pushMatrix();
    translate(a.x, a.y);

        for (var b = 0; b < 7; b++) {

// Evolution colours, from Lv 1 to Lv 30
var evoColors = [
    [70, 110, 45], [35, 135, 115], [40, 95, 185], [105, 55, 185],
    [175, 45, 150], [195, 40, 55], [225, 110, 30], [240, 195, 50]
];

var mixArr = function(A, B, u) {
    return [lerp(A[0], B[0], u), lerp(A[1], B[1], u), lerp(A[2], B[2], u)];
};

var evoColor = function(lv) {
    var f = (lv - 1) / 29 * (evoColors.length - 1);
    var i = Math.min(evoColors.length - 2, Math.floor(f));
    return mixArr(evoColors[i], evoColors[i + 1], f - i);
};

var snakeLook = function(a) {
    if (a.ana) { return a.col; }
    if (a.morphF > 0) {
        var mf = a.morphF;
        a.morphF = 0;
        var base = snakeLook(a);
        a.morphF = mf;
        return { body: mixArr(base.body, [85, 95, 40], mf), band: mixArr(base.band, [58, 66, 26], mf) };
    }
    var lv = a.evo || 1;
    if (lv >= 30) {
        // the Serpent King shimmers through every colour
        var h = t * 0.04 + a.phase * 0.02;
        return {
            body: [130 + 110 * Math.sin(h), 130 + 110 * Math.sin(h + 2.1), 130 + 110 * Math.sin(h + 4.2)],
            band: [255, 235, 150]
        };
    }
    if (a.lookLv !== lv) {
        var u = Math.min(1, (lv - 1) / 5);
        a.look = {
            body: mixArr(a.col.body, evoColor(lv), u),
            band: mixArr(a.col.band, mixArr(evoColor(lv), [255, 250, 220], 0.5), u)
        };
        a.lookLv = lv;
    }
    return a.look;
};

var drawSnakeHead = function(x, y, dir, c, tongue, k, lv) {
    k = k || S;
    lv = lv || 1;
    noStroke();
    // horns (Lv 11+)
    if (lv >= 11) {
        var hl = (5 + (lv - 11) * 0.25) * k;
        if (lv >= 20) { fill(245, 210, 90); } else { fill(70, 50, 40); }
        triangle(x - dir * 0.5 * k, y - 1.5 * k, x - dir * 3 * k, y - 1 * k, x - dir * 5 * k, y - 1 * k - hl);
        triangle(x + dir * 1 * k, y - 2 * k, x - dir * 1.5 * k, y - 2 * k, x - dir * 2 * k, y - 2 * k - hl * 0.7);
    }
    fillArr(c.body);
    ellipse(x, y, 7 * k, 5 * k);
    // glowing eyes (Lv 3+)
    if (lv >= 3) {
        var g = lv >= 20 ? [120, 220, 255] : [255, 90, 40];
        fill(g[0], g[1], g[2], 70 + 40 * Math.sin(t * 0.1));
        ellipse(x + dir * 1.5 * k, y - 1 * k, 4.5 * k, 4.5 * k);
        fill(g[0], g[1], g[2]);
    } else {
        fill(240, 220, 60);
    }
    ellipse(x + dir * 1.5 * k, y - 1 * k, 1.8 * k, 1.8 * k);
    fill(10);
    ellipse(x + dir * 1.7 * k, y - 1 * k, 0.6 * k, 1.4 * k);
    // crown (Lv 27+)
    if (lv >= 27) {
        fill(250, 205, 60);
        var cy = y - 3.5 * k;
        rect(x - 3 * k, cy - 1 * k, 6 * k, 2 * k);
        triangle(x - 3 * k, cy - 1 * k, x - 1.5 * k, cy - 1 * k, x - 2.6 * k, cy - 4 * k);
        triangle(x - 0.8 * k, cy - 1 * k, x + 0.8 * k, cy - 1 * k, x, cy - 5 * k);
        triangle(x + 1.5 * k, cy - 1 * k, x + 3 * k, cy - 1 * k, x + 2.6 * k, cy - 4 * k);
        fill(220, 40, 80);
        ellipse(x, cy, 1.4 * k, 1.4 * k);
    }
    if (tongue) {
        stroke(220, 40, 50);
        strokeWeight(1);
        line(x + dir * 3.5 * k, y + 0.5 * k, x + dir * 6.5 * k, y + 0.5 * k);
        line(x + dir * 6.5 * k, y + 0.5 * k, x + dir * 8 * k, y - 0.5 * k);
        line(x + dir * 6.5 * k, y + 0.5 * k, x + dir * 8 * k, y + 1.5 * k);
        noStroke();
    }
};

// CONSTRICT in the forest view: rings of snake wrapped around the other snake.
// The back half is drawn behind it, the front half (and head) in front.
var drawWrapRings = function(a, front) {
    var b = a.foe;
    if (!b) { return; }
    var c = snakeLook(a);
    var k = S * (a.size || 1);
    var fk = S * (b.size || 1);
    var sq = 1 - 0.1 * Math.abs(Math.sin(t * 0.25));
    noFill();
    for (var r = 0; r < 4; r++) {
        var yy = GROUND - 4 * fk - r * 5.5 * fk;
        var ww = (24 - r * 2.5) * fk * sq + 6 * k;
        var hh = 7 * fk;
        var col = r % 2 === 0 ? c.body : c.band;
        stroke(20, 15, 10, 170);
        strokeWeight(5.6 * k);
        if (front) { arc(b.x, yy, ww, hh, 0, PI); } else { arc(b.x, yy, ww, hh, PI, TWO_PI); }
        stroke(col[0], col[1], col[2]);
        strokeWeight(4.2 * k);
        if (front) { arc(b.x, yy, ww, hh, 0, PI); } else { arc(b.x, yy, ww, hh, PI, TWO_PI); }
    }
    noStroke();
    if (front) {
        var topY = GROUND - 4 * fk - 3 * 5.5 * fk - 6 * k;
        drawSnakeHead(b.x + a.dir * 4 * k, topY, a.dir, c, true, k, a.evo || 1);
        // squeeze marks
        stroke(230, 200, 255, 200);
        strokeWeight(Math.max(1, 1.5 * S));
        for (var m = -1; m <= 1; m += 2) {
            line(b.x + m * 16 * fk, GROUND - 10 * fk, b.x + m * 22 * fk, GROUND - 12 * fk);
            line(b.x + m * 15 * fk, GROUND - 16 * fk, b.x + m * 21 * fk, GROUND - 19 * fk);
        }
        noStroke();
        textAlign(CENTER, CENTER);
        textSize(Math.max(9, 8 * S));
        fill(0, 0, 0, 120);
        text((a.name || "") + "  SQUEEZING!", b.x + 1, topY - 12 * k + 1);
        fill(220, 190, 255);
        text((a.name || "") + "  SQUEEZING!", b.x, topY - 12 * k);
        textAlign(LEFT, BASELINE);
    }
};

var drawSnake = function(a) {
    var lv = a.evo || 1;
    var c = snakeLook(a);
    var k = S * (a.size || 1);
    if (a.state === "eaten") {
        k *= Math.max(0.05, a.timer / 70);
    }
    var tongue = Math.sin(t * 0.5 + a.phase * 0.1) > 0.6 ||
                 (a.state === "hunt" && Math.sin(t * 0.9) > 0);
    var bandEvery = lv >= 4 ? 2 : 3;
    var reared = a.state === "coil" || a.state === "fight" || a.state === "eat" ||
                 a.state === "evolve" || a.state === "victory";
    var segs = [];
    var extra = [];             // a tail swinging out for TAIL WHIP / FLAME TAIL
    var tailTip = null;
    var hx, hy, neck;
    // CONSTRICT: drawn coiled around the other snake (front half comes later)
    if (a.wrapT > 0 && a.foe && a.state === "fight") {
        drawWrapRings(a, false);
        return;
    }
    var i, s;

    if (reared) {
        var shake = a.recoil ? Math.sin(a.recoil * 2) * 2 * k : 0;
        var bx = a.x + shake;
        for (i = 15; i >= 0; i--) {
            var ang = i * 0.75;
            var r = (3 + i * 0.45) * k;
            segs.push({ x: bx + Math.cos(ang) * r * 1.4,
                        y: GROUND - 3 * k + Math.sin(ang) * r * 0.4 - (15 - i) * 0.2 * k,
                        w: 5 * k, h: 4 * k, band: i % bandEvery === 0 });
        }
        var sway = Math.sin(t * 0.04) * 2 * k;
        var lunge = 0;
        var rise = 0;
        var mvA = (a.state === "fight" && (a.strikeT > 0 || a.moveAnimT > 0)) ? a.move : "";
        if (a.state === "fight") {
            sway = Math.sin(t * 0.15 + a.phase) * 2.5 * k;
            if (mvA === "spit") {
                // rear up high and spit
                lunge = (a.strike || 0) * 3 * k;
                rise = 4 * k + (a.strike || 0) * 12 * k;
            } else if (mvA === "whip" || mvA === "flame") {
                // pull the head back - the tail does the work
                lunge = -(a.strike || 0) * 5 * k;
                rise = 3 * k;
            } else {
                lunge = (a.strike || 0) * 14 * k;
                rise = 4 * k - (a.strike || 0) * 6 * k;
            }
        } else if (a.state === "eat") {
            lunge = (4 + Math.sin(t * 0.3) * 2) * k;
        } else if (a.state === "evolve" || a.state === "victory") {
            sway = Math.sin(t * 0.3) * 3 * k;
            rise = 8 * k;
        }
        hx = bx + a.dir * 7 * k + sway + a.dir * lunge;
        hy = GROUND - 18 * k - rise;
        for (var n = 0; n < 6; n++) {
            var f = n / 6;
            segs.push({ x: lerp(bx, hx - a.dir * 2 * k, f),
                        y: lerp(GROUND - 5 * k, hy + 2 * k, f) - Math.sin(f * PI) * 2 * k,
                        w: 4.6 * k, h: 4 * k, band: n % 2 === 1 });
        }
        var tbx = bx - a.dir * 5 * k;
        var tby = GROUND - 4 * k;
        if (mvA === "whip") {
            // the tail sweeps from behind, over the ground, into the enemy
            var sw = a.strikeT > 0 ? (16 - a.strikeT) / 16 : Math.min(1, a.moveAnimT / 24);
            var sws = sw * sw * (3 - 2 * sw);
            var th = lerp(PI * 0.95, 0.05, sws);
            var L = 30 * k;
            for (i = 1; i <= 13; i++) {
                var tf = i / 13;
                var tth = th * (0.35 + 0.65 * tf);
                extra.push({ x: tbx + a.dir * Math.cos(tth) * tf * L,
                             y: tby - Math.sin(tth) * tf * L * 0.45,
                             w: (4.8 - tf * 3) * k, band: i % 2 === 0 });
            }
            tailTip = extra[extra.length - 1];
            tailTip.whip = sws > 0.25 && sws < 0.95;
            tailTip.th = th;
            tailTip.L = L;
            tailTip.bx = tbx;
            tailTip.by = tby;
        } else if (mvA === "flame") {
            // scorpion-style: the tail arches over the head and breathes fire
            var up = a.strikeT > 0 ? Math.min(1, (16 - a.strikeT) / 8) : Math.min(1, a.moveAnimT / 8);
            var p1x = tbx - a.dir * lerp(4, 12, up) * k;
            var p1y = tby - lerp(2, 26, up) * k;
            var p2x = bx + a.dir * lerp(-8, 3, up) * k;
            var p2y = tby - lerp(3, 36, up) * k;
            for (i = 1; i <= 14; i++) {
                var bf = i / 14;
                var ex = (1 - bf) * (1 - bf) * tbx + 2 * (1 - bf) * bf * p1x + bf * bf * p2x;
                var ey = (1 - bf) * (1 - bf) * tby + 2 * (1 - bf) * bf * p1y + bf * bf * p2y;
                extra.push({ x: ex, y: ey, w: (4.8 - bf * 2.8) * k, band: i % 2 === 0 });
            }
            tailTip = extra[extra.length - 1];
            tailTip.fire = up;
            tailTip.jet = a.strikeT === 0 && a.moveAnimT > 0 ? a.moveAnimT / 24 : 0;
        }
    } else {
        var wig = (a.state === "flee" || a.state === "hunt") ? 2 : 1;
        var nSeg = a.ana ? 26 : 16;
        for (var j = nSeg - 1; j >= 0; j--) {
            var w = (5 - j * 3.5 / nSeg) * k;
            segs.push({ x: a.x - a.dir * j * (a.ana ? 2.6 : 3) * k,
                        y: GROUND - 2.5 * k + Math.sin(a.phase * wig - j * 0.55) * 1.5 * k,
                        w: w * 1.4, h: w, band: j % bandEvery === 0 });
        }
        hx = a.x + a.dir * 3 * k;
        hy = GROUND - 3 * k + Math.sin(a.phase) * 1.5 * k;
    }
    neck = segs[segs.length - 1];
    noStroke();

    // aura (Lv 20+)
    if (lv >= 20) {
        var pulse = 0.6 + 0.4 * Math.sin(t * 0.08 + a.phase);
        var ac = lv >= 30 ? c.body : evoColor(lv);
        fill(ac[0], ac[1], ac[2], 35 * pulse);
        ellipse(a.x, GROUND - 10 * k, 46 * k, 34 * k);
        fill(ac[0], ac[1], ac[2], 25 * pulse);
        ellipse(a.x, GROUND - 10 * k, 64 * k, 46 * k);
    }

    // wings (Lv 24+) - big when reared up, smaller while slithering
    if (lv >= 24 && !a.ana) {
        var ws = reared ? 1 : 0.7;
        var flap = Math.sin(t * (reared ? 0.2 : 0.35)) * 4 * k;
        var wc = mixArr(c.body, [30, 20, 40], 0.4);
        var wx = (reared ? neck.x : segs[Math.max(0, segs.length - 4)].x) - a.dir * 2 * k;
        var wy = reared ? neck.y : segs[Math.max(0, segs.length - 4)].y - 2 * k;
        fill(wc[0], wc[1], wc[2], 225);
        triangle(wx, wy, wx - a.dir * 16 * k * ws, wy - (14 * k + flap) * ws, wx - a.dir * 6 * k * ws, wy + 4 * k * ws);
        triangle(wx, wy, wx - a.dir * 10 * k * ws, wy - (18 * k + flap) * ws, wx - a.dir * 14 * k * ws, wy - 6 * k * ws);
        stroke(red(color(wc[0], wc[1], wc[2])) * 0.6, green(color(wc[0], wc[1], wc[2])) * 0.6, blue(color(wc[0], wc[1], wc[2])) * 0.6);
        strokeWeight(Math.max(1, 0.8 * k));
        line(wx, wy, wx - a.dir * 16 * k * ws, wy - (14 * k + flap) * ws);
        line(wx, wy, wx - a.dir * 10 * k * ws, wy - (18 * k + flap) * ws);
        noStroke();
    }

    // RAGE: a hot red glow
    if (a.state === "fight" && a.hp < a.maxHp * 0.3) {
        var rgl = 0.6 + 0.4 * Math.sin(t * 0.3);
        fill(255, 40, 20, 45 * rgl);
        ellipse(a.x, GROUND - 12 * k, 44 * k, 36 * k);
    }

    // body
    for (i = 0; i < segs.length; i++) {
        s = segs[i];
        fillArr(s.band ? c.band : c.body);
        ellipse(s.x, s.y, s.w, s.h);
    }

    // the attacking tail (TAIL WHIP / FLAME TAIL)
    if (extra.length > 0) {
        if (tailTip.whip) {
            // motion streaks behind the swinging tail
            noFill();
            for (i = 1; i <= 3; i++) {
                stroke(255, 255, 255, 150 - i * 40);
                strokeWeight(Math.max(1, (3 - i * 0.6) * S));
                var oth = tailTip.th + i * 0.25;
                line(tailTip.bx + a.dir * Math.cos(oth * 0.7) * tailTip.L * 0.5,
                     tailTip.by - Math.sin(oth * 0.7) * tailTip.L * 0.22,
                     tailTip.bx + a.dir * Math.cos(oth) * tailTip.L,
                     tailTip.by - Math.sin(oth) * tailTip.L * 0.45);
            }
            noStroke();
        }
        fill(20, 15, 10, 150);
        for (i = 0; i < extra.length; i++) {
            ellipse(extra[i].x, extra[i].y, extra[i].w + 1.6 * k, extra[i].w + 1.6 * k);
        }
        for (i = 0; i < extra.length; i++) {
            fillArr(extra[i].band ? c.band : c.body);
            ellipse(extra[i].x, extra[i].y, extra[i].w, extra[i].w);
        }
        if (tailTip.fire !== undefined) {
            // glowing tail tip
            var fl2 = Math.sin(t * 0.6) * 1.5 * k;
            fill(255, 140, 30, 120 * tailTip.fire);
            ellipse(tailTip.x, tailTip.y, 12 * k + fl2, 12 * k + fl2);
            fill(255, 230, 120, 220 * tailTip.fire);
            ellipse(tailTip.x, tailTip.y, 5 * k, 5 * k);
            // the fire jet
            if (tailTip.jet > 0 && a.foe) {
                var jx = a.foe.x;
                var jy = GROUND - 10 * S * (a.foe.size || 1);
                for (i = 0; i < 16; i++) {
                    var jf = i / 15;
                    var wob = Math.sin(t * 0.9 + i * 1.7) * 3 * S * jf;
                    var fx2 = lerp(tailTip.x, jx, jf) + wob;
                    var fy2 = lerp(tailTip.y, jy, jf) - Math.sin(jf * PI) * 6 * S + wob;
                    var fsz = (5 + jf * 15) * S * (0.7 + 0.3 * Math.sin(t * 1.3 + i));
                    fill(255, lerp(230, 80, jf), lerp(120, 20, jf), 210 * tailTip.jet);
                    ellipse(fx2, fy2, fsz, fsz);
                }
                fill(255, 150, 40, 90 * tailTip.jet);
                ellipse(jx, jy, 30 * S, 24 * S);
            }
        }
    }

    // Anaconda: pale belly and big black spots
    if (a.ana) {
        for (i = 0; i < segs.length; i++) {
            s = segs[i];
            fill(175, 165, 85, 150);
            ellipse(s.x, s.y + s.h * 0.28, s.w * 0.8, s.h * 0.3);
            if (i % 2 === 1) {
                fill(28, 30, 16);
                ellipse(s.x, s.y - s.h * 0.12, s.w * 0.5, s.h * 0.45);
                fill(120, 115, 50);
                ellipse(s.x, s.y - s.h * 0.12, s.w * 0.2, s.h * 0.18);
            }
        }
    }

    // glowing markings (Lv 14+)
    if (lv >= 14) {
        var gl = 45 + 30 * Math.sin(t * 0.12 + a.phase);
        fill(c.band[0], c.band[1], c.band[2], gl);
        for (i = 0; i < segs.length; i++) {
            if (segs[i].band) { ellipse(segs[i].x, segs[i].y, segs[i].w * 1.35, segs[i].h * 1.35); }
        }
    }

    // back spikes (Lv 5+)
    if (lv >= 5) {
        var sh = (1.5 + (lv - 5) * 0.12) * k;
        var sc2 = lv >= 20 ? [245, 215, 110] : mixArr(c.body, [20, 15, 15], 0.45);
        fillArr(sc2);
        for (i = 1; i < segs.length; i += 2) {
            s = segs[i];
            var top = s.y - s.h * 0.45;
            triangle(s.x - s.w * 0.25, top, s.x + s.w * 0.25, top, s.x, top - sh);
        }
    }

    // tail flame / crystal (Lv 17+)
    if (lv >= 17) {
        var tail = segs[0];
        var fl = Math.sin(t * 0.3 + a.phase) * 1.5 * k;
        fill(255, 160, 40, 170);
        ellipse(tail.x, tail.y - 3 * k, 5 * k, 8 * k + fl);
        fill(255, 240, 140, 220);
        ellipse(tail.x, tail.y - 2 * k, 2.5 * k, 4 * k + fl * 0.5);
    }

    // cobra hood (Lv 8+) when reared
    if (lv >= 8 && reared) {
        var hd = mixArr(c.body, [20, 15, 20], 0.25);
        fillArr(hd);
        var hcx = hx - a.dir * 3 * k;
        quad(hcx, hy - 1 * k, hcx - 6 * k, hy + 7 * k, hcx, hy + 13 * k, hcx + 6 * k, hy + 7 * k);
        ellipse(hcx, hy + 6.5 * k, 11 * k, 10 * k);
        fillArr(c.band);
        ellipse(hcx - 2.4 * k, hy + 5.5 * k, 2.6 * k, 3.2 * k);
        ellipse(hcx + 2.4 * k, hy + 5.5 * k, 2.6 * k, 3.2 * k);
    }

    drawHead2Side(a, hx, hy, k, tongue || a.state === "fight", lv);
    drawSnakeHead(hx, hy, a.dir, c, tongue || a.state === "fight", k, lv);

    if (a.poison > 0) {
        for (i = 0; i < 4; i++) {
            var pb = (t * 0.6 + i * 9) % 30;
            fill(120, 230, 80, 200 * (1 - pb / 30));
            ellipse(hx + Math.sin(i * 2.3 + t * 0.05) * 4 * k, hy - 4 * k - pb * 0.5 * S, 2.4 * S, 2.4 * S);
        }
    }

    if ((a.state === "fight" && a.strike > 0.5) || a.state === "eat") {
        // open jaws
        fill(240, 200, 200);
        triangle(hx + a.dir * 2 * k, hy + 0.5 * k, hx + a.dir * 5 * k, hy + 2.5 * k,
                 hx + a.dir * 2 * k, hy + 3 * k);
    }

    // orbiting sparkles (Lv 30)
    if (lv >= 30) {
        for (i = 0; i < 5; i++) {
            var oa = t * 0.06 + i * TWO_PI / 5;
            var ox = a.x + Math.cos(oa) * 22 * k;
            var oy = GROUND - 12 * k + Math.sin(oa) * 7 * k;
            fill(255, 240, 160, 200);
            ellipse(ox, oy, 2.5 * k, 2.5 * k);
        }
    }

    // level & health
    var labelY = Math.min(hy, GROUND - 22 * k) - 10 * k - 6 * S;
    if (a.ana && !reared) { labelY = hy - 18 * S; }
    if (a.state === "fight") {
        var hp = constrain(a.hp / a.maxHp, 0, 1);
        fill(0, 0, 0, 140);
        rect(a.x - 12 * S, labelY + 4 * S, 24 * S, 4 * S, 2 * S);
        fill(255 * (1 - hp), 200 * hp + 40, 60);
        rect(a.x - 12 * S, labelY + 4 * S, 24 * S * hp, 4 * S, 2 * S);
    }
    if (a.state !== "eaten") {
        textAlign(CENTER, CENTER);
        textSize(Math.max(9, 8 * S));
        var tc = lv >= 30 ? [255, 225, 90] : (lv >= 2 ? evoColor(lv) : [230, 230, 230]);
        var label = (a.name ? a.name + "  " : "") + (lv >= 30 ? "SERPENT KING" : "Lv " + lv);
        if (a.ana) {
            tc = [220, 40, 30];
            label = "THE ANACONDA";
        }
        fill(0, 0, 0, 120);
        text(label, a.x + 1, labelY + 1);
        fill(Math.min(255, tc[0] + 60), Math.min(255, tc[1] + 60), Math.min(255, tc[2] + 60));
        text(label, a.x, labelY);
        textAlign(LEFT, BASELINE);
    }
};

// ---- Shrewbert Snoutley, elephant shrew & commentator ----
var drawShrew = function(x, y, k, dir, talking) {
    var i;
    var blink = (frameCount % 190) < 6;
    var wig = talking ? Math.sin(frameCount * 0.45) : Math.sin(frameCount * 0.05) * 0.4;
    var bob = talking ? Math.abs(Math.sin(frameCount * 0.22)) * 1.2 * k : 0;
    pushMatrix();
    translate(x, y);
    scale(dir, 1);
    // tail
    noFill();
    stroke(140, 95, 65);
    strokeWeight(1.6 * k);
    line(-13 * k, -7 * k, -22 * k, -4 * k);
    line(-22 * k, -4 * k, -30 * k, -7 * k);
    noStroke();
    // back leg (long, springy)
    fill(150, 100, 65);
    ellipse(-7 * k, -9 * k, 13 * k, 13 * k);
    stroke(110, 75, 50);
    strokeWeight(1.6 * k);
    line(-8 * k, -4 * k, -5 * k, 0);
    line(-5 * k, 0, 1 * k, 0);
    line(8 * k, -6 * k, 9 * k, 0);
    noStroke();
    translate(0, -bob);
    // body
    fill(178, 122, 74);
    ellipse(0, -12 * k, 30 * k, 18 * k);
    fill(232, 205, 165);
    ellipse(3 * k, -7.5 * k, 20 * k, 8 * k);
    // bow tie - he's a professional
    fill(200, 40, 60);
    triangle(11 * k, -15 * k, 8 * k, -17.5 * k, 8 * k, -12.5 * k);
    triangle(11 * k, -15 * k, 14 * k, -17.5 * k, 14 * k, -12.5 * k);
    fill(150, 20, 40);
    ellipse(11 * k, -15 * k, 2.2 * k, 2.2 * k);
    // head
    fill(182, 126, 78);
    ellipse(14 * k, -21 * k, 15 * k, 13 * k);
    // big round ear
    fill(168, 113, 68);
    ellipse(8 * k, -29 * k, 8 * k, 10 * k);
    fill(225, 160, 150);
    ellipse(8.3 * k, -28.5 * k, 4.5 * k, 6.5 * k);
    // the famous wiggly snout
    var sx = 20 * k;
    var sy = -20 * k;
    var ang = 0.12 + wig * 0.25;
    for (i = 0; i < 7; i++) {
        fill(188 - i * 4, 128 - i * 3, 84);
        ellipse(sx, sy, (5 - i * 0.55) * k, (4 - i * 0.4) * k);
        sx += Math.cos(ang) * 2.3 * k;
        sy += Math.sin(ang) * 2.3 * k;
        ang += wig * 0.2 + 0.05;
    }
    fill(80, 40, 40);
    ellipse(sx, sy, 2.3 * k, 2 * k);
    stroke(60, 40, 30, 160);
    strokeWeight(Math.max(0.5, 0.45 * k));
    line(sx - 4 * k, sy - 0.5 * k, sx - 2 * k, sy - 4.5 * k);
    line(sx - 4 * k, sy, sx + 1 * k, sy + 3.5 * k);
    line(sx - 5 * k, sy, sx - 5 * k, sy - 4 * k);
    noStroke();
    // eye with the white eye-ring sengis have
    fill(250, 245, 235);
    ellipse(15 * k, -23 * k, 7.5 * k, 7 * k);
    if (blink) {
        stroke(40);
        strokeWeight(Math.max(1, 0.8 * k));
        line(12.5 * k, -23 * k, 17.5 * k, -23 * k);
        noStroke();
    } else {
        fill(20);
        ellipse(15.6 * k, -23 * k, 4.8 * k, 4.8 * k);
        fill(255);
        ellipse(16.6 * k, -24.2 * k, 1.5 * k, 1.5 * k);
    }
    // mouth
    if (talking && Math.sin(frameCount * 0.6) > 0) {
        fill(90, 40, 40);
        ellipse(20 * k, -16 * k, 3 * k, 2.2 * k);
    }
    // microphone
    stroke(110, 75, 50);
    strokeWeight(1.4 * k);
    line(9 * k, -10 * k, 15 * k, -13 * k);
    noStroke();
    fill(45);
    rect(14.5 * k, -14 * k, 2 * k, 6 * k);
    fill(150);
    ellipse(15.5 * k, -15 * k, 4.2 * k, 4.2 * k);
    fill(110);
    ellipse(15.5 * k, -15 * k, 2.2 * k, 2.2 * k);
    popMatrix();
};

var wrapWords = function(str, maxW) {
    var words = str.split(" ");
    var lines = [];
    var cur = "";
    for (var i = 0; i < words.length; i++) {
        var test = cur === "" ? words[i] : cur + " " + words[i];
        if (textWidth(test) > maxW && cur !== "") {
            lines.push(cur);
            cur = words[i];
        } else {
            cur = test;
        }
    }
    if (cur !== "") { lines.push(cur); }
    return lines;
};

// A comic speech bubble whose bottom sits at (ax, ay), pointing at (tx, ty)
var drawBubble = function(str, ax, ay, maxW, tx, ty, size) {
    textSize(size);
    var lines = wrapWords(str, maxW);
    var w = 0;
    var i;
    for (i = 0; i < lines.length; i++) { w = Math.max(w, textWidth(lines[i])); }
    w += 22;
    var lh = size + 4;
    var h = lines.length * lh + 14;
    var x = constrain(ax - w / 2, 4, W - w - 4);
    var y = ay - h;
    var shown = Math.floor((frameCount - shrewT) * 1.5);
    var baseX = constrain(tx, x + 14, x + w - 14);
    stroke(35, 28, 20);
    strokeWeight(2);
    fill(255, 251, 238);
    triangle(baseX - 7, y + h - 2, baseX + 7, y + h - 2, tx, ty);
    rect(x, y, w, h, 10);
    noStroke();
    triangle(baseX - 5.5, y + h - 3, baseX + 5.5, y + h - 3, tx, ty - 2.5);
    fill(35, 28, 20);
    textAlign(LEFT, TOP);
    for (i = 0; i < lines.length; i++) {
        var part = lines[i];
        if (shown < part.length) { part = part.substring(0, Math.max(0, shown)); }
        shown -= lines[i].length + 1;
        text(part, x + 11, y + 8 + i * lh);
    }
    textAlign(LEFT, BASELINE);
};

// colour of a snake's bait dot (matches the L list)
var baitColor = function(who) {
    return who.evo > 1 ? evoColor(who.evo) : who.col.body;
};

var drawBaitPellet = function(x, y, c, band, k, pulse) {
    noStroke();
    fill(c[0], c[1], c[2], 60 * pulse);
    ellipse(x, y, 18 * k, 12 * k);
    fill(c[0], c[1], c[2]);
    ellipse(x, y, 8 * k, 6 * k);
    fill(band[0], band[1], band[2]);
    ellipse(x - 1 * k, y - 1 * k, 3 * k, 2.4 * k);
};

var drawBaits = function() {
    for (var i = 0; i < baits.length; i++) {
        var bt = baits[i];
        if (!inView(bt.x, 40)) { continue; }
        var c = bt.ana ? [85, 95, 40] : baitColor(bt.who);
        var band = bt.ana ? [25, 25, 15] : bt.who.col.band;
        var pulse = 0.6 + 0.4 * Math.sin(frameCount * 0.1 + i);
        // little flag so you can find it
        stroke(90, 70, 50);
        strokeWeight(Math.max(1, 1.2 * S));
        line(bt.x + 6 * S, GROUND - 1 * S, bt.x + 6 * S, GROUND - 22 * S);
        noStroke();
        fill(c[0], c[1], c[2]);
        triangle(bt.x + 6 * S, GROUND - 22 * S, bt.x + 6 * S, GROUND - 15 * S, bt.x + 15 * S, GROUND - 18.5 * S);
        drawBaitPellet(bt.x, GROUND - 2 * S, c, band, S * (bt.ana ? 1.6 : 1), pulse);
        textAlign(CENTER, BASELINE);
        textSize(Math.max(9, 7 * S));
        var nm = bt.ana ? "ANACONDA BAIT" : bt.who.name;
        fill(0, 0, 0, 140);
        text(nm, bt.x + 7 * S + 1, GROUND - 25 * S + 1);
        fill(255, 255, 255, 230);
        text(nm, bt.x + 7 * S, GROUND - 25 * S);
        textAlign(LEFT, BASELINE);
    }
};

// The Fight Pit, seen from the side
// colours of the snake that became the Fight SNAKE
var fightSnakeCols = function() {
    var w = fightPit && fightPit.who ? fightPit.who : snakeRoster[0];
    if (w.isAna) {
        var dry = (1 - fsShrink) * 1.1;
        return { body: mixArr(w.col.body, [120, 100, 75], Math.min(1, dry)), band: mixArr(w.col.band, [90, 75, 60], Math.min(1, dry)),
                 evo: 0, ana: true };
    }
    return { body: w.evo > 1 ? evoColor(w.evo) : w.col.body, band: w.col.band, evo: w.evo };
};

var drawArenaSide = function(x, hw) {
    var i;
    var type = fightPit.type;
    noStroke();
    if (type === "flesh") { drawFleshSide(x, hw); return; }
    if (type === "pond") { drawPondSide(x, hw); return; }
    if (type === "snake") {
        // the sacrificed snake, huge, coiled around the arena
        var fc = fightSnakeCols();
        var k = S * 3 * fsShrink * (fc.ana ? 1.2 : 1);
        var segN = 30;
        for (i = 0; i < segN; i++) {
            var ang = PI + i / (segN - 1) * PI;
            var sx = x + Math.cos(ang) * hw * 1.05;
            var sy = GROUND - 4 * S + Math.sin(ang) * 16 * S;
            fill(20, 15, 10, 170);
            ellipse(sx, sy, 7.4 * k, 6.4 * k);
            fillArr(i % 2 === 0 ? fc.body : fc.band);
            ellipse(sx, sy, 6.4 * k, 5.4 * k);
            fill(255, 255, 255, 40);
            ellipse(sx - 1 * k, sy - 1.4 * k, 2.6 * k, 1.6 * k);
        }
        // the neck rising up behind the arena to a giant head (facing in)
        var hx = x - hw * 0.55;
        var hy = GROUND - (92 - (1 - fsShrink) * 50) * S + Math.sin(t * 0.03) * 4 * S;
        // the Anaconda arena lunges out to swallow a snake
        if (fightPit.lunge && animals.indexOf(fightPit.lunge.v) >= 0) {
            var lage = frameCount - fightPit.lunge.f0;
            var lf = lage < 24 ? Math.sin(lage / 24 * HALF_PI) : Math.max(0, 1 - (lage - 24) / 46);
            hx = lerp(hx, fightPit.lunge.v.x - 40 * S, lf);
            hy = lerp(hy, GROUND - 16 * S, lf);
        }
        for (i = 0; i < 14; i++) {
            var nf = i / 13;
            var nx = lerp(x - hw * 1.0, hx, nf) - Math.sin(nf * PI) * 18 * S;
            var ny = lerp(GROUND - 8 * S, hy + 10 * S, nf);
            fill(20, 15, 10, 170);
            ellipse(nx, ny, (8.4 - nf * 1.5) * k, (8.4 - nf * 1.5) * k);
            fillArr(i % 2 === 0 ? fc.body : fc.band);
            ellipse(nx, ny, (7.4 - nf * 1.5) * k, (7.4 - nf * 1.5) * k);
        }
        fill(20, 15, 10, 170);
        ellipse(hx + 4 * S, hy, 16 * k, 12 * k);
        fillArr(fc.body);
        ellipse(hx + 4 * S, hy, 14.5 * k, 10.5 * k);
        // jaws open over the arena
        fill(90, 25, 35);
        triangle(hx + 22 * S, hy + 4 * S, hx + 52 * S, hy + 14 * S, hx + 22 * S, hy + 16 * S);
        fill(255);
        triangle(hx + 30 * S, hy + 6 * S, hx + 27 * S, hy + 6 * S, hx + 28.5 * S, hy + 13 * S);
        var gl = 0.6 + 0.4 * Math.sin(t * 0.08);
        if (fightPit.morph) { gl = 1.5 + Math.sin(frameCount * 0.6) * 0.5; }
        fsEyeSide = { x: hx + 10 * S, y: hy - 8 * S };
        fill(255, 60, 40, 90 * gl);
        ellipse(hx + 10 * S, hy - 8 * S, 16 * S, 16 * S);
        fill(255, 220, 80);
        ellipse(hx + 10 * S, hy - 8 * S, 6 * S, 6 * S);
        fill(10);
        ellipse(hx + 10 * S, hy - 8 * S, 2 * S, 5 * S);
        if (Math.sin(t * 0.2) > 0.3) {
            stroke(220, 40, 50);
            strokeWeight(Math.max(1, 1.6 * S));
            line(hx + 50 * S, hy + 10 * S, hx + 64 * S, hy + 12 * S);
            line(hx + 64 * S, hy + 12 * S, hx + 70 * S, hy + 8 * S);
            line(hx + 64 * S, hy + 12 * S, hx + 70 * S, hy + 16 * S);
            noStroke();
        }
        if (fc.evo >= 27) {
            fill(250, 205, 60);
            triangle(hx + 16 * S, hy - 16 * S, hx + 10 * S, hy - 16 * S, hx + 13 * S, hy - 28 * S);
            triangle(hx + 6 * S, hy - 17 * S, hx + 0 * S, hy - 17 * S, hx + 3 * S, hy - 30 * S);
            triangle(hx - 4 * S, hy - 16 * S, hx - 10 * S, hy - 16 * S, hx - 7 * S, hy - 28 * S);
        }
        fill(60, 40, 70);
        ellipse(x, GROUND + 6 * S, hw * 1.7, 14 * S);
    }
};

var drawFightPit = function() {
    if (!fightPit || !inView(fightPit.x, pitHalf() + 90 * S)) { return; }
    var x = fightPit.x;
    var hw = pitHalf();
    var i;
    noStroke();
    if (fightPit.type && fightPit.type !== "pit" && fightPit.type !== "death") {
        drawArenaSide(x, hw);
    } else {
    // the dug-out arena
    fill(55, 38, 25);
    ellipse(x, GROUND + 5 * S, hw * 2.08, 28 * S);
    fill(170, 145, 100);
    ellipse(x, GROUND + 6 * S, hw * 1.86, 19 * S);
    fill(150, 125, 85);
    ellipse(x, GROUND + 8 * S, hw * 1.4, 10 * S);
    // stakes around the back
    for (i = 0; i <= 14; i++) {
        var f = i / 14;
        var sx = x - hw + f * 2 * hw;
        var sy = GROUND - 1 * S - Math.sin(f * PI) * 5 * S;
        fill(95, 65, 38);
        rect(sx - 1.8 * S, sy - 15 * S, 3.6 * S, 15 * S);
        fill(125, 90, 55);
        triangle(sx - 1.8 * S, sy - 15 * S, sx + 1.8 * S, sy - 15 * S, sx, sy - 19 * S);
    }
    // rope
    stroke(185, 160, 110);
    strokeWeight(Math.max(1, 1.2 * S));
    for (i = 0; i < 14; i++) {
        var f1 = i / 14;
        var f2 = (i + 1) / 14;
        line(x - hw + f1 * 2 * hw, GROUND - 11 * S - Math.sin(f1 * PI) * 5 * S,
             x - hw + f2 * 2 * hw, GROUND - 11 * S - Math.sin(f2 * PI) * 5 * S);
    }
    noStroke();
    // torches
    for (var side = -1; side <= 1; side += 2) {
        var tx = x + side * (hw + 10 * S);
        var fl = Math.sin(frameCount * 0.3 + side) * 1.5 * S;
        fill(255, 150, 40, 40);
        ellipse(tx, GROUND - 34 * S, 34 * S, 34 * S);
        fill(80, 55, 30);
        rect(tx - 1.5 * S, GROUND - 30 * S, 3 * S, 30 * S);
        fill(255, 140, 30);
        ellipse(tx, GROUND - 34 * S - fl * 0.5, 7 * S, 11 * S + fl);
        fill(255, 230, 120);
        ellipse(tx, GROUND - 33 * S, 3.5 * S, 5 * S);
    }
    // pennant flags on the rope
    var penCols = [[220, 60, 50], [250, 200, 60], [80, 140, 230], [120, 200, 90]];
    for (i = 0; i < 14; i++) {
        var pf = (i + 0.5) / 14;
        var px0 = x - hw + pf * 2 * hw;
        var py0 = GROUND - 11 * S - Math.sin(pf * PI) * 5 * S;
        var pc = penCols[i % 4];
        fill(pc[0], pc[1], pc[2]);
        triangle(px0 - 3 * S, py0, px0 + 3 * S, py0, px0, py0 + 6 * S + Math.sin(frameCount * 0.1 + i) * S);
    }
    // banners on tall poles
    for (var bs = -1; bs <= 1; bs += 2) {
        var bpx = x + bs * hw * 0.6;
        fill(70, 48, 28);
        rect(bpx - 1.2 * S, GROUND - 62 * S, 2.4 * S, 50 * S);
        var bw2 = Math.sin(frameCount * 0.08 + bs) * 2 * S;
        if (fightPit.type === "death") { fill(25, 20, 22); } else { fill(150, 30, 40); }
        quad(bpx, GROUND - 62 * S, bpx + bs * 16 * S + bw2, GROUND - 60 * S,
             bpx + bs * 15 * S + bw2, GROUND - 48 * S, bpx, GROUND - 50 * S);
        fill(255, 210, 90);
        ellipse(bpx + bs * 8 * S + bw2 * 0.5, GROUND - 55 * S, 5 * S, 5 * S);
    }
    if (fightPit.type === "death") { drawDeathSide(x, hw); }
    }
    // (in the cave and the knot, Shrewbert is inside - drawn with them)
    if (arenaHides()) { return; }
    // Shrewbert's podium and speech bubble
    var shx = x + hw + 34 * S;
    fill(90, 62, 38);
    rect(shx - 10 * S, GROUND - 14 * S, 20 * S, 14 * S, 2 * S);
    fill(115, 80, 50);
    rect(shx - 12 * S, GROUND - 16 * S, 24 * S, 4 * S, 2 * S);
    var talkingS = frameCount - shrewT < 200;
    drawShrew(shx, GROUND - 16 * S, 0.75 * S, -1, talkingS);
    if (frameCount - shrewT < 260) {
        pushMatrix();
        translate(camX, 0);
        drawBubble(shrewLine, shx - camX - 40 * S, GROUND - 44 * S, 180, shx - camX - 6 * S, GROUND - 36 * S, 11);
        popMatrix();
    }
    // sign (the cave and the tree knot get their own)
    if (arenaHides()) { return; }
    var signX = fightPit.type === "snake" ? x + hw * 0.4 : x;
    fill(80, 55, 32);
    rect(signX - 2 * S, GROUND - 44 * S, 4 * S, 26 * S);
    fill(120, 85, 50);
    rect(signX - 32 * S, GROUND - 52 * S, 64 * S, 14 * S, 3 * S);
    fill(255, 225, 150);
    textAlign(CENTER, CENTER);
    textSize(Math.max(9, 8 * S));
    text(arenaName().toUpperCase(), signX, GROUND - 45 * S);
    textAlign(LEFT, BASELINE);
};

var overPit = function() {
    if (!fightPit) { return false; }
    var mx = mouseX + camX;
    if (arenaIs("tree")) {
        var kp = knotPos();
        return dist(mx, mouseY, kp.x, kp.y) < kp.w * 1.4 + 6 * S;
    }
    if (arenaIs("cave")) {
        return Math.abs(mx - fightPit.x) < pitHalf() * 1.2 &&
               mouseY > GROUND - 62 * S && mouseY < GROUND + 10 * S;
    }
    return Math.abs(mx - fightPit.x) < pitHalf() + 10 * S &&
           mouseY > GROUND - 55 * S && mouseY < GROUND + 25 * S;
};

// how many snakes are inside the cave / knot right now (and are any fighting?)
var hiddenCount = function() {
    var n = 0;
    var fighting = false;
    for (var i = 0; i < animals.length; i++) {
        var s = animals[i];
        if (s.type === "snake" && inPitX(s.x) && s.state !== "eaten") {
            n++;
            if (s.state === "fight") { fighting = true; }
        }
    }
    return { n: n, fighting: fighting };
};

// one rounded rock with shading
var drawRock = function(x, y, w, h, base) {
    fill(base[0] * 0.55, base[1] * 0.55, base[2] * 0.55);
    ellipse(x + w * 0.05, y + h * 0.08, w, h);
    fill(base[0], base[1], base[2]);
    ellipse(x, y, w * 0.95, h * 0.92);
    fill(Math.min(255, base[0] * 1.25), Math.min(255, base[1] * 1.25), Math.min(255, base[2] * 1.25));
    ellipse(x - w * 0.15, y - h * 0.18, w * 0.5, h * 0.38);
};

// Shrewbert's speech bubble in the forest view, pointing at (px, py) in the world
var shrewBubbleAt = function(px, py) {
    if (frameCount - shrewT < 260) {
        pushMatrix();
        translate(camX, 0);
        drawBubble(shrewLine, px - camX - 30 * S, py - 10 * S, 180, px - camX, py - 2 * S, 11);
        popMatrix();
    }
};

// A small cave out in the forest - snakes go inside to fight
var drawCaveOutside = function() {
    var x = fightPit.x;
    var hw = pitHalf();
    if (!inView(x, hw * 1.6)) { return; }
    var hc = hiddenCount();
    var rum = hc.fighting ? Math.sin(t * 1.7) * 0.8 * S : 0;
    var i;
    noStroke();
    pushMatrix();
    translate(rum, 0);
    // earthy hill, with a grassy cap
    fill(96, 74, 52);
    arc(x, GROUND + 4 * S, hw * 2.7, 128 * S, PI, TWO_PI);
    fill(86, 124, 56);
    arc(x, GROUND + 4 * S - 4 * S, hw * 2.55, 124 * S, PI + 0.35, TWO_PI - 0.35);
    fill(96, 74, 52);
    arc(x, GROUND + 4 * S + 2 * S, hw * 2.4, 112 * S, PI, TWO_PI);
    // grass tufts and a few flowers on top
    for (i = 0; i < 9; i++) {
        var ga = PI + 0.45 + i / 8 * (PI - 0.9);
        var gx = x + Math.cos(ga) * hw * 1.27;
        var gy = GROUND + 2 * S + Math.sin(ga) * 62 * S;
        stroke(70, 120, 50);
        strokeWeight(Math.max(1, 1.2 * S));
        line(gx, gy, gx - 2 * S, gy - 6 * S);
        line(gx, gy, gx + 1 * S, gy - 7 * S);
        line(gx, gy, gx + 3 * S, gy - 5 * S);
        noStroke();
        if (i % 3 === 1) {
            fill(i % 2 === 0 ? color(250, 220, 90) : color(240, 120, 160));
            ellipse(gx + 1 * S, gy - 7 * S, 3 * S, 3 * S);
        }
    }
    // stone archway built of shaded boulders
    var rockCols = [[128, 122, 116], [112, 108, 104], [138, 130, 120], [120, 116, 112]];
    for (i = 0; i < 11; i++) {
        var ra = PI + i / 10 * PI;
        var rx = x + Math.cos(ra) * hw * 0.68;
        var ry = GROUND + 2 * S + Math.sin(ra) * 50 * S;
        var rsz = (i === 5 ? 30 : 22 + (i * 7) % 8) * S;
        drawRock(rx, ry, rsz, rsz * 0.82, rockCols[i % 4]);
    }
    // the dark entrance, deeper toward the middle
    var dCols = [[46, 38, 36], [32, 26, 25], [20, 16, 16], [10, 8, 9]];
    for (i = 0; i < 4; i++) {
        fill(dCols[i][0], dCols[i][1], dCols[i][2]);
        arc(x, GROUND + 3 * S, hw * (1.06 - i * 0.14), (82 - i * 11) * S, PI, TWO_PI);
    }
    // torchlight flickering deep inside when there's a fight
    if (hc.fighting) {
        var fl = 0.6 + 0.4 * Math.sin(t * 0.5);
        fill(255, 140, 50, 45 * fl);
        ellipse(x, GROUND - 14 * S, hw * 0.7, 40 * S);
    }
    // eyes glinting in the dark - one pair per snake inside
    for (i = 0; i < Math.min(5, hc.n); i++) {
        if (Math.sin(t * 0.04 + i * 3) < -0.8) { continue; }
        var ex = x - hw * 0.22 + i * hw * 0.11;
        var ey = GROUND - 9 * S - (i % 2) * 8 * S;
        fill(255, 220, 90);
        ellipse(ex - 1.6 * S, ey, 2 * S, 2 * S);
        ellipse(ex + 1.6 * S, ey, 2 * S, 2 * S);
    }
    // hanging vines over the entrance
    for (i = 0; i < 5; i++) {
        var vx = x - hw * 0.35 + i * hw * 0.17;
        var vtop = GROUND + 3 * S - Math.sin((i + 0.5) / 5 * PI) * 40 * S;
        var vlen = (12 + (i * 9) % 12) * S;
        stroke(60, 110, 45);
        strokeWeight(Math.max(1, 1.2 * S));
        line(vx, vtop, vx + Math.sin(t * 0.03 + i) * 1.5 * S, vtop + vlen);
        noStroke();
        fill(80, 140, 60);
        ellipse(vx - 1.5 * S, vtop + vlen * 0.4, 3.5 * S, 2.2 * S);
        ellipse(vx + 1.5 * S, vtop + vlen * 0.75, 3.5 * S, 2.2 * S);
    }
    // two torches flanking the entrance
    for (var sd = -1; sd <= 1; sd += 2) {
        var tx = x + sd * hw * 0.98;
        var tfl = Math.sin(t * 0.3 + sd) * 1.2 * S;
        fill(255, 150, 40, 40);
        ellipse(tx, GROUND - 30 * S, 26 * S, 26 * S);
        fill(80, 55, 32);
        rect(tx - 1.3 * S, GROUND - 28 * S, 2.6 * S, 28 * S);
        fill(255, 130, 30);
        ellipse(tx, GROUND - 31 * S - tfl * 0.5, 6 * S, 9 * S + tfl);
        fill(255, 230, 130);
        ellipse(tx, GROUND - 30 * S, 3 * S, 4 * S);
    }
    // pebbles and a worn dirt path leading in
    fill(120, 96, 70);
    ellipse(x, GROUND + 3 * S, hw * 0.9, 7 * S);
    for (i = 0; i < 6; i++) {
        drawRock(x - hw * 0.6 + i * hw * 0.24 + Math.sin(i * 3) * 4 * S, GROUND - 1 * S, (6 + i % 3 * 2) * S, (4 + i % 2) * S, [130, 124, 118]);
    }
    // carved sign on a post beside the cave
    var sgx = x - hw * 1.18;
    fill(80, 55, 32);
    rect(sgx - 1.5 * S, GROUND - 26 * S, 3 * S, 26 * S);
    fill(120, 85, 50);
    rect(sgx - 22 * S, GROUND - 34 * S, 44 * S, 12 * S, 3 * S);
    fill(255, 225, 150);
    textAlign(CENTER, CENTER);
    textSize(Math.max(8, 7 * S));
    text("FIGHT CAVE", sgx, GROUND - 28 * S);
    textAlign(LEFT, BASELINE);
    popMatrix();
    // Shrewbert, just inside the entrance with his microphone
    var talking = frameCount - shrewT < 200;
    drawShrew(x + hw * 0.3, GROUND - 1 * S, 0.62 * S, -1, talking);
    shrewBubbleAt(x + hw * 0.3, GROUND - 26 * S);
    // dust puffs out of the cave mouth during fights
    if (hc.fighting && frameCount % 25 === 0) {
        snakeBurst(x + random(-12, 12) * S, GROUND - 4 * S, 4, [150, 135, 110], 1);
    }
};

// The knot in the Fight Tree's trunk - snakes climb in to fight
var drawKnotOutside = function() {
    var tr = fightPit.tree;
    if (!tr || !inView(tr.x, 80 * S)) { return; }
    var kp = knotPos();
    var hc = hiddenCount();
    var shake = hc.fighting ? Math.sin(t * 1.9) * 0.5 * S : 0;
    var x = kp.x + shake;
    var y = kp.y;
    var w = kp.w;
    var bk = tr.sp.bark;
    var bh = tr.sp.barkHi;
    var i;
    noStroke();
    // a leafy vine winding up the trunk to the knot
    stroke(60, 105, 45);
    strokeWeight(Math.max(1, 1.2 * S));
    var vx0 = x - w * 0.4;
    var prevx = vx0;
    var prevy = GROUND;
    for (i = 1; i <= 8; i++) {
        var vf = i / 8;
        var vx = vx0 + Math.sin(vf * 9) * w * 0.35;
        var vy = lerp(GROUND, y + w * 0.7, vf);
        line(prevx, prevy, vx, vy);
        prevx = vx;
        prevy = vy;
    }
    noStroke();
    for (i = 1; i <= 7; i++) {
        var lf = i / 8;
        fill(80, 140, 60);
        ellipse(vx0 + Math.sin(lf * 9) * w * 0.35 + (i % 2 === 0 ? 2 : -2) * S, lerp(GROUND, y + w * 0.7, lf), 3.4 * S, 2.2 * S);
    }
    // bark bulge around the knot (darker below, lighter on top)
    fill(red(bk) * 0.5, green(bk) * 0.5, blue(bk) * 0.5);
    ellipse(x + w * 0.08, y + w * 0.12, w * 2.0, w * 2.5);
    fill(red(bk) * 0.9, green(bk) * 0.9, blue(bk) * 0.9);
    ellipse(x, y, w * 1.9, w * 2.35);
    fill(red(bh), green(bh), blue(bh));
    ellipse(x - w * 0.12, y - w * 0.2, w * 1.5, w * 1.6);
    fill(red(bk) * 0.7, green(bk) * 0.7, blue(bk) * 0.7);
    ellipse(x, y + w * 0.04, w * 1.32, w * 1.72);
    // the hole, dark and deep
    fill(28, 18, 12);
    ellipse(x, y + w * 0.08, w * 1.08, w * 1.46);
    fill(10, 6, 4);
    ellipse(x + w * 0.04, y + w * 0.16, w * 0.82, w * 1.15);
    // a bit of moss on the lip
    fill(90, 140, 60);
    ellipse(x - w * 0.3, y - w * 0.78, w * 0.6, w * 0.22);
    ellipse(x + w * 0.15, y - w * 0.82, w * 0.4, w * 0.18);
    if (hc.fighting) {
        var fl = 0.6 + 0.4 * Math.sin(t * 0.5);
        fill(255, 150, 60, 60 * fl);
        ellipse(x, y + w * 0.15, w * 0.7, w * 1.0);
    }
    for (i = 0; i < Math.min(4, hc.n); i++) {
        if (Math.sin(t * 0.05 + i * 3) < -0.8) { continue; }
        var ex = x - w * 0.18 + (i % 2) * w * 0.36;
        var ey = y - w * 0.1 + Math.floor(i / 2) * w * 0.4;
        fill(255, 220, 90);
        ellipse(ex - 1.1 * S, ey, 1.5 * S, 1.5 * S);
        ellipse(ex + 1.1 * S, ey, 1.5 * S, 1.5 * S);
    }
    // Shrewbert peeking out of the knot
    var talking = frameCount - shrewT < 200;
    var px = x + w * 0.28;
    var py = y + w * 0.42 - (talking ? Math.abs(Math.sin(t * 0.2)) * 1 * S : 0);
    fill(182, 126, 78);
    ellipse(px, py, 7 * S, 6 * S);
    fill(168, 113, 68);
    ellipse(px - 2.2 * S, py - 3.4 * S, 3 * S, 3.6 * S);
    var sw = talking ? Math.sin(t * 0.45) * 0.4 : 0;
    fill(188, 128, 84);
    ellipse(px + 3.5 * S, py + 0.5 * S + sw * S, 4 * S, 2.2 * S);
    fill(80, 40, 40);
    ellipse(px + 5.5 * S, py + 0.8 * S + sw * 1.5 * S, 1.3 * S, 1.2 * S);
    fill(250, 245, 235);
    ellipse(px + 0.6 * S, py - 1 * S, 2.6 * S, 2.4 * S);
    fill(20);
    ellipse(px + 0.9 * S, py - 1 * S, 1.5 * S, 1.5 * S);
    shrewBubbleAt(px, py - 4 * S);
    // a tiny hanging sign
    var sy = y + w * 1.25;
    stroke(90, 70, 50);
    strokeWeight(1);
    line(x - 8 * S, y + w * 0.9, x - 9 * S, sy);
    line(x + 8 * S, y + w * 0.9, x + 9 * S, sy);
    noStroke();
    fill(120, 85, 50);
    rect(x - 15 * S, sy, 30 * S, 8 * S, 2 * S);
    fill(255, 225, 150);
    textAlign(CENTER, CENTER);
    textSize(Math.max(7, 5 * S));
    text("FIGHT KNOT", x, sy + 4 * S);
    textAlign(LEFT, BASELINE);
};

// ---- The Fight Pit, looking down from above ----
var drawSnakeTop = function(a, px, py, ang, k) {
    var lv = a.evo || 1;
    var c = snakeLook(a);
    if (a.state === "eaten") { k *= Math.max(0.05, a.timer / 70); }
    var i, s;
    // RAGE: a hot red glow
    if (a.state === "fight" && a.hp < a.maxHp * 0.3) {
        var rg = 0.6 + 0.4 * Math.sin(frameCount * 0.3);
        noStroke();
        fill(255, 40, 20, 50 * rg);
        ellipse(px, py, 50 * k, 50 * k);
        fill(255, 90, 30, 40 * rg);
        ellipse(px, py, 34 * k, 34 * k);
    }
    // CONSTRICT: wrapped around the other snake in a tight ring
    if (a.wrapT > 0 && a.foe) {
        var fk = (a.foe.size || 1) / (a.size || 1);
        var ringR = (7 + 3 * fk) * k;
        var squeeze = 1 - 0.12 * Math.abs(Math.sin(frameCount * 0.25));
        noStroke();
        fill(190, 120, 255, 60);
        ellipse(px, py, ringR * 3.2, ringR * 3.2);
        for (i = 0; i < 24; i++) {
            var wa = i / 24 * TWO_PI * 1.15 + frameCount * 0.04;
            var wx = px + Math.cos(wa) * ringR * squeeze;
            var wy = py + Math.sin(wa) * ringR * squeeze;
            fill(20, 15, 10, 170);
            ellipse(wx, wy, 6.5 * k, 6.5 * k);
            fillArr(i % 2 === 0 ? c.band : c.body);
            ellipse(wx, wy, 5 * k, 5 * k);
        }
        var hwa = 24 / 24 * TWO_PI * 1.15 + frameCount * 0.04;
        var hhx = px + Math.cos(hwa) * ringR * squeeze;
        var hhy = py + Math.sin(hwa) * ringR * squeeze;
        fill(20, 15, 10, 170);
        ellipse(hhx, hhy, 9 * k, 9 * k);
        fillArr(c.body);
        ellipse(hhx, hhy, 7.5 * k, 7.5 * k);
        fill(255, 120, 60);
        ellipse(hhx + Math.cos(hwa + HALF_PI) * 1.8 * k, hhy + Math.sin(hwa + HALF_PI) * 1.8 * k, 2 * k, 2 * k);
        // squeeze lines
        stroke(230, 200, 255, 160);
        strokeWeight(2);
        for (i = 0; i < 4; i++) {
            var la = i * HALF_PI + frameCount * 0.05;
            line(px + Math.cos(la) * ringR * 1.5, py + Math.sin(la) * ringR * 1.5,
                 px + Math.cos(la) * ringR * 1.9, py + Math.sin(la) * ringR * 1.9);
        }
        noStroke();
        return;
    }
    var segs = [];
    var coiled = a.state === "coil" || a.state === "eat" || a.state === "evolve" || a.state === "victory";
    if (a.state === "fight" && a.move === "whip" && (a.strikeT > 0 || a.moveAnimT > 0)) {
        var spn = a.strikeT > 0 ? (16 - a.strikeT) / 16 : Math.min(1, a.moveAnimT / 24);
        ang += PI * Math.sin(spn * PI);
    }
    if (a.state === "fight" && a.move === "spit" && a.strikeT > 0) {
        k *= 1 + (a.strike || 0) * 0.15;
    }
    var ca = Math.cos(ang);
    var sa = Math.sin(ang);
    var hx = px;
    var hy = py;
    var lunge = 0;
    if (coiled) {
        for (i = 18; i >= 1; i--) {
            var ra = i * 0.62 + a.phase * 0.02;
            var rr = (1.5 + i * 0.75) * k;
            segs.push({ x: px + Math.cos(ra) * rr, y: py + Math.sin(ra) * rr,
                        w: (4.2 + (18 - i) * 0.12) * k, band: i % 2 === 0 });
        }
        hx = px + ca * 3 * k;
        hy = py + sa * 3 * k;
    } else {
        var n = a.ana ? 24 : 16;
        var wig = (a.state === "hunt" || a.state === "leave") ? 2 : (a.state === "fight" ? 1.6 : 1);
        lunge = a.state === "fight" ? (a.strike || 0) * 13 * k : 0;
        var rec = a.recoil ? -Math.sin(a.recoil * 0.4) * 4 * k : 0;
        px += ca * rec;
        py += sa * rec;
        hx = px + ca * lunge;
        hy = py + sa * lunge;
        for (i = n; i >= 1; i--) {
            var back = i * 3 * k;
            var sway = Math.sin(a.phase * wig - i * 0.55) * Math.min(1, i / 4) * 2.6 * k;
            segs.push({ x: px - ca * back - sa * sway, y: py - sa * back + ca * sway,
                        w: (5.2 - i * 3.6 / n) * k, band: i % 2 === 0 });
        }
        segs.push({ x: (px + hx) / 2, y: (py + hy) / 2, w: 5 * k, band: false });
    }
    noStroke();
    // aura (Lv 20+)
    if (lv >= 20 && !a.ana) {
        var ac = lv >= 30 ? c.body : evoColor(lv);
        fill(ac[0], ac[1], ac[2], 35 + 20 * Math.sin(frameCount * 0.08));
        ellipse(px, py, 58 * k, 58 * k);
        fill(ac[0], ac[1], ac[2], 25);
        ellipse(px, py, 80 * k, 80 * k);
    }
    // shadow
    fill(0, 0, 0, 55);
    for (i = 0; i < segs.length; i += 2) {
        ellipse(segs[i].x + 2 * k, segs[i].y + 2.5 * k, segs[i].w * 1.05, segs[i].w * 1.05);
    }
    // wings (Lv 24+), spread out from the shoulders and flapping
    if (lv >= 24 && !a.ana) {
        var wbx = coiled ? px : px - ca * 7 * k;
        var wby = coiled ? py : py - sa * 7 * k;
        var wflap = 0.75 + 0.25 * Math.sin(frameCount * 0.25 + a.phase);
        var wcol = mixArr(c.body, [30, 20, 40], 0.4);
        for (var wsd = -1; wsd <= 1; wsd += 2) {
            var tipx = wbx - sa * wsd * 22 * k * wflap - ca * 10 * k;
            var tipy = wby + ca * wsd * 22 * k * wflap - sa * 10 * k;
            var midx = wbx - sa * wsd * 14 * k * wflap - ca * 16 * k;
            var midy = wby + ca * wsd * 14 * k * wflap - sa * 16 * k;
            fill(0, 0, 0, 45);
            triangle(wbx + 3, wby + 4, tipx + 3, tipy + 4, midx + 3, midy + 4);
            fill(wcol[0], wcol[1], wcol[2], 230);
            triangle(wbx, wby, tipx, tipy, midx, midy);
            triangle(wbx, wby, midx, midy, wbx - ca * 12 * k, wby - sa * 12 * k);
            stroke(wcol[0] * 0.6, wcol[1] * 0.6, wcol[2] * 0.6);
            strokeWeight(Math.max(1, 0.7 * k));
            line(wbx, wby, tipx, tipy);
            line(wbx, wby, midx, midy);
            noStroke();
        }
    }
    // lunge trail
    if (lunge > 3 * k) {
        for (var tr2 = 3; tr2 >= 1; tr2--) {
            fill(c.body[0], c.body[1], c.body[2], 45 - tr2 * 10);
            ellipse(hx - ca * tr2 * 4 * k, hy - sa * tr2 * 4 * k, 9 * k, 7 * k);
        }
    }
    // dark outline, then body, then shine
    fill(20, 15, 10, 170);
    for (i = 0; i < segs.length; i++) {
        ellipse(segs[i].x, segs[i].y, segs[i].w + 2 * k, segs[i].w + 2 * k);
    }
    for (i = 0; i < segs.length; i++) {
        s = segs[i];
        fillArr(s.band && !a.ana ? c.band : c.body);
        ellipse(s.x, s.y, s.w, s.w);
        if (a.ana && s.band) {
            fill(28, 30, 16);
            ellipse(s.x, s.y, s.w * 0.55, s.w * 0.55);
        }
        if (lv >= 5 && !a.ana && i % 2 === 1) {
            fill(lv >= 20 ? color(245, 215, 110) : color(30, 25, 25, 150));
            ellipse(s.x, s.y, s.w * 0.32, s.w * 0.32);
        }
    }
    fill(255, 255, 255, 50);
    for (i = 0; i < segs.length; i++) {
        s = segs[i];
        ellipse(s.x - s.w * 0.18, s.y - s.w * 0.2, s.w * 0.45, s.w * 0.3);
    }
    // glowing markings (Lv 14+)
    if (lv >= 14 && !a.ana) {
        fill(c.band[0], c.band[1], c.band[2], 50 + 30 * Math.sin(frameCount * 0.12 + a.phase));
        for (i = 0; i < segs.length; i += 2) {
            ellipse(segs[i].x, segs[i].y, segs[i].w * 1.4, segs[i].w * 1.4);
        }
    }
    drawHead2Top(a, hx, hy, ang, k);
    // head
    pushMatrix();
    translate(hx, hy);
    rotate(ang);
    if (lv >= 11 && !a.ana) {
        fill(lv >= 20 ? color(245, 210, 90) : color(70, 50, 40));
        triangle(-2 * k, -2.5 * k, -2 * k, -0.5 * k, -8 * k, -5 * k);
        triangle(-2 * k, 2.5 * k, -2 * k, 0.5 * k, -8 * k, 5 * k);
    }
    fill(20, 15, 10, 170);
    ellipse(0.5 * k, 0, 12.5 * k, 9.5 * k);
    fillArr(c.body);
    ellipse(0.5 * k, 0, 10.5 * k, 7.8 * k);
    var snout = mixArr(c.body, [20, 15, 15], 0.25);
    fillArr(snout);
    ellipse(4 * k, 0, 4.5 * k, 5 * k);
    fill(20, 15, 15);
    ellipse(5.6 * k, -1 * k, 0.8 * k, 0.8 * k);
    ellipse(5.6 * k, 1 * k, 0.8 * k, 0.8 * k);
    if (lv >= 3 && !a.ana) {
        fill(255, 90, 40, 100);
        ellipse(1.5 * k, -2.6 * k, 4 * k, 4 * k);
        ellipse(1.5 * k, 2.6 * k, 4 * k, 4 * k);
    }
    fill(lv >= 3 && !a.ana ? color(255, 120, 60) : color(240, 220, 60));
    ellipse(1.5 * k, -2.6 * k, 2.4 * k, 2.4 * k);
    ellipse(1.5 * k, 2.6 * k, 2.4 * k, 2.4 * k);
    fill(10);
    ellipse(1.8 * k, -2.6 * k, 0.8 * k, 1.6 * k);
    ellipse(1.8 * k, 2.6 * k, 0.8 * k, 1.6 * k);
    if (lv >= 27 && !a.ana) {
        fill(250, 205, 60);
        for (i = 0; i < 5; i++) {
            var cra = i / 5 * TWO_PI;
            ellipse(-1.5 * k + Math.cos(cra) * 2.8 * k, Math.sin(cra) * 2.8 * k, 2 * k, 2 * k);
        }
        fill(220, 40, 80);
        ellipse(-1.5 * k, 0, 1.6 * k, 1.6 * k);
    }
    if (a.state === "fight" && a.strike > 0.4) {
        // jaws wide open
        fill(240, 190, 190);
        triangle(5 * k, 0, 10 * k, -3.5 * k, 10 * k, 3.5 * k);
        fill(255);
        triangle(7 * k, -2.2 * k, 8 * k, -0.6 * k, 8.6 * k, -2.6 * k);
        triangle(7 * k, 2.2 * k, 8 * k, 0.6 * k, 8.6 * k, 2.6 * k);
    } else if (a.state === "fight" || a.state === "hunt" || Math.sin(frameCount * 0.4 + a.phase) > 0.7) {
        stroke(220, 40, 50);
        strokeWeight(Math.max(1, 0.6 * k));
        line(6 * k, 0, 9.5 * k, 0);
        line(9.5 * k, 0, 11 * k, -1.2 * k);
        line(9.5 * k, 0, 11 * k, 1.2 * k);
        noStroke();
    }
    popMatrix();
    if (a.recoil) {
        noFill();
        stroke(255, 70, 60, 25 * a.recoil);
        strokeWeight(3);
        ellipse(px, py, 28 * k, 28 * k);
        noStroke();
    }
    // POISONED: green bubbles
    if (a.poison > 0) {
        noStroke();
        for (i = 0; i < 5; i++) {
            var bt = (frameCount * 0.6 + i * 13) % 40;
            fill(120, 230, 80, 200 * (1 - bt / 40));
            ellipse(px + Math.sin(i * 2.1 + frameCount * 0.05) * 8 * k, py - bt * 0.6 * k / 2, (2 + i % 2) * k, (2 + i % 2) * k);
        }
    }
};

// A big comic-book word with a dark outline
var outlinedText = function(str, x, y, sz, col, alpha) {
    textSize(sz);
    textAlign(CENTER, CENTER);
    var o = Math.max(2, sz * 0.06);
    fill(25, 15, 10, alpha);
    text(str, x - o, y);
    text(str, x + o, y);
    text(str, x, y - o);
    text(str, x, y + o);
    text(str, x + o, y + o * 1.6);
    fill(col[0], col[1], col[2], alpha);
    text(str, x, y);
    textAlign(LEFT, BASELINE);
};

var hpBar = function(x, y, w, h, s, flip) {
    var hp = constrain(s.hp / s.maxHp, 0, 1);
    if (s.hpShow === undefined) { s.hpShow = hp; s.hpGhost = hp; }
    s.hpShow = lerp(s.hpShow, hp, 0.25);
    s.hpGhost = Math.max(s.hpShow, lerp(s.hpGhost, s.hpShow, 0.025));
    noStroke();
    fill(15, 10, 8, 220);
    rect(x - 3, y - 3, w + 6, h + 6, 4);
    fill(70, 20, 20);
    rect(x, y, w, h, 2);
    fill(255, 220, 160);
    if (flip) { rect(x + w * (1 - s.hpGhost), y, w * s.hpGhost, h, 2); } else { rect(x, y, w * s.hpGhost, h, 2); }
    var hc = s.hpShow > 0.5 ? [90, 210, 90] : (s.hpShow > 0.25 ? [240, 200, 60] : [235, 70, 50]);
    fill(hc[0], hc[1], hc[2]);
    if (flip) { rect(x + w * (1 - s.hpShow), y, w * s.hpShow, h, 2); } else { rect(x, y, w * s.hpShow, h, 2); }
    fill(255, 255, 255, 60);
    rect(x, y, w, h * 0.4, 2);
};

// a ring of cheering critters (used by the tree and snake arenas)
var drawCrowdRing = function(cx, cy, R, base) {
    for (var i = 0; i < crowd.length; i++) {
        var cr = crowd[i];
        var rr = R * (base + cr.row * 0.12);
        var ca2 = Math.cos(cr.ang);
        var sa2 = Math.sin(cr.ang);
        var jump = Math.max(0, Math.sin(frameCount * (0.12 + pitHype * 0.2) + cr.ph));
        var sz = cr.size * (1 + jump * (0.05 + pitHype * 0.25));
        var x = cx + ca2 * rr;
        var y = cy + sa2 * rr;
        fill(0, 0, 0, 60);
        ellipse(x + 2, y + 3, sz, sz);
        fill(cr.col[0], cr.col[1], cr.col[2]);
        ellipse(x + ca2 * sz * 0.25 - sa2 * sz * 0.35, y + sa2 * sz * 0.25 + ca2 * sz * 0.35, sz * 0.45, sz * 0.45);
        ellipse(x + ca2 * sz * 0.25 + sa2 * sz * 0.35, y + sa2 * sz * 0.25 - ca2 * sz * 0.35, sz * 0.45, sz * 0.45);
        ellipse(x, y, sz, sz);
        fill(255);
        ellipse(x - ca2 * sz * 0.25 - sa2 * sz * 0.18, y - sa2 * sz * 0.25 + ca2 * sz * 0.18, sz * 0.22, sz * 0.22);
        ellipse(x - ca2 * sz * 0.25 + sa2 * sz * 0.18, y - sa2 * sz * 0.25 - ca2 * sz * 0.18, sz * 0.22, sz * 0.22);
    }
};

// the floor and walls of the cave, tree and snake arenas (top-down)
var drawArenaTopBack = function(type, cx, cy, R) {
    var i, j, f;
    noStroke();
    if (type === "flesh") { drawFleshTopBack(cx, cy, R); return; }
    if (type === "pond") { drawPondTopBack(cx, cy, R); return; }
    if (type === "cave") {
        fill(12, 10, 13);
        ellipse(cx, cy, R * 3.4, R * 3.4);
        // eyes in the dark instead of a crowd
        for (i = 0; i < crowd.length; i++) {
            var cr = crowd[i];
            if (Math.sin(frameCount * 0.04 + cr.ph * 3) < -0.6) { continue; }
            var er = R * (1.38 + cr.row * 0.12);
            var ex = cx + Math.cos(cr.ang) * er;
            var ey = cy + Math.sin(cr.ang) * er;
            var ec = i % 3 === 0 ? [255, 80, 60] : [255, 220, 100];
            fill(ec[0], ec[1], ec[2], 160 + pitHype * 90);
            ellipse(ex - 2.5, ey, 2.6, 2.6);
            ellipse(ex + 2.5, ey, 2.6, 2.6);
        }
        // boulder walls
        for (i = 0; i < caveRocks.length; i++) {
            var rk = caveRocks[i];
            var rx = cx + Math.cos(rk.ang) * R * rk.r;
            var ry = cy + Math.sin(rk.ang) * R * rk.r;
            fill(70 + rk.shade, 68 + rk.shade, 74 + rk.shade);
            ellipse(rx, ry, R * 0.26 * rk.s, R * 0.22 * rk.s);
            fill(100 + rk.shade, 98 + rk.shade, 104 + rk.shade);
            ellipse(rx - R * 0.03 * rk.s, ry - R * 0.03 * rk.s, R * 0.12 * rk.s, R * 0.09 * rk.s);
        }
        // stone floor
        for (i = 0; i < 9; i++) {
            f = i / 8;
            fill(lerp(34, 74, f), lerp(32, 70, f), lerp(40, 80, f));
            ellipse(cx, cy, R * 2.1 * (1 - f * 0.55), R * 2.1 * (1 - f * 0.55));
        }
        // cracks
        stroke(25, 22, 28, 160);
        strokeWeight(2);
        for (i = 0; i < 7; i++) {
            var ca = i * 0.9 + 0.3;
            var r0 = R * 0.2;
            var px = cx + Math.cos(ca) * r0;
            var py = cy + Math.sin(ca) * r0;
