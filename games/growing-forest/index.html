// Clicking (or dragging on) the mini-map jumps the view there
var jumpMini = function() {
    var m = miniRect();
    if (!miniLocked) {
        miniLockStart = miniStart();
        miniLocked = true;
    }
    var wx = miniLockStart + (mouseX - m.x - 4) / (m.w - 8) * miniSpan();
    camX = constrain(wx - W / 2, 0, WW - W);
};

mousePressed = function() {
    if (pitView) {
        dragMode = "";
        dragMoved = 0;
        return;
    }
    if (mouseButton === RIGHT) {
        dragMode = "right";
        var picked = treeUnderMouse();
        statsTree = picked && picked !== statsTree ? picked : null;
        return;
    }
    var m = miniRect();
    dragMoved = 0;
    dragStartX = mouseX;
    dragStartCam = camX;
    // The info panel sits on top of the mini-map if they overlap
    var overPanel = showInfo && mouseX < 265 && mouseY < 178;
    if (!overPanel && mouseX >= m.x && mouseX <= m.x + m.w && mouseY >= m.y && mouseY <= m.y + m.h) {
        dragMode = "mini";
        jumpMini();
    } else if (mouseY < H - 68) {
        dragMode = "pan";
    } else {
        dragMode = "";
    }
};

mouseDragged = function() {
    dragMoved = Math.max(dragMoved, Math.abs(mouseX - dragStartX));
    if (dragMode === "pan") {
        camX = constrain(dragStartCam - (mouseX - dragStartX), 0, WW - W);
    } else if (dragMode === "mini") {
        jumpMini();
    }
};

mouseClicked = function() {
    // Any click leaves the top-down pit view
    if (pitView) {
        pitView = false;
        snd("door", null, 0.6);
        return;
    }
    // A drag (or a right-click) isn't a planting click
    if (dragMode === "mini" || dragMode === "right" || dragMoved > 6) {
        return;
    }
    // Clicking on the stats box doesn't plant anything
    if (statsBox && mouseX >= statsBox.x && mouseX <= statsBox.x + statsBox.w &&
        mouseY >= statsBox.y && mouseY <= statsBox.y + statsBox.h) {
        return;
    }
    // Close / open the info panel
    var tb = infoToggleRect();
    if (mouseX >= tb.x && mouseX <= tb.x + tb.w && mouseY >= tb.y && mouseY <= tb.y + tb.h) {
        showInfo = !showInfo;
        return;
    }
    // picking the snake to sacrifice
    if (placeTool && placeTool.kind === "choose") {
        for (var ci = 0; ci < snakeRoster.length; ci++) {
            var cr = chooserSlot(ci);
            if (mouseX >= cr.x && mouseX <= cr.x + cr.w && mouseY >= cr.y && mouseY <= cr.y + cr.h) {
                placeTool = { kind: "pit", arena: "snake", who: snakeRoster[ci] };
                showToast("Now click the ground to turn " + snakeRoster[ci].name + " into the FIGHT SNAKE");
                return;
            }
        }
        var acr = chooserSlot(snakeRoster.length);
        if (mouseX >= acr.x && mouseX <= acr.x + acr.w && mouseY >= acr.y && mouseY <= acr.y + acr.h) {
            snd("click");
            if (!anaFightUnlocked) {
                showToast("Locked: see the Anaconda 10 times (" + anaSeenCount + " / 10) - or type 'anny'");
            } else {
                placeTool = { kind: "pit", arena: "snake", who: ANA_FS };
                showToast("Now click the ground to make THE ANACONDA the Fight Snake");
            }
            return;
        }
    }
    // Bait dots and the arena buttons
    var slot = baitSlotAt(mouseX, mouseY);
    if (slot) { snd("click"); }
    if (slot && slot.kind === "pit") {
        if (!arenaUnlocked(slot.arena)) {
            showToast(arenaLockHint(slot.arena));
        } else if (toolIs(slot)) {
            placeTool = null;
            showToast("Back to planting " + selected.name);
        } else if (slot.arena === "snake") {
            placeTool = { kind: "choose", arena: "snake", who: null };
            showToast("Choose which snake to sacrifice");
        } else {
            placeTool = { kind: "pit", arena: slot.arena, who: null };
            showToast(slot.arena === "tree" ? "Click one of your trees to carve the Fight Knot into it" :
                      "Click the ground to build the " + arenaName(slot.arena));
        }
        return;
    }
    if (slot) {
        if (toolIs(slot)) {
            placeTool = null;
            showToast("Back to planting " + selected.name);
        } else {
            placeTool = { kind: slot.kind, who: slot.who };
            if (slot.kind === "pit") {
                showToast("Click the ground to " + (fightPit ? "move" : "build") + " the Fight Pit");
            } else if (slot.kind === "ana") {
                showToast("Click the ground to place the ANACONDA bait");
            } else {
                showToast("Click the ground to place " + slot.who.name + "'s bait");
            }
        }
        return;
    }
    for (var i = 0; i < speciesList.length; i++) {
        var r = buttonRect(i);
        if (mouseX >= r.x && mouseX <= r.x + r.w && mouseY >= r.y && mouseY <= r.y + r.h) {
            selected = speciesList[i];
            snd("click");
            placeTool = null;
            showToast("Now planting: " + selected.name);
            return;
        }
    }
    if (placeTool) {
        if (placeTool.kind === "choose") {
            showToast("Pick a snake to sacrifice first (or click SNAKE again to cancel)");
        } else if (placeTool.kind === "pit" && placeTool.arena === "tree") {
            var ptr = mouseInScene() ? treeUnderMouse() : null;
            if (ptr && ptr.state === "alive" && ptr.mature > 0.25) {
                placeTreeArena(ptr);
            } else if (ptr) {
                showToast("That tree is too small or not alive - pick a bigger living tree");
            } else {
                showToast("Click on one of your trees to carve the Fight Knot into it");
            }
        } else if (mouseInScene() && nearGround()) {
            placeAt(mouseX + camX);
        }
        return;
    }
    // Click the pit to watch it from above
    if (mouseInScene() && overPit()) {
        pitView = true;
        snd("door");
        if (frameCount - shrewT > 120) {
            shrewSay(pickLine(["Welcome back to the {FP}, viewer!",
                               "Oh! A viewer! Hi! Welcome to the {P}!",
                               "You're watching the {FP}, live! I'm Shrewbert Snoutley!",
                               "Pull up a rock, viewer! The best seat in the forest!"]), 1);
        }
        return;
    }
    if (mouseInScene() && nearGround()) {
        plantAt(mouseX + camX);
    }
};

// Is the player in the middle of typing a secret word?
var typingSecret = function() {
    var words = ["secret", "fight", "anaconda", "bait", "snake", "tree", "cave", "anny", "death", "repete", "flesh", "pond", "rain", "zap", "dry", "clear"];
    for (var w = 0; w < words.length; w++) {
        for (var k = 2; k <= words[w].length; k++) {
            var part = words[w].substring(0, k);
            if (typedKeys.slice(-k) === part) { return true; }
        }
    }
    return false;
};

keyPressed = function() {
    if (keyCode === 27) {
        pitView = false;
        placeTool = null;
    }
    var ch = String(key.toString()).toLowerCase();
    if (ch.length === 1 && ch >= "a" && ch <= "z") {
        typedKeys = (typedKeys + ch).slice(-12);
        var busy = typingSecret();
        if (typedKeys.slice(-6) === "secret" && !mysticUnlocked) {
            mysticUnlocked = true;
            speciesList.push(MYSTIC);
            unlockFrame = frameCount;
            snd("unlock");
        } else if (typedKeys.slice(-5) === "fight") {
            if (pitUnlocked) {
                showToast("The Fight Pit is already unlocked!");
            } else {
                unlockPit();
            }
        } else if (typedKeys.slice(-4) === "rain") {
            setWeather("rain", DAY * 1.2);
        } else if (typedKeys.slice(-3) === "zap") {
            setWeather("storm", DAY * 0.7);
        } else if (typedKeys.slice(-3) === "dry") {
            setWeather("drought", DAY * 3);
        } else if (typedKeys.slice(-5) === "clear") {
            setWeather("clear", DAY * 2);
        } else if (typedKeys.slice(-4) === "pond") {
            if (pondUnlocked) { showToast("The Fight Pond is already unlocked!"); } else { unlockArena("pond"); }
        } else if (typedKeys.slice(-5) === "flesh") {
            if (fleshUnlocked) { showToast("The Flesh Pit is already unlocked!"); } else { unlockArena("flesh"); }
        } else if (typedKeys.slice(-6) === "repete") {
            repeteLaser();
        } else if (typedKeys.slice(-4) === "anny") {
            if (anaFightUnlocked) { showToast("The Anaconda Fight Snake is already unlocked!"); } else { unlockAnaFight(""); }
        } else if (typedKeys.slice(-5) === "death") {
            if (deathUnlocked) { showToast("The Pit of DEATH is already unlocked!"); } else { unlockArena("death"); }
        } else if (typedKeys.slice(-5) === "snake") {
            if (snakeArenaUnlocked) { showToast("The Fight SNAKE is already unlocked!"); } else { unlockArena("snake"); }
        } else if (typedKeys.slice(-4) === "tree") {
            if (treeArenaUnlocked) { showToast("The Fight Tree is already unlocked!"); } else { unlockArena("tree"); }
        } else if (typedKeys.slice(-4) === "cave") {
            if (caveUnlocked) { showToast("The Fight Cave is already unlocked!"); } else { unlockArena("cave"); }
        } else if (typedKeys.slice(-4) === "bait") {
            if (baitUnlocked) {
                showToast("Bait is already unlocked!");
            } else {
                unlockBait();
            }
        } else if (typedKeys.slice(-8) === "anaconda") {
            if (anaBaitUnlocked) {
                showToast("Anaconda bait is already unlocked!");
            } else {
                anaBaitUnlocked = true;
                showToast("ANACONDA BAIT unlocked! It's next to the snake bait dots.");
            }
        } else if (busy) {
            // still typing a secret word - don't trigger single-letter keys
            ch = "";
        } else if (ch === "i") {
            showInfo = !showInfo;
        } else if (ch === "l") {
            showRoster = !showRoster;
        } else if (ch === "n") {
            treeX = camX + W / 2;
            init();
            showToast("A new " + selected.name + " forest");
        }
    }

    if (keyCode === 32) {
        speedIndex = (speedIndex + 1) % speeds.length;
        speed = speeds[speedIndex];
    }
    if (keyCode >= 49 && keyCode < 49 + speciesList.length) {
        selected = speciesList[keyCode - 49];
        placeTool = null;
        showToast("Now planting: " + selected.name);
    }
};

// ================= SAFETY CHECK =================

var fixSpecies = function() {
    var fb = selected.noSprout ? OAK : selected;
    var i;
    for (i = 0; i < trees.length; i++) {
        if (!trees[i].sp) { trees[i].sp = fb; }
    }
    for (i = 0; i < seedlings.length; i++) {
        if (!seedlings[i].sp) { seedlings[i].sp = fb; }
    }
    for (i = 0; i < groundFood.length; i++) {
        if (!groundFood[i].sp) { groundFood[i].sp = fb; }
    }
    for (i = 0; i < falling.length; i++) {
        if (falling[i].type === 3 && !falling[i].sp) { falling[i].sp = fb; }
    }
};

// ================= MAIN LOOP =================

setupScene();
init();

draw = function() {
    var st = seasonPos();
    var year = Math.floor(t / YEAR);
    var sn = snowAmount(st);
    var wind = Math.sin(t * 0.004) * 0.6 + Math.sin(t * 0.017) * 0.25 + Math.sin(t * 0.051) * 0.1;
    var ti, tr;

    // Arrow keys scroll too
    if (keyIsPressed && keyCode === LEFT) {
        camX -= 12 * S;
    }
    if (keyIsPressed && keyCode === RIGHT) {
        camX += 12 * S;
    }
    camX = constrain(camX, 0, WW - W);

    fixSpecies();
    updateLight();

    for (ti = 0; ti < trees.length; ti++) {
        updateTreeState(trees[ti], st, year);
    }
    updateWeather();
    ensureMain();

    // ---- Screen space: sky and distant hills ----
    drawSky(st);
    drawClouds(sn);
    drawHills(st);
    drawWeatherSky();

    // ---- World space: everything in the forest ----
    pushMatrix();
    translate(-camX, 0);

    drawSoil();
    for (ti = 0; ti < trees.length; ti++) {
        tr = trees[ti];
        if (tr.state === "dust" && t - tr.deadT > YEAR * 0.2) { continue; }
        if (!inView(tr.x, 160 * S)) { continue; }
        useTree(tr);
        beginTree(tr, false);
        drawRoots();
        popMatrix();
    }
    drawWorm();

    // Fallen logs
    for (ti = 0; ti < trees.length; ti++) {
        tr = trees[ti];
        if (tr.state !== "log") { continue; }
        if (t - tr.logT >= YEAR * 1.5) {
            tr.done = true;
        } else if (inView(tr.x + tr.fallDir * tr.logLen / 2, tr.logLen / 2 + 40)) {
            useTree(tr);
            drawLog(tr);
        }
    }

    // Standing trees: fully drawn when on screen; off-screen trees only
    // run their fruit (so they keep spreading seeds while you're away)
    var grown = 0;
    var leafCount = 0;
    for (ti = 0; ti < trees.length; ti++) {
        tr = trees[ti];
        if (tr.state === "log") { continue; }
        useTree(tr);
        beginTree(tr, true);
        if (inView(tr.x, 320 * S * tr.sc + 60)) {
            var g = drawTree(sn);
            var lc = drawLeaves(st, year, wind, sn);
            drawBlossoms(st, year);
            drawFruits(st, wind, year);
            if (tr.hive) {
                drawHive(tr.hive);
            }
            tr.shownGrown = g;
            tr.shownLeaves = lc;
            if (tr === mainTree) {
                grown = g;
                leafCount = lc;
            }
        } else {
            drawFruits(st, wind, year);
        }
        popMatrix();
    }

    for (ti = trees.length - 1; ti >= 0; ti--) {
        if (trees[ti].done) {
            trees.splice(ti, 1);
        }
    }
    useTree(mainTree);
    growFrac = mainTree.branches.length > 0 ? grown / mainTree.branches.length : 0;

    drawLitter(st);
    drawSticks();
    drawGroundFood();
    drawGroundHives();
    drawSeedlings(st, wind);
    drawSnowGround(sn);
    drawFlowers(st, wind, sn);
    drawGrass(st, wind, sn);
    drawDroughtGround();

    updateGroundFood();
    updateSeedlings();
    spawnWildlife(st, sn);
    for (var s = 0; s < speed; s++) {
        spawnSnow(st);
        updateFalling(wind);
        updateAnimals(year);
    }
    updateSparkles();
    updateAnaPit();
    updateMerge();

    drawFightPit();
    drawBaits();
    drawFalling();
    drawAnimals();
    drawAnaLaserSide();
    drawFleshTrialSide();
    drawPondFront();
    drawHiveBees(st);
    drawBees(st);
    drawButterflies(st);

    popMatrix();

    // ---- Night darkness (screen), then glowing things (world) ----
    drawNightShade();

    pushMatrix();
    translate(-camX, 0);
    drawFireflies(st);
    drawSparkles();
    drawNightGlows();
    drawFires();
    drawRainAndBolts(wind);
    popMatrix();
    drawFlash();

    // ---- Interface ----
    drawButtons();
    drawBaitBar();
    drawMinimap();
    drawWeatherBadge();
    drawUI(st, year, leafCount, grown);
    drawBanner();

    t += speed;
};

}

}
}

startForest(window, document, document.getElementById("forest"));
document.getElementById("forest").focus();
</script>
