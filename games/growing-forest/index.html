    triangle(kx + 4 * S, GROUND - 54 * S, kx + 13 * S, GROUND - 67 * S, kx + 2 * S, GROUND - 58 * S);
    jagShape(kx, GROUND - 51 * S, 16 * S, 15 * S, 800, false, 0);
    flFill(BONE);
    triangle(kx - 4 * S, GROUND - 54.5 * S, kx - 11.5 * S, GROUND - 65.5 * S, kx - 2.5 * S, GROUND - 57.5 * S);
    triangle(kx + 4 * S, GROUND - 54.5 * S, kx + 11.5 * S, GROUND - 65.5 * S, kx + 2.5 * S, GROUND - 57.5 * S);
    jagShape(kx, GROUND - 51 * S, 13 * S, 12 * S, 800, false, 0);
    flFill(RT_OUT);
    triangle(kx - 5 * S, GROUND - 53 * S, kx - 1 * S, GROUND - 52 * S, kx - 3 * S, GROUND - 49 * S);
    triangle(kx + 5 * S, GROUND - 53 * S, kx + 1 * S, GROUND - 52 * S, kx + 3 * S, GROUND - 49 * S);
    fill(RT_ORANGE[0], RT_ORANGE[1], RT_ORANGE[2], 150 + beat * 105);
    ellipse(kx - 3 * S, GROUND - 51.5 * S, 1.4 * S, 1.4 * S);
    ellipse(kx + 3 * S, GROUND - 51.5 * S, 1.4 * S, 1.4 * S);
    drawBone(x - hw * 0.5, GROUND + 3 * S, x - hw * 0.28, GROUND + 1 * S, 2.6 * S);
    drawBone(x + hw * 0.22, GROUND + 2 * S, x + hw * 0.48, GROUND + 4 * S, 2.6 * S);
};

// ================= THE FLESH PIT'S TRIAL =================
// Only ONE snake goes in at a time. The moment it does, the pit wakes up and
// attacks it: 5 waves of flesh creatures. Survive them all and the pit spits
// you out with +6 levels. Fail... and the pit eats you. Everyone else waits outside.
//   flesh snakes   - crawl in and bite
//   flesh ticks    - tiny, fast, come in swarms and nibble
//   pus spitters   - fleshy mounds that lob glowing goo from across the pit
//   gazers         - giant eyes on stalks that charge up and fire a beam
//   tentacles      - rise from the walls, wind up, and SLAM
//   THE FLESH SERPENT - the final boss
var TRIAL_WAVES = 5;
var fleshWaitSpot = function(a) {
    var side = a.x < fightPit.x ? -1 : 1;
    var idx = a.who ? snakeRoster.indexOf(a.who) : 5;
    return constrain(fightPit.x + side * (pitHalf() + (32 + (idx % 4) * 14) * S), 10, WW - 10);
};
var FLESH_KINDS = {
    snake:   { hp: function(v) { return 30 + v * 2.6; },  spd: 0.0055, reach: 0.13, cd: 72, dmg: function(v) { return 4.6 + v * 0.33; } },
    boss:    { hp: function(v) { return 170 + v * 9; },   spd: 0.0035, reach: 0.2,  cd: 52, dmg: function(v) { return 14 + v * 0.52; } },
    tick:    { hp: function(v) { return 9 + v * 0.8; },   spd: 0.010,  reach: 0.08, cd: 34, dmg: function(v) { return 1.6 + v * 0.11; } },
    spitter: { hp: function(v) { return 38 + v * 3; },    spd: 0,      reach: 2,    cd: 115, dmg: function(v) { return 5.5 + v * 0.3; } },
    gazer:   { hp: function(v) { return 55 + v * 4; },    spd: 0,      reach: 2,    cd: 200, dmg: function(v) { return 4 + v * 0.22; } }
};
var spawnFlesh = function(tr, kind) {
    var a = random(TWO_PI);
    var r = kind === "spitter" || kind === "gazer" ? random(0.55, 0.75) : 0.95;
    var K = FLESH_KINDS[kind];
    tr.enemies.push({
        kind: kind, big: kind === "boss",
        x: Math.cos(a) * r, y: Math.sin(a) * r,
        hp: K.hp(tr.s.evo), maxHp: K.hp(tr.s.evo),
        ph: random(TWO_PI), cd: random(40, 100), born: 0, hitT: 0, lunge: 0, charge: 0, beam: 0
    });
};
var spawnFleshTentacle = function(tr) {
    tr.tents.push({
        ang: random(TWO_PI), ext: 0, st: "rise", t: 60,
        hp: 40 + tr.s.evo * 3, maxHp: 40 + tr.s.evo * 3, hitT: 0
    });
};
var WAVE_PLAN = [
    { snake: 2, tick: 4 },
    { snake: 3, spitter: 1 },
    { snake: 2, tick: 6, tent: 2 },
    { snake: 2, spitter: 2, gazer: 1, tent: 1 },
    { boss: 1, gazer: 1, tick: 4, tent: 2 }
];
var spawnWave = function(tr) {
    tr.wave++;
    var plan = WAVE_PLAN[tr.wave - 1];
    for (var k in plan) {
        for (var i = 0; i < plan[k]; i++) {
            if (k === "tent") { spawnFleshTentacle(tr); } else { spawnFlesh(tr, k); }
        }
    }
    snd("squish", fightPit.x);
    snd(tr.wave === TRIAL_WAVES ? "anaconda" : "hiss", fightPit.x, tr.wave === TRIAL_WAVES ? 0.6 : 0.8);
    pitEvent("trialwave", tr.s, null);
    sideWord(tr.wave === TRIAL_WAVES ? "THE FLESH SERPENT!" : "WAVE " + tr.wave + "!", tr.s, [226, 62, 160]);
};
var trialScreen = function(ax, ay) {
    var g = topGeom();
    return { x: g.cx + ax * g.R, y: g.cy + ay * g.R };
};
var trialPop = function(text, ax, ay, col, sz) {
    var p = trialScreen(ax, ay);
    pitPops.push({ kind: "word", text: text, x: p.x, y: p.y - 30, f: frameCount,
                   col: col || [255, 120, 200], rot: random(-0.25, 0.25), sz: sz || 24 });
};
var startTrial = function(s) {
    fightPit.trial = { s: s, wave: 0, enemies: [], tents: [], shots: [], pending: [], pause: 90, t: 0, atkCD: 40 };
    s.trialing = true;
    s.foe = null;
    s.prey = null;
    s.state = "coil";
    s.wrapT = 0;
    s.poison = 0;
    s.maxHp = s.hp = (s.ana ? 900 : 100 + s.evo * 12) * 1.25;
    s.hpShow = s.hpGhost = 1;
    s.trialAim = null;
    snd("door", s.x);
    snd("squish", s.x);
    pitEvent("trialstart", s, null);
    snakeMsg = s.name + " has entered the FLESH PIT alone... and the pit is waking up!";
};
var endTrialCommon = function(tr) {
    tr.s.trialing = false;
    tr.s.trialMoveT = 0;
    fightPit.trial = null;
    fightPit.trialCool = 220;
};
var winTrial = function(tr) {
    var s = tr.s;
    endTrialCommon(tr);
    var gain = s.ana ? 0 : Math.min(30, s.evo + 6) - s.evo;
    s.evo += gain;
    if (s.who) {
        s.who.evo = s.evo;
        s.who.best = Math.max(s.who.best, s.evo);
        s.who.wins++;
    }
    s.fleshWins = (s.fleshWins || 0) + 1;
    s.lastGift = gain;
    s.state = "evolve";
    s.timer = 100;
    s.lingerT = 1500;
    s.cool = 300;
    snd(s.evo >= 30 && gain > 0 ? "king" : "levelup", s.x);
    snd("cheer", s.x, 0.7);
    snakeBurst(s.x, GROUND - 16 * S * s.size, 30, [255, 150, 220], 2);
    sideWord("SURVIVED! +" + gain + " LEVELS", s, [255, 215, 90]);
    pitEvent("trialwin", s, null);
    snakeMsg = s.name + " SURVIVED THE FLESH PIT! (+" + gain + " levels, now Lv " + s.evo + ")";
};
var loseTrial = function(tr) {
    var s = tr.s;
    endTrialCommon(tr);
    s.hp = 0;
    s.state = "eaten";
    s.eater = null;
    s.timer = 70;
    s.cool = 99999;
    s.fleshEaten = true;
    snd("chomp", s.x);
    snd("gulp", s.x);
    snakeBurst(s.x, GROUND - 12 * S, 26, [150, 20, 60], 1.8);
    sawDeath(s.x);
    pitEvent("triallose", s, null);
    snakeMsg = "The Flesh Pit swallowed " + s.name + " (reached wave " + tr.wave + ")";
};

var tentTip = function(tn) {
    var r = 1.0 - tn.ext;
    return { x: Math.cos(tn.ang) * r, y: Math.sin(tn.ang) * r };
};
var hurtChallenger = function(c, dmg, word, col, shake) {
    dmg *= 0.86;
    if (c.ana) { dmg *= 2.5; }
    c.hp -= dmg;
    c.recoil = 8;
    if (word) { trialPop(word, 0, 0, col || [255, 90, 140], 22); }
    pitShake = Math.min(18, pitShake + (shake || 3));
};

// the challenger attacks: pick a move, show it, and hit when the attack lands
var challengerAttack = function(tr, c) {
    var targets = [];
    var i;
    for (i = 0; i < tr.enemies.length; i++) {
        if (tr.enemies[i].born > 15) { targets.push({ o: tr.enemies[i], x: tr.enemies[i].x, y: tr.enemies[i].y }); }
    }
    for (i = 0; i < tr.tents.length; i++) {
        var tp = tentTip(tr.tents[i]);
        targets.push({ o: tr.tents[i], x: tp.x, y: tp.y });
    }
    if (targets.length === 0) { return; }
    targets.sort(function(p, q) { return dist(p.x, p.y, 0, 0) - dist(q.x, q.y, 0, 0); });
    var mv = snakeMoves(c);
    var t0 = targets[0];
    var base = c.ana ? 30 : 8 + c.evo * 1.1;
    var hits = [];
    var delay = 6;
    if (mv === "whip") {
        for (i = 0; i < targets.length; i++) { if (dist(targets[i].x, targets[i].y, 0, 0) < 0.35) { hits.push([targets[i], 0.8]); } }
        if (hits.length === 0) { hits.push([t0, 0.8]); }
        delay = 5;
        snd("whoosh", c.x);
    } else if (mv === "flame") {
        for (i = 0; i < targets.length; i++) {
            var da = Math.abs(Math.atan2(targets[i].y, targets[i].x) - Math.atan2(t0.y, t0.x));
            if (da > PI) { da = TWO_PI - da; }
            if (da < 0.6) { hits.push([targets[i], 0.9]); }
        }
        delay = 8;
        snd("flame", c.x);
    } else if (mv === "spit") {
        hits.push([t0, 1.0]);
        delay = 14;
        snd("spit", c.x);
    } else if (mv === "wrap") {
        hits.push([t0, 1.7]);
        delay = 10;
        snd("squeeze", c.x);
    } else {
        hits.push([t0, 1.0]);
        delay = 6;
    }
    c.trialMove = mv;
    c.trialMoveT = 16;
    c.trialAim = { x: t0.x, y: t0.y };
    // the animation
    if (pitView && c.topX !== undefined) {
        var tp2 = trialScreen(t0.x, t0.y);
        var dir = Math.atan2(tp2.y - c.topY, tp2.x - c.topX);
        if (mv === "whip") {
            pitPops.push({ kind: "swoosh", x: c.topX, y: c.topY, f: frameCount, dir: dir });
        } else if (mv === "spit") {
            pitPops.push({ kind: "spit", x: c.topX, y: c.topY, tx: tp2.x, ty: tp2.y, f: frameCount });
        } else if (mv === "flame") {
            pitPops.push({ kind: "fire", x: c.topX, y: c.topY, tx: tp2.x, ty: tp2.y, f: frameCount, seed: random(100) });
        } else if (mv === "wrap") {
            pitPops.push({ kind: "coil", x: tp2.x, y: tp2.y, f: frameCount, col: snakeLook(c).body });
        } else {
            pitPops.push({ kind: "jaws", x: tp2.x, y: tp2.y, f: frameCount + 3, dir: dir });
        }
        trialPop(moveNames[mv] + "!", t0.x, t0.y - 0.08, [255, 215, 90], 20);
    }
    for (i = 0; i < hits.length; i++) {
        tr.pending.push({ o: hits[i][0].o, dmg: base * hits[i][1] * random(0.8, 1.2), t: delay, mv: mv });
    }
};

// runs every game step
var fleshTrial = function() {
    if (!arenaIs("flesh")) { return; }
    var i, s, d, e, K;
    var tr = fightPit.trial;
    // everyone except the challenger waits outside
    for (i = 0; i < animals.length; i++) {
        s = animals[i];
        if (s.type !== "snake" || s.state === "eaten" || s.trialing) { continue; }
        if (inPitX(s.x) && (tr || s.lingerT > 0) && s.state !== "evolve" && s.state !== "eat") {
            s.state = "slither";
            s.foe = null;
            s.prey = null;
            s.tx = fleshWaitSpot(s);
        }
    }
    if (!tr) {
        if (fightPit.trialCool > 0) { fightPit.trialCool--; return; }
        for (i = 0; i < animals.length; i++) {
            s = animals[i];
            if (s.type === "snake" && inPitX(s.x) && !(s.lingerT > 0) && !s.grabbed && !s.merging && !s.morphing &&
                (s.state === "slither" || s.state === "coil" || s.state === "hunt")) {
                startTrial(s);
                break;
            }
        }
        return;
    }
    var c = tr.s;
    if (animals.indexOf(c) < 0 || c.state === "eaten") {
        fightPit.trial = null;
        fightPit.trialCool = 200;
        return;
    }
    c.x = lerp(c.x, fightPit.x, 0.05);
    c.pitY = lerp(c.pitY || 0, 0, 0.05);
    c.state = "coil";
    c.timer = 999;
    c.cool = 99999;
    if (c.recoil > 0) { c.recoil--; }
    tr.t++;
    // the next wave
    if (tr.enemies.length === 0 && tr.tents.length === 0 && tr.shots.length === 0) {
        if (tr.pause > 0) {
            tr.pause--;
        } else if (tr.wave >= TRIAL_WAVES) {
            winTrial(tr);
            return;
        } else {
            if (tr.wave > 0) {
                c.hp = Math.min(c.maxHp, c.hp + c.maxHp * 0.15);
                sideWord("+HP", c, [140, 230, 120]);
            }
            spawnWave(tr);
            tr.pause = 100;
        }
    }
    // creatures
    for (i = 0; i < tr.enemies.length; i++) {
        e = tr.enemies[i];
        K = FLESH_KINDS[e.kind];
        e.born++;
        if (e.hitT > 0) { e.hitT--; }
        if (e.lunge > 0) { e.lunge--; }
        e.ph += e.kind === "tick" ? 0.45 : 0.2;
        d = dist(e.x, e.y, 0, 0);
        if (e.born < 20) { continue; }
        if (K.spd > 0 && d > K.reach) {
            var ang = Math.atan2(-e.y, -e.x) + Math.sin(e.ph * 0.4) * (e.kind === "tick" ? 0.9 : 0.5);
            e.x += Math.cos(ang) * K.spd;
            e.y += Math.sin(ang) * K.spd;
            continue;
        }
        e.cd--;
        if (e.kind === "gazer") {
            // stare... charge... BEAM
            if (e.cd <= 0 && e.charge === 0 && e.beam === 0) { e.charge = 70; snd("charge", c.x, 0.5); }
            if (e.charge > 0) {
                e.charge--;
                if (e.charge === 0) { e.beam = 36; snd("laser", c.x, 0.5); }
            } else if (e.beam > 0) {
                e.beam--;
                if (e.beam % 12 === 0) { hurtChallenger(c, K.dmg(c.evo), "ZAP!", [255, 120, 230], 4); }
                if (e.beam === 0) { e.cd = K.cd; }
            }
        } else if (e.kind === "spitter") {
            if (e.cd <= 0) {
                e.cd = K.cd;
                e.lunge = 14;
                tr.shots.push({ x: e.x, y: e.y, sx: e.x, sy: e.y, t: 0, max: 28, dmg: K.dmg(c.evo) });
                snd("spit", c.x, 0.6);
            }
        } else if (e.cd <= 0) {
            e.cd = K.cd;
            e.lunge = 10;
            hurtChallenger(c, K.dmg(c.evo), e.kind === "boss" ? "CHOMP!" : (e.kind === "tick" ? "nibble" : pickLine(["BITE!", "NOM!", "SNAP!"])),
                           [255, 90, 140], e.kind === "boss" ? 8 : 2);
            snd(e.kind === "tick" ? "squish" : "bite", c.x, e.kind === "tick" ? 0.5 : 0.8);
            if (pitView && e.kind !== "tick") {
                var ep = trialScreen(e.x, e.y);
                pitPops.push({ kind: "jaws", x: c.topX, y: c.topY, f: frameCount, dir: Math.atan2(c.topY - ep.y, c.topX - ep.x), col: [226, 102, 128] });
            }
        }
    }
    // flying goo
    for (i = tr.shots.length - 1; i >= 0; i--) {
        var sh = tr.shots[i];
        sh.t++;
        var u = sh.t / sh.max;
        sh.x = lerp(sh.sx, 0, u);
        sh.y = lerp(sh.sy, 0, u);
        if (sh.t >= sh.max) {
            hurtChallenger(c, sh.dmg, "SPLORT!", [236, 84, 214], 4);
            snd("splat", c.x, 0.7);
            tr.shots.splice(i, 1);
        }
    }
    // tentacles rise, wind up and SLAM
    for (i = 0; i < tr.tents.length; i++) {
        var tn = tr.tents[i];
        if (tn.hitT > 0) { tn.hitT--; }
        tn.t--;
        if (tn.st === "rise") {
            tn.ext = lerp(tn.ext, 0.55, 0.05);
            if (tn.t <= 0) { tn.st = "wind"; tn.t = 40; }
        } else if (tn.st === "wind") {
            tn.ext = lerp(tn.ext, 0.4, 0.08);
            if (tn.t <= 0) { tn.st = "slam"; tn.t = 8; snd("whoosh", c.x, 0.7); }
        } else if (tn.st === "slam") {
            tn.ext = lerp(tn.ext, 0.97, 0.35);
            if (tn.t <= 0) {
                hurtChallenger(c, 9.5 + c.evo * 0.4, "SLAM!", [226, 62, 160], 7);
                snd("hit", c.x);
                tn.st = "back";
                tn.t = 50;
            }
        } else if (tn.st === "back") {
            tn.ext = lerp(tn.ext, 0.55, 0.06);
            if (tn.t <= 0) { tn.st = "wind"; tn.t = 70 + random(40); tn.ang += random(-0.5, 0.5); }
        }
    }
    // the challenger fights back
    tr.atkCD--;
    if (tr.atkCD <= 0) {
        challengerAttack(tr, c);
        tr.atkCD = Math.max(18, 52 - c.evo * 1.1) * random(0.8, 1.2);
    }
    if (c.trialMoveT > 0) { c.trialMoveT--; }
    // attacks land
    for (i = tr.pending.length - 1; i >= 0; i--) {
        var pd = tr.pending[i];
        pd.t--;
        if (pd.t <= 0) {
            pd.o.hp -= pd.dmg;
            pd.o.hitT = 10;
            if (pd.mv === "bite") { snd("bite", c.x, 0.8); }
            if (pd.mv === "spit") { snd("splat", c.x, 0.6); }
            tr.pending.splice(i, 1);
        }
    }
    // the dead
    for (i = tr.enemies.length - 1; i >= 0; i--) {
        if (tr.enemies[i].hp <= 0) {
            var de = tr.enemies[i];
            trialPop(de.big ? "THE SERPENT FALLS!" : (de.kind === "tick" ? "squish" : (de.kind === "gazer" ? "POP!" : "SPLAT!")), de.x, de.y,
                     [255, 120, 180], de.big ? 30 : (de.kind === "tick" ? 16 : 24));
            snd(de.kind === "tick" ? "squish" : "splat", c.x);
            snakeBurst(trapWX(de.x), GROUND - 6 * S, de.big ? 30 : 12, [150, 20, 60], 1.4);
            tr.enemies.splice(i, 1);
            if (de.big) { pitEvent("trialboss", c, null); }
        }
    }
    for (i = tr.tents.length - 1; i >= 0; i--) {
        if (tr.tents[i].hp <= 0) {
            var dtp = tentTip(tr.tents[i]);
            trialPop("SEVERED!", dtp.x, dtp.y, [255, 120, 180], 24);
            snd("splat", c.x);
            tr.tents.splice(i, 1);
        }
    }
    // clean up hits aimed at things that already died
    for (i = tr.pending.length - 1; i >= 0; i--) {
        if (tr.enemies.indexOf(tr.pending[i].o) < 0 && tr.tents.indexOf(tr.pending[i].o) < 0) { tr.pending.splice(i, 1); }
    }
    if (c.hp <= 0) { loseTrial(tr); }
};

// ---------- drawing ----------
var drawFleshSnakeTop = function(e, cx, cy, R) {
    var px = cx + e.x * R;
    var py = cy + e.y * R;
    var ang = Math.atan2(-e.y, -e.x);
    var k = (e.big ? 2.2 : 1) * R / 92;
    var grow = Math.min(1, e.born / 25);
    var lunge = e.lunge > 0 ? Math.sin(e.lunge / 10 * PI) * 10 * k : 0;
    var n = e.big ? 12 : 8;
    var i;
    if (e.born < 25) {
        flFill(RT_GOO);
        jagShape(px, py, 30 * k, 22 * k, 7, true, 0);
    }
    fill(RT_ORANGE[0], RT_ORANGE[1], RT_ORANGE[2], 45);
    ellipse(px - Math.cos(ang) * n * 3 * k, py - Math.sin(ang) * n * 3 * k, n * 9 * k, n * 7 * k);
    for (i = n - 1; i >= 0; i--) {
        var f = i / n;
        var wig = Math.sin(e.ph - i * 0.7) * 5 * k;
        var sx = px - Math.cos(ang) * i * 6 * k - Math.sin(ang) * wig;
        var sy = py - Math.sin(ang) * i * 6 * k + Math.cos(ang) * wig;
        var w = (11 - f * 6) * k * grow;
        fleshLump(sx, sy, w, w * 0.85, e.hitT > 0 ? [255, 200, 220] : (i % 2 ? [196, 64, 98] : [226, 102, 128]), i + (e.big ? 900 : 950));
        if (i % 3 === 1) { glowCrack(sx - w * 0.3, sy, w * 0.6, ang + HALF_PI, 0.5, i); }
    }
    var hx = px + Math.cos(ang) * lunge;
    var hy = py + Math.sin(ang) * lunge;
    var hs = 15 * k * grow;
    flFill(RT_OUT);
    jagShape(hx, hy, hs + 5, hs * 0.85 + 5, 33, true, 0);
    flFill(e.hitT > 0 ? [255, 200, 220] : [232, 112, 136]);
    jagShape(hx, hy, hs, hs * 0.85, 33, true, 0);
    var jx = hx + Math.cos(ang) * hs * 0.35;
    var jy = hy + Math.sin(ang) * hs * 0.35;
    flFill([30, 4, 16]);
    ellipse(jx, jy, hs * 0.55, hs * 0.55);
    flFill(BONE);
    for (i = 0; i < 6; i++) {
        var ta = i / 6 * TWO_PI;

                 jx + Math.cos(ta + 0.25) * hs * 0.27, jy + Math.sin(ta + 0.25) * hs * 0.27,
                 jx + Math.cos(ta) * hs * 0.1, jy + Math.sin(ta) * hs * 0.1);
    }

        var ex = hx - Math.cos(ang) * hs * 0.1 - Math.sin(ang) * s2 * hs * 0.3;

// a flesh tick: tiny, skittering, lots of legs
var drawFleshTickTop = function(e, cx, cy, R) {

};
// a pus spitter: a fleshy mound with a glowing mouth on top
var drawSpitterTop = function(e, cx, cy, R) {

    ellipse(px, py - 2 * k, sz * 0.42, sz * 0.36);

};
// a gazer: a huge eye on a fleshy stalk
var drawGazerTop = function(e, cx, cy, R, tx, ty) {

};
var drawFleshTentTop = function(tn, cx, cy, R) {
    var pts = [];
    var tip = tentTip(tn);
    var base = { x: Math.cos(tn.ang) * 1.12, y: Math.sin(tn.ang) * 1.12 };
    for (var s = 0; s <= 12; s++) {
        var f = s / 12;
        var cur = Math.sin(frameCount * 0.07 + f * 4 + tn.ang * 3) * 0.08 * Math.sin(f * PI);
        var ax = lerp(base.x, tip.x, f);
        var ay = lerp(base.y, tip.y, f);
        pts.push([cx + (ax - Math.sin(tn.ang) * cur) * R, cy + (ay + Math.cos(tn.ang) * cur) * R]);

    fill(RT_ORANGE[0], RT_ORANGE[1], RT_ORANGE[2], 40);
    for (var gi = 0; gi < pts.length; gi += 3) { ellipse(pts[gi][0], pts[gi][1], R * 0.22, R * 0.22); }
    tendril(pts, R * (tn.st === "slam" ? 0.17 : 0.15), tn.hitT > 0 ? [255, 200, 220] : [190, 60, 110]);
    if (tn.st === "wind") {
        fill(RT_ORANGE[0], RT_ORANGE[1], RT_ORANGE[2], 120 + 100 * Math.sin(frameCount * 0.6));
        ellipse(pts[12][0], pts[12][1], 16, 16);
    }
};
var drawFleshTrialTop = function(cx, cy, R) {
    var tr = fightPit.trial;
    if (!tr) { return; }
    var i;
    var c = tr.s;
    var tx = c.topX !== undefined ? c.topX : cx;
    var ty = c.topY !== undefined ? c.topY : cy;
    for (i = 0; i < tr.tents.length; i++) { drawFleshTentTop(tr.tents[i], cx, cy, R); }
    for (i = 0; i < tr.enemies.length; i++) {
        var e = tr.enemies[i];
        if (e.kind === "tick") { drawFleshTickTop(e, cx, cy, R); }
        else if (e.kind === "spitter") { drawSpitterTop(e, cx, cy, R); }
        else if (e.kind === "gazer") { drawGazerTop(e, cx, cy, R, tx, ty); }
        else { drawFleshSnakeTop(e, cx, cy, R); }
        if (e.hp < e.maxHp && e.born > 20) {
            var k = R / 92;
            var bw = (e.big ? 60 : (e.kind === "tick" ? 16 : 34)) * k;
            fill(0, 0, 0, 160);
            rect(cx + e.x * R - bw / 2, cy + e.y * R - 22 * k * (e.big ? 2 : 1), bw, 4 * k);
            flFill(RT_ORANGE);
            rect(cx + e.x * R - bw / 2, cy + e.y * R - 22 * k * (e.big ? 2 : 1), bw * Math.max(0, e.hp / e.maxHp), 4 * k);
        }
    }
    // globs of pus in the air
    for (i = 0; i < tr.shots.length; i++) {
        var sh = tr.shots[i];
        var u = sh.t / sh.max;
        var sxp = cx + sh.x * R;
        var syp = cy + sh.y * R - Math.sin(u * PI) * 40;
        fill(0, 0, 0, 60);
        ellipse(cx + sh.x * R, cy + sh.y * R, 12, 8);
        fill(RT_ORANGE[0], RT_ORANGE[1], RT_ORANGE[2], 120);
        ellipse(sxp, syp, 22, 22);

        ellipse(sxp, syp, 12, 12);
    }
};
// the trial's scoreboard (screen space)

// the forest view
var drawFleshTrialSide = function() {
    if (!arenaIs("flesh") || !fightPit.trial || !inView(fightPit.x, pitHalf() + 60 * S)) { return; }
    var tr = fightPit.trial;
    var c = tr.s;
    var i, s;
    for (i = 0; i < tr.tents.length; i++) {
        var tn = tr.tents[i];
        var bx = trapWX(Math.cos(tn.ang) * 1.0);
        var tx = trapWX(Math.cos(tn.ang) * (1 - tn.ext));
        var hgt = (tn.st === "slam" ? 20 : 50 + Math.sin(frameCount * 0.05 + i) * 6) * S;
        var pts = [];
        for (s = 0; s <= 9; s++) {
            var f = s / 9;
            pts.push([lerp(bx, tx, f) + Math.sin(frameCount * 0.06 + f * 3 + i) * 4 * S * f,
                      GROUND + 4 * S - Math.sin(f * PI * 0.85) * hgt - f * 10 * S]);
        }
        tendril(pts, 7 * S, [190, 60, 110]);
    }
    for (i = 0; i < tr.enemies.length; i++) {
        var e = tr.enemies[i];
        var ex = trapWX(e.x);
        var up = Math.min(1, e.born / 25);
        if (e.kind === "spitter") {
            fleshLump(ex, GROUND - 5 * S * up, 16 * S, 12 * S * up, [190, 60, 96], 1500);
            fill(RT_ORANGE[0], RT_ORANGE[1], RT_ORANGE[2], 200);

        }

            stroke(RT_OUT[0], RT_OUT[1], RT_OUT[2]);
            strokeWeight(5 * S);
            line(ex, GROUND, ex + Math.sin(frameCount * 0.04) * 3 * S, GROUND - 26 * S * up);
            stroke(170, 50, 90);
            strokeWeight(3 * S);
            line(ex, GROUND, ex + Math.sin(frameCount * 0.04) * 3 * S, GROUND - 26 * S * up);
            noStroke();
            var gx = ex + Math.sin(frameCount * 0.04) * 3 * S;
            var gy = GROUND - 28 * S * up;
            fleshEye(gx, gy, 5 * S, c.x, GROUND - 10 * S, 77);
            if (e.beam > 0) {
                stroke(255, 120, 230, 160);

                line(gx, gy, c.x, GROUND - 12 * S * c.size);

        triangle(hx + dir * 2 * k, hy, hx + dir * 7 * k, hy - 3 * k, hx + dir * 7 * k, hy + 3 * k);
        flFill(RT_ORANGE);
        ellipse(hx, hy - 2 * k, 2.5 * k, 2.5 * k);

        var sh = tr.shots[i];
        var u = sh.t / sh.max;
        flFill(RT_ORANGE);

    }

// ================= THE FIGHT POND =================
// Snakes battle in a pond. Unlock: watch 50 snake fights (or type "pond").
//   - snakes can DIVE: everything misses a bit more
//   - FLAME TAIL fizzles in the water (much weaker)
//   - TAIL WHIP becomes a TIDAL WHIP (a bit stronger, big splash)
//   - a grumpy SNAPPING TURTLE lives at the bottom and bites fighters
//   - the crowd is frogs
var pondUnlocked = false;
var fightsSeen = 0;
var POND_FIGHTS = 50;
var sawFight = function(x) {
    if (!(inView(x, 0) || (pitView && inPitX(x)))) { return; }
    fightsSeen++;
    if (fightsSeen >= POND_FIGHTS && !pondUnlocked) { unlockArena("pond"); }
};
var pondLevel = function() { return fightPit && fightPit.water !== undefined ? fightPit.water : 1; };
var pondWet = function() { return pondLevel() > 0.25; };
var inPond = function(a) { return arenaIs("pond") && inPitX(a.x) && pondWet(); };
var pondTurtle = function() {
    if (!arenaIs("pond") || !pondWet()) { return; }
    for (var i = 0; i < animals.length; i++) {
        var s = animals[i];
        if (s.type !== "snake" || s.state !== "fight" || !inPitX(s.x)) { continue; }
        if (random(1) < 0.0013) {
            s.hp -= random(6, 11) * (s.ana ? 2.5 : 1);
            s.recoil = 10;
            sideWord("SNAPPING TURTLE!", s, [120, 200, 120]);
            snakeBurst(s.x, GROUND - 4 * S, 10, [120, 180, 230], 1.4);
            pitEvent("turtle", s, null);
            snd("chomp", s.x, 0.8);
            snd("splash", s.x);
        }
    }
};

// ----- colours -----
var PD_WATER = [44, 120, 150];
var PD_DEEP = [22, 70, 100];
var PD_PAD = [70, 150, 70];
var PD_PAD_D = [44, 110, 50];

// a lily pad (with a notch) and maybe a flower
var lilyPad = function(x, y, r, rot, flower) {
    fill(0, 40, 50, 60);
    ellipse(x + 3, y + 3, r * 2, r * 1.6);
    fill(PD_PAD_D[0], PD_PAD_D[1], PD_PAD_D[2]);
    arc(x, y, r * 2 + 3, r * 1.6 + 3, rot + 0.35, rot + TWO_PI - 0.35);
    fill(PD_PAD[0], PD_PAD[1], PD_PAD[2]);
    arc(x, y, r * 2, r * 1.6, rot + 0.35, rot + TWO_PI - 0.35);
    stroke(PD_PAD_D[0], PD_PAD_D[1], PD_PAD_D[2]);
    strokeWeight(1);
    for (var v = 0; v < 5; v++) {
        var va = rot + 0.7 + v * 1.1;
        line(x, y, x + Math.cos(va) * r * 0.8, y + Math.sin(va) * r * 0.65);
    }
    noStroke();
    if (flower) {
        for (var p = 0; p < 6; p++) {
            var pa = p / 6 * TWO_PI + rot;
            fill(250, 170, 200);
            ellipse(x + Math.cos(pa) * r * 0.3, y + Math.sin(pa) * r * 0.25, r * 0.42, r * 0.3);
        }
        fill(255, 230, 120);
        ellipse(x, y, r * 0.3, r * 0.3);
    }
};
// a frog (from above), hopping with excitement
var frogTop = function(x, y, sz, col, hop) {
    var h = 1 + hop * 0.25;
    fill(0, 40, 50, 60);

    ellipse(x - sz * 0.45, y + sz * 0.3, sz * 0.45, sz * 0.3);
    ellipse(x + sz * 0.45, y + sz * 0.3, sz * 0.45, sz * 0.3);
    fill(col[0], col[1], col[2]);
    ellipse(x, y, sz * h, sz * 0.9 * h);
    fill(255);
    ellipse(x - sz * 0.25, y - sz * 0.32, sz * 0.32, sz * 0.32);
    ellipse(x + sz * 0.25, y - sz * 0.32, sz * 0.32, sz * 0.32);
    fill(20);
    ellipse(x - sz * 0.25, y - sz * 0.32, sz * 0.14, sz * 0.18);
    ellipse(x + sz * 0.25, y - sz * 0.32, sz * 0.14, sz * 0.18);

// ----- from the side (forest view) -----
var drawPondSide = function(x, hw) {
    var i;

    noStroke();
    // muddy bank (cracked when dry)

            line(cxp, GROUND + 2 * S, cxp + 6 * S, GROUND + 7 * S);
            line(cxp + 6 * S, GROUND + 7 * S, cxp + 2 * S, GROUND + 11 * S);
        }
        noStroke();
    }
    // the water (shrinks as it dries)
    if (lv > 0.02) {
        fill(PD_DEEP[0], PD_DEEP[1], PD_DEEP[2]);
        ellipse(x, GROUND + 6 * S + (1 - lv) * 4 * S, hw * 2.0 * lv, 20 * S * lv);
        fill(PD_WATER[0], PD_WATER[1], PD_WATER[2]);

            line(sx, GROUND + 3 * S + (i % 3) * 2 * S, sx + 7 * S, GROUND + 3 * S + (i % 3) * 2 * S);
        }
        noStroke();
        // bubbles rising
        for (i = 0; i < 4; i++) {
            var bp = ((frameCount * 0.7 + i * 40) % 90) / 90;
            noFill();
            stroke(220, 240, 250, 200 * (1 - bp));
            strokeWeight(1);
            ellipse(x - hw * 0.4 + i * hw * 0.27, GROUND + 6 * S - bp * 4 * S, 2.5 * S, 2.5 * S);
            noStroke();

    // stones along the bank

    for (i = 0; i < stones.length; i++) {
        mossRock(x + stones[i][0] * hw, GROUND + 3 * S, stones[i][1] * S, stones[i][2] * S, i);
    }
    // reeds and cattails at both ends (brown in a drought)

// ================= WEATHER =================
// clear, RAIN (trees grow faster, puts out fires, fills the pond),
// STORM (heavy rain + lightning that can set trees on fire),
// DROUGHT (trees grow slower, the pond dries up, trees can catch fire)
var weather = { kind: "clear", until: DAY * 2, since: 0 };
var weatherNames = { clear: "Clear", rain: "Rain", storm: "STORM", drought: "Drought" };
var lastWeatherT = 0;
var rainDrops = [];
var bolts = [];               // lightning bolts being drawn
var flashA = 0;               // screen flash from lightning
var nextBolt = 0;
var weatherNoise = 0;
var growthMult = function() {
    if (weather.kind === "rain") { return 1.7; }
    if (weather.kind === "storm") { return 1.35; }
    if (weather.kind === "drought") { return 0.45; }
    return 1;
};
var isWinter = function() { return Math.floor(((t % YEAR) / YEAR) * 4) === 3; };
var setWeather = function(kind, dur) {
    weather.kind = kind;
    weather.since = t;
    weather.until = t + dur;
    if (kind === "rain") { showToast("It's raining! Trees grow faster in the rain."); }
    if (kind === "storm") { showToast("A STORM is rolling in! Watch out for lightning!"); snd("thunder", undefined, 0.6); }
    if (kind === "drought") { showToast("A DROUGHT has started... trees grow slowly, and fires can start!"); }
    if (kind === "clear") { showToast("The weather clears up."); }
    if (fightPit && frameCount - shrewT > 200) {
        if (kind === "storm") { shrewSay("Folks, there's a STORM coming! I'm holding a metal microphone! This is FINE!", 3); }
        if (kind === "drought") { shrewSay("It's SO hot. Drought conditions, folks. Stay hydrated. I'm drinking my own sweat.", 2); }
        if (kind === "rain") { shrewSay("Rain delay? NO! The fights go on! Snakes don't care about rain!", 2); }
    }
};
var pickWeather = function() {
    if (isWinter()) { setWeather("clear", DAY * random(1, 2)); return; }
    var summer = Math.floor(((t % YEAR) / YEAR) * 4) === 1;
    var r = random(1);
    if (weather.kind !== "clear") { setWeather("clear", DAY * random(1, 2.5)); return; }
    if (r < 0.32) { setWeather("rain", DAY * random(0.6, 1.4)); }
    else if (r < 0.48) { setWeather("storm", DAY * random(0.4, 0.8)); }
    else if (r < (summer ? 0.78 : 0.62)) { setWeather("drought", DAY * random(2, 3.5)); }
    else { setWeather("clear", DAY * random(1, 2.5)); }
};

// ---- fire ----
var BURN_TIME = DAY * 0.55;
var igniteTree = function(tr, why) {
    if (!tr || tr.state !== "alive" || tr.burn || tr.mature < 0.15) { return false; }
    var pts = [];
    var i;
    for (i = 0; i < 22; i++) {
        if (tr.leaves.length > 0 && i % 2 === 0) {
            var L = tr.leaves[Math.floor(random(tr.leaves.length))];
            pts.push({ x: L.x, y: L.y, ph: random(TWO_PI), s: random(0.7, 1.3) });
        } else {
            var b = tr.branches[Math.floor(random(Math.min(tr.branches.length, 60)))];
            var p = b.pts[Math.floor(random(b.pts.length))];
            pts.push({ x: p.x, y: p.y, ph: random(TWO_PI), s: random(0.7, 1.3) });
        }
    }
    tr.burn = { t0: t, heat: 0.3, pts: pts, why: why };
    snd("ignite", tr.x);
    if (inView(tr.x, 0)) {
        snakeMsg = why === "lightning" ? "LIGHTNING struck a " + tr.sp.name + " tree! It's ON FIRE!" :
                   (why === "spread" ? "The fire is spreading to a " + tr.sp.name + " tree!" :
                                       "The drought set a " + tr.sp.name + " tree on fire!");
    }
    return true;
};
var updateFires = function(dt) {
    var raining = weather.kind === "rain" || weather.kind === "storm";
    for (var i = 0; i < trees.length; i++) {
        var tr = trees[i];
        if (!tr.burn) {
            if (tr.smokeT > 0) { tr.smokeT -= dt; }
            if (tr.burnt) { tr.vigor = 0; }
            continue;
        }
        var B = tr.burn;
        if (tr.state !== "alive") { tr.burn = null; continue; }
        var prog = (t - B.t0) / BURN_TIME;
        B.heat = Math.min(1, B.heat + 0.004 * dt);
        if (raining) {
            B.heat -= (weather.kind === "storm" ? 0.0035 : 0.006) * dt;
            if (B.heat <= 0) {
                // the rain put it out
                tr.burn = null;
                tr.smokeT = DAY * 0.25;
                tr.scorched = true;
                if (inView(tr.x, 0)) { snakeMsg = "The rain put out the fire! The " + tr.sp.name + " tree survived (barely)."; }
                snd("fizzle", tr.x, 0.7);
                continue;
            }
        }
        // burning trees wilt and turn grey
        tr.vigor = Math.min(tr.vigor, 1 - Math.min(1, prog) * 0.95);
        if (prog >= 1) {
            tr.burn = null;
            tr.state = "dead";
            tr.deadT = t;
            tr.burnt = true;
            tr.smokeT = DAY * 0.5;
            tr.fallDir = random(1) < 0.5 ? -1 : 1;
            tr.hive = null;
            if (inView(tr.x, 0)) { snakeMsg = "The " + tr.sp.name + " tree burned down..."; }
            continue;
        }
        // spread to neighbours
        for (var j = 0; j < trees.length; j++) {
            var o = trees[j];
            if (o === tr || o.state !== "alive" || o.burn) { continue; }
            var dd = Math.abs(o.x - tr.x);
            if (dd < 80 * S) {
                var chance = 0.0016 * dt * B.heat * (weather.kind === "drought" ? 2.2 : 1) * (raining ? 0.15 : 1) * (1 - dd / (80 * S));
                if (random(1) < chance) { igniteTree(o, "spread"); }
            }
        }
        if (inView(tr.x, 0) && frameCount % 50 === i % 50) { snd("crackle", tr.x, 0.5 + B.heat * 0.5); }
    }
};

// ---- the weather, every frame ----
var updateWeather = function() {
    var dt = t - lastWeatherT;
    lastWeatherT = t;
    if (dt <= 0 || dt > 50) { return; }
    if (t >= weather.until) { pickWeather(); }
    if (isWinter() && weather.kind !== "clear") { setWeather("clear", DAY * random(1, 2)); }
    // growth: shift every growing tree's timeline earlier (rain) or later (drought)
    var gm = growthMult();
    if (gm !== 1) {
        var shift = (gm - 1) * dt;
        for (var i = 0; i < trees.length; i++) {
            var tr = trees[i];
            if (tr.state !== "alive" || tr.mature >= 0.999) { continue; }
            tr.start -= shift;
            tr.life += shift;
            var k;
            for (k = 0; k < tr.branches.length; k++) { tr.branches[k].birth -= shift; }
            for (k = 0; k < tr.roots.length; k++) { tr.roots[k].birth -= shift; }
            for (k = 0; k < tr.leaves.length; k++) { if (tr.leaves[k].birth !== undefined) { tr.leaves[k].birth -= shift; } }
        }
        for (var sd = 0; sd < seedlings.length; sd++) { seedlings[sd].birth -= shift; }
    }
    // the pond fills in the rain and dries up in a drought
    if (fightPit && arenaIs("pond")) {
        if (fightPit.water === undefined) { fightPit.water = 1; }
        var wasWet = pondWet();
        if (weather.kind === "drought") { fightPit.water = Math.max(0, fightPit.water - 0.00045 * dt); }
        else if (weather.kind === "rain" || weather.kind === "storm") { fightPit.water = Math.min(1, fightPit.water + 0.0012 * dt); }
        else { fightPit.water = Math.min(1, fightPit.water + 0.00008 * dt); }
        if (wasWet && !pondWet()) {
            showToast("The Fight Pond has DRIED UP! It's just mud now...");
            shrewSay("The pond... is gone. It's a MUD PIT now. Gerald is very upset. Gerald is hiding in his shell.", 4);
        } else if (!wasWet && pondWet()) {
            showToast("The rain filled the Fight Pond back up!");
            shrewSay("THE POND IS BACK! Gerald is back! Everybody's wet again! Hooray!", 4);
        }
    }
    // drought: trees can catch fire on their own
    if (weather.kind === "drought") {
        for (var di = 0; di < trees.length; di++) {
            var dtr = trees[di];
            if (dtr.state === "alive" && !dtr.burn && dtr.mature > 0.4 && random(1) < 0.000012 * dt) { igniteTree(dtr, "drought"); }
        }
    }
    // storm: lightning
    if (weather.kind === "storm") {
        nextBolt -= dt;
        if (nextBolt <= 0) {
            nextBolt = random(160, 420);
            lightningStrike();
        }
    }
    updateFires(dt);
    // rain sound
    weatherNoise -= 1;
    if ((weather.kind === "rain" || weather.kind === "storm") && weatherNoise <= 0) {
        weatherNoise = 70;
        snd("rain", undefined, weather.kind === "storm" ? 0.9 : 0.6);
    }
};
var lightningStrike = function() {
    // usually it hits the tallest tree near the middle of the screen
    var best = null;
    var bestTop = 1e9;
    for (var i = 0; i < trees.length; i++) {
        var tr = trees[i];
        if (tr.state !== "alive" || !inView(tr.x, W * 0.3)) { continue; }
        var top = treeWY(tr, treeBounds(tr).top) - random(0, 60) * S;
        if (top < bestTop) { bestTop = top; best = tr; }
    }
    var x, y;
    if (best && random(1) < 0.75) {
        x = best.x + random(-10, 10) * S;
        y = treeWY(best, treeBounds(best).top + 10 * S);
    } else {
        x = camX + random(0.1, 0.9) * W;
        y = GROUND;
        best = null;
    }
    var pts = [];
    var px = x + random(-120, 120) * S;
    var steps = 14;
    for (var s = 0; s <= steps; s++) {
        var f = s / steps;
        pts.push({ x: lerp(px, x, f) + (s > 0 && s < steps ? random(-18, 18) * S : 0), y: lerp(-20, y, f) });
    }
    var branch = [];
    var bi = Math.floor(random(3, 9));
    var bx = pts[bi].x;
    var by = pts[bi].y;
    for (var k = 0; k < 5; k++) {
        bx += random(-22, 22) * S;
        by += random(10, 26) * S;
        branch.push({ x: bx, y: by });
    }
    bolts.push({ pts: pts, branch: [pts[bi]].concat(branch), age: 0 });
    flashA = 1;
    snd("thunder", x);
    if (best && random(1) < 0.8) { igniteTree(best, "lightning"); }
    snakeBurst(x, y, 16, [255, 250, 200], 2);
};

// ---- drawing ----
// sky colour over the clouds (screen space)
var drawWeatherSky = function() {
    noStroke();
    var k = weather.kind;

};
// cracked, dry ground in a drought (world space)
var drawDroughtGround = function() {
    if (weather.kind !== "drought") { return; }
    var fadeIn = Math.min(1, (t - weather.since) / 600);
    noStroke();
    fill(170, 140, 80, 90 * fadeIn);
    rect(camX, GROUND - 14 * S, W, 18 * S);
    stroke(90, 65, 40, 150 * fadeIn);
    strokeWeight(Math.max(1, 0.8 * S));
    var start = Math.floor(camX / (40 * S));
    for (var i = start; i < start + W / (40 * S) + 2; i++) {
        var x = i * 40 * S;
        var r1 = Math.sin(i * 12.9898) * 43758.5453;
        r1 = r1 - Math.floor(r1);
        line(x, GROUND + 2 * S, x + (r1 - 0.5) * 18 * S, GROUND + 9 * S);
        line(x + (r1 - 0.5) * 18 * S, GROUND + 9 * S, x + 10 * S, GROUND + 14 * S);
        line(x + (r1 - 0.5) * 18 * S, GROUND + 9 * S, x - 8 * S, GROUND + 16 * S);
    }
    noStroke();
};
// fire and smoke on burning trees (world space)
var drawFires = function() {
    for (var i = 0; i < trees.length; i++) {
        var tr = trees[i];
        if (!inView(tr.x, 200 * S)) { continue; }
        var j, p, wx, wy;
        if (tr.burn) {
            var B = tr.burn;
            var prog = (t - B.t0) / BURN_TIME;
            noStroke();
            var glowY = treeWY(tr, treeBounds(tr).top) + 40 * S;
            fill(255, 120, 30, 40 * B.heat);
            ellipse(tr.x, (glowY + GROUND) / 2, 140 * S * tr.sc + 40 * S, (GROUND - glowY) * 1.2);
            var n = Math.floor(B.pts.length * Math.min(1, 0.3 + prog * 1.5));
            for (j = 0; j < n; j++) {
                p = B.pts[j];
                wx = treeWX(tr, p.x);
                wy = treeWY(tr, p.y);
                var fl = (0.6 + 0.4 * Math.sin(frameCount * 0.4 + p.ph)) * p.s * B.heat;
                var fs = (12 + 10 * fl) * S;
                fill(255, 80, 20, 170);
                triangle(wx - fs * 0.45, wy + fs * 0.2, wx + fs * 0.45, wy + fs * 0.2, wx + Math.sin(frameCount * 0.3 + p.ph) * 4 * S, wy - fs * 1.4);
                fill(255, 170, 40, 200);
                triangle(wx - fs * 0.28, wy + fs * 0.15, wx + fs * 0.28, wy + fs * 0.15, wx + Math.sin(frameCount * 0.35 + p.ph) * 3 * S, wy - fs * 0.95);
                fill(255, 240, 150, 220);
                ellipse(wx, wy, fs * 0.3, fs * 0.4);
                // embers
                if ((frameCount + j * 7) % 14 === 0 && snakeFx.length < 110) {
                    snakeFx.push({ x: wx, y: wy, vx: random(-0.4, 0.4) * S, vy: -random(0.6, 1.4) * S, life: 0, max: random(25, 45),
                                   col: [255, 150 + random(80), 40], r: random(1, 2.2) });
                }
            }
            // trunk flames
            for (j = 0; j < 3; j++) {
                var ty = GROUND - (10 + j * 22) * S * tr.sc;
                var tfs = (10 + 6 * Math.sin(frameCount * 0.5 + j)) * S * B.heat;
                fill(255, 110, 30, 170);
                triangle(tr.x - tfs * 0.5, ty, tr.x + tfs * 0.5, ty, tr.x + Math.sin(frameCount * 0.4 + j) * 3 * S, ty - tfs * 1.6);
            }
        }
        // smoke rising
        if (tr.burn || tr.smokeT > 0) {
            var sm = tr.burn ? 1 : Math.min(1, tr.smokeT / (DAY * 0.2));
            var topY = treeWY(tr, treeBounds(tr).top);
            for (j = 0; j < 8; j++) {
                var sp = ((frameCount * 0.6 + j * 30) % 240) / 240;
                var sx = tr.x + Math.sin(sp * 6 + j) * 20 * S + sp * 40 * S;
                var sy = topY + 30 * S - sp * 160 * S;
                fill(70, 65, 65, 110 * (1 - sp) * sm);
                ellipse(sx, sy, (20 + sp * 50) * S, (20 + sp * 50) * S);
            }
        }
    }
};
// rain and lightning (world space, over everything)
var drawRainAndBolts = function(wind) {
    var k = weather.kind;
    var i;
    if (k === "rain" || k === "storm") {
        var want = k === "storm" ? 320 : 170;
        var fadeIn = Math.min(1, (t - weather.since) / 200);
        want = Math.floor(want * fadeIn);
        while (rainDrops.length < want) {
            rainDrops.push({ x: camX + random(-60, W + 60), y: random(-H, GROUND), v: random(9, 14) * S, len: random(10, 18) * S });
        }
        if (rainDrops.length > want) { rainDrops.length = want; }
        var slant = (wind || 0) * 3 * S + (k === "storm" ? 3 * S : 1 * S);
        stroke(190, 205, 230, k === "storm" ? 150 : 120);
        strokeWeight(Math.max(1, 0.8 * S));
        for (i = 0; i < rainDrops.length; i++) {
            var d = rainDrops[i];
            d.y += d.v * Math.min(3, speed);
            d.x += slant * 0.6;
            if (d.y > GROUND) {
                // a little splash
                noStroke();
                fill(200, 215, 235, 140);
                ellipse(d.x, GROUND, 4 * S, 1.5 * S);
                stroke(190, 205, 230, k === "storm" ? 150 : 120);
                d.y = random(-60, -10);
                d.x = camX + random(-60, W + 60);
            }
            if (d.x < camX - 80 || d.x > camX + W + 80) { d.x = camX + random(-60, W + 60); }
            line(d.x, d.y, d.x - slant, d.y - d.len);
        }
        noStroke();
    } else {
        rainDrops.length = 0;
    }
    for (i = bolts.length - 1; i >= 0; i--) {
        var b = bolts[i];
        b.age++;
        var a = b.age < 4 ? 255 : 255 * (1 - (b.age - 4) / 10);
        var layers = [[255, 255, 255, 12, 0.25], [200, 220, 255, 6, 0.6], [255, 255, 255, 2.5, 1]];
        for (var L = 0; L < layers.length; L++) {
            var ly = layers[L];
            stroke(ly[0], ly[1], ly[2], a * ly[4]);
            strokeWeight(ly[3] * S);
            for (var j = 0; j < b.pts.length - 1; j++) { line(b.pts[j].x, b.pts[j].y, b.pts[j + 1].x, b.pts[j + 1].y); }
            strokeWeight(ly[3] * S * 0.5);
            for (j = 0; j < b.branch.length - 1; j++) { line(b.branch[j].x, b.branch[j].y, b.branch[j + 1].x, b.branch[j + 1].y); }
        }
        noStroke();
        if (b.age > 14) { bolts.splice(i, 1); }
    }
};

            opts.push("Brr! Snakes don't like snow. Neither does my snout.");
            opts.push("It's too cold for snakes! The {P}'s closed for winter. I'm still here though. Alone.");
        }
        if (anaAround) {
            opts.push("The Anaconda is still out there somewhere... *gulp*");
            opts.push("I've installed a second, emergency desk to hide under. For the Anaconda.");
        }
        if (resting.length > 0) {
            var r = resting[Math.floor(random(resting.length))];
            opts.push(fillNames(pickLine(["{A} is resting up. Smart.",
                                          "{A} is just coiled up, staring at me. Please stop.",
                                          "{A} is taking a nap in the {P}. Bold move."]), r, null));
        }
        if (champ && champ.evo >= 15) {
            opts.push(fillNames("Word is {A} is Lv {LA} now. Nobody wants that smoke.", champ, null));
        }
        shrewSay(pickLine(opts), 0);
    }
};

// ================= HELPERS =================

var clamp01 = function(v) {
    return v < 0 ? 0 : (v > 1 ? 1 : v);
};

var ease = function(v) {
    v = clamp01(v);
    return v * v * (3 - 2 * v);
};

var fillArr = function(c, a) {
    if (a === undefined) {
        fill(c[0], c[1], c[2]);
    } else {
        fill(c[0], c[1], c[2], a);
    }
};

var byDepth = function(arr, d) {
    return arr[Math.min(d, arr.length - 1)];
};

// Is a world x-position on screen (with some extra margin)?
var inView = function(x, margin) {
    return x > camX - margin && x < camX + W + margin;
};

var offView = function(x, margin) {
    return x < camX - margin || x > camX + W + margin;
};

// A word floating over a snake in the forest view
var sideWord = function(text, a, col) {
    if (!inView(a.x, 60)) { return; }
    sideWords.push({ text: text, x: a.x, y: GROUND - 34 * S * (a.size || 1) - 10 * S, col: col, f: frameCount });
    if (sideWords.length > 24) { sideWords.shift(); }
};

// Just past the left or right edge of the view
var viewEdge = function(side, margin) {
    return side < 0 ? camX - margin : camX + W + margin;
};

var seasonPos = function() {
    return (t % YEAR) / YEAR;
};

var nextSpring = function() {
    return (Math.floor(t / YEAR) + 1) * YEAR + random(0.03, 0.12) * YEAR;
};

var seasonColor = function(arr, st) {
    var s = st * 4;
    var i = Math.floor(s) % 4;
    var f = s - Math.floor(s);
    return lerpColor(arr[i], arr[(i + 1) % 4], ease((f - 0.7) / 0.3));
};

var snowAmount = function(st) {
    if (st < 0.76) { return 0; }
    return ease((st - 0.77) / 0.07) * (1 - ease((st - 0.955) / 0.04));
};

var pointAt = function(b, s) {
    var n = b.pts.length - 1;
    var f = clamp01(s) * n;
    var i = Math.floor(f);
    if (i >= n) { i = n - 1; }
    var k = f - i;
    var p1 = b.pts[i];
    var p2 = b.pts[i + 1];
    var dx = p2.x - p1.x;
    var dy = p2.y - p1.y;
    var d = Math.sqrt(dx * dx + dy * dy) || 1;
    return {
        x: p1.x + dx * k,
        y: p1.y + dy * k,
        a: Math.atan2(dy, dx),
        nx: -dy / d,
        ny: dx / d
    };
};

var makePath = function(x, y, angle, len, segs, bend, wander) {
    var pts = [{ x: x, y: y }];
    var a = angle;
    var step = len / segs;
    for (var i = 0; i < segs; i++) {
        a += random(-wander, wander);
        a = Math.atan2(Math.sin(a) + bend, Math.cos(a));
        x += Math.cos(a) * step;
        y += Math.sin(a) * step;
        pts.push({ x: x, y: y });
    }
    return pts;
};

var toWX = function(x) {
    return curX + (x - curX) * curScale;
};
var toWY = function(y) {
    return GROUND + (y - GROUND) * curScale;
};
var treeWX = function(tr, x) {
    return tr.x + (x - tr.x) * tr.sc;
};
var treeWY = function(tr, y) {
    return GROUND + (y - GROUND) * tr.sc;
};

var leafFrame = [0, 0, 1, 0, 0, 1];

var poly = function(list) {
    var f = leafFrame;
    var out = [];
    for (var q = 0; q < list.length; q++) {
        var u = list[q][0];
        var v = list[q][1];
        out.push(f[0] + f[2] * u + f[4] * v, f[1] + f[3] * u + f[5] * v);
    }
    return out;
};

// ================= DAY & NIGHT HELPERS =================

var dayPos = function() {
    return ((t + DAY * 0.3) % DAY) / DAY;
};

var sunAngle = function() {
    return (dayPos() - 0.25) * TWO_PI;
};

var updateLight = function() {
    var h = Math.sin(sunAngle());
    daylight = ease((h + 0.12) / 0.35);
    dusk = clamp01(1 - Math.abs(h) / 0.28);
};

var clockText = function() {
    var mins = Math.floor(dayPos() * 24 * 60);
    var hr = Math.floor(mins / 60);
    var mn = Math.floor((mins % 60) / 5) * 5;
    var h12 = hr % 12;
    if (h12 === 0) { h12 = 12; }
    return h12 + ":" + (mn < 10 ? "0" : "") + mn + (hr < 12 ? " AM" : " PM");
};

// ================= TREE GENERATION =================

var addBarkDetails = function(b) {
    if (b.w0 <= 6 * S || b.depth > 1) {
        return;
    }
    var style = SP.barkStyle;
    var nb = Math.floor(b.len / ((style === "lenticel" ? 3 : 5) * S));

    for (var i = 0; i < nb; i++) {
        if (style === "lenticel") {
            b.bark.push({
                s: random(0.02, 0.98),
                off: random(-0.45, 0.1),
                l: random(0.15, 0.4),
                dark: random(0.6, 1)
            });
        } else {
            b.bark.push({
                s: random(0.02, 0.92),
                off: random(-0.42, 0.42),
                l: style === "plates" ? random(0.03, 0.07) : random(0.04, 0.14),
                dark: random(0.6, 1)
            });
        }
    }

    var nk = b.depth === 0 ? 3 : (random(1) < 0.5 ? 1 : 0);
    for (var k = 0; k < nk; k++) {
        b.knots.push({
            s: random(0.15, 0.85),
            off: random(-0.25, 0.25),
            size: random(0.25, 0.45)
        });
    }
};

var addFoliage = function(b) {
    var lvl = b.depth + depthCut;
    var count = byDepth(SP.leafCount, lvl);

    for (var i = 0; i < count; i++) {
        var f = (i === 0) ? 1 : random(0.25, 1);
        var p = pointAt(b, f);
        var side = (i % 2 === 0) ? 1 : -1;

        var a = p.a + side * random(SP.leafSpread[0], SP.leafSpread[1]);
        a = Math.atan2(Math.sin(a) + SP.leafDroop, Math.cos(a));

        var L = random(SP.leafLen[0], SP.leafLen[1]) * S * (1 + 0.2 * depthCut);
        var Wd = L * SP.leafWid;
        var ux = Math.cos(a);
        var uy = Math.sin(a);
        var nx = -uy;
        var ny = ux;
        var bx = ux * 1.5 * S;
        var by = uy * 1.5 * S;

        leafFrame = [bx, by, ux, uy, nx, ny];

        var polys = [];
        var shades = [];

        if (SP.leafShape === "palmate") {
            for (var k = -1; k <= 1; k++) {
                var da = k * 0.8;
                var ll = L * (k === 0 ? 1 : 0.78);
                polys.push(poly([
                    [0, 0],
                    [Math.cos(da + 0.32) * ll * 0.5, Math.sin(da + 0.32) * ll * 0.5],
                    [Math.cos(da) * ll, Math.sin(da) * ll],
                    [Math.cos(da - 0.32) * ll * 0.5, Math.sin(da - 0.32) * ll * 0.5]
                ]));
                shades.push(k === 0 ? 14 : (k < 0 ? -4 : -12));
            }
        } else if (SP.leafShape === "needle") {
            polys.push(poly([
                [0, 0],
                [Math.cos(0.6) * L, Math.sin(0.6) * L],
                [Math.cos(-0.6) * L, Math.sin(-0.6) * L]
            ]));
            shades.push(-8);
            polys.push(poly([
                [0, 0],
                [Math.cos(0.25) * L * 1.05, Math.sin(0.25) * L * 1.05],
                [Math.cos(-0.25) * L * 1.05, Math.sin(-0.25) * L * 1.05]
            ]));
            shades.push(12);
        } else {
            var pr = SP.leafProfile;
            polys.push(poly([[0, 0], [pr[0] * L, pr[1] * Wd], [pr[2] * L, pr[3] * Wd], [L, 0]]));
            shades.push(18);
            polys.push(poly([[0, 0], [L, 0], [pr[2] * L, -pr[3] * Wd], [pr[0] * L, -pr[1] * Wd]]));
            shades.push(-12);
        }

        // Young trees use one shape per leaf instead of two (about twice as fast)
        if (depthCut >= 2 && polys.length === 2) {
            var p1 = polys[0];
            var p2 = polys[1];
            if (p1.length === 8) {
                polys = [[p1[0], p1[1], p1[4], p1[5], p1[6], p1[7], p2[4], p2[5]]];
            } else {
                polys = [p1];
            }
            shades = [4];
        }

        var li = (p.x - curX) / (W * 0.4) * 14 +
                 (GROUND - p.y) / (H * 0.6) * 14 - 10 + random(-10, 10);

        var pal = SP.autumn.length > 0 ?
            SP.autumn[Math.floor(random(SP.autumn.length))] : [0, 0, 0];
        var gc = SP.green;

        leaves.push({
            x: p.x, y: p.y,
            polys: polys, shades: shades,
            cx: bx + ux * L * 0.5, cy: by + uy * L * 0.5,
            gr: random(gc[0], gc[1]) + li,
            gg: random(gc[2], gc[3]) + li,
            gb: random(gc[4], gc[5]) + li * 0.5,
            ar: pal[0], ag: pal[1], ab: pal[2],
            turn: random(1),
            keep: random(1),
            phase: random(TWO_PI),
            birth: b.birth + b.dur * f + random(10, 60),
            fallYear: -1,
            rot: a,
            size: L,
            wid: Math.max(Wd, L * 0.15)
        });
    }

    var bl = SP.blossom;
    if (bl && lvl >= bl.depth) {
        for (var j = 0; j < bl.perTwig; j++) {
            if (random(1) < bl.chance) {
                var q = pointAt(b, random(0.6, 1));
                blossoms.push({
                    x: q.x, y: q.y,
                    r: random(bl.size[0], bl.size[1]) * S,
                    birth: b.birth + b.dur,
                    drop: random(0.14, 0.21),
                    dropYear: -1,
                    phase: random(TWO_PI),
                    pale: random(1)
                });
            }
        }
    }

    var F = SP.fruit;
    if (F && lvl >= F.depth && random(1) < F.chance) {
        var fp = pointAt(b, random(0.5, 1));
        fruits.push({
            x: fp.x, y: fp.y,
            birth: b.birth + b.dur,
            s: random(0.85, 1.15),
            dropAt: F.always ? random(0.58, 0.75) : random(F.to - 0.05, F.to - 0.01),
            drops: F.always ? random(1) < 0.4 : true,
            fallYear: -1,
            eatenYear: -1
        });
    }
};

var growBranch = function(x, y, angle, len, w, depth, birth) {
    var segs = depth === 0 ? 9 : (depth < 3 ? 6 : SP.thinSegs);

    var decay = depth === 0 ? 2 :
        Math.min(curDecay, 0.15 + (1 - depth / (SP.maxDepth + 1)) * 0.75 + random(-0.1, 0.1));

    var b = {
        pts: makePath(x, y, angle, len, segs, byDepth(SP.bend, depth), depth === 0 ? 0.06 : SP.wander),
        w0: w,
        w1: w * 0.62,
        len: len,
        depth: depth,
        birth: birth,
        dur: len * 2.4 + 15,
        bark: [],
        knots: [],
        decay: decay,
        tdust: random(0.8, 0.97),
        dropped: false
    };
    branches.push(b);
    addBarkDetails(b);

    if (byDepth(SP.leafCount, depth + depthCut) > 0) {
        addFoliage(b);
    }

    if (depth >= SP.maxDepth - depthCut) {
        return;
    }

    var n = byDepth(SP.kids, depth);
    var side = random(1) < 0.5 ? -1 : 1;
    var savedDecay = curDecay;
    curDecay = decay;

    for (var j = 0; j < n; j++) {
        var leader = (j === 0);
        var f = leader ? 1 : (depth === 0 ? random(SP.trunkBranchFrom, 0.95) : random(0.4, 0.92));
        var p = pointAt(b, f);
        var wAt = lerp(b.w0, b.w1, f);
        var ang, nl, nw;

        if (leader) {
            ang = p.a + random(-0.25, 0.25);
            nl = len * random(SP.leaderShrink[0], SP.leaderShrink[1]);
            nw = wAt * 0.82;
        } else {
            ang = p.a + side * random(SP.sideAngle[0], SP.sideAngle[1]);
            side *= -1;
            nl = len * random(SP.sideShrink[0], SP.sideShrink[1]);
            nw = wAt * random(0.5, 0.68);
        }

        growBranch(p.x, p.y, ang, nl, nw, depth + 1, birth + b.dur * f);
    }

    curDecay = savedDecay;
};

var growConifer = function() {
    var tiers = SP.tiers - depthCut * 3;
    var segLen = SP.trunkLen * S / tiers;
    var w = SP.trunkW * S;
    var x = curX;
    var y = GROUND;
    var birth = curStart;

    for (var i = 0; i < tiers; i++) {
        var w0 = w * (1 - (i / tiers) * 0.92);
        var w1 = w * (1 - ((i + 1) / tiers) * 0.92);

        var b = {
            pts: makePath(x, y, -PI / 2 + random(-0.03, 0.03), segLen, 3, 0, 0.03),
            w0: w0, w1: w1,
            len: segLen, depth: 0,
            birth: birth, dur: segLen * 4 + 10,
            bark: [], knots: [],
            decay: 2, tdust: 0.8 + (1 - i / tiers) * 0.17, dropped: false
        };
        branches.push(b);
        addBarkDetails(b);

        var top = b.pts[b.pts.length - 1];

        if (i >= Math.max(1, Math.floor((SP.bareFrac || 0) * tiers))) {
            var tierFrac = (i + 1) / tiers;
            var latLen = (SP.latMax * Math.pow(1 - tierFrac, 0.85) + 14) * S;
            var lw = w1 * 0.45 + 1 * S;
            curDecay = 1;

            for (var sd = -1; sd <= 1; sd += 2) {
                growBranch(top.x, top.y, -PI / 2 + sd * random(1.15, 1.5),
                           latLen * random(0.85, 1.05), lw, 2, birth + b.dur);
                if (i < tiers - 1) {
                    growBranch(top.x, top.y, -PI / 2 + sd * random(0.6, 1.0),
                               latLen * random(0.5, 0.65), lw * 0.7, 3, birth + b.dur);
                }
                if (i < tiers - 4) {
                    growBranch(top.x, top.y, -PI / 2 + sd * random(1.6, 1.85),
                               latLen * random(0.6, 0.75), lw * 0.7, 3, birth + b.dur);
                }
            }
        }

        x = top.x;
        y = top.y;
        birth += b.dur;
    }

    curDecay = 1;
    growBranch(x, y, -PI / 2, 22 * S, 2 * S, 3, birth);
};

var growRoot = function(x, y, angle, len, w, depth, birth) {
    var r = {
        pts: makePath(x, y, angle, len, depth === 0 ? 6 : 4, 0.06, 0.25),
        w0: w,
        w1: w * 0.45,
        len: len,
        depth: depth,
        birth: birth,
        dur: len * 3 + 20
    };
    roots.push(r);

    if (depth >= (depthCut > 0 ? 2 : 3)) {
        return;
    }

    for (var i = 0; i < 2; i++) {
        var f = random(0.35, 0.95);
        var p = pointAt(r, f);
        var side = (i === 0) ? -1 : 1;
        growRoot(
            p.x, p.y,
            p.a + side * random(0.4, 0.9),
            len * random(0.45, 0.65),
            lerp(r.w0, r.w1, f) * 0.6,
            depth + 1,
            birth + r.dur * f
        );
    }
};

var useTree = function(tr) {
    SP = tr.sp;
    branches = tr.branches;
    roots = tr.roots;
    leaves = tr.leaves;
    blossoms = tr.blossoms;
    fruits = tr.fruits;
    curX = tr.x;
    curStart = tr.start;
    depthCut = tr.cut;
    curScale = tr.sc;
    curVigor = tr.vigor;
    curMature = tr.mature;
    curDead = (tr.state === "alive" || tr.state === "dust") ? 0 :
              clamp01((t - tr.deadT) / (YEAR * 0.8));
    curDust = tr.state === "dust" ? clamp01((t - tr.deadT) / (YEAR * 0.35)) : 0;
};

var makeTree = function(x, cut, start, startScale, target, growTime, sp) {
    var tr = {
        sp: sp,
        x: x, cut: cut, start: start,
        startScale: startScale, target: target, growTime: growTime,
        life: sp.life * random(0.85, 1.15) * YEAR,
        sc: startScale, vigor: 1, mature: 0,
        state: "alive", deadT: 0, fallT: 0, fallDir: 1, logT: 0,
        hive: null, hiveYear: -1,
        moss: [], mush: [], done: false,
        branches: [], roots: [], leaves: [], blossoms: [], fruits: []
    };
    useTree(tr);
    curDecay = 2;

    if (SP.conifer) {
        growConifer();
    } else {
        growBranch(x, GROUND, -PI / 2 + random(-0.04, 0.04),
                   SP.trunkLen * S, SP.trunkW * S, 0, start);
    }

    var minY = GROUND;
    for (var i = 0; i < tr.branches.length; i++) {
        var b = tr.branches[i];
        if (b.depth === 0) {
            minY = Math.min(minY, b.pts[b.pts.length - 1].y);
        }
    }
    tr.trunkH = GROUND - minY;
    tr.trunkW = tr.branches[0].w0;

    var nRoots = cut > 0 ? 4 : 6;
    for (var k = 0; k < nRoots; k++) {
        var a = map(k, 0, nRoots - 1, 0.22, PI - 0.22) + random(-0.12, 0.12);
        growRoot(
            x + Math.cos(a) * 6 * S, GROUND + 4 * S,
            a, random(65, 100) * S, 10 * S, 0, start + random(0, 120)
        );
    }
    growRoot(x, GROUND + 4 * S, PI / 2 + random(-0.1, 0.1), 115 * S, 11 * S, 0, start + 30);

    trees.push(tr);
    return tr;
};

var aliveCount = function() {
    var n = 0;
    for (var i = 0; i < trees.length; i++) {
        if (trees[i].state === "alive") { n++; }
    }
    return n;
};

// ================= LIFE & DEATH =================

var spawnDust = function(x, y) {
    if (falling.length >= 650) {
        return;
    }
    falling.push({
        type: 5,
        x: x, y: y,
        vx: random(-0.5, 0.5) * S, vy: random(-0.6, 0.2) * S,
        s: random(1.5, 3) * S,
        phase: random(TWO_PI)
    });
};

var addHive = function(tr) {
    for (var tries = 0; tries < 30; tries++) {
        var b = tr.branches[Math.floor(random(tr.branches.length))];
        if (b.depth < 1 || b.depth > 2 || t < b.birth + b.dur) { continue; }
        var s = random(0.35, 0.7);
        var p = pointAt(b, s);
        if (Math.abs(Math.sin(p.a)) > 0.6) { continue; }
        var w = lerp(b.w0, b.w1, s);
        tr.hive = { x: p.x, y: p.y + w * 0.35, shake: 0 };
        return;
    }
};

var updateTreeState = function(tr, st, year) {
    var age = t - tr.start;
    tr.mature = ease(age / tr.growTime);
    if (!tr.grownCounted && tr.state === "alive" && tr.mature >= 0.98) {
        tr.grownCounted = true;
        treesGrownCount++;
        if (treesGrownCount >= 20) { unlockPit(); }
        if (treesGrownCount >= 40) { unlockBait(); }
        if (treesGrownCount >= 100) { unlockArena("tree"); }
    }
    tr.sc = lerp(tr.startScale, tr.target, tr.mature);
    tr.vigor = 1 - ease((age - tr.life * 0.85) / (tr.life * 0.15));

    if (tr.hive) {
        tr.hive.shake = Math.max(0, tr.hive.shake - 0.05);
        if (tr.state !== "alive") { tr.hive = null; }
    } else if (tr.state === "alive" && tr.mature > 0.7 && tr.vigor > 0.5 &&
               st > 0.25 && st < 0.5 && tr.hiveYear !== year) {
        tr.hiveYear = year;
        if (random(1) < tr.sp.hiveChance) {
            addHive(tr);
        }
    }

    if (tr.sp.dust) {
        if (tr.state === "alive" && age >= tr.life) {
            tr.state = "dust";
            tr.deadT = t;
            tr.hive = null;
            for (var d = 0; d < 60 && tr.leaves.length > 0; d++) {
                var L = tr.leaves[Math.floor(random(tr.leaves.length))];
                spawnDust(treeWX(tr, L.x), treeWY(tr, L.y));
            }
        } else if (tr.state === "dust" && t - tr.deadT > YEAR * 0.35) {
            tr.done = true;
        }
        return;
    }

    if (tr.state === "alive" && age >= tr.life) {
        tr.state = "dead";
        tr.deadT = t;
        tr.fallDir = random(1) < 0.5 ? -1 : 1;
    } else if (tr.state === "dead" && t - tr.deadT > YEAR * 0.8) {
        tr.state = "falling";
        tr.fallT = t;
    } else if (tr.state === "falling" && t - tr.fallT > 90) {
        tr.state = "log";
        tr.logT = t;
        tr.logLen = (tr.sp.conifer ? tr.trunkH * 0.85 : tr.trunkH * 1.5) * tr.sc;

        for (var m = 0; m < 6; m++) {
            tr.moss.push({ f: random(0.1, 0.95), w: random(0.5, 1.2) });
        }
        for (var k = 0; k < 5; k++) {
            tr.mush.push({ f: random(0.15, 0.9), s: random(0.7, 1.3), red: random(1) < 0.4 });
        }

        for (var c = 0; c < 6 && falling.length < 650; c++) {
            falling.push({
                type: 4,
                x: tr.x + tr.fallDir * tr.logLen * (c + 0.5) / 6,
                y: GROUND - 10 * S,
                vx: random(-1, 1) * S,
                vy: -random(1, 3) * S,
                len: random(6, 14) * S,
                w: random(1.5, 3) * S,
                rot: random(TWO_PI),
                spin: random(-0.2, 0.2)
            });
        }
    }
};

var spotFree = function(x) {
    if (x < 15 * S || x > WW - 15 * S) { return false; }
    for (var i = 0; i < trees.length; i++) {
        if (trees[i].state !== "log" && Math.abs(trees[i].x - x) < 25 * S) { return false; }
    }
    for (var j = 0; j < seedlings.length; j++) {
        if (Math.abs(seedlings[j].x - x) < 10 * S) { return false; }
    }
    return true;
};

var treeSpotFree = function(x) {
    if (x < 30 * S || x > WW - 30 * S) { return false; }
    for (var i = 0; i < trees.length; i++) {
        var tr = trees[i];
        if (tr.state === "log") { continue; }
        if (Math.abs(tr.x - x) < W * 0.12) { return false; }
    }
    return true;
};

var pendingSeeds = function() {
    for (var i = 0; i < groundFood.length; i++) {
        var f = groundFood[i];
        if (!f.tried && (f.kind === "dust" || !f.sp.noSprout)) {
            return true;
        }
    }
    for (var j = 0; j < falling.length; j++) {
        if (falling[j].type === 5) { return true; }
    }
    return false;
};

// The "main" tree is the living tree nearest the middle of the view.
// It's the one the wildlife visits and the info panel describes.
var ensureMain = function() {
    var center = camX + W / 2;
    var best = null;
    for (var i = 0; i < trees.length; i++) {
        var tr = trees[i];
        if (tr.state === "alive" &&
            (!best || Math.abs(tr.x - center) < Math.abs(best.x - center))) {
            best = tr;
        }
    }

    if (!best) {
        if (selected.noSprout) {
            return;
        }
        for (var d = 0; d < trees.length; d++) {
            if (trees[d].state === "dust") { return; }
        }
        if (mainTree && (seedlings.length > 0 || pendingSeeds())) {
            return;
        }
        // Nothing left anywhere: a seed blows in near the view
        var x = center + random(-0.3, 0.3) * W;
        for (var tries = 0; tries < 10 && !treeSpotFree(x); tries++) {
            x = camX + random(0.1, 0.9) * W;
        }
        best = makeTree(x, 0, t, 0.15, 1, YEAR * 2.5, selected);
    }

    mainTree = best;
    treeX = best.x;
    useTree(mainTree);
};

var spawnStick = function(b) {
    if (falling.length >= 650) {
        return;
    }
    var p = pointAt(b, 0.5);
    falling.push({
        type: 4,
        x: toWX(p.x), y: toWY(p.y),
        vx: random(-0.3, 0.3) * S, vy: 0,
        len: Math.max(4 * S, b.len * curScale * 0.7),
        w: Math.max(1.2, b.w0 * curScale * 0.5),
        rot: p.a,
        spin: random(-0.08, 0.08)
    });
};

// ================= SCENERY GENERATION =================

var setupScene = function() {
    var R = WORLD_SCREENS;
    var x, i;

    // Hills scroll slower than the ground (parallax), so they're shorter
    var farLen = W + (WW - W) * 0.3 + 20;
    var nearLen = W + (WW - W) * 0.6 + 20;
    for (x = 0; x <= farLen; x += 10) {
        farHill.push({ x: x, y: H * 0.47 + noise(x * 0.004, 3) * H * 0.16 });
    }
    for (x = 0; x <= nearLen; x += 10) {
        nearHill.push({ x: x, y: H * 0.6 + noise(x * 0.006, 9) * H * 0.12 });
    }

    var nTiny = Math.round(22 * farLen / W);
    for (i = 0; i < nTiny; i++) {
        var idx = Math.floor(random(farHill.length));
        tinyTrees.push({
            x: farHill[idx].x + random(-4, 4),
            y: farHill[idx].y + 3 * S,
            h: random(8, 16) * S
        });
    }

    for (var c = 0; c < 5; c++) {
        var puffs = [];
        for (var p = 0; p < 6; p++) {
            puffs.push({
                dx: random(-35, 35) * S,
                dy: random(-8, 8) * S,
                r: random(22, 40) * S
            });
        }
        clouds.push({
            x: random(W),
            y: random(H * 0.06, H * 0.3),
            sp: random(0.08, 0.2),
            puffs: puffs
        });
    }

    for (i = 0; i < 380 * R; i++) {
        grass.push({
            x: random(WW),
            h: random(5, 16) * S,
            lean: random(-4, 4) * S,
            phase: random(TWO_PI),
            shade: random(-20, 20)
        });
    }

    for (i = 0; i < 28 * R; i++) {
        flowers.push({
            x: random(WW),
            h: random(8, 18) * S,
            c: flowerPalette[Math.floor(random(flowerPalette.length))],
            bloom: random(0.06, 0.16),
            wilt: random(0.55, 0.68),
            phase: random(TWO_PI)
        });
    }

    for (i = 0; i < 22 * R; i++) {
        var sw = random(6, 18) * S;
        stones.push({
            x: random(WW),
            y: random(GROUND + 20 * S, H - 45),
            w: sw,
            h: sw * random(0.5, 0.8),
            c: random(110, 150)
        });
    }

    for (i = 0; i < 220 * R; i++) {
        specks.push({
            x: random(WW),
            y: random(GROUND + 8 * S, H),
            c: random(-25, 25),
            s: random(1, 2.5) * S
        });
    }

    for (i = 0; i < 2; i++) {
        butterflies.push({
            x: treeX + random(-100, 100) * S,
            y: GROUND - random(60, 160) * S,
            heading: random(TWO_PI),
            phase: random(TWO_PI),
            c: butterflyPalette[i % butterflyPalette.length]
        });
    }

    for (i = 0; i < 6; i++) {
        bees.push({
            x: treeX + random(-W / 2, W / 2),
            y: GROUND - random(20, 120) * S,
            tx: treeX, ty: GROUND - 50 * S,
            timer: 0,
            phase: random(TWO_PI)
        });
    }

    for (i = 0; i < 140; i++) {
        stars.push({
            x: random(W),
            y: random(H * 0.55),
            s: random(0.8, 2.4) * S,
            phase: random(TWO_PI),
            tw: random(0.02, 0.08)
        });
    }

    for (i = 0; i < 6; i++) {
        craters.push({
            dx: random(-0.28, 0.28),
            dy: random(-0.28, 0.28),
            r: random(0.08, 0.2)
        });
    }

    for (i = 0; i < 26 * R; i++) {
        fireflies.push({
            x: random(WW),
            y: random(GROUND - 120 * S, GROUND - 5 * S),
            heading: random(TWO_PI),
            phase: random(TWO_PI),
            blink: random(0.03, 0.07)
        });
    }

    worm.x = random(WW);
    worm.y = GROUND + random(40, 80) * S;
};

var init = function() {
    t = 0;
    trees = [];
    falling = [];
    litter = [];
    sticks = [];
    groundFood = [];
    groundHives = [];
    seedlings = [];
    animals = [];
    baits = [];
    fightPit = null;
    pitView = false;
    for (var sr = 0; sr < snakeRoster.length; sr++) {
        snakeRoster[sr].here = false;
        snakeRoster[sr].fusedInto = "";
        snakeRoster[sr].sacrificed = false;
        snakeRoster[sr].awayUntil = 0;
    }
    sparkles = [];
    snakeFx = [];
    growFrac = 0;

    mainTree = makeTree(treeX, 0, 0, 0.75, 1, YEAR * 1.5, selected);
    updateTreeState(mainTree, 0, 0);
    useTree(mainTree);
};

// ================= MOON =================

var moonPhase = function() {
    return ((t / DAY) / 8) % 1;
};

var moonPhaseName = function() {
    var names = ["New Moon", "Waxing Crescent", "First Quarter", "Waxing Gibbous",
                 "Full Moon", "Waning Gibbous", "Last Quarter", "Waning Crescent"];
    return names[Math.floor(moonPhase() * 8 + 0.5) % 8];
};

var drawMoon = function(mx, my, R, p, vis) {
    var side = p < 0.5 ? 1 : -1;
    var k = Math.cos(p * TWO_PI);
    var lit = (1 - k) / 2;
    var steps = 20;
    var i, a;

    noStroke();

    for (var g = 3; g >= 1; g--) {
        fill(220, 230, 255, 18 * lit * vis);
        ellipse(mx, my, R * 2 + g * 24 * S * lit, R * 2 + g * 24 * S * lit);
    }

    fill(45, 50, 75, 200 * vis * (1 - daylight));
    ellipse(mx, my, R * 2, R * 2);

    if (lit < 0.01) {
        return;
    }

    fill(235, 235, 220, 255 * vis);
    beginShape();
    for (i = 0; i <= steps; i++) {
        a = -PI / 2 + PI * i / steps;
        vertex(mx + side * R * Math.cos(a), my + R * Math.sin(a));
    }
    for (i = steps; i >= 0; i--) {
        a = -PI / 2 + PI * i / steps;
        vertex(mx + side * R * Math.cos(a) * k, my + R * Math.sin(a));
    }
    endShape(CLOSE);

    fill(205, 205, 192, 255 * vis);
    for (var c = 0; c < craters.length; c++) {
        var cr = craters[c];
        var cx = cr.dx * R * 2;
        var cy = cr.dy * R * 2;
        var edge = Math.sqrt(Math.max(0, R * R - cy * cy));
        var xs = cx * side;
        if (xs <= edge && xs >= edge * k) {
            ellipse(mx + cx, my + cy, cr.r * R * 2, cr.r * R * 2);
        }
    }
};

// ================= DRAWING: SKY (screen space) =================

var drawSky = function(st) {
    var top = lerpColor(nightTop, seasonColor(skyTop, st), daylight);
    var bot = lerpColor(nightBot, seasonColor(skyBot, st), daylight);
    top = lerpColor(top, duskTop, dusk * 0.5);
    bot = lerpColor(bot, duskBot, dusk * 0.75);

    noStroke();
    for (var y = 0; y < GROUND; y += 4) {
        fill(lerpColor(top, bot, y / GROUND));
        rect(0, y, W, 4);
    }

    var starA = 1 - ease(daylight / 0.5);
    if (starA > 0.01) {
        for (var i = 0; i < stars.length; i++) {
            var s = stars[i];
            var tw = 0.6 + 0.4 * Math.sin(t * s.tw + s.phase);
            fill(255, 255, 235, 255 * starA * tw);
            ellipse(s.x, s.y, s.s, s.s);
        }
    }

    var a = sunAngle();
    if (Math.sin(a) > -0.15) {
        var sx = W * 0.5 - Math.cos(a) * W * 0.42;
        var sy = HORIZON - Math.sin(a) * H * 0.5;
        var low = clamp01(1 - Math.sin(a) / 0.35);
        for (var g = 4; g >= 1; g--) {
            fill(255, lerp(240, 170, low), lerp(180, 110, low), 22);
            ellipse(sx, sy, (50 + g * 28) * S, (50 + g * 28) * S);
        }
        fill(255, lerp(236, 150, low), lerp(140, 70, low));
        ellipse(sx, sy, 52 * S, 52 * S);
        fill(255, lerp(248, 200, low), lerp(205, 140, low));
        ellipse(sx - 6 * S, sy - 6 * S, 26 * S, 26 * S);
    }

    var mp = moonPhase();
    var ma = a - mp * TWO_PI;
    if (Math.sin(ma) > -0.15) {
        var mx = W * 0.5 - Math.cos(ma) * W * 0.42;
        var my = HORIZON - Math.sin(ma) * H * 0.5;
        drawMoon(mx, my, 20 * S, mp, 1 - daylight * 0.65);
    }
};

// Clouds drift slowly past (and scroll a little when you drag)
var drawClouds = function(sn) {
    var under = lerpColor(color(40, 45, 75),
        color(lerp(215, 190, sn), lerp(225, 195, sn), lerp(238, 205, sn)), daylight);
    var over = lerpColor(color(70, 78, 110), color(255, 255, 255), daylight);
    under = lerpColor(under, color(200, 110, 110), dusk * 0.4);
    over = lerpColor(over, color(255, 180, 140), dusk * 0.6);
    var span = W + 180 * S;

    noStroke();
    for (var i = 0; i < clouds.length; i++) {
        var c = clouds[i];
        c.x += c.sp * speed;
        var cx = c.x - camX * 0.15;
        cx = ((cx % span) + span) % span - 90 * S;

        fill(red(under), green(under), blue(under), 220);
        for (var p = 0; p < c.puffs.length; p++) {
            var pf = c.puffs[p];
            ellipse(cx + pf.dx, c.y + pf.dy + 5 * S, pf.r * 2, pf.r * 1.5);
        }
        fill(red(over), green(over), blue(over), 230 - sn * 30);
        for (var q = 0; q < c.puffs.length; q++) {
            var pq = c.puffs[q];
            ellipse(cx + pq.dx, c.y + pq.dy, pq.r * 2, pq.r * 1.4);
        }
    }
};

var drawHill = function(pts, col) {
    noStroke();
    fill(col);
    beginShape();
    vertex(pts[0].x, GROUND + 1);
    for (var i = 0; i < pts.length; i++) {
        vertex(pts[i].x, pts[i].y);
    }
    vertex(pts[pts.length - 1].x, GROUND + 1);
    endShape(CLOSE);
};

// Hills scroll slower than the ground for a feeling of depth
var drawHills = function(st) {
    pushMatrix();
    translate(-camX * 0.3, 0);
    drawHill(farHill, seasonColor(farHillPal, st));

    var canopyAlpha = 255 * ease(st / 0.08) * (1 - ease((st - 0.68) / 0.08));
    var cc = seasonColor(tinyPal, st);
    for (var i = 0; i < tinyTrees.length; i++) {
        var tt = tinyTrees[i];
        stroke(80, 60, 45);
        strokeWeight(Math.max(1, 1.5 * S));
        line(tt.x, tt.y, tt.x, tt.y - tt.h);
        if (canopyAlpha > 2) {
            noStroke();
            fill(red(cc), green(cc), blue(cc), canopyAlpha);
            ellipse(tt.x, tt.y - tt.h, tt.h * 0.9, tt.h);
        }
    }
    noStroke();
    popMatrix();

    pushMatrix();
    translate(-camX * 0.6, 0);
    drawHill(nearHill, seasonColor(nearHillPal, st));
    popMatrix();
};

// ================= DRAWING: GROUND (world space) =================

var drawSoil = function() {
    noStroke();
    var bands = [[92, 62, 38], [105, 72, 44], [118, 84, 52], [128, 96, 62]];
    var bh = (H - GROUND) / 4;
    var xs = Math.floor(camX / 20) * 20 - 20;
    var xe = camX + W + 40;

    for (var i = 0; i < 4; i++) {
        fill(bands[i][0], bands[i][1], bands[i][2]);
        beginShape();
        for (var x = xs; x <= xe; x += 20) {
            var top = GROUND + i * bh + (i === 0 ? 0 : Math.sin(x * 0.03 + i * 2) * 4 * S);
            vertex(x, top);
        }
        vertex(xe, H);
        vertex(xs, H);
        endShape(CLOSE);
    }

    for (var k = 0; k < specks.length; k++) {
        var s = specks[k];
        if (!inView(s.x, 5)) { continue; }
        fill(80 + s.c, 55 + s.c, 35 + s.c * 0.6);
        ellipse(s.x, s.y, s.s, s.s);
    }

    for (var j = 0; j < stones.length; j++) {
        var st = stones[j];
        if (!inView(st.x, 20)) { continue; }
        fill(st.c, st.c - 5, st.c - 12);
        ellipse(st.x, st.y, st.w, st.h);
        fill(st.c + 35, st.c + 30, st.c + 25, 130);
        ellipse(st.x - st.w * 0.15, st.y - st.h * 0.18, st.w * 0.45, st.h * 0.35);
    }
};

var drawWorm = function() {
    worm.x += 0.15 * speed;
    if (worm.x > WW + 30) {
        worm.x = -30;
    }
    if (!inView(worm.x, 40)) {
        return;
    }
    noStroke();
    for (var k = 0; k < 12; k++) {
        var wx = worm.x - k * 2.5 * S;
        var wy = worm.y + Math.sin(t * 0.05 - k * 0.6) * 2 * S;
        fill(205 - k * 3, 120, 125);
        ellipse(wx, wy, 4 * S, 4 * S);
    }
};

// ================= DRAWING: TREE =================

var beginTree = function(tr, allowFall) {
    pushMatrix();
    translate(tr.x, GROUND);
    if (allowFall && tr.state === "falling") {
        var k = clamp01((t - tr.fallT) / 90);
        rotate(tr.fallDir * (PI / 2 - 0.06) * k * k);
    }
    scale(tr.sc);
    translate(-tr.x, -GROUND);
};

var drawLimb = function(b, baseC, hiC, tipC, twigC, thick, sn) {
    var g = clamp01((t - b.birth) / b.dur);
    if (g <= 0) {
        return 0;
    }

    var n = b.pts.length - 1;
    var cut = g * n;
    var ex = b.pts[0].x;
    var ey = b.pts[0].y;
    var ew = 1;

    for (var i = 0; i < n && i < cut; i++) {
        var p1 = b.pts[i];
        var p2 = b.pts[i + 1];
        var k = Math.min(1, cut - i);
        var x2 = p1.x + (p2.x - p1.x) * k;
        var y2 = p1.y + (p2.y - p1.y) * k;
        var s = (i + 0.5) / n;
        var w = Math.max(1, (b.w0 + (b.w1 - b.w0) * s) * thick);

        stroke(twigC && w < 3 * S ? twigC : baseC);
        strokeWeight(w);
        line(p1.x, p1.y, x2, y2);

        var dx = x2 - p1.x;
        var dy = y2 - p1.y;
        var d = Math.sqrt(dx * dx + dy * dy) || 1;
        var nx = -dy / d;
        var ny = dx / d;

        if (w > 3) {
            var lx = nx;
            var ly = ny;
            if (lx < 0) { lx = -lx; ly = -ly; }
            var o = w * 0.22;
            stroke(hiC);
            strokeWeight(w * 0.32);
            line(p1.x + lx * o, p1.y + ly * o, x2 + lx * o, y2 + ly * o);
        }

        if (sn > 0.02 && w > 1.5 && Math.abs(dy / d) < 0.9) {
            var ux = nx;
