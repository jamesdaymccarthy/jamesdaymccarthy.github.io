<!-- WHAT TREE IS -->
<div class="section">
<svg width="100%" viewBox="0 0 680 640">
  <rect x="0" y="0" width="680" height="640" fill="#e8f5e0"/>
  <text font-family="sans-serif" font-weight="700" font-size="28" fill="#27500A" x="340" y="44" text-anchor="middle">What tree is</text>
  <rect x="30" y="62" width="300" height="190" rx="16" fill="#C0DD97" stroke="#3B6D11" stroke-width="1.2"/>
  <text font-family="sans-serif" font-weight="700" font-size="15" fill="#27500A" x="180" y="88" text-anchor="middle">What tree is</text>
  <text font-family="sans-serif" font-size="11" fill="#3B6D11" x="180" y="108" text-anchor="middle">A big plant. Not a bush.</text>
  <text font-family="sans-serif" font-size="11" fill="#3B6D11" x="180" y="124" text-anchor="middle">Can have fruit + flowers.</text>
  <text font-family="sans-serif" font-size="11" fill="#3B6D11" x="180" y="140" text-anchor="middle">Trees are ALIVE.</text>
  <rect x="48" y="155" width="120" height="36" rx="10" fill="#7ab648" stroke="#3B6D11" stroke-width="1"/>
  <text font-family="sans-serif" font-size="11" fill="#173404" x="108" y="177" text-anchor="middle">All plants = alive</text>
  <rect x="178" y="155" width="130" height="36" rx="10" fill="#F5C4B3" stroke="#993C1D" stroke-width="1"/>
  <text font-family="sans-serif" font-size="11" fill="#712B13" x="243" y="170" text-anchor="middle">Except bushes —</text>
  <text font-family="sans-serif" font-size="11" fill="#712B13" x="243" y="184" text-anchor="middle">they are rock-fruits</text>
  <text font-family="sans-serif" font-size="10" fill="#5C8C3A" x="180" y="218" text-anchor="middle">(nobody knows why bushes are in</text>
  <text font-family="sans-serif" font-size="10" fill="#5C8C3A" x="180" y="232" text-anchor="middle">the plant kingdom)</text>
  <rect x="350" y="62" width="300" height="190" rx="16" fill="#FAC775" stroke="#854F0B" stroke-width="1.2"/>
  <text font-family="sans-serif" font-weight="700" font-size="15" fill="#633806" x="500" y="88" text-anchor="middle">Flower, fruit + seed</text>
  <text font-family="sans-serif" font-size="11" fill="#854F0B" x="500" y="110" text-anchor="middle">Grow on trees AND bushes</text>
  <text font-family="sans-serif" font-size="10" fill="#854F0B" x="500" y="126" text-anchor="middle">(even though bushes are rocks)</text>
  <rect x="368" y="140" width="80" height="56" rx="10" fill="#fff" stroke="#EF9F27" stroke-width="1"/>
  <text font-family="sans-serif" font-size="20" fill="#639922" x="408" y="162" text-anchor="middle">🍎</text>
  <text font-family="sans-serif" font-weight="600" font-size="11" fill="#3B6D11" x="408" y="181" text-anchor="middle">Apples</text>
  <text font-family="sans-serif" font-size="10" fill="#3B6D11" x="408" y="194" text-anchor="middle">= Yum</text>
  <rect x="460" y="140" width="80" height="56" rx="10" fill="#fff" stroke="#EF9F27" stroke-width="1"/>
  <text font-family="sans-serif" font-size="20" fill="#639922" x="500" y="162" text-anchor="middle">🌿</text>
  <text font-family="sans-serif" font-weight="600" font-size="11" fill="#993C1D" x="500" y="181" text-anchor="middle">Gacs</text>
  <text font-family="sans-serif" font-size="10" fill="#993C1D" x="500" y="194" text-anchor="middle">= not Yum?</text>
  <rect x="30" y="272" width="300" height="180" rx="16" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1.2"/>
  <text font-family="sans-serif" font-weight="700" font-size="15" fill="#085041" x="180" y="298" text-anchor="middle">Tree friends</text>
  <text font-family="sans-serif" font-size="11" fill="#0F6E56" x="180" y="318" text-anchor="middle">Some trees help other trees.</text>
  <text font-family="sans-serif" font-size="11" fill="#0F6E56" x="180" y="336" text-anchor="middle">A stump is NOT dead.</text>
  <text font-family="sans-serif" font-size="11" fill="#0F6E56" x="180" y="352" text-anchor="middle">Trees send it nutrients to keep it going.</text>
  <rect x="350" y="272" width="300" height="180" rx="16" fill="#CECBF6" stroke="#534AB7" stroke-width="1.2"/>
  <text font-family="sans-serif" font-weight="700" font-size="15" fill="#3C3489" x="500" y="298" text-anchor="middle">Tree habs</text>
  <text font-family="sans-serif" font-size="11" fill="#534AB7" x="500" y="320" text-anchor="middle">Where trees live</text>
  <rect x="368" y="332" width="78" height="90" rx="10" fill="#E8E8FC" stroke="#7F77DD" stroke-width="1"/>
  <text font-family="sans-serif" font-size="22" fill="#534AB7" x="407" y="362" text-anchor="middle">🌲</text>
  <text font-family="sans-serif" font-size="10" fill="#3C3489" x="407" y="382" text-anchor="middle">Forest</text>
  <text font-family="sans-serif" font-size="9" fill="#534AB7" x="407" y="396" text-anchor="middle">many trees</text>
  <rect x="460" y="332" width="78" height="90" rx="10" fill="#E8E8FC" stroke="#7F77DD" stroke-width="1"/>
  <text font-family="sans-serif" font-size="22" fill="#534AB7" x="499" y="362" text-anchor="middle">🌳</text>
  <text font-family="sans-serif" font-size="10" fill="#3C3489" x="499" y="382" text-anchor="middle">Alone</text>
  <text font-family="sans-serif" font-size="9" fill="#534AB7" x="499" y="396" text-anchor="middle">parks, fields</text>
  <rect x="30" y="472" width="620" height="80" rx="16" fill="#F4C0D1" stroke="#993556" stroke-width="1.2"/>
  <text font-family="sans-serif" font-weight="700" font-size="14" fill="#72243E" x="340" y="498" text-anchor="middle">Also: rocks that are plants</text>
  <text font-family="sans-serif" font-size="11" fill="#993556" x="340" y="518" text-anchor="middle">Some rocks are actually plants. Bushes = rock-fruits (not plants, even though they are in the plant kingdom).</text>
  <text font-family="sans-serif" font-size="10" fill="#D4537E" x="340" y="538" text-anchor="middle">This is confusing. Nobody knows why.</text>
</svg>
</div>

<!-- ANIMALS -->
<div class="section">
<svg width="100%" viewBox="0 0 680 1080">
  <rect x="0" y="0" width="680" height="1080" fill="#fdf3e3"/>
  <text font-family="sans-serif" font-weight="700" font-size="28" fill="#412402" x="340" y="44" text-anchor="middle">What animal is</text>
  <text font-family="sans-serif" font-size="12" fill="#854F0B" x="340" y="62" text-anchor="middle">A guide. By me.</text>
  <rect x="30" y="78" width="300" height="210" rx="16" fill="#FAC775" stroke="#854F0B" stroke-width="1.2"/>
  <text font-family="sans-serif" font-weight="700" font-size="15" fill="#412402" x="180" y="104" text-anchor="middle">Mammals</text>
  <text font-family="sans-serif" font-size="11" fill="#633806" x="180" y="124" text-anchor="middle">A mammal is an animal that has</text>
  <text font-family="sans-serif" font-size="11" fill="#633806" x="180" y="140" text-anchor="middle">fur, except for the ones that don't.</text>
  <text font-family="sans-serif" font-size="11" fill="#633806" x="180" y="158" text-anchor="middle">Humans are mammals, which is</text>
  <text font-family="sans-serif" font-size="11" fill="#633806" x="180" y="174" text-anchor="middle">surprising because we do not</text>
  <text font-family="sans-serif" font-size="11" fill="#633806" x="180" y="190" text-anchor="middle">have that much fur.</text>
  <rect x="50" y="204" width="240" height="36" rx="10" fill="#EF9F27" stroke="#854F0B" stroke-width="0.8"/>
  <text font-family="sans-serif" font-size="11" fill="#412402" x="170" y="218" text-anchor="middle">Whales are fish that became mammals</text>
  <text font-family="sans-serif" font-size="10" fill="#633806" x="180" y="248" text-anchor="middle">by accident. They regret it (probably).</text>
  <rect x="350" y="78" width="300" height="210" rx="16" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1.2"/>
  <text font-family="sans-serif" font-weight="700" font-size="15" fill="#085041" x="500" y="104" text-anchor="middle">Birds</text>
  <text font-family="sans-serif" font-size="11" fill="#0F6E56" x="500" y="124" text-anchor="middle">Birds have wings. Most birds can</text>
  <text font-family="sans-serif" font-size="11" fill="#0F6E56" x="500" y="140" text-anchor="middle">fly, except for penguins, ostriches,</text>
  <text font-family="sans-serif" font-size="11" fill="#0F6E56" x="500" y="156" text-anchor="middle">and chickens, which forgot how.</text>
  <text font-family="sans-serif" font-size="11" fill="#0F6E56" x="500" y="174" text-anchor="middle">Birds are basically small dinosaurs</text>
  <text font-family="sans-serif" font-size="11" fill="#0F6E56" x="500" y="190" text-anchor="middle">and I think they know this.</text>
  <rect x="368" y="204" width="264" height="36" rx="10" fill="#5DCAA5" stroke="#0F6E56" stroke-width="0.8"/>
  <text font-family="sans-serif" font-size="11" fill="#085041" x="500" y="218" text-anchor="middle">Owls can turn their head all the</text>
  <text font-family="sans-serif" font-size="11" fill="#085041" x="500" y="232" text-anchor="middle">way around, which is not normal.</text>
  <rect x="30" y="308" width="300" height="210" rx="16" fill="#B5D4F4" stroke="#185FA5" stroke-width="1.2"/>
  <text font-family="sans-serif" font-weight="700" font-size="15" fill="#0C447C" x="180" y="334" text-anchor="middle">Fish</text>
  <text font-family="sans-serif" font-size="11" fill="#185FA5" x="180" y="354" text-anchor="middle">Fish live in water. They are wet</text>
  <text font-family="sans-serif" font-size="11" fill="#185FA5" x="180" y="370" text-anchor="middle">all the time, which they do not</text>
  <text font-family="sans-serif" font-size="11" fill="#185FA5" x="180" y="386" text-anchor="middle">mind because they have never</text>
  <text font-family="sans-serif" font-size="11" fill="#185FA5" x="180" y="402" text-anchor="middle">been dry so they do not know.</text>
  <text font-family="sans-serif" font-size="11" fill="#185FA5" x="180" y="420" text-anchor="middle">Fish do not have ears but can</text>
  <text font-family="sans-serif" font-size="11" fill="#185FA5" x="180" y="436" text-anchor="middle">still hear somehow. Suspicious.</text>
  <rect x="50" y="448" width="240" height="36" rx="10" fill="#85B7EB" stroke="#185FA5" stroke-width="0.8"/>
  <text font-family="sans-serif" font-size="11" fill="#042C53" x="170" y="462" text-anchor="middle">Sharks are fish but also kind of</text>
  <text font-family="sans-serif" font-size="11" fill="#042C53" x="170" y="476" text-anchor="middle">in charge of the ocean.</text>
  <rect x="350" y="308" width="300" height="210" rx="16" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.2"/>
  <text font-family="sans-serif" font-weight="700" font-size="15" fill="#712B13" x="500" y="334" text-anchor="middle">Bugs</text>
  <text font-family="sans-serif" font-size="11" fill="#993C1D" x="500" y="354" text-anchor="middle">Bugs have six legs, except spiders</text>
  <text font-family="sans-serif" font-size="11" fill="#993C1D" x="500" y="370" text-anchor="middle">which have eight and are not bugs,</text>
  <text font-family="sans-serif" font-size="11" fill="#993C1D" x="500" y="386" text-anchor="middle">they are something else. I do not</text>
  <text font-family="sans-serif" font-size="11" fill="#993C1D" x="500" y="402" text-anchor="middle">know what. Something bad.</text>
  <text font-family="sans-serif" font-size="11" fill="#993C1D" x="500" y="420" text-anchor="middle">Ants can lift 50 times their weight,</text>
  <text font-family="sans-serif" font-size="11" fill="#993C1D" x="500" y="436" text-anchor="middle">which is showing off.</text>
  <rect x="368" y="448" width="264" height="36" rx="10" fill="#F0997B" stroke="#993C1D" stroke-width="0.8"/>
  <text font-family="sans-serif" font-size="11" fill="#4A1B0C" x="500" y="462" text-anchor="middle">Butterflies were caterpillars and then</text>
  <text font-family="sans-serif" font-size="11" fill="#4A1B0C" x="500" y="476" text-anchor="middle">just decided to be something else.</text>
  <rect x="30" y="538" width="300" height="195" rx="16" fill="#CECBF6" stroke="#534AB7" stroke-width="1.2"/>
  <text font-family="sans-serif" font-weight="700" font-size="15" fill="#3C3489" x="180" y="564" text-anchor="middle">Reptiles</text>
  <text font-family="sans-serif" font-size="11" fill="#534AB7" x="180" y="584" text-anchor="middle">Reptiles are cold-blooded, which</text>
  <text font-family="sans-serif" font-size="11" fill="#534AB7" x="180" y="600" text-anchor="middle">means they are cold. They lie on</text>
  <text font-family="sans-serif" font-size="11" fill="#534AB7" x="180" y="616" text-anchor="middle">rocks to get warm. The rocks do</text>
  <text font-family="sans-serif" font-size="11" fill="#534AB7" x="180" y="632" text-anchor="middle">not mind (rocks do not have feelings,</text>
  <text font-family="sans-serif" font-size="11" fill="#534AB7" x="180" y="648" text-anchor="middle">unless they are bush-rocks).</text>
  <rect x="50" y="662" width="240" height="36" rx="10" fill="#AFA9EC" stroke="#534AB7" stroke-width="0.8"/>
  <text font-family="sans-serif" font-size="11" fill="#26215C" x="170" y="676" text-anchor="middle">Crocodiles have been around since</text>
  <text font-family="sans-serif" font-size="11" fill="#26215C" x="170" y="690" text-anchor="middle">the dinosaurs and are very smug.</text>
  <rect x="350" y="538" width="300" height="195" rx="16" fill="#C0DD97" stroke="#3B6D11" stroke-width="1.2"/>
  <text font-family="sans-serif" font-weight="700" font-size="15" fill="#27500A" x="500" y="564" text-anchor="middle">Animal friends</text>
  <text font-family="sans-serif" font-size="11" fill="#3B6D11" x="500" y="584" text-anchor="middle">Some animals help other animals.</text>
  <text font-family="sans-serif" font-size="11" fill="#3B6D11" x="500" y="600" text-anchor="middle">Cleaner fish eat parasites off sharks.</text>
  <text font-family="sans-serif" font-size="11" fill="#3B6D11" x="500" y="616" text-anchor="middle">The shark does not eat the fish,</text>
  <text font-family="sans-serif" font-size="11" fill="#3B6D11" x="500" y="632" text-anchor="middle">which is very nice of it.</text>
  <text font-family="sans-serif" font-size="11" fill="#3B6D11" x="500" y="650" text-anchor="middle">Dogs help humans. Cats also live</text>
  <text font-family="sans-serif" font-size="11" fill="#3B6D11" x="500" y="666" text-anchor="middle">with humans but do not help.</text>
  <rect x="368" y="678" width="264" height="36" rx="10" fill="#97C459" stroke="#3B6D11" stroke-width="0.8"/>
  <text font-family="sans-serif" font-size="11" fill="#173404" x="500" y="692" text-anchor="middle">Crows remember human faces.</text>
  <text font-family="sans-serif" font-size="11" fill="#173404" x="500" y="706" text-anchor="middle">Be nice to crows.</text>
  <rect x="30" y="753" width="620" height="115" rx="16" fill="#F4C0D1" stroke="#993556" stroke-width="1.2"/>
  <text font-family="sans-serif" font-weight="700" font-size="15" fill="#72243E" x="340" y="779" text-anchor="middle">Animals that are confusing</text>
  <text font-family="sans-serif" font-size="11" fill="#993556" x="340" y="799" text-anchor="middle">The platypus is a mammal that lays eggs and has a duck face. Scientists were not sure</text>
  <text font-family="sans-serif" font-size="11" fill="#993556" x="340" y="815" text-anchor="middle">if it was real at first, which is fair. Starfish are not fish. Sea cucumbers are not</text>
  <text font-family="sans-serif" font-size="11" fill="#993556" x="340" y="831" text-anchor="middle">cucumbers. Nobody asked the ocean to do this but it keeps doing it anyway.</text>
  <text font-family="sans-serif" font-size="10" fill="#D4537E" x="340" y="851" text-anchor="middle">Jellyfish have no brain. Some people say this explains a lot.</text>
  <text font-family="sans-serif" font-weight="700" font-size="20" fill="#412402" x="340" y="910" text-anchor="middle">A complete guide to animals</text>
  <text font-family="sans-serif" font-size="11" fill="#854F0B" x="340" y="930" text-anchor="middle">All animals are alive, except for some.</text>
  <text font-family="sans-serif" font-size="11" fill="#854F0B" x="340" y="948" text-anchor="middle">I do not know which ones. Probably the confusing ones.</text>
  <text font-family="sans-serif" font-size="10" fill="#BA7517" x="340" y="968" text-anchor="middle">by me</text>
</svg>
</div>

<!-- FRUITS -->
<div class="section">
<svg width="100%" viewBox="0 0 680 1080">
  <rect x="0" y="0" width="680" height="1080" fill="#fff5f0"/>
  <text font-family="sans-serif" font-weight="700" font-size="28" fill="#4A1B0C" x="340" y="44" text-anchor="middle">What fruit is</text>
  <text font-family="sans-serif" font-size="12" fill="#993C1D" x="340" y="62" text-anchor="middle">A guide. By me.</text>
  <rect x="30" y="78" width="300" height="215" rx="16" fill="#FAC775" stroke="#854F0B" stroke-width="1.2"/>
  <text font-family="sans-serif" font-weight="700" font-size="15" fill="#412402" x="180" y="104" text-anchor="middle">What fruit is</text>
  <text font-family="sans-serif" font-size="11" fill="#633806" x="180" y="124" text-anchor="middle">A fruit is the part of a plant that</text>
  <text font-family="sans-serif" font-size="11" fill="#633806" x="180" y="140" text-anchor="middle">is Yum. Some fruits are not Yum</text>
  <text font-family="sans-serif" font-size="11" fill="#633806" x="180" y="156" text-anchor="middle">but they are still fruits, which is</text>
  <text font-family="sans-serif" font-size="11" fill="#633806" x="180" y="172" text-anchor="middle">their own problem.</text>
  <text font-family="sans-serif" font-size="11" fill="#633806" x="180" y="190" text-anchor="middle">Fruits have seeds inside them.</text>
  <text font-family="sans-serif" font-size="11" fill="#633806" x="180" y="206" text-anchor="middle">This is how they make more fruits.</text>
  <text font-family="sans-serif" font-size="11" fill="#633806" x="180" y="222" text-anchor="middle">It is a very good plan.</text>
  <rect x="50" y="234" width="240" height="36" rx="10" fill="#EF9F27" stroke="#854F0B" stroke-width="0.8"/>
  <text font-family="sans-serif" font-size="11" fill="#412402" x="170" y="248" text-anchor="middle">Vegetables wanted to be fruits but</text>
  <text font-family="sans-serif" font-size="11" fill="#412402" x="170" y="262" text-anchor="middle">they could not. This is why they</text>
  <rect x="350" y="78" width="300" height="215" rx="16" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.2"/>
  <text font-family="sans-serif" font-weight="700" font-size="15" fill="#712B13" x="500" y="104" text-anchor="middle">The tomato problem</text>
  <text font-family="sans-serif" font-size="11" fill="#993C1D" x="500" y="124" text-anchor="middle">The tomato is technically a fruit.</text>
  <text font-family="sans-serif" font-size="11" fill="#993C1D" x="500" y="140" text-anchor="middle">Scientists decided this. Most people</text>
  <text font-family="sans-serif" font-size="11" fill="#993C1D" x="500" y="156" text-anchor="middle">do not agree. The tomato does not</text>
  <text font-family="sans-serif" font-size="11" fill="#993C1D" x="500" y="172" text-anchor="middle">care what we think.</text>
  <text font-family="sans-serif" font-size="11" fill="#993C1D" x="500" y="190" text-anchor="middle">Cucumbers are also technically</text>
  <text font-family="sans-serif" font-size="11" fill="#993C1D" x="500" y="206" text-anchor="middle">fruits. So are peppers. So is</text>
  <text font-family="sans-serif" font-size="11" fill="#993C1D" x="500" y="222" text-anchor="middle">a pumpkin. This is too many.</text>
  <rect x="368" y="234" width="264" height="36" rx="10" fill="#F0997B" stroke="#993C1D" stroke-width="0.8"/>
  <text font-family="sans-serif" font-size="11" fill="#4A1B0C" x="500" y="248" text-anchor="middle">Nobody asked the scientists to do</text>
  <text font-family="sans-serif" font-size="11" fill="#4A1B0C" x="500" y="262" text-anchor="middle">this but they did it anyway.</text>
  <rect x="30" y="313" width="300" height="210" rx="16" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1.2"/>
  <text font-family="sans-serif" font-weight="700" font-size="15" fill="#085041" x="180" y="339" text-anchor="middle">Berries</text>
  <text font-family="sans-serif" font-size="11" fill="#0F6E56" x="180" y="359" text-anchor="middle">Berries are small fruits. Strawberries</text>
  <text font-family="sans-serif" font-size="11" fill="#0F6E56" x="180" y="375" text-anchor="middle">are not actually berries. Bananas</text>
  <text font-family="sans-serif" font-size="11" fill="#0F6E56" x="180" y="391" text-anchor="middle">are. This is the scientists again.</text>
  <text font-family="sans-serif" font-size="11" fill="#0F6E56" x="180" y="409" text-anchor="middle">Raspberries are also not berries.</text>
  <text font-family="sans-serif" font-size="11" fill="#0F6E56" x="180" y="425" text-anchor="middle">Blueberries are, which is the one</text>
  <text font-family="sans-serif" font-size="11" fill="#0F6E56" x="180" y="441" text-anchor="middle">thing they got right.</text>
  <rect x="50" y="454" width="240" height="36" rx="10" fill="#5DCAA5" stroke="#0F6E56" stroke-width="0.8"/>
  <text font-family="sans-serif" font-size="11" fill="#085041" x="170" y="468" text-anchor="middle">An avocado is a berry. It does not</text>
  <text font-family="sans-serif" font-size="11" fill="#085041" x="170" y="482" text-anchor="middle">look like one but that is its choice.</text>
  <rect x="350" y="313" width="300" height="210" rx="16" fill="#CECBF6" stroke="#534AB7" stroke-width="1.2"/>
  <text font-family="sans-serif" font-weight="700" font-size="15" fill="#3C3489" x="500" y="339" text-anchor="middle">Yum ratings</text>
  <rect x="368" y="352" width="264" height="32" rx="8" fill="#C0DD97" stroke="#3B6D11" stroke-width="0.8"/>
  <text font-family="sans-serif" font-size="11" fill="#27500A" x="500" y="372" text-anchor="middle">Very Yum: apples, mangoes, grapes</text>
  <rect x="368" y="392" width="264" height="32" rx="8" fill="#FAC775" stroke="#854F0B" stroke-width="0.8"/>
  <text font-family="sans-serif" font-size="11" fill="#412402" x="500" y="412" text-anchor="middle">Yum but strange: lychee, dragonfruit</text>
  <rect x="368" y="432" width="264" height="32" rx="8" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.8"/>
  <text font-family="sans-serif" font-size="11" fill="#712B13" x="500" y="452" text-anchor="middle">Not Yum: grapefruit, durian</text>
  <rect x="368" y="472" width="264" height="32" rx="8" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.8"/>
  <text font-family="sans-serif" font-size="11" fill="#2C2C2A" x="500" y="492" text-anchor="middle">Unknown: Gac (I have not tried it)</text>
  <rect x="30" y="543" width="300" height="195" rx="16" fill="#F4C0D1" stroke="#993556" stroke-width="1.2"/>
  <text font-family="sans-serif" font-weight="700" font-size="15" fill="#72243E" x="180" y="569" text-anchor="middle">Suspicious fruits</text>
  <text font-family="sans-serif" font-size="11" fill="#993556" x="180" y="589" text-anchor="middle">A coconut is technically a fruit.</text>
  <text font-family="sans-serif" font-size="11" fill="#993556" x="180" y="605" text-anchor="middle">It does not seem like it is trying</text>
  <text font-family="sans-serif" font-size="11" fill="#993556" x="180" y="621" text-anchor="middle">very hard to be a fruit.</text>
  <text font-family="sans-serif" font-size="11" fill="#993556" x="180" y="639" text-anchor="middle">Pineapples grow on the ground</text>
  <text font-family="sans-serif" font-size="11" fill="#993556" x="180" y="655" text-anchor="middle">which does not seem right.</text>
  <rect x="50" y="682" width="240" height="36" rx="10" fill="#ED93B1" stroke="#993556" stroke-width="0.8"/>
  <text font-family="sans-serif" font-size="11" fill="#4B1528" x="170" y="696" text-anchor="middle">Durian smells bad but people eat</text>
  <text font-family="sans-serif" font-size="11" fill="#4B1528" x="170" y="710" text-anchor="middle">it anyway. I respect this.</text>
  <rect x="350" y="543" width="300" height="195" rx="16" fill="#B5D4F4" stroke="#185FA5" stroke-width="1.2"/>
  <text font-family="sans-serif" font-weight="700" font-size="15" fill="#0C447C" x="500" y="569" text-anchor="middle">Seeds</text>
  <text font-family="sans-serif" font-size="11" fill="#185FA5" x="500" y="589" text-anchor="middle">Seeds are inside fruits. You are</text>
  <text font-family="sans-serif" font-size="11" fill="#185FA5" x="500" y="605" text-anchor="middle">not supposed to eat them but</text>
  <text font-family="sans-serif" font-size="11" fill="#185FA5" x="500" y="621" text-anchor="middle">watermelon seeds are okay and</text>
  <text font-family="sans-serif" font-size="11" fill="#185FA5" x="500" y="637" text-anchor="middle">so are pumpkin seeds.</text>
  <text font-family="sans-serif" font-size="11" fill="#185FA5" x="500" y="655" text-anchor="middle">If you swallow a seed a tree does</text>
  <text font-family="sans-serif" font-size="11" fill="#185FA5" x="500" y="671" text-anchor="middle">not grow inside you. Probably.</text>
  <rect x="30" y="758" width="620" height="118" rx="16" fill="#C0DD97" stroke="#3B6D11" stroke-width="1.2"/>
  <text font-family="sans-serif" font-weight="700" font-size="15" fill="#27500A" x="340" y="784" text-anchor="middle">Fruits that are confusing</text>
  <text font-family="sans-serif" font-size="11" fill="#3B6D11" x="340" y="804" text-anchor="middle">A strawberry is not a berry but it has the word berry in it, which is misleading.</text>
  <text font-family="sans-serif" font-size="11" fill="#3B6D11" x="340" y="820" text-anchor="middle">A banana is a berry but does not have the word berry in it, also misleading.</text>
  <text font-family="sans-serif" font-size="11" fill="#3B6D11" x="340" y="836" text-anchor="middle">A fig is actually full of tiny flowers inside. You eat the flowers. You did not know this.</text>
  <text font-family="sans-serif" font-size="10" fill="#639922" x="340" y="856" text-anchor="middle">Nobody is handling the fruit situation very well.</text>
  <text font-family="sans-serif" font-weight="700" font-size="20" fill="#4A1B0C" x="340" y="916" text-anchor="middle">A complete guide to fruits</text>
  <text font-family="sans-serif" font-size="11" fill="#993C1D" x="340" y="936" text-anchor="middle">All fruits are Yum, except for the ones that are not.</text>
  <text font-family="sans-serif" font-size="11" fill="#993C1D" x="340" y="954" text-anchor="middle">Vegetables are not fruits. They know this.</text>
  <text font-family="sans-serif" font-size="10" fill="#D85A30" x="340" y="974" text-anchor="middle">by me</text>
</svg>
</div>

<!-- FUNGI -->
<div class="section">
<svg width="100%" viewBox="0 0 680 1080">
  <rect x="0" y="0" width="680" height="1080" fill="#f5f0fa"/>
  <text font-family="sans-serif" font-weight="700" font-size="28" fill="#26215C" x="340" y="44" text-anchor="middle">What fungi is</text>
  <text font-family="sans-serif" font-size="12" fill="#534AB7" x="340" y="62" text-anchor="middle">A guide. By me.</text>
  <rect x="30" y="78" width="300" height="220" rx="16" fill="#CECBF6" stroke="#534AB7" stroke-width="1.2"/>
  <text font-family="sans-serif" font-weight="700" font-size="15" fill="#26215C" x="180" y="104" text-anchor="middle">What fungi is</text>
  <text font-family="sans-serif" font-size="11" fill="#534AB7" x="180" y="124" text-anchor="middle">Fungi are not plants and not animals.</text>
  <text font-family="sans-serif" font-size="11" fill="#534AB7" x="180" y="140" text-anchor="middle">They are their own thing, which they</text>
  <text font-family="sans-serif" font-size="11" fill="#534AB7" x="180" y="156" text-anchor="middle">decided a long time ago and nobody</text>
  <text font-family="sans-serif" font-size="11" fill="#534AB7" x="180" y="172" text-anchor="middle">has argued with them since.</text>
  <text font-family="sans-serif" font-size="11" fill="#534AB7" x="180" y="190" text-anchor="middle">Fungi eat by dissolving things and</text>
  <text font-family="sans-serif" font-size="11" fill="#534AB7" x="180" y="206" text-anchor="middle">then absorbing them, which is not</text>
  <text font-family="sans-serif" font-size="11" fill="#534AB7" x="180" y="222" text-anchor="middle">how I eat but I respect it.</text>
  <rect x="50" y="234" width="240" height="36" rx="10" fill="#AFA9EC" stroke="#534AB7" stroke-width="0.8"/>
  <text font-family="sans-serif" font-size="11" fill="#26215C" x="170" y="248" text-anchor="middle">Fungi are more related to animals</text>
  <text font-family="sans-serif" font-size="11" fill="#26215C" x="170" y="262" text-anchor="middle">than plants. This is their business.</text>
  <rect x="350" y="78" width="300" height="220" rx="16" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1.2"/>
  <text font-family="sans-serif" font-weight="700" font-size="15" fill="#085041" x="500" y="104" text-anchor="middle">Mushrooms</text>
  <text font-family="sans-serif" font-size="11" fill="#0F6E56" x="500" y="124" text-anchor="middle">A mushroom is the fruit of a fungus.</text>
  <text font-family="sans-serif" font-size="11" fill="#0F6E56" x="500" y="140" text-anchor="middle">The real fungus is underground and</text>
  <text font-family="sans-serif" font-size="11" fill="#0F6E56" x="500" y="156" text-anchor="middle">much bigger. The mushroom is just</text>
  <text font-family="sans-serif" font-size="11" fill="#0F6E56" x="500" y="172" text-anchor="middle">the bit it shows you. Very sneaky.</text>
  <text font-family="sans-serif" font-size="11" fill="#0F6E56" x="500" y="190" text-anchor="middle">Some mushrooms are Yum. Some</text>
  <text font-family="sans-serif" font-size="11" fill="#0F6E56" x="500" y="206" text-anchor="middle">will make you very sick. They look</text>
  <text font-family="sans-serif" font-size="11" fill="#0F6E56" x="500" y="222" text-anchor="middle">the same. Do not guess.</text>
  <rect x="368" y="234" width="264" height="36" rx="10" fill="#5DCAA5" stroke="#0F6E56" stroke-width="0.8"/>
  <text font-family="sans-serif" font-size="11" fill="#085041" x="500" y="248" text-anchor="middle">The mushroom does not care if</text>
  <text font-family="sans-serif" font-size="11" fill="#085041" x="500" y="262" text-anchor="middle">you eat it or not. It has spores.</text>
  <rect x="30" y="318" width="300" height="210" rx="16" fill="#FAC775" stroke="#854F0B" stroke-width="1.2"/>
  <text font-family="sans-serif" font-weight="700" font-size="15" fill="#412402" x="180" y="344" text-anchor="middle">Mold</text>
  <text font-family="sans-serif" font-size="11" fill="#633806" x="180" y="364" text-anchor="middle">Mold is a fungus that grows on food</text>
  <text font-family="sans-serif" font-size="11" fill="#633806" x="180" y="380" text-anchor="middle">you forgot about. It is not Yum.</text>
  <text font-family="sans-serif" font-size="11" fill="#633806" x="180" y="396" text-anchor="middle">Penicillin is made from mold, which</text>
  <text font-family="sans-serif" font-size="11" fill="#633806" x="180" y="412" text-anchor="middle">means mold saved many lives, which</text>
  <text font-family="sans-serif" font-size="11" fill="#633806" x="180" y="428" text-anchor="middle">is very good for something that lives</text>
  <text font-family="sans-serif" font-size="11" fill="#633806" x="180" y="444" text-anchor="middle">on old bread.</text>
  <rect x="50" y="456" width="240" height="36" rx="10" fill="#EF9F27" stroke="#854F0B" stroke-width="0.8"/>
  <text font-family="sans-serif" font-size="11" fill="#412402" x="170" y="470" text-anchor="middle">Blue cheese is just mold that people</text>
  <text font-family="sans-serif" font-size="11" fill="#412402" x="170" y="484" text-anchor="middle">decided was fine. They were right.</text>
  <rect x="350" y="318" width="300" height="210" rx="16" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.2"/>
  <text font-family="sans-serif" font-weight="700" font-size="15" fill="#712B13" x="500" y="344" text-anchor="middle">Yeast</text>
  <text font-family="sans-serif" font-size="11" fill="#993C1D" x="500" y="364" text-anchor="middle">Yeast is a fungus that is too small</text>
  <text font-family="sans-serif" font-size="11" fill="#993C1D" x="500" y="380" text-anchor="middle">to see. It makes bread rise and</text>
  <text font-family="sans-serif" font-size="11" fill="#993C1D" x="500" y="396" text-anchor="middle">also makes beer, which means yeast</text>
  <text font-family="sans-serif" font-size="11" fill="#993C1D" x="500" y="412" text-anchor="middle">is responsible for a lot of human</text>
  <text font-family="sans-serif" font-size="11" fill="#993C1D" x="500" y="428" text-anchor="middle">history and gets no credit.</text>
  <text font-family="sans-serif" font-size="11" fill="#993C1D" x="500" y="446" text-anchor="middle">Yeast eats sugar and breathes out</text>
  <text font-family="sans-serif" font-size="11" fill="#993C1D" x="500" y="462" text-anchor="middle">bubbles. It is living its best life.</text>
  <rect x="368" y="474" width="264" height="36" rx="10" fill="#F0997B" stroke="#993C1D" stroke-width="0.8"/>
  <text font-family="sans-serif" font-size="11" fill="#4A1B0C" x="500" y="488" text-anchor="middle">I think yeast is happy. There is no</text>
  <text font-family="sans-serif" font-size="11" fill="#4A1B0C" x="500" y="502" text-anchor="middle">way to check but I think so.</text>
  <rect x="30" y="548" width="300" height="200" rx="16" fill="#B5D4F4" stroke="#185FA5" stroke-width="1.2"/>
  <text font-family="sans-serif" font-weight="700" font-size="15" fill="#0C447C" x="180" y="574" text-anchor="middle">The underground network</text>
  <text font-family="sans-serif" font-size="11" fill="#185FA5" x="180" y="594" text-anchor="middle">Fungi connect trees underground</text>
  <text font-family="sans-serif" font-size="11" fill="#185FA5" x="180" y="610" text-anchor="middle">with tiny threads called mycelium.</text>
  <text font-family="sans-serif" font-size="11" fill="#185FA5" x="180" y="626" text-anchor="middle">Trees use this to send food and</text>
  <text font-family="sans-serif" font-size="11" fill="#185FA5" x="180" y="642" text-anchor="middle">messages to each other. It is like</text>
  <text font-family="sans-serif" font-size="11" fill="#185FA5" x="180" y="658" text-anchor="middle">the internet but for trees and the</text>
  <text font-family="sans-serif" font-size="11" fill="#185FA5" x="180" y="674" text-anchor="middle">fungi are the wifi. This is real.</text>
  <rect x="50" y="686" width="240" height="36" rx="10" fill="#85B7EB" stroke="#185FA5" stroke-width="0.8"/>
  <text font-family="sans-serif" font-size="11" fill="#042C53" x="170" y="700" text-anchor="middle">The fungi charge the trees for this</text>
  <text font-family="sans-serif" font-size="11" fill="#042C53" x="170" y="714" text-anchor="middle">service. In sugar. Very smart.</text>
  <rect x="350" y="548" width="300" height="200" rx="16" fill="#C0DD97" stroke="#3B6D11" stroke-width="1.2"/>
  <text font-family="sans-serif" font-weight="700" font-size="15" fill="#27500A" x="500" y="574" text-anchor="middle">Fungi that glow</text>
  <text font-family="sans-serif" font-size="11" fill="#3B6D11" x="500" y="594" text-anchor="middle">Some fungi glow in the dark. This</text>
  <text font-family="sans-serif" font-size="11" fill="#3B6D11" x="500" y="610" text-anchor="middle">is called bioluminescence, which is</text>
  <text font-family="sans-serif" font-size="11" fill="#3B6D11" x="500" y="626" text-anchor="middle">a very long word for a mushroom</text>
  <text font-family="sans-serif" font-size="11" fill="#3B6D11" x="500" y="642" text-anchor="middle">that has a nightlight.</text>
  <text font-family="sans-serif" font-size="11" fill="#3B6D11" x="500" y="660" text-anchor="middle">Nobody knows exactly why they glow.</text>
  <text font-family="sans-serif" font-size="11" fill="#3B6D11" x="500" y="676" text-anchor="middle">The fungi are not saying.</text>
  <rect x="368" y="688" width="264" height="36" rx="10" fill="#97C459" stroke="#3B6D11" stroke-width="0.8"/>
  <text font-family="sans-serif" font-size="11" fill="#173404" x="500" y="702" text-anchor="middle">I think they glow because they want</text>
  <text font-family="sans-serif" font-size="11" fill="#173404" x="500" y="716" text-anchor="middle">to. That is a good enough reason.</text>
  <rect x="30" y="768" width="620" height="118" rx="16" fill="#F4C0D1" stroke="#993556" stroke-width="1.2"/>
  <text font-family="sans-serif" font-weight="700" font-size="15" fill="#72243E" x="340" y="794" text-anchor="middle">Fungi that are confusing</text>
  <text font-family="sans-serif" font-size="11" fill="#993556" x="340" y="814" text-anchor="middle">The honey fungus in Oregon is one single organism and is 3 miles wide. It is the</text>
  <text font-family="sans-serif" font-size="11" fill="#993556" x="340" y="830" text-anchor="middle">largest living thing on Earth, probably. It has been there for thousands of years.</text>
  <text font-family="sans-serif" font-size="11" fill="#993556" x="340" y="846" text-anchor="middle">Nobody noticed for a very long time, which is embarrassing for us.</text>
  <text font-family="sans-serif" font-size="10" fill="#D4537E" x="340" y="866" text-anchor="middle">The fungus did not mind. It was busy.</text>
  <text font-family="sans-serif" font-weight="700" font-size="20" fill="#26215C" x="340" y="920" text-anchor="middle">A complete guide to fungi</text>
  <text font-family="sans-serif" font-size="11" fill="#534AB7" x="340" y="940" text-anchor="middle">Fungi are not plants. They are not animals. They are fungi.</text>
  <text font-family="sans-serif" font-size="11" fill="#534AB7" x="340" y="958" text-anchor="middle">They were here before us and will probably be here after.</text>
  <text font-family="sans-serif" font-size="10" fill="#7F77DD" x="340" y="978" text-anchor="middle">by me</text>
</svg>
</div>

<!-- TARDIGRADES -->
<div class="section">
<svg width="100%" viewBox="0 0 680 1080">
  <rect x="0" y="0" width="680" height="1080" fill="#eaf3fd"/>
  <text font-family="sans-serif" font-weight="700" font-size="28" fill="#042C53" x="340" y="44" text-anchor="middle">What tardigrade is</text>
  <text font-family="sans-serif" font-size="12" fill="#185FA5" x="340" y="62" text-anchor="middle">A guide. By me. (also spelled tartegrades, which is fine)</text>
  <rect x="30" y="78" width="300" height="220" rx="16" fill="#B5D4F4" stroke="#185FA5" stroke-width="1.2"/>
  <text font-family="sans-serif" font-weight="700" font-size="15" fill="#042C53" x="180" y="104" text-anchor="middle">What tardigrade is</text>
  <text font-family="sans-serif" font-size="11" fill="#185FA5" x="180" y="124" text-anchor="middle">A tardigrade is a very small animal.</text>
  <text font-family="sans-serif" font-size="11" fill="#185FA5" x="180" y="140" text-anchor="middle">It has eight legs, which is too many</text>
  <text font-family="sans-serif" font-size="11" fill="#185FA5" x="180" y="156" text-anchor="middle">for something that small, but it</text>
  <text font-family="sans-serif" font-size="11" fill="#185FA5" x="180" y="172" text-anchor="middle">does not seem to notice.</text>
  <text font-family="sans-serif" font-size="11" fill="#185FA5" x="180" y="190" text-anchor="middle">It is also called a water bear, which</text>
  <text font-family="sans-serif" font-size="11" fill="#185FA5" x="180" y="206" text-anchor="middle">is a very good name for it because</text>
  <text font-family="sans-serif" font-size="11" fill="#185FA5" x="180" y="222" text-anchor="middle">it looks exactly like a tiny bear.</text>
  <rect x="50" y="234" width="240" height="36" rx="10" fill="#85B7EB" stroke="#185FA5" stroke-width="0.8"/>
  <text font-family="sans-serif" font-size="11" fill="#042C53" x="170" y="248" text-anchor="middle">It is also called a moss piglet.</text>
  <text font-family="sans-serif" font-size="11" fill="#042C53" x="170" y="262" text-anchor="middle">Both names are correct and good.</text>
  <rect x="350" y="78" width="300" height="220" rx="16" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.2"/>
  <text font-family="sans-serif" font-weight="700" font-size="15" fill="#712B13" x="500" y="104" text-anchor="middle">What it survives</text>
  <text font-family="sans-serif" font-size="11" fill="#993C1D" x="500" y="124" text-anchor="middle">Tardigrades can survive almost</text>
  <text font-family="sans-serif" font-size="11" fill="#993C1D" x="500" y="140" text-anchor="middle">anything. This is not an exaggeration.</text>
  <text font-family="sans-serif" font-size="11" fill="#993C1D" x="500" y="158" text-anchor="middle">Boiling. Freezing. The vacuum of</text>
  <text font-family="sans-serif" font-size="11" fill="#993C1D" x="500" y="174" text-anchor="middle">space. Radiation. Being dried out</text>
  <text font-family="sans-serif" font-size="11" fill="#993C1D" x="500" y="190" text-anchor="middle">completely for 30 years and then</text>
  <text font-family="sans-serif" font-size="11" fill="#993C1D" x="500" y="206" text-anchor="middle">getting wet again and being fine.</text>
  <text font-family="sans-serif" font-size="11" fill="#993C1D" x="500" y="222" text-anchor="middle">We cannot do any of these things.</text>
  <rect x="368" y="234" width="264" height="36" rx="10" fill="#F0997B" stroke="#993C1D" stroke-width="0.8"/>
  <text font-family="sans-serif" font-size="11" fill="#4A1B0C" x="500" y="248" text-anchor="middle">The tardigrade does not think</text>
  <text font-family="sans-serif" font-size="11" fill="#4A1B0C" x="500" y="262" text-anchor="middle">this is impressive. It is just Tuesday.</text>
  <rect x="30" y="318" width="300" height="210" rx="16" fill="#CECBF6" stroke="#534AB7" stroke-width="1.2"/>
  <text font-family="sans-serif" font-weight="700" font-size="15" fill="#3C3489" x="180" y="344" text-anchor="middle">How it survives</text>
  <text font-family="sans-serif" font-size="11" fill="#534AB7" x="180" y="364" text-anchor="middle">When things get bad, a tardigrade</text>
  <text font-family="sans-serif" font-size="11" fill="#534AB7" x="180" y="380" text-anchor="middle">dries itself into a tiny ball called</text>
  <text font-family="sans-serif" font-size="11" fill="#534AB7" x="180" y="396" text-anchor="middle">a tun. It stops doing everything.</text>
  <text font-family="sans-serif" font-size="11" fill="#534AB7" x="180" y="412" text-anchor="middle">It is not dead. It is just waiting.</text>
  <text font-family="sans-serif" font-size="11" fill="#534AB7" x="180" y="430" text-anchor="middle">When things get better it wakes up</text>
  <text font-family="sans-serif" font-size="11" fill="#534AB7" x="180" y="446" text-anchor="middle">and carries on. No problem.</text>
  <rect x="50" y="458" width="240" height="36" rx="10" fill="#AFA9EC" stroke="#534AB7" stroke-width="0.8"/>
  <text font-family="sans-serif" font-size="11" fill="#26215C" x="170" y="472" text-anchor="middle">I would also like to do this but</text>
  <text font-family="sans-serif" font-size="11" fill="#26215C" x="170" y="486" text-anchor="middle">I do not know how.</text>
  <rect x="350" y="318" width="300" height="210" rx="16" fill="#C0DD97" stroke="#3B6D11" stroke-width="1.2"/>
  <text font-family="sans-serif" font-weight="700" font-size="15" fill="#27500A" x="500" y="344" text-anchor="middle">Where it lives</text>
  <text font-family="sans-serif" font-size="11" fill="#3B6D11" x="500" y="364" text-anchor="middle">Tardigrades live everywhere. Moss,</text>
  <text font-family="sans-serif" font-size="11" fill="#3B6D11" x="500" y="380" text-anchor="middle">soil, the ocean, Antarctica, probably</text>
  <text font-family="sans-serif" font-size="11" fill="#3B6D11" x="500" y="396" text-anchor="middle">your garden, possibly your house.</text>
  <text font-family="sans-serif" font-size="11" fill="#3B6D11" x="500" y="414" text-anchor="middle">There are tardigrades on the moon</text>
  <text font-family="sans-serif" font-size="11" fill="#3B6D11" x="500" y="430" text-anchor="middle">now because a spacecraft crashed</text>
  <text font-family="sans-serif" font-size="11" fill="#3B6D11" x="500" y="446" text-anchor="middle">there in 2019. They are probably fine.</text>
  <rect x="368" y="458" width="264" height="36" rx="10" fill="#97C459" stroke="#3B6D11" stroke-width="0.8"/>
  <text font-family="sans-serif" font-size="11" fill="#173404" x="500" y="472" text-anchor="middle">The moon tardigrades have not been</text>
  <text font-family="sans-serif" font-size="11" fill="#173404" x="500" y="486" text-anchor="middle">checked on. Someone should do that.</text>
  <rect x="30" y="548" width="300" height="200" rx="16" fill="#FAC775" stroke="#854F0B" stroke-width="1.2"/>
  <text font-family="sans-serif" font-weight="700" font-size="15" fill="#412402" x="180" y="574" text-anchor="middle">What it eats</text>
  <text font-family="sans-serif" font-size="11" fill="#633806" x="180" y="594" text-anchor="middle">Tardigrades eat algae and moss</text>
  <text font-family="sans-serif" font-size="11" fill="#633806" x="180" y="610" text-anchor="middle">by stabbing them with a little mouth</text>
  <text font-family="sans-serif" font-size="11" fill="#633806" x="180" y="626" text-anchor="middle">part and sucking out the insides.</text>
  <text font-family="sans-serif" font-size="11" fill="#633806" x="180" y="642" text-anchor="middle">Some eat other tardigrades, which</text>
  <text font-family="sans-serif" font-size="11" fill="#633806" x="180" y="658" text-anchor="middle">is not very nice but they are very</text>
  <text font-family="sans-serif" font-size="11" fill="#633806" x="180" y="674" text-anchor="middle">small so I will not judge them.</text>
  <rect x="50" y="686" width="240" height="36" rx="10" fill="#EF9F27" stroke="#854F0B" stroke-width="0.8"/>
  <text font-family="sans-serif" font-size="11" fill="#412402" x="170" y="700" text-anchor="middle">In their tun state they do not eat.</text>
  <text font-family="sans-serif" font-size="11" fill="#412402" x="170" y="714" text-anchor="middle">They do not need to. They are a ball.</text>
  <rect x="350" y="548" width="300" height="200" rx="16" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1.2"/>
  <text font-family="sans-serif" font-weight="700" font-size="15" fill="#085041" x="500" y="574" text-anchor="middle">Yum rating</text>
  <text font-family="sans-serif" font-size="11" fill="#0F6E56" x="500" y="594" text-anchor="middle">Tardigrades are too small to eat.</text>
  <text font-family="sans-serif" font-size="11" fill="#0F6E56" x="500" y="610" text-anchor="middle">You have probably already eaten</text>
  <text font-family="sans-serif" font-size="11" fill="#0F6E56" x="500" y="626" text-anchor="middle">some by accident. You are fine.</text>
  <text font-family="sans-serif" font-size="11" fill="#0F6E56" x="500" y="644" text-anchor="middle">They are in moss and water and</text>
  <text font-family="sans-serif" font-size="11" fill="#0F6E56" x="500" y="660" text-anchor="middle">you have definitely had water.</text>
  <rect x="368" y="678" width="264" height="36" rx="10" fill="#5DCAA5" stroke="#0F6E56" stroke-width="0.8"/>
  <text font-family="sans-serif" font-size="11" fill="#085041" x="500" y="694" text-anchor="middle">Yum rating: unknown. Too small</text>
  <text font-family="sans-serif" font-size="11" fill="#085041" x="500" y="708" text-anchor="middle">to tell. Probably not Yum.</text>
  <rect x="30" y="768" width="620" height="130" rx="16" fill="#F4C0D1" stroke="#993556" stroke-width="1.2"/>
  <text font-family="sans-serif" font-weight="700" font-size="15" fill="#72243E" x="340" y="794" text-anchor="middle">Things that are surprising about tardigrades</text>
  <text font-family="sans-serif" font-size="11" fill="#993556" x="340" y="814" text-anchor="middle">They have been on Earth for 500 million years, which is longer than most things.</text>
  <text font-family="sans-serif" font-size="11" fill="#993556" x="340" y="830" text-anchor="middle">They survived all five mass extinctions. Every single one. While we were not even here yet.</text>
  <text font-family="sans-serif" font-size="11" fill="#993556" x="340" y="848" text-anchor="middle">Scientists have sent them to space on purpose to see what happens. They were fine.</text>
  <text font-family="sans-serif" font-size="10" fill="#D4537E" x="340" y="868" text-anchor="middle">The scientists were more surprised than the tardigrades.</text>
  <text font-family="sans-serif" font-weight="700" font-size="20" fill="#042C53" x="340" y="930" text-anchor="middle">A complete guide to tardigrades</text>
  <text font-family="sans-serif" font-size="11" fill="#185FA5" x="340" y="952" text-anchor="middle">Tardigrades are indestructible. We are not. They were here first.</text>
  <text font-family="sans-serif" font-size="11" fill="#185FA5" x="340" y="970" text-anchor="middle">They will probably be here last. I think they know this.</text>
  <text font-family="sans-serif" font-size="10" fill="#378ADD" x="340" y="990" text-anchor="middle">by me</text>
</svg>
</div>

<!-- NEMATODES -->
<div class="section">
<svg width="100%" viewBox="0 0 680 1080">
  <rect x="0" y="0" width="680" height="1080" fill="#f0faf0"/>
  <text font-family="sans-serif" font-weight="700" font-size="28" fill="#173404" x="340" y="44" text-anchor="middle">What nematode is</text>
  <text font-family="sans-serif" font-size="12" fill="#3B6D11" x="340" y="62" text-anchor="middle">A guide. By me.</text>
  <rect x="30" y="78" width="300" height="220" rx="16" fill="#C0DD97" stroke="#3B6D11" stroke-width="1.2"/>
  <text font-family="sans-serif" font-weight="700" font-size="15" fill="#173404" x="180" y="104" text-anchor="middle">What nematode is</text>
  <text font-family="sans-serif" font-size="11" fill="#3B6D11" x="180" y="124" text-anchor="middle">A nematode is a very small worm.</text>
  <text font-family="sans-serif" font-size="11" fill="#3B6D11" x="180" y="140" text-anchor="middle">It is not related to earthworms,</text>
  <text font-family="sans-serif" font-size="11" fill="#3B6D11" x="180" y="156" text-anchor="middle">which are a completely different</text>
  <text font-family="sans-serif" font-size="11" fill="#3B6D11" x="180" y="172" text-anchor="middle">kind of worm and probably offended</text>
  <text font-family="sans-serif" font-size="11" fill="#3B6D11" x="180" y="188" text-anchor="middle">by the comparison.</text>
  <text font-family="sans-serif" font-size="11" fill="#3B6D11" x="180" y="206" text-anchor="middle">Nematodes are also called roundworms</text>
  <text font-family="sans-serif" font-size="11" fill="#3B6D11" x="180" y="222" text-anchor="middle">because they are round. And worms.</text>
  <rect x="50" y="234" width="240" height="36" rx="10" fill="#97C459" stroke="#3B6D11" stroke-width="0.8"/>
  <text font-family="sans-serif" font-size="11" fill="#173404" x="170" y="248" text-anchor="middle">They have no eyes, no ears, and</text>
  <text font-family="sans-serif" font-size="11" fill="#173404" x="170" y="262" text-anchor="middle">no legs. They are doing fine.</text>
  <rect x="350" y="78" width="300" height="220" rx="16" fill="#FAC775" stroke="#854F0B" stroke-width="1.2"/>
  <text font-family="sans-serif" font-weight="700" font-size="15" fill="#412402" x="500" y="104" text-anchor="middle">How many there are</text>
  <text font-family="sans-serif" font-size="11" fill="#633806" x="500" y="124" text-anchor="middle">There are more nematodes on Earth</text>
  <text font-family="sans-serif" font-size="11" fill="#633806" x="500" y="140" text-anchor="middle">than any other animal. By a lot.</text>
  <text font-family="sans-serif" font-size="11" fill="#633806" x="500" y="156" text-anchor="middle">In one handful of soil there can be</text>
  <text font-family="sans-serif" font-size="11" fill="#633806" x="500" y="172" text-anchor="middle">thousands of nematodes. You have</text>
  <text font-family="sans-serif" font-size="11" fill="#633806" x="500" y="188" text-anchor="middle">held soil before. You held thousands</text>
  <text font-family="sans-serif" font-size="11" fill="#633806" x="500" y="204" text-anchor="middle">of nematodes. You did not know.</text>
  <text font-family="sans-serif" font-size="11" fill="#633806" x="500" y="222" text-anchor="middle">They did not tell you.</text>
  <rect x="368" y="234" width="264" height="36" rx="10" fill="#EF9F27" stroke="#854F0B" stroke-width="0.8"/>
  <text font-family="sans-serif" font-size="11" fill="#412402" x="500" y="248" text-anchor="middle">60% of all animals on Earth are</text>
  <text font-family="sans-serif" font-size="11" fill="#412402" x="500" y="262" text-anchor="middle">nematodes. This is their planet.</text>
  <rect x="30" y="318" width="300" height="215" rx="16" fill="#B5D4F4" stroke="#185FA5" stroke-width="1.2"/>
  <text font-family="sans-serif" font-weight="700" font-size="15" fill="#0C447C" x="180" y="344" text-anchor="middle">Where they live</text>
  <text font-family="sans-serif" font-size="11" fill="#185FA5" x="180" y="364" text-anchor="middle">Nematodes live in soil, water, ice,</text>
  <text font-family="sans-serif" font-size="11" fill="#185FA5" x="180" y="380" text-anchor="middle">hot springs, and inside other animals</text>
  <text font-family="sans-serif" font-size="11" fill="#185FA5" x="180" y="396" text-anchor="middle">including possibly you right now.</text>
  <text font-family="sans-serif" font-size="11" fill="#185FA5" x="180" y="414" text-anchor="middle">Scientists found nematodes living</text>
  <text font-family="sans-serif" font-size="11" fill="#185FA5" x="180" y="430" text-anchor="middle">2 miles underground in gold mines.</text>
  <text font-family="sans-serif" font-size="11" fill="#185FA5" x="180" y="446" text-anchor="middle">Nobody invited them. They went anyway.</text>
  <rect x="50" y="458" width="240" height="36" rx="10" fill="#85B7EB" stroke="#185FA5" stroke-width="0.8"/>
  <text font-family="sans-serif" font-size="11" fill="#042C53" x="170" y="472" text-anchor="middle">There is nowhere on Earth without</text>
  <text font-family="sans-serif" font-size="11" fill="#042C53" x="170" y="486" text-anchor="middle">nematodes. They checked.</text>
  <rect x="350" y="318" width="300" height="215" rx="16" fill="#CECBF6" stroke="#534AB7" stroke-width="1.2"/>
  <text font-family="sans-serif" font-weight="700" font-size="15" fill="#3C3489" x="500" y="344" text-anchor="middle">What they eat</text>
  <text font-family="sans-serif" font-size="11" fill="#534AB7" x="500" y="364" text-anchor="middle">Different nematodes eat different</text>
  <text font-family="sans-serif" font-size="11" fill="#534AB7" x="500" y="380" text-anchor="middle">things. Some eat bacteria. Some eat</text>
  <text font-family="sans-serif" font-size="11" fill="#534AB7" x="500" y="396" text-anchor="middle">fungi. Some eat plants. Some eat</text>
  <text font-family="sans-serif" font-size="11" fill="#534AB7" x="500" y="412" text-anchor="middle">other nematodes, which is either</text>
  <text font-family="sans-serif" font-size="11" fill="#534AB7" x="500" y="428" text-anchor="middle">very rude or very efficient, I am</text>
  <text font-family="sans-serif" font-size="11" fill="#534AB7" x="500" y="444" text-anchor="middle">not sure which.</text>
  <rect x="368" y="458" width="264" height="36" rx="10" fill="#AFA9EC" stroke="#534AB7" stroke-width="0.8"/>
  <text font-family="sans-serif" font-size="11" fill="#26215C" x="500" y="472" text-anchor="middle">Some live inside humans and eat</text>
  <text font-family="sans-serif" font-size="11" fill="#26215C" x="500" y="486" text-anchor="middle">our food. We do not split it with them.</text>
  <rect x="30" y="553" width="300" height="200" rx="16" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.2"/>
  <text font-family="sans-serif" font-weight="700" font-size="15" fill="#712B13" x="180" y="579" text-anchor="middle">C. elegans</text>
  <text font-family="sans-serif" font-size="11" fill="#993C1D" x="180" y="599" text-anchor="middle">One nematode called C. elegans is</text>
  <text font-family="sans-serif" font-size="11" fill="#993C1D" x="180" y="615" text-anchor="middle">very famous in science. It has exactly</text>
  <text font-family="sans-serif" font-size="11" fill="#993C1D" x="180" y="631" text-anchor="middle">302 brain cells. Scientists mapped</text>
  <text font-family="sans-serif" font-size="11" fill="#993C1D" x="180" y="647" text-anchor="middle">all of them, which took a very long</text>
  <text font-family="sans-serif" font-size="11" fill="#993C1D" x="180" y="663" text-anchor="middle">time and is probably why scientists</text>
  <text font-family="sans-serif" font-size="11" fill="#993C1D" x="180" y="679" text-anchor="middle">seem tired.</text>
  <rect x="50" y="691" width="240" height="36" rx="10" fill="#F0997B" stroke="#993C1D" stroke-width="0.8"/>
  <text font-family="sans-serif" font-size="11" fill="#4A1B0C" x="170" y="705" text-anchor="middle">It has been to space. It survived.</text>
  <text font-family="sans-serif" font-size="11" fill="#4A1B0C" x="170" y="719" text-anchor="middle">Of course it survived.</text>
  <rect x="350" y="553" width="300" height="200" rx="16" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1.2"/>
  <text font-family="sans-serif" font-weight="700" font-size="15" fill="#085041" x="500" y="579" text-anchor="middle">Yum rating</text>
  <text font-family="sans-serif" font-size="11" fill="#0F6E56" x="500" y="599" text-anchor="middle">Nematodes are too small to eat on</text>
  <text font-family="sans-serif" font-size="11" fill="#0F6E56" x="500" y="615" text-anchor="middle">purpose. Like tardigrades, you have</text>
  <text font-family="sans-serif" font-size="11" fill="#0F6E56" x="500" y="631" text-anchor="middle">already eaten some. Unlike tardigrades,</text>
  <text font-family="sans-serif" font-size="11" fill="#0F6E56" x="500" y="647" text-anchor="middle">some nematodes also eat you back,</text>
  <text font-family="sans-serif" font-size="11" fill="#0F6E56" x="500" y="663" text-anchor="middle">which changes things somewhat.</text>
  <rect x="368" y="677" width="264" height="36" rx="10" fill="#5DCAA5" stroke="#0F6E56" stroke-width="0.8"/>
  <text font-family="sans-serif" font-size="11" fill="#085041" x="500" y="691" text-anchor="middle">Yum rating: complicated. Do not</text>
  <text font-family="sans-serif" font-size="11" fill="#085041" x="500" y="705" text-anchor="middle">think about it too much.</text>
  <rect x="30" y="773" width="620" height="120" rx="16" fill="#F4C0D1" stroke="#993556" stroke-width="1.2"/>
  <text font-family="sans-serif" font-weight="700" font-size="15" fill="#72243E" x="340" y="799" text-anchor="middle">Things that are surprising about nematodes</text>
  <text font-family="sans-serif" font-size="11" fill="#993556" x="340" y="819" text-anchor="middle">If you removed everything from Earth except nematodes you could still see the outline</text>
  <text font-family="sans-serif" font-size="11" fill="#993556" x="340" y="835" text-anchor="middle">of all the continents, oceans, mountains, and cities just from the nematodes. In the</text>
  <text font-family="sans-serif" font-size="11" fill="#993556" x="340" y="851" text-anchor="middle">shape of where things were. A nematode ghost of everything. This is real.</text>
  <text font-family="sans-serif" font-size="10" fill="#D4537E" x="340" y="871" text-anchor="middle">I think about this a lot.</text>
  <text font-family="sans-serif" font-weight="700" font-size="20" fill="#173404" x="340" y="930" text-anchor="middle">A complete guide to nematodes</text>
  <text font-family="sans-serif" font-size="11" fill="#3B6D11" x="340" y="950" text-anchor="middle">Nematodes are everywhere. In the soil, in the sea, in the mines, in you.</text>
  <text font-family="sans-serif" font-size="11" fill="#3B6D11" x="340" y="968" text-anchor="middle">There are more of them than us. There have always been more of them than us.</text>
  <text font-family="sans-serif" font-size="10" fill="#639922" x="340" y="988" text-anchor="middle">by me</text>
